    html += '<div class="fi"><label class="fl">Dias da semana *</label>';
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">';
    DIAS_SEMANA.forEach(function(d) {
      html += '<label style="cursor:pointer;">';
      html += '<input type="checkbox" id="res-dia-' + d.v + '" value="' + d.v + '" style="display:none;" onchange="Reservas.onDiaChange(this)">';
      html += '<div class="res-dia-btn" id="res-dia-btn-' + d.v + '" style="width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:var(--text-3);transition:all .15s;">' + d.l + '</div>';
      html += '</label>';
    });
    html += '</div></div>';
    html += '<div class="form-row"><div class="fi"><label class="fl">Hora início *</label><input type="time" id="res-hora-i" class="fin" value="09:00"></div>';
    html += '<div class="fi"><label class="fl">Hora fim *</label><input type="time" id="res-hora-f" class="fin" value="10:00"></div></div>';
    html += '<div class="form-row"><div class="fi"><label class="fl">Período — início *</label><input type="date" id="res-peri-i" class="fin"></div>';
    html += '<div class="fi"><label class="fl">Período — fim *</label><input type="date" id="res-peri-f" class="fin"></div></div>';
    html += '</div>';

    html += '<div class="fi"><label class="fl">Observações</label><textarea id="res-obs" class="fin" rows="2" placeholder="Informações adicionais..."></textarea></div>';

    html += '</div>';
    html += '<div class="modal-footer" id="m-res-footer">';
    html += '<button class="btn btn-ghost" onclick="closeModal(\'m-reserva-nova\')">Cancelar</button>';
    html += '<button class="btn btn-primary" onclick="Reservas.salvar()">Guardar reserva</button>';
    html += '</div>';
    html += '</div></div>';

    // MODAL LISTAGEM
    html += '<div class="modal-bd" id="m-res-listagem">';
    html += '<div class="modal" style="max-width:800px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-blue"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></div><div><div class="modal-title">Lista de reservas</div><div class="modal-sub" id="m-res-list-sub">—</div></div><button class="modal-close" onclick="closeModal(\'m-res-listagem\')">✕</button></div>';
    html += '<div class="modal-body" id="m-res-list-body"></div>';
    html += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-res-listagem\')">Fechar</button></div>';
    html += '</div></div>';

    // MODAL DETALHE — aberto ao tocar numa reserva do calendário
    html += '<div class="modal-bd" id="m-res-detalhe">';
    html += '<div class="modal" style="max-width:460px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-blue"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div><div class="modal-title" id="m-resd-ttl">Reserva</div><div class="modal-sub" id="m-resd-eq">—</div></div><button class="modal-close" onclick="closeModal(\'m-res-detalhe\')">✕</button></div>';
    html += '<div class="modal-body" id="m-resd-body"></div>';
    html += '<div class="modal-footer" id="m-resd-footer"></div>';
    html += '</div></div>';

    return html;
  }

  // ── DETALHE DE UMA RESERVA ────────────────────────────────
  function escolherCor(v) {
    var inp = document.getElementById('res-cor');
    if (inp) inp.value = v;
    var picker = document.getElementById('res-cor-picker');
    if (picker) {
      picker.querySelectorAll('.res-cor-bolha').forEach(function(b) {
        b.classList.toggle('sel', b.dataset.cor === v);
      });
    }
  }

  function abrirDetalhe(id) {
    var r = (APP.reservas || []).filter(function(x) { return x.id === id; })[0];
    if (!r) { toast('Reserva não encontrada.', 'error'); return; }
    var eq  = getEq(r.equipamento_id);
    var est = ESTADOS[r.estado] || ESTADOS.confirmada;

    document.getElementById('m-resd-ttl').textContent = r.titulo || 'Reserva';
    document.getElementById('m-resd-eq').textContent  = eq ? eq.nome : '—';

    function linha(rot, val) {
      if (val == null || val === '') return '';
      return '<div class="resd-l"><span class="resd-r">' + H(rot) + '</span><span class="resd-v">' + H(String(val)) + '</span></div>';
    }

    var quando;
    if (r.recorrente) {
      var diasStr = (r.dias_semana || '').split(',').map(function(d) {
        var ds = DIAS_SEMANA.filter(function(x) { return x.v == parseInt(d, 10); })[0];
        return ds ? ds.l : d;
      }).join(', ');
      quando = diasStr + ' · ' + (r.hora_inicio || '').slice(0, 5) + '–' + (r.hora_fim || '').slice(0, 5) +
               '<br><span style="font-size:12px;color:var(--text-3);">' + fData(r.data_inicio_periodo) + ' a ' + fData(r.data_fim_periodo) + '</span>';
    } else {
      var hi = new Date(r.data_inicio), hf = new Date(r.data_fim);
      quando = fData(r.data_inicio) + ' · ' + _horaLocal(hi) + '–' + _horaLocal(hf);
    }

    var body = '<div class="resd-badges">';
    body += '<span class="bdg" style="background:' + est.bg + ';color:' + est.cor + ';">' + est.l + '</span>';
    body += '<span class="bdg" style="background:' + (r.recorrente ? '#EDE9FE' : 'var(--accent-light)') + ';color:' + (r.recorrente ? '#5B21B6' : 'var(--accent-dark)') + ';">' + (r.recorrente ? '🔁 Recorrente' : 'Pontual') + '</span>';
    body += '</div>';
    body += '<div class="resd-quando">' + quando + '</div>';
    body += linha('Entidade', r.entidade);
    body += linha('Espaço', r.espaco);
    body += linha('Nº de pessoas', r.num_pessoas);
    body += linha('Observações', r.observacoes);
    document.getElementById('m-resd-body').innerHTML = body;

    var footer = document.getElementById('m-resd-footer');
    if (APP.podeGerirReservas(r.equipamento_id)) {
      var extra = '';
      if (r.estado === 'pre_reserva') {
        extra = '<button class="btn btn-success btn-sm" onclick="Reservas.confirmar(\'' + r.id + '\')">✓ Confirmar</button> ';
      }
      footer.innerHTML = extra +
        '<button class="btn btn-danger btn-sm" onclick="Reservas.apagar(\'' + r.id + '\')">Apagar</button>' +
        '<button class="btn btn-ghost" onclick="closeModal(\'m-res-detalhe\')">Fechar</button>' +
        '<button class="btn btn-primary" onclick="closeModal(\'m-res-detalhe\');Reservas.openEditar(\'' + r.id + '\')">Editar</button>';
    } else {
      footer.innerHTML = '<button class="btn btn-ghost" onclick="closeModal(\'m-res-detalhe\')">Fechar</button>';
    }
    openModal('m-res-detalhe');
  }

  // ── ACÇÕES ────────────────────────────────────────────────
  function onTipoChange() {
    var isRec = document.getElementById('res-tipo-r').checked;
    document.getElementById('res-pontual-wrap').style.display    = isRec ? 'none'  : 'block';
    document.getElementById('res-recorrente-wrap').style.display = isRec ? 'block' : 'none';
    // highlight selected label
    document.getElementById('lbl-pontual').style.borderColor    = isRec ? 'var(--border)' : 'var(--accent)';
    document.getElementById('lbl-recorrente').style.borderColor = isRec ? 'var(--accent)' : 'var(--border)';
  }

  function onDiaChange(cb) {
    var btn = document.getElementById('res-dia-btn-' + cb.value);
    if (!btn) return;
    if (cb.checked) {
      btn.style.background   = 'var(--accent)';
      btn.style.color        = '#fff';
      btn.style.borderColor  = 'var(--accent)';
    } else {
      btn.style.background   = '';
      btn.style.color        = 'var(--text-3)';
      btn.style.borderColor  = 'var(--border)';
    }
  }

  function _configurarPorTipo(eqId) {
    // popular dropdown com os espaços DO EQUIPAMENTO
    var sel = document.getElementById('res-espaco-sel');
    var espacos = (APP.espacos || []).filter(function(x){ return x.equipamento_id === eqId; });
    espacos.sort(function(a,b){ return (a.ordem||0)-(b.ordem||0); });

    if (sel) {
      sel.innerHTML = '<option value="">Nenhum</option>';
      espacos.forEach(function(esp) {
        var o = document.createElement('option');
        o.value = esp.id; o.textContent = esp.nome;
        sel.appendChild(o);
      });
      var oOutro = document.createElement('option');
      oOutro.value = '__outro'; oOutro.textContent = 'Outro...';
      sel.appendChild(oOutro);
    }

    // por defeito: contagem genérica até escolher espaço
    _aplicarLabelsContagem(null);

    // Só mostra a escolha Pontual/Recorrente se o equipamento a permitir.
    // Caso contrário, força pontual e esconde o seletor.
    var eq = getEq(eqId);
    var permite = permiteRecorrente(eq);
    var wrap = document.getElementById('res-tipo-wrap');
    if (wrap) wrap.style.display = permite ? 'block' : 'none';
    if (!permite) {
      var rp = document.getElementById('res-tipo-p');
      var rr = document.getElementById('res-tipo-r');
      if (rp) rp.checked = true;
      if (rr) rr.checked = false;
      onTipoChange();
    }
  }

  function _aplicarLabelsContagem(espacoId) {
    var esp = espacoId ? (APP.espacos || []).filter(function(x){ return x.id === espacoId; })[0] : null;
    var lbl1 = document.getElementById('res-lbl-cont');
    if (lbl1) lbl1.textContent = (esp && esp.label_contagem) ? esp.label_contagem : 'Nº de pessoas';
    var cont2wrap = document.getElementById('res-cont2-wrap');
    var lbl2 = document.getElementById('res-lbl-cont2');
    if (esp && esp.label_contagem2) {
      if (cont2wrap) cont2wrap.style.display = 'block';
      if (lbl2) lbl2.textContent = esp.label_contagem2;
    } else {
      if (cont2wrap) cont2wrap.style.display = 'none';
    }
  }

  function onEspacoChange() {
    var sel = document.getElementById('res-espaco-sel');
    var inp = document.getElementById('res-espaco');
    if (!sel || !inp) return;
    if (sel.value === '__outro') {
      inp.style.display = 'block';
      inp.value = '';
      inp.focus();
      _aplicarLabelsContagem(null);
    } else if (sel.value === '') {
      inp.style.display = 'none';
      inp.value = '';
      _aplicarLabelsContagem(null);
    } else {
      // é um espaço definido — usar o nome e aplicar os seus rótulos
      inp.style.display = 'none';
      var esp = (APP.espacos || []).filter(function(x){ return x.id === sel.value; })[0];
      inp.value = esp ? esp.nome : '';
      _aplicarLabelsContagem(sel.value);
    }
  }

  function _resetModal() {
    document.getElementById('res-titulo').value   = '';
    document.getElementById('res-entidade').value = '';
    document.getElementById('res-espaco').value   = '';
    var ss = document.getElementById('res-espaco-sel'); if (ss) ss.value = '';
    var si = document.getElementById('res-espaco'); if (si) si.style.display = 'none';
    var np = document.getElementById('res-num-pessoas'); if (np) np.value = '';
    var np2 = document.getElementById('res-num-pessoas2'); if (np2) np2.value = '';
    document.getElementById('res-obs').value      = '';
    escolherCor('#3B82F6');
    document.getElementById('res-tipo-p').checked = true;
    document.getElementById('res-data-i').value   = '';
    document.getElementById('res-inicio').value   = '09:00';
    document.getElementById('res-fim').value      = '10:00';
    document.getElementById('res-hora-i').value   = '09:00';
    document.getElementById('res-hora-f').value   = '10:00';
    document.getElementById('res-peri-i').value   = '';
    document.getElementById('res-peri-f').value   = '';
    DIAS_SEMANA.forEach(function(d) {
      var cb  = document.getElementById('res-dia-' + d.v);
      var btn = document.getElementById('res-dia-btn-' + d.v);
      if (cb)  cb.checked = false;
      if (btn) { btn.style.background=''; btn.style.color='var(--text-3)'; btn.style.borderColor='var(--border)'; }
    });
    onTipoChange();
  }

  function semanaAnterior() { _weekOffset--; _rerender(); }
  function semanaProxima()  { _weekOffset++; _rerender(); }
  function semanaActual()   { _weekOffset = 0; _rerender(); }

  function _rerender() { App.renderContent(); }

  function clickCelula(el, eqId) {
    if (!APP.podeGerirReservas(eqId)) return; // funcionário não cria
    var hora = el.dataset.hora, data = el.dataset.data;
    if (!hora || !data) return;
    openNova(eqId, 'confirmada', data, String(hora).padStart(2,'0') + ':00');
  }

  function onDataChange() {
    // reserva pontual é sempre de um dia — nada a sincronizar
  }

  function openNova(eqId, estado, data, hora) {
    APP.editId = null;
    APP.actionRecord = { equipamento_id: eqId };
    var eq = getEq(eqId);
    document.getElementById('m-res-ttl').textContent = estado === 'pre_reserva' ? 'Nova pré-reserva' : 'Nova reserva';
    document.getElementById('m-res-eq').textContent  = eq ? eq.nome : '—';
    _resetModal();
    _configurarPorTipo(eqId);
    // reativar campos (podem ter ficado disabled de uma consulta anterior)
    document.querySelectorAll('#m-reserva-nova input, #m-reserva-nova select, #m-reserva-nova textarea').forEach(function(el){ el.disabled = false; });
    document.getElementById('res-estado').value = estado || 'confirmada';
    if (data) {
      document.getElementById('res-data-i').value = data;
    }
    if (hora) document.getElementById('res-inicio').value = hora;

    var footer = document.getElementById('m-res-footer');
    if (footer) footer.innerHTML = '<button class="btn btn-ghost" onclick="closeModal(\'m-reserva-nova\')">Cancelar</button><button class="btn btn-primary" onclick="Reservas.salvar()">Guardar</button>';
    openModal('m-reserva-nova');
  }

  function openEditar(idOrEl) {
    var id = typeof idOrEl === 'string' ? idOrEl : (idOrEl.dataset ? idOrEl.dataset.rid : idOrEl);
    var r = (APP.reservas || []).filter(function(x) { return x.id === id; })[0];
    if (!r) return;
    APP.editId = id;
    APP.actionRecord = r;
    var eq = getEq(r.equipamento_id);
    document.getElementById('m-res-ttl').textContent = 'Editar reserva';
    document.getElementById('m-res-eq').textContent  = eq ? eq.nome : '—';
    _resetModal();
    _configurarPorTipo(r.equipamento_id);

    var set = function(eid, val) { var el=document.getElementById(eid); if(el) el.value=val||''; };
    set('res-titulo',   r.titulo);
    set('res-entidade', r.entidade);
    set('res-num-pessoas',  r.num_pessoas);
    set('res-num-pessoas2', r.num_pessoas2);
    // espaço — tentar selecionar no dropdown, senão usar campo livre
    var espSel = document.getElementById('res-espaco-sel');
    if (r.espaco_id && espSel) {
      espSel.value = r.espaco_id;
      _aplicarLabelsContagem(r.espaco_id);
      var espInp0 = document.getElementById('res-espaco');
      if (espInp0) espInp0.value = r.espaco || '';
    } else if (r.espaco && espSel) {
      espSel.value = '__outro';
      var espInp = document.getElementById('res-espaco');
      if (espInp) { espInp.style.display = 'block'; espInp.value = r.espaco; }
    }
    set('res-obs',      r.observacoes);
    set('res-estado',   r.estado || 'confirmada');
    escolherCor(r.cor || '#3B82F6');

    if (r.recorrente) {
      document.getElementById('res-tipo-r').checked = true;
      set('res-hora-i', (r.hora_inicio || '09:00').slice(0,5));
      set('res-hora-f', (r.hora_fim    || '10:00').slice(0,5));
      set('res-peri-i', r.data_inicio_periodo ? new Date(r.data_inicio_periodo).toISOString().split('T')[0] : '');
      set('res-peri-f', r.data_fim_periodo    ? new Date(r.data_fim_periodo).toISOString().split('T')[0]    : '');
      (r.dias_semana || '').split(',').forEach(function(d) {
        var cb  = document.getElementById('res-dia-' + d.trim());
        if (cb) { cb.checked = true; onDiaChange(cb); }
      });
    } else {
      document.getElementById('res-tipo-p').checked = true;
      // Preencher com componentes LOCAIS. Usar toISOString() convertia para UTC
      // e podia trocar o dia/hora (foi o que fazia os campos parecerem vazios ou
      // errados ao reabrir para editar).
      if (r.data_inicio) {
        var di = new Date(r.data_inicio);
        document.getElementById('res-data-i').value = _dataLocal(di);
        document.getElementById('res-inicio').value = _horaLocal(di);
      }
      if (r.data_fim) {
        document.getElementById('res-fim').value = _horaLocal(new Date(r.data_fim));
      } else if (r.hora_fim) {
        document.getElementById('res-fim').value = String(r.hora_fim).slice(0, 5);
      }
    }
    onTipoChange();

    var footer = document.getElementById('m-res-footer');
    if (footer) {
      // reativar campos primeiro
      document.querySelectorAll('#m-reserva-nova input, #m-reserva-nova select, #m-reserva-nova textarea').forEach(function(el){ el.disabled = false; });

      if (!APP.podeGerirReservas(r.equipamento_id)) {
        // só consulta — desativar campos e mostrar só Fechar
        footer.innerHTML = '<button class="btn btn-ghost" onclick="closeModal(\'m-reserva-nova\')">Fechar</button>';
        document.querySelectorAll('#m-reserva-nova input, #m-reserva-nova select, #m-reserva-nova textarea').forEach(function(el){ el.disabled = true; });
      } else {
        var btnsExtra = '';
        if (r.estado === 'pre_reserva') {
          btnsExtra = '<button class="btn btn-success btn-sm" onclick="Reservas.confirmar(\'' + r.id + '\')">✓ Confirmar reserva</button> ';
        }
        footer.innerHTML = btnsExtra +
          '<button class="btn btn-danger btn-sm" onclick="Reservas.apagar(\'' + r.id + '\')">Apagar</button>' +
          '<button class="btn btn-ghost" onclick="closeModal(\'m-reserva-nova\')">Cancelar</button>' +
          '<button class="btn btn-primary" onclick="Reservas.salvar()">Guardar alterações</button>';
      }
    }
    openModal('m-reserva-nova');
  }

  function confirmar(id) {
    // mudar estado para confirmada + notificar admin
    sbPatch('reservas', 'id=eq.' + id, { estado: 'confirmada' }).then(function() {
      toast('Reserva confirmada.', 'success');
      closeModal('m-reserva-nova');
      closeModal('m-res-listagem');

      // notificar admin
      var r = (APP.reservas || []).filter(function(x) { return x.id === id; })[0];
      var admin = APP.utilizadores.filter(function(u) { return u.perfil === 'admin'; })[0];
      if (admin && admin.id) {
        sbPost('avisos', {
          destinatario_id: admin.id,
          titulo: 'Reserva confirmada — ' + (r ? r.titulo : ''),
          mensagem: 'A pré-reserva "' + (r ? r.titulo : '') + '" foi confirmada.' + (r && r.entidade ? ' Entidade: ' + r.entidade + '.' : ''),
          lido: false
        }).then(function() {
          if (typeof Avisos !== 'undefined') Avisos.carregar();
        }).catch(function() {});
      }

      _loadReservas(function() { _rerender(); });
    }).catch(function() { toast('Erro ao confirmar.', 'error'); });
  }

  function salvar() {
    var titulo = document.getElementById('res-titulo');
    if (!titulo || !titulo.value.trim()) { toast('O título é obrigatório.', 'error'); return; }

    var isRec = document.getElementById('res-tipo-r').checked;
    var eqId  = APP.actionRecord ? APP.actionRecord.equipamento_id : APP.spotEqId;

    // Rede de segurança: se o equipamento não permite recorrentes, garantir
    // que nunca se grava uma (ex.: estado residual do formulário).
    if (isRec && !permiteRecorrente(getEq(eqId))) isRec = false;

    var uuidRx = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    var criadoPor = APP.user && APP.user.id && uuidRx.test(APP.user.id) ? APP.user.id : null;

    var body = {
      equipamento_id: eqId,
      titulo:         titulo.value.trim(),
      entidade:       (document.getElementById('res-entidade').value || '').trim(),
      espaco:         (document.getElementById('res-espaco').value   || '').trim(),
      espaco_id:      (function(){ var s=document.getElementById('res-espaco-sel'); return (s && s.value && s.value!=='__outro') ? s.value : null; })(),
      num_pessoas:    parseInt(document.getElementById('res-num-pessoas').value,10)  || null,
      num_pessoas2:   parseInt(document.getElementById('res-num-pessoas2').value,10) || null,
      estado:         document.getElementById('res-estado').value || 'confirmada',
      cor:            document.getElementById('res-cor').value    || '#3B82F6',
      observacoes:    (document.getElementById('res-obs').value   || '').trim(),
      criado_por:     criadoPor,
      recorrente:     isRec
    };

    if (isRec) {
      // validar dias
      var diasSel = DIAS_SEMANA.map(function(d) {
        var cb = document.getElementById('res-dia-' + d.v);
        return cb && cb.checked ? d.v : null;
      }).filter(function(v) { return v !== null; });

      if (!diasSel.length) { toast('Selecione pelo menos um dia da semana.', 'error'); return; }
      var pi = document.getElementById('res-peri-i').value;
      var pf = document.getElementById('res-peri-f').value;
      if (!pi || !pf) { toast('Indique o período da reserva recorrente.', 'error'); return; }
      if (pi > pf) { toast('A data de fim deve ser posterior ao início.', 'error'); return; }

      body.dias_semana          = diasSel.join(',');
      body.hora_inicio          = document.getElementById('res-hora-i').value || null;
      body.hora_fim             = document.getElementById('res-hora-f').value || null;
      body.data_inicio_periodo  = pi;
      body.data_fim_periodo     = pf;
      body.data_inicio          = pi; // para compatibilidade
      body.data_fim             = pf;
    } else {
      var dataI  = document.getElementById('res-data-i').value;
      var horaI  = document.getElementById('res-inicio').value || '09:00';
      var horaF  = document.getElementById('res-fim').value    || '10:00';
      if (!dataI) { toast('A data é obrigatória.', 'error'); return; }
      if (!horaI) { toast('A hora de início é obrigatória.', 'error'); return; }
      if (!horaF) { toast('A hora de fim é obrigatória.', 'error'); return; }
      if (horaF <= horaI) { toast('A hora de fim deve ser posterior à de início.', 'error'); return; }
      // Reserva pontual = SEMPRE um único dia. data_fim fica no mesmo dia,
      // só muda a hora. Assim o calendário nunca a espalha por dois dias.
      body.data_inicio = dataI + 'T' + horaI + ':00';
      body.data_fim    = dataI + 'T' + horaF + ':00';
      body.hora_inicio = horaI;
      body.hora_fim    = horaF;
    }

    var p = APP.editId
      ? sbPatch('reservas', 'id=eq.' + APP.editId, body)
      : sbPost('reservas', body);

    p.then(function() {
      toast(APP.editId ? 'Reserva atualizada.' : 'Reserva criada.', 'success');
      closeModal('m-reserva-nova');
      _loadReservas(function() { _rerender(); });
    }).catch(function(e) {
      console.error('Erro reserva:', e);
      var msg = 'Erro ao guardar reserva.';
      if (e && e.message) msg += ' ' + e.message;
      if (e && e.details) msg += ' ' + e.details;
      if (e && e.hint)    msg += ' ' + e.hint;
      if (e && e.code)    msg += ' (código: ' + e.code + ')';
      toast(msg, 'error');
    });
  }

  function apagar(id) {
    if (!confirm('Apagar esta reserva? A ação é irreversível.')) return;
    sbDelete('reservas', 'id=eq.' + id).then(function() {
      toast('Reserva eliminada.', 'success');
      closeModal('m-reserva-nova');
      closeModal('m-res-listagem');
      _loadReservas(function() { _rerender(); });
    }).catch(function() { toast('Erro ao apagar.', 'error'); });
  }

  // ── CARREGAR ──────────────────────────────────────────────
  function _loadReservas(cb) {
    if (!APP.spotEqId) { if (cb) cb(); return; }
    var eq = APP.spotEqId;

    sbGet('reservas', 'equipamento_id=eq.' + eq + '&order=data_inicio.asc')
      .then(function(data) {
        var novas = Array.isArray(data) ? data : [];

        // Fundir com as que já existem, descartando as antigas DESTE
        // equipamento (assim as apagadas desaparecem e as dos outros
        // equipamentos não se perdem).
        var base = (APP.reservas || []).filter(function(r) {
          return r.equipamento_id !== eq;
        });

        APP.reservas = base.concat(novas);
        if (cb) cb();
      }).catch(function(e) {
        console.error('Erro ao carregar reservas:', e);
        if (cb) cb();
      });
  }

  function init() {
    APP.reservas = APP.reservas || [];
    var cont = document.getElementById('modais-reservas');
    if (cont) cont.innerHTML = getModaisHTML();
  }

  function load(cb) { _loadReservas(cb); }

  return {
    render: render, init: init, load: load,
    semanaAnterior: semanaAnterior, semanaProxima: semanaProxima, semanaActual: semanaActual,
    clickCelula: clickCelula, openNova: openNova, openEditar: openEditar,
    abrirDetalhe: abrirDetalhe, escolherCor: escolherCor,
    openListagem: openListagem, confirmar: confirmar, salvar: salvar, apagar: apagar,
    onTipoChange: onTipoChange, onDiaChange: onDiaChange, onEspacoChange: onEspacoChange
  };

})();

</script>
<script>
/* ═════ escalas.js ═════ */
// ============================================================
// GestDDS — escalas.js  v5.1
// Módulo de Escalas e Turnos por equipamento
// ============================================================

var Escalas = (function() {

  var _weekOffset = 0;

  // Data 'YYYY-MM-DD' em componentes LOCAIS. Nunca usar toISOString() para
  // comparar dias: converte para UTC e, em Portugal (UTC+1 no verão), a
  // meia-noite local de dia 13 vira '2026-07-12', desalinhando a grelha.
  function _ymdLocal(d) {
    if (!(d instanceof Date)) d = new Date(d);
    return d.getFullYear() + '-' +
           ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
           ('0' + d.getDate()).slice(-2);
  }

  var TIPOS_TURNO = [
    { v: 'normal',   l: 'Turno Normal',  cor: '#3B82F6' },
    { v: 'ferias',   l: 'Férias',        cor: '#10B981' },
    { v: 'folga',    l: 'Folga',         cor: '#94A3B8' },
    { v: 'feriado',  l: 'Feriado',       cor: '#F59E0B' },
    { v: 'formacao', l: 'Formação',      cor: '#8B5CF6' },
    { v: 'doenca',   l: 'Doença',        cor: '#EF4444' }
  ];

  var FUNCOES = ['Manutenção','Receção','Limpeza','Sala / Campo','Piscina','Segurança','Outra'];
  var HORAS   = ['06:00','07:00','08:00','09:00','10:00','11:00','12:00','13:00',
                 '14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00','23:00'];

  // ── RENDER ────────────────────────────────────────────────
  function render(eqId) {
    var alvo = eqDoModulo('escalas', eqId || APP.spotEqId);
    if (!alvo) return semEqParaModulo('Escalas');
    if (APP.spotEqId !== alvo) APP.spotEqId = alvo;
    var eq = getEq(alvo);
    if (!eq) return semEqParaModulo('Escalas');

    var tipo = getTipo(eq.tipo_id);

    var html = '<div class="eq-toolbar"><div class="eq-toolbar-t">Escala semanal</div>';
    if (!APP.podeGerirEscalas(eq.id)) {
      html += '<span style="font-size:12px;color:var(--text-3);padding:6px 10px;background:var(--bg);border-radius:6px;">👁 Apenas consulta</span>';
    }
    html += '</div>';

    // Para funcionário: destacar a SUA escala
    if (APP.isFuncionario() && APP.user) {
      html += _renderMinhaEscala(eq.id, APP.user.id);
    }

    html += _renderEscala(eq.id);
    return html;
  }

  function _renderMinhaEscala(eqId, funcId) {
    var hoje = new Date(); hoje.setHours(0,0,0,0);
    var diaSem = hoje.getDay();
    var seg = new Date(hoje); seg.setDate(hoje.getDate() - (diaSem===0?6:diaSem-1));
    var nomesDia = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

    var meusTurnos = (APP.escalas || []).filter(function(e) {
      return e.equipamento_id === eqId && e.funcionario_id === funcId;
    });

    // turnos desta semana
    var estaSemana = [];
    for (var k=0;k<7;k++) {
      var d = new Date(seg); d.setDate(seg.getDate()+k);
      var dataStr = _ymdLocal(d);
      meusTurnos.forEach(function(t) {
        var ei = String(t.data_inicio).slice(0, 10);
        var ef = String(t.data_fim || t.data_inicio).slice(0, 10);
        if (dataStr >= ei && dataStr <= ef) {
          estaSemana.push({ dia: d, turno: t });
        }
      });
    }

    var html = '<div style="background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--r);padding:14px;margin-bottom:16px;">';
    html += '<div style="font-size:14px;font-weight:700;color:var(--accent-dark);margin-bottom:10px;">📋 A minha escala esta semana</div>';
    if (!estaSemana.length) {
      html += '<div style="font-size:13px;color:var(--text-2);">Não tens turnos marcados esta semana.</div>';
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:6px;">';
      estaSemana.forEach(function(item) {
        var t = item.turno;
        var ent = (t.hora_entrada||'').slice(0,5);
        var sai = (t.hora_saida||'').slice(0,5);
        var isHoje = item.dia.toDateString() === new Date().toDateString();
        html += '<div style="display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--surface);border-radius:6px;' + (isHoje?'border:2px solid var(--accent);':'') + '">';
        html += '<div style="font-weight:700;font-size:12.5px;min-width:80px;color:var(--text);">' + nomesDia[item.dia.getDay()] + (isHoje?' (hoje)':'') + '</div>';
        html += '<div style="font-family:JetBrains Mono,monospace;font-size:13px;color:var(--accent-dark);font-weight:600;">' + ent + ' – ' + sai + '</div>';
        if (t.funcao) html += '<div style="font-size:12px;color:var(--text-3);">' + H(t.funcao) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  // ── SEMANA ────────────────────────────────────────────────
  function _getWeekDates() {
    var hoje = new Date();
    var diaSemana = hoje.getDay();
    var seg = new Date(hoje);
    seg.setDate(hoje.getDate() - (diaSemana === 0 ? 6 : diaSemana - 1) + (_weekOffset * 7));
    var dias = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(seg);
      d.setDate(seg.getDate() + i);
      dias.push(d);
    }
    return dias;
  }

  function _fDataCurta(d) {
    var nomes = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    return nomes[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1);
  }

  function _isHoje(d) {
    var h = new Date();
    return d.getDate() === h.getDate() && d.getMonth() === h.getMonth() && d.getFullYear() === h.getFullYear();
  }

  function _tipoCor(tipo) {
    var t = TIPOS_TURNO.filter(function(x) { return x.v === tipo; })[0];
    return t ? t.cor : '#3B82F6';
  }

  function _tipoLabel(tipo) {
    var t = TIPOS_TURNO.filter(function(x) { return x.v === tipo; })[0];
    return t ? t.l : tipo;
  }

  // ── RENDER ESCALA ─────────────────────────────────────────
  function _renderEscala(eqId) {
    var dias = _getWeekDates();
    var seg = dias[0], dom = dias[6];
    var labelSemana = fData(seg.toISOString()) + ' — ' + fData(dom.toISOString());

    // funcionários deste equipamento
    var funcs = APP.utilizadores.filter(function(u) {
      return funcNoEq(u, eqId) && !u.isDds;
    });

    var html = '<div class="escala-controls">';
    html += '<div class="escala-nav">';
    html += '<div class="esc-nav-btn" onclick="Escalas.semanaAnterior()">‹</div>';
    html += '<div class="escala-week">📅 ' + labelSemana + '</div>';
    html += '<div class="esc-nav-btn" onclick="Escalas.semanaProxima()">›</div>';
    if (_weekOffset !== 0) html += '<button class="btn btn-ghost btn-sm" onclick="Escalas.semanaActual()" style="font-size:12px;">Hoje</button>';
    html += '</div>';
    if (APP.podeGerirEscalas(eqId)) {
      html += '<div style="display:flex;gap:6px;">';
      html += '<button class="btn btn-secondary btn-sm" onclick="Escalas.exportar(\'' + eqId + '\')">↓ Exportar</button>';
      html += '<button class="btn btn-primary btn-sm" onclick="Escalas.openNovo(\'' + eqId + '\')">+ Novo turno</button>';
      html += ' <button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Escalas.openSerie(\'' + eqId + '\')">Limpar turnos…</button>';
      html += '</div>';
    }
    html += '</div>';

    if (!funcs.length) {
      html += emptyState('Sem funcionários', 'Não existem funcionários afectos a este equipamento. Adicione funcionários em Configurações → Funcionários.');
      return html;
    }

    // GRID: linhas = funcionários, colunas = dias
    html += '<div class="sched-wrap"><div style="overflow-x:auto;">';
    html += '<table style="width:100%;border-collapse:collapse;min-width:600px;font-size:12px;">';

    // Header
    html += '<thead><tr><th style="padding:7px 10px;text-align:left;font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;background:var(--bg);border-bottom:1px solid var(--border);min-width:120px;">Funcionário</th>';
    dias.forEach(function(d) {
      html += '<th style="padding:7px 6px;text-align:center;font-size:10.5px;font-weight:700;color:' + (_isHoje(d) ? 'var(--accent)' : 'var(--text-3)') + ';background:' + (_isHoje(d) ? 'var(--accent-light)' : 'var(--bg)') + ';border-bottom:1px solid var(--border);">' + _fDataCurta(d) + '</th>';
    });
    html += '</tr></thead>';

    // Linhas por funcionário
    html += '<tbody>';
    funcs.forEach(function(func) {
      var pal = PERFIL_PALETTES[func.perfil] || ['#F1F5F9','#475569'];
      html += '<tr>';
      html += '<td style="padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;">';
      html += '<div style="display:flex;align-items:center;gap:7px;">';
      html += '<div style="width:26px;height:26px;border-radius:50%;background:' + pal[0] + ';color:' + pal[1] + ';font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">' + iniciais(func.nome) + '</div>';
      html += '<div><div style="font-weight:600;color:var(--text);font-size:12.5px;">' + H(func.nome) + '</div>';
      html += '<div style="font-size:10.5px;color:var(--text-3);">' + H((func.perfil || '').replace(/_/g,' ')) + '</div></div>';
      html += '</div></td>';

      dias.forEach(function(d) {
        var dataStr = _ymdLocal(d);
        // encontrar turno deste funcionário neste dia
        var turnos = (APP.escalas || []).filter(function(e) {
          if (e.funcionario_id !== func.id || e.equipamento_id !== eqId) return false;
          // as datas vêm do Supabase como 'YYYY-MM-DD' — comparar os 10 primeiros
          // caracteres diretamente evita o desvio de fuso do toISOString()
          var ei = String(e.data_inicio).slice(0, 10);
          var ef = String(e.data_fim || e.data_inicio).slice(0, 10);
          return dataStr >= ei && dataStr <= ef;
        });

        html += '<td style="padding:3px 4px;border-bottom:1px solid var(--border);border-left:1px solid var(--border);text-align:center;vertical-align:middle;min-width:80px;">';

        var podeGerir = APP.podeGerirEscalas(eqId);

        if (turnos.length) {
          turnos.forEach(function(t) {
            var cor = t.cor || _tipoCor(t.tipo_turno);
            html += '<div style="background:' + cor + '22;color:' + cor + ';border:1px solid ' + cor + '44;border-radius:5px;padding:3px 5px;font-size:10.5px;font-weight:600;cursor:pointer;margin-bottom:2px;" onclick="Escalas.openEditar(\'' + t.id + '\')">';
            if (t.hora_entrada && t.hora_saida) {
              html += t.hora_entrada.slice(0,5) + '—' + t.hora_saida.slice(0,5);
            } else {
              html += _tipoLabel(t.tipo_turno);
            }
            html += '</div>';
          });
          // adicionar outro turno no mesmo dia (ex: manhã + tarde) — só quem gere
          if (podeGerir) {
            html += '<div style="color:var(--border-2);font-size:14px;cursor:pointer;line-height:1;" title="Adicionar outro turno neste dia" onclick="Escalas.openNovoDia(\'' + eqId + '\',\'' + func.id + '\',\'' + dataStr + '\')">+</div>';
          }
        } else if (podeGerir) {
          html += '<div style="color:var(--border-2);font-size:18px;cursor:pointer;" onclick="Escalas.openNovoDia(\'' + eqId + '\',\'' + func.id + '\',\'' + dataStr + '\')">+</div>';
        } else {
          html += '<div style="color:var(--border-2);font-size:12px;">—</div>';
        }

        html += '</td>';
      });

      html += '</tr>';
    });
    html += '</tbody></table></div></div>';

    // Legenda
    html += '<div class="sched-legend" style="margin-top:10px;">';
    TIPOS_TURNO.forEach(function(t) {
      html += '<div class="legend-item"><div class="legend-dot" style="background:' + t.cor + ';"></div>' + t.l + '</div>';
    });
    html += '</div>';

    return html;
  }

  // ── MODAL HTML ────────────────────────────────────────────
  function getModaisHTML() {
    var html = '';

    html += '<div class="modal-bd" id="m-escala-novo">';
    html += '<div class="modal" style="max-width:520px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-amber"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div><div class="modal-title" id="m-esc-ttl">Novo turno</div><div class="modal-sub" id="m-esc-eq">—</div></div><button class="modal-close" onclick="closeModal(\'m-escala-novo\')">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div id="m-esc-info" style="display:none;"></div>';

    // todo o formulário — escondido nas folgas/férias (só se consulta)
    html += '<div id="esc-form">';
    html += '<div class="form-sec-t">Funcionário</div>';
    html += '<div class="fi"><label class="fl">Funcionário *</label><select id="esc-func" class="fin"><option value="">Selecione...</option></select></div>';

    html += '<div class="form-sec-t">Turno</div>';
    html += '<div class="form-row"><div class="fi"><label class="fl">Tipo de turno</label><select id="esc-tipo" class="fin" onchange="Escalas.onTipoChange()">';
    TIPOS_TURNO.forEach(function(t) {
      html += '<option value="' + t.v + '">' + t.l + '</option>';
    });
    html += '</select></div>';
    html += '<div class="fi"><label class="fl">Função</label><select id="esc-funcao" class="fin"><option value="">Selecione...</option>';
    FUNCOES.forEach(function(f) { html += '<option value="' + f + '">' + f + '</option>'; });
    html += '</select></div></div>';

    html += '<div class="form-row"><div class="fi"><label class="fl">Data início *</label><input type="date" id="esc-di" class="fin"></div>';
    html += '<div class="fi"><label class="fl">Data fim *</label><input type="date" id="esc-df" class="fin"></div></div>';

    html += '<div id="esc-horas-wrap">';
    html += '<div class="fi"><label class="fl">Horário</label><select id="esc-horario" class="fin" onchange="Escalas.onHorarioChange()">';
    html += '<option value="partido">Horário partido — 09:00–12:30 e 14:00–17:30</option>';
    html += '<option value="manha">Só manhã — 09:00–12:30</option>';
    html += '<option value="tarde">Só tarde — 14:00–17:30</option>';
    html += '<option value="custom">Personalizado…</option>';
    html += '</select>';
    html += '<p id="esc-horario-help" style="font-size:11.5px;color:var(--text-3);margin:4px 0 0;line-height:1.4;">Cria dois turnos por dia: manhã e tarde.</p>';
    html += '</div>';
    html += '<div class="form-row" id="esc-horas-custom" style="display:none;"><div class="fi"><label class="fl">Hora entrada</label><input type="time" id="esc-he" class="fin" value="09:00"></div>';
    html += '<div class="fi"><label class="fl">Hora saída</label><input type="time" id="esc-hs" class="fin" value="17:00"></div></div>';
    html += '</div>';

    html += '<div class="fi"><label class="fl">Observações</label><textarea id="esc-obs" class="fin" rows="2" placeholder="Notas..."></textarea></div>';

    // ── Repetição (só ao criar) ──
    html += '<div id="esc-rep-wrap">';
    html += '<div class="form-sec-t">Repetir turno</div>';
    html += '<p style="font-size:12px;color:var(--text-3);margin:-2px 0 8px;line-height:1.5;">Para quem faz sempre o mesmo horário. Escolha os dias da semana e até quando — cria todos os turnos de uma vez.</p>';
    html += '<div class="fi"><label class="fl">Dias da semana</label>';
    html += '<div id="esc-dias" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;">';
    [['1','Seg'],['2','Ter'],['3','Qua'],['4','Qui'],['5','Sex'],['6','Sáb'],['0','Dom']].forEach(function(d) {
      html += '<label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:5px 9px;cursor:pointer;">';
      html += '<input type="checkbox" class="esc-dia" value="' + d[0] + '" style="margin:0;">' + d[1] + '</label>';
    });
    html += '</div></div>';
    html += '<div class="fi"><label class="fl">Repetir até</label><input type="date" id="esc-ate" class="fin"></div>';
    html += '<p style="font-size:11.5px;color:var(--text-3);margin:4px 0 0;line-height:1.5;">Deixe em branco para criar apenas um turno.</p>';
    html += '</div>';

    html += '</div>';   // fecha #esc-form
    html += '</div>';   // fecha .modal-body
    html += '<div class="modal-footer" id="m-esc-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-escala-novo\')">Cancelar</button><button class="btn btn-primary" onclick="Escalas.salvar()">Guardar turno</button></div>';
    html += '</div></div>';

    html += _modalSerie();

    return html;
  }

  // ── ACÇÕES ────────────────────────────────────────────────
  function semanaAnterior() { _weekOffset--; _recarregarSemana(); }
  function semanaProxima()  { _weekOffset++; _recarregarSemana(); }
  function semanaActual()   { _weekOffset = 0; _recarregarSemana(); }

  // Ao mudar de semana podemos sair da janela de ±14 dias já carregada,
  // por isso vamos buscar os turnos da nova semana antes de redesenhar.
  function _recarregarSemana() {
    _loadEscalas(function() { _rerender(); });
  }

  function _rerender() { App.renderContent(); }

  function onTipoChange() {
    var tipo = document.getElementById('esc-tipo').value;
    var hw   = document.getElementById('esc-horas-wrap');
    // folga/feriado/férias não têm hora
    var semHoras = ['ferias','folga','feriado'];
    if (hw) hw.style.display = semHoras.indexOf(tipo) >= 0 ? 'none' : 'block';
  }

  // Mostra a origem do turno quando vem do Banco de Horas ou das Férias
  function _preencherInfoOrigem(e) {
    var box = document.getElementById('m-esc-info');
    if (!box) return;
    box.style.display = 'none';
    box.innerHTML = '';

    // ── Folga vinda do banco de horas ──
    if (e.tipo_turno === 'folga' && typeof Horas !== 'undefined' && Horas.registos) {
      var reg = Horas.registos().filter(function(r) {
        return r.tipo === 'gozada' && r.estado === 'aprovado' &&
               r.funcionario_id === e.funcionario_id && r.data === e.data_inicio;
      })[0];

      if (reg) {
        var quem = (APP.utilizadores || []).filter(function(u) { return u.id === reg.validado_chefe_por; })[0];
        var per  = (typeof Horas.labelPeriodo === 'function') ? Horas.labelPeriodo(reg) : '';
        var s    = Horas.saldoDe(reg.funcionario_id);

        var h = '<div style="background:#FEF3C7;border:1px solid #FDE68A;border-radius:10px;padding:12px;margin-bottom:14px;">';
        h += '<div style="font-size:12px;font-weight:700;color:#92400E;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;">⏱ Folga do banco de horas</div>';
        h += '<div style="font-size:13px;color:#78350F;line-height:1.7;">';
        h += '<div><strong>Funcionário:</strong> ' + H(_nomeFunc(reg.funcionario_id)) + '</div>';
        h += '<div><strong>Horas gozadas:</strong> ' + Horas.fmtH(reg.horas) + (per ? ' · ' + H(per) : '') + '</div>';
        h += '<div><strong>Data:</strong> ' + _fdataBr(reg.data) + '</div>';
        if (reg.motivo) h += '<div><strong>Motivo:</strong> ' + H(reg.motivo) + '</div>';
        if (reg.data_valid_chefe) {
          h += '<div><strong>Autorizado em:</strong> ' + _fdataBr(reg.data_valid_chefe) + (quem ? ' por ' + H(quem.nome) : '') + '</div>';
        }
        h += '<div style="margin-top:4px;padding-top:6px;border-top:1px solid #FDE68A;"><strong>Saldo atual:</strong> ' + Horas.fmtH(s.saldo) + '</div>';
        h += '</div>';
        h += '<p style="font-size:11.5px;color:#92400E;margin:10px 0 0;line-height:1.5;">Esta folga resulta de um pedido autorizado, por isso <strong>não pode ser alterada aqui</strong>. Para a corrigir, peça a alteração no Banco de Horas — segue o mesmo circuito de autorização.</p>';
        h += '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">';
        h += '<button class="btn btn-secondary btn-sm" onclick="closeModal(\'m-escala-novo\');App.nav(\'horas\')">Abrir Banco de Horas</button>';
        // o admin pode anular a folga (apaga o turno E o registo de horas)
        if (APP.user && APP.user.perfil === 'admin') {
          h += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Escalas.anularFolga(\'' + e.id + '\',\'' + reg.id + '\')">Anular folga</button>';
        }
        h += '</div>';
        h += '</div>';

        box.innerHTML = h;
        box.style.display = 'block';
        return;
      }

      // ── Folga ÓRFÃ: o pedido já não existe no banco de horas ──
      var ho = '<div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:12px;margin-bottom:14px;">';
      ho += '<div style="font-size:12px;font-weight:700;color:#B91C1C;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;">⚠️ Folga sem pedido associado</div>';
      ho += '<div style="font-size:13px;color:#7F1D1D;line-height:1.6;">';
      ho += 'Este turno de folga já não tem um pedido correspondente no banco de horas — o registo terá sido apagado.';
      ho += '</div>';
      ho += '<p style="font-size:11.5px;color:#B91C1C;margin:8px 0 0;line-height:1.5;">Pode apagá-lo em segurança com o botão <strong>Apagar turno</strong>, em baixo. Não afecta o saldo de horas.</p>';
      ho += '</div>';
      box.innerHTML = ho;
      box.style.display = 'block';
      return;
    }

    // ── Turno de férias ──
    if (e.tipo_turno === 'ferias') {
      var hf = '<div style="background:#DCFCE7;border:1px solid #BBF7D0;border-radius:10px;padding:12px;margin-bottom:14px;">';
      hf += '<div style="font-size:12px;font-weight:700;color:#15803D;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;">🏖 Férias aprovadas</div>';
      hf += '<div style="font-size:13px;color:#166534;line-height:1.7;">';
      hf += '<div><strong>Período:</strong> ' + _fdataBr(e.data_inicio) + (e.data_fim && e.data_fim !== e.data_inicio ? ' a ' + _fdataBr(e.data_fim) : '') + '</div>';
      hf += '</div>';
      hf += '<div style="margin-top:10px;"><button class="btn btn-secondary btn-sm" onclick="closeModal(\'m-escala-novo\');App.nav(\'ferias\')">Abrir Férias</button></div>';
      hf += '<p style="font-size:11.5px;color:#15803D;margin:8px 0 0;line-height:1.5;">Férias aprovadas — para alterar, use o menu Férias.</p>';
      hf += '</div>';
      box.innerHTML = hf;
      box.style.display = 'block';
    }
  }

  // Bloqueia (ou repõe) os campos de edição do turno.
  // turnoId: se vier preenchido e o utilizador puder gerir a escala,
  // mantém o botão de apagar no rodapé (para folgas órfãs, férias, etc.)
  function _bloquearEdicao(bloquear, turnoId, podeApagar) {
    ['esc-func','esc-tipo','esc-di','esc-df','esc-he','esc-hs','esc-funcao','esc-obs','esc-horario'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.disabled = !!bloquear;
    });

    var rep = document.getElementById('esc-rep-wrap');
    if (rep && bloquear) rep.style.display = 'none';

    var footer = document.getElementById('m-esc-footer');
    if (footer && bloquear) {
      var h = '';
      if (podeApagar && turnoId) {
        h += '<button class="btn btn-danger btn-sm" onclick="Escalas.apagarTurnoBloqueado(\'' + turnoId + '\')">Apagar turno</button>';
      }
      h += '<button class="btn btn-primary" onclick="closeModal(\'m-escala-novo\')">Fechar</button>';
      footer.innerHTML = h;
    }
  }

  // Esconde (ou repõe) o formulário de edição.
  // Nas folgas e férias não faz sentido mostrar campos — só a informação.
  function _mostrarFormulario(mostrar) {
    var f = document.getElementById('esc-form');
    if (f) f.style.display = mostrar ? '' : 'none';
  }

  // apagar um turno que está em modo consulta (folga/férias).
  // Se houver um pedido de banco de horas associado, avisa e apaga os dois.
  function apagarTurnoBloqueado(id) {
    var t = (APP.escalas || []).filter(function(x) { return x.id === id; })[0];
    if (!t) return;
    if (!APP.podeGerirEscalas(t.equipamento_id)) {
      toast('Não tem permissão para apagar turnos.', 'error');
      return;
    }

    // procurar o pedido de banco de horas correspondente
    var reg = null;
    if (t.tipo_turno === 'folga' && typeof Horas !== 'undefined' && Horas.registos) {
      reg = Horas.registos().filter(function(r) {
        return r.tipo === 'gozada' && r.funcionario_id === t.funcionario_id && r.data === t.data_inicio;
      })[0];
    }

    var msg = reg
      ? 'Apagar esta folga?\n\nO turno sai da escala e o pedido é apagado do banco de horas. As horas voltam ao saldo do funcionário.'
      : 'Apagar este turno da escala?';
    if (!confirm(msg)) return;

    sbDelete('escalas', 'id=eq.' + id).then(function() {
      if (reg) {
        return sbDelete('banco_horas', 'id=eq.' + reg.id).catch(function(e) {
          console.error('Registo de horas não apagado:', e);
        });
      }
    }).then(function() {
      APP.escalas = (APP.escalas || []).filter(function(x) { return x.id !== id; });
      toast(reg ? 'Folga apagada. As horas voltaram ao saldo.' : 'Turno apagado.', 'success');
      closeModal('m-escala-novo');
      if (reg && typeof Horas !== 'undefined' && Horas.load) {
        Horas.load(function() { _rerender(); });
      } else {
        _rerender();
      }
    }).catch(function(e) {
      console.error('Erro ao apagar:', e);
      var m = [e && e.code, e && e.message].filter(Boolean).join(' · ');
      toast('Erro ao apagar: ' + (m || 'desconhecido'), 'error');
    });
  }

  function _nomeFunc(id) {
    var u = (APP.utilizadores || []).filter(function(x) { return x.id === id; })[0];
    return u ? u.nome : '—';
  }

  function _fdataBr(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
  }

  // horários padrão da DDS
  var HORARIOS = {
    partido: [{ he: '09:00', hs: '12:30' }, { he: '14:00', hs: '17:30' }],
    manha:   [{ he: '09:00', hs: '12:30' }],
    tarde:   [{ he: '14:00', hs: '17:30' }]
  };

  function onHorarioChange() {
    var sel = document.getElementById('esc-horario');
    var cw  = document.getElementById('esc-horas-custom');
    var hp  = document.getElementById('esc-horario-help');
    if (!sel) return;
    var v = sel.value;

    if (cw) cw.style.display = (v === 'custom') ? 'flex' : 'none';

    if (hp) {
      hp.textContent = v === 'partido' ? 'Cria dois turnos por dia: manhã e tarde.'
                     : v === 'manha'   ? 'Um turno de manhã.'
                     : v === 'tarde'   ? 'Um turno de tarde.'
                     : 'Indique as horas de entrada e saída.';
    }
  }

  // Admin: anular uma folga — apaga o turno da escala E o registo no banco de horas
  function anularFolga(turnoId, regId) {
    if (!APP.user || APP.user.perfil !== 'admin') {
      toast('Apenas o administrador pode anular folgas.', 'error');
      return;
    }
    if (!confirm('Anular esta folga?\n\nO turno é retirado da escala e o registo é apagado do banco de horas. As horas voltam ao saldo do funcionário.')) return;

    sbDelete('escalas', 'id=eq.' + turnoId).then(function() {
      if (regId && regId !== 'null') {
        return sbDelete('banco_horas', 'id=eq.' + regId).catch(function(e) {
          console.error('Registo de horas não apagado:', e);
        });
      }
    }).then(function() {
      APP.escalas = (APP.escalas || []).filter(function(x) { return x.id !== turnoId; });
      toast('Folga anulada. As horas voltaram ao saldo.', 'success');
      closeModal('m-escala-novo');
      if (typeof Horas !== 'undefined' && Horas.load) {
        Horas.load(function() { _rerender(); });
      } else {
        _rerender();
      }
    }).catch(function(e) {
      console.error('Erro ao anular folga:', e);
      var msg = [e && e.code, e && e.message].filter(Boolean).join(' · ');
      toast('Erro ao anular: ' + (msg || 'desconhecido'), 'error');
    });
  }

  // ── Apagar turnos em série (quando uma repetição correu mal) ──

    h += '<div><div class="modal-title">Limpar turnos</div><div class="modal-sub" id="m-serie-eq">—</div></div>';
