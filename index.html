    h += _kpi(Horas.fmtH(s.efetuadas), 'Horas efetuadas');
    h += _kpi(Horas.fmtH(s.gozadas),   'Horas gozadas');
    h += _kpi(Horas.fmtH(s.saldo),     'Saldo atual');
    h += '</div>';

    var movs = Horas.registos().filter(function(r) {
      return r.funcionario_id === funcId && r.estado === 'aprovado';
    }).sort(function(a, b) { return new Date(a.data || 0) - new Date(b.data || 0); });

    h += '<div class="pr-sec">Movimentos autorizados (' + movs.length + ')</div>';
    if (!movs.length) {
      h += '<div class="pr-empty">Sem movimentos autorizados.</div>';
      return h + _rodape();
    }

    h += '<table class="pr-table">';
    h += '<colgroup><col style="width:11%"><col style="width:15%"><col style="width:10%"><col style="width:41%"><col style="width:11%"><col style="width:12%"></colgroup>';
    h += '<thead><tr><th>Data</th><th>Tipo</th><th>Horas</th><th>Justificação</th><th>Equipamento / Iniciativa</th><th>Saldo acum.</th></tr></thead><tbody>';

    var acum = 0;
    movs.forEach(function(r) {
      var hrs = parseFloat(r.horas) || 0;
      var gozada = r.tipo === 'gozada';
      acum += gozada ? -hrs : hrs;
      var eq = r.equipamento_id ? (getEq(r.equipamento_id) || {}).nome : null;
      var local = eq || r.iniciativa || '—';
      h += '<tr>';
      h += '<td>' + _fdata(r.data) + '</td>';
      var tipoTxt = gozada ? 'Gozar horas' : 'Horas extra';
      var perX = (typeof Horas.labelPeriodo === 'function') ? Horas.labelPeriodo(r) : '';
      if (perX) tipoTxt += '<div style="font-size:8px;color:#666;">' + esc(perX) + '</div>';
      h += '<td>' + tipoTxt + '</td>';
      h += '<td>' + (gozada ? '−' : '+') + Horas.fmtH(hrs) + '</td>';
      h += '<td>' + esc(r.motivo || '—') + '</td>';
      h += '<td>' + esc(local) + '</td>';
      h += '<td><strong>' + Horas.fmtH(acum) + '</strong></td>';
      h += '</tr>';
    });
    h += '<tr class="pr-tot"><td colspan="5">Saldo final</td><td>' + Horas.fmtH(s.saldo) + '</td></tr>';
    h += '</tbody></table>';

    // pedidos ainda em curso
    var pend = Horas.registos().filter(function(r) {
      return r.funcionario_id === funcId && (r.estado === 'pendente' || r.estado === 'validado_resp');
    });
    if (pend.length) {
      h += '<div class="pr-sec">Pedidos por autorizar (' + pend.length + ') — não contam no saldo</div>';
      h += '<table class="pr-table">';
      h += '<colgroup><col style="width:14%"><col style="width:18%"><col style="width:12%"><col style="width:36%"><col style="width:20%"></colgroup>';
      h += '<thead><tr><th>Data</th><th>Tipo</th><th>Horas</th><th>Justificação</th><th>Estado</th></tr></thead><tbody>';
      pend.forEach(function(r) {
        h += '<tr><td>' + _fdata(r.data) + '</td><td>' + (r.tipo === 'gozada' ? 'Gozar horas' : 'Horas extra') + '</td><td>' + Horas.fmtH(r.horas) + '</td><td>' + esc(r.motivo || '—') + '</td><td>' + (r.estado === 'pendente' ? 'Aguarda responsável' : 'Aguarda chefe unidade') + '</td></tr>';
      });
      h += '</tbody></table>';
    }

    h += '<div style="margin-top:24px;display:flex;gap:40px;font-size:9px;">';
    h += '<div style="flex:1;border-top:1px solid #999;padding-top:4px;">O funcionário</div>';
    h += '<div style="flex:1;border-top:1px solid #999;padding-top:4px;">O chefe de unidade</div>';
    h += '</div>';

    return h + _rodape();
  }

  // ══════════════════════════════════════════════════════════
  // ABA "EQUIPAMENTOS" — o relatório mensal, pronto a imprimir
  // ══════════════════════════════════════════════════════════
  // Estadias, visitas e checklists só são carregadas para o equipamento
  // selecionado. Para um relatório transversal é preciso carregar tudo.

  var _globaisEstado = null; // null = por carregar | 'a-carregar' | 'ok' | 'erro'
  var _globaisErro   = '';

  function _carregarGlobais() {
    if (_globaisEstado === 'a-carregar' || _globaisEstado === 'ok') return;
    _globaisEstado = 'a-carregar';

    var ano  = APP.anoTrabalho || new Date().getFullYear();
    var ini  = ano + '-01-01';
    var fim  = ano + '-12-31';

    Promise.all([
      sbGet('estadias', 'data_checkin=gte.' + ini + '&data_checkin=lte.' + fim + '&order=data_checkin.asc')
        .then(function(d) { APP.repEstadias = Array.isArray(d) ? d : []; }),
      sbGet('visitas', 'data=gte.' + ini + '&data=lte.' + fim + '&order=data.asc')
        .then(function(d) { APP.repVisitas = Array.isArray(d) ? d : []; }),
      sbGet('checklist_registos', 'data_registo=gte.' + ini + '&data_registo=lte.' + fim + '&order=data_registo.asc')
        .then(function(d) { APP.repChecks = Array.isArray(d) ? d : []; })
    ]).then(function() {
      _globaisEstado = 'ok';
      _rerender();
    }).catch(function(e) {
      // mostrar SEMPRE o erro real do Supabase
      _globaisEstado = 'erro';
      _globaisErro = (e && (e.code || e.message))
        ? [e.code, e.message, e.details, e.hint].filter(Boolean).join(' · ')
        : String(e);
      _rerender();
    });
  }

  // ── INDICADORES DE UM EQUIPAMENTO NO PERÍODO ──────────────
  function _pessoasReg(r) {
    return (parseInt(r.n_adultos, 10) || 0) + (parseInt(r.n_criancas, 10) || 0);
  }

  // noites de uma estadia (mesma regra do módulo Estadias)
  function _noitesEst(e) {
    if (!e.data_checkin) return 0;
    var i = new Date(e.data_checkin);
    var f = e.data_checkout_real ? new Date(e.data_checkout_real)
          : (e.estado === 'ativa' ? new Date()
          : (e.data_checkout_prev ? new Date(e.data_checkout_prev) : null));
    if (!f || isNaN(i) || isNaN(f)) return 0;
    var n = Math.round((f - i) / 86400000);
    return n > 0 ? n : (e.estado === 'ativa' ? 0 : 1);
  }

  // dormidas = pessoas × noites (indicador oficial de turismo)
  function _dormidasEst(e) { return _pessoasReg(e) * _noitesEst(e); }

  // Todos os indicadores de um equipamento, num mês (ou no ano se mes=null)
  function _indicadores(eqId, mes) {
    function noMes(iso) {
      if (!iso) return false;
      var ano = String(APP.anoTrabalho || new Date().getFullYear());
      var s = String(iso).slice(0, 10);
      if (s.slice(0, 4) !== ano) return false;
      if (!mes) return true;
      return s.slice(5, 7) === ('0' + mes).slice(-2);
    }
    function doEq(arr, campoData) {
      return (arr || []).filter(function(r) {
        return r.equipamento_id === eqId && noMes(r[campoData]);
      });
    }

    var reservas = doEq(APP.reservas, 'data_inicio').filter(function(r) { return r.estado !== 'cancelada'; });
    var memos    = doEq(APP.memos, 'created_at');
    var estadias = doEq(APP.repEstadias, 'data_checkin');
    var visitas  = doEq(APP.repVisitas, 'data');
    var checks   = doEq(APP.repChecks, 'data_registo');
    var turnos   = doEq(APP.escalas, 'data_inicio');

    var dormidas = 0, hospedes = 0, noites = 0;
    estadias.forEach(function(e) {
      dormidas += _dormidasEst(e);
      hospedes += _pessoasReg(e);
      noites   += _noitesEst(e);
    });

    var visitantes = 0, vAd = 0, vCr = 0;
    visitas.forEach(function(v) {
      vAd += parseInt(v.n_adultos, 10) || 0;
      vCr += parseInt(v.n_criancas, 10) || 0;
    });
    visitantes = vAd + vCr;

    return {
      reservas:   reservas.length,
      memosAb:    memos.filter(function(m) { return m.estado !== 'concluido'; }).length,
      memosCo:    memos.filter(function(m) { return m.estado === 'concluido'; }).length,
      estadias:   estadias.length,
      dormidas:   dormidas,
      hospedes:   hospedes,
      noites:     noites,
      estadiasL:  estadias,
      visitas:    visitas.length,
      visitantes: visitantes,
      vAdultos:   vAd,
      vCriancas:  vCr,
      visitasL:   visitas,
      checklists: checks.length,
      turnos:     turnos.length
    };
  }

  // ── GRÁFICOS (SVG puro — sem bibliotecas, imprime bem) ─────
  var CORES = { azul:'#2563EB', teal:'#0D9488', ambar:'#D97706', verde:'#16A34A', roxo:'#7C3AED', vermelho:'#DC2626' };

  // Barras verticais — evolução ao longo dos 12 meses.
  // compacto = versão para 3 gráficos lado a lado no relatório impresso:
  // usa a inicial do mês e fontes maiores, para continuar legível depois
  // de o SVG ser reduzido a um terço da largura da página.
  function _chartBarras(dados, cor, compacto) {
    var W  = compacto ? 300 : 380;
    var H  = compacto ? 172 : 150;
    var pb = compacto ? 26  : 22;
    var pt = compacto ? 20  : 16;
    var pl = 6;
    var fLbl = compacto ? 11   : 8.5;
    var fVal = compacto ? 10.5 : 8.5;

    var alt = H - pt - pb;
    var max = 1;
    dados.forEach(function(d) { if (d.v > max) max = d.v; });
    var n = dados.length || 1;
    var slot = (W - pl * 2) / n;
    var bw = Math.min(slot * 0.6, 26);

    var s = '<svg class="rchart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
    [0, 0.5, 1].forEach(function(f) {
      var y = pt + alt * (1 - f);
      s += '<line x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (W - pl) + '" y2="' + y.toFixed(1) +
           '" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>';
    });
    dados.forEach(function(d, i) {
      var h = alt * (d.v / max);
      var x = pl + slot * i + (slot - bw) / 2;
      var y = pt + alt - h;
      var rot = compacto ? String(d.l).charAt(0) : d.l;
      s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) +
           '" height="' + Math.max(h, 0).toFixed(1) + '" rx="3" fill="' + cor +
           '" fill-opacity="' + (d.destaque ? '1' : '0.72') + '"><title>' + esc(d.l) + ': ' + d.v + '</title></rect>';
      if (d.v > 0) {
        s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 4).toFixed(1) +
             '" text-anchor="middle" font-size="' + fVal + '" font-weight="700" fill="#334155">' + d.v + '</text>';
      }
      s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) +
           '" text-anchor="middle" font-size="' + fLbl + '" fill="#64748B">' + esc(rot) + '</text>';
    });
    s += '</svg>';
    return s;
  }

  // Barras horizontais — comparação entre equipamentos (nomes longos)
  function _chartBarrasH(dados, cor) {
    if (!dados.length) return _chartVazio();
    var linha = 26, W = 380, pl = 118, pr = 34;
    var H = dados.length * linha + 8;
    var max = 1;
    dados.forEach(function(d) { if (d.v > max) max = d.v; });
    var larg = W - pl - pr;

    var s = '<svg class="rchart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
    dados.forEach(function(d, i) {
      var y = i * linha + 5;
      var w = larg * (d.v / max);
      var nome = d.l.length > 18 ? d.l.slice(0, 17) + '…' : d.l;
      s += '<text x="' + (pl - 8) + '" y="' + (y + 12) + '" text-anchor="end" font-size="9.5" fill="#334155">' + esc(nome) + '</text>';
      s += '<rect x="' + pl + '" y="' + y + '" width="' + larg + '" height="15" rx="3" fill="#94A3B8" fill-opacity="0.12"/>';
      s += '<rect x="' + pl + '" y="' + y + '" width="' + Math.max(w, d.v > 0 ? 2 : 0).toFixed(1) +
           '" height="15" rx="3" fill="' + cor + '"><title>' + esc(d.l) + ': ' + d.v + '</title></rect>';
      s += '<text x="' + (W - pr + 6) + '" y="' + (y + 12) + '" font-size="9.5" font-weight="700" fill="#334155">' + d.v + '</text>';
    });
    s += '</svg>';
    return s;
  }

  // Donut — repartição (tipos de visitante, etc.)
  function _chartDonut(dados) {
    var total = 0;
    dados.forEach(function(d) { total += d.v; });
    if (!total) return _chartVazio();

    var cx = 62, cy = 62, R = 52, r = 32, ang = -Math.PI / 2;
    var s = '<div class="rdonut"><svg viewBox="0 0 124 124" class="rdonut-svg">';
    dados.forEach(function(d) {
      if (!d.v) return;
      var frac = d.v / total;
      var a2 = ang + frac * Math.PI * 2;
      // um único segmento a 100% não desenha arco — usar dois anéis
      if (frac >= 0.999) {
        s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((R + r) / 2) + '" fill="none" stroke="' + d.c +
             '" stroke-width="' + (R - r) + '"><title>' + esc(d.l) + ': ' + d.v + '</title></circle>';
        ang = a2;
        return;
      }
      var grande = frac > 0.5 ? 1 : 0;
      var x1 = cx + R * Math.cos(ang), y1 = cy + R * Math.sin(ang);
      var x2 = cx + R * Math.cos(a2),  y2 = cy + R * Math.sin(a2);
      var x3 = cx + r * Math.cos(a2),  y3 = cy + r * Math.sin(a2);
      var x4 = cx + r * Math.cos(ang), y4 = cy + r * Math.sin(ang);
      s += '<path d="M' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
           ' A' + R + ' ' + R + ' 0 ' + grande + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2) +
           ' L' + x3.toFixed(2) + ' ' + y3.toFixed(2) +
           ' A' + r + ' ' + r + ' 0 ' + grande + ' 0 ' + x4.toFixed(2) + ' ' + y4.toFixed(2) + ' Z"' +
           ' fill="' + d.c + '"><title>' + esc(d.l) + ': ' + d.v + '</title></path>';
      ang = a2;
    });
    s += '<text x="' + cx + '" y="' + (cy + 1) + '" text-anchor="middle" font-size="19" font-weight="800" fill="#0F172A">' + total + '</text>';
    s += '<text x="' + cx + '" y="' + (cy + 13) + '" text-anchor="middle" font-size="7.5" fill="#64748B">total</text>';
    s += '</svg><div class="rleg">';
    // Percentagens pelo método do maior resto: arredondar cada fatia por si
    // dava somas de 99% ou 101%. Distribui-se a diferença pelas maiores sobras.
    var vis = dados.filter(function(d) { return d.v > 0; });
    var pcts = vis.map(function(d) {
      var exato = d.v / total * 100;
      return { base: Math.floor(exato), resto: exato - Math.floor(exato) };
    });
    var soma = 0;
    pcts.forEach(function(p) { soma += p.base; });
    var faltam = 100 - soma;
    pcts.map(function(p, i) { return { i: i, r: p.resto }; })
        .sort(function(a, b) { return b.r - a.r; })
        .slice(0, Math.max(faltam, 0))
        .forEach(function(x) { pcts[x.i].base += 1; });

    vis.forEach(function(d, i) {
      s += '<div class="rleg-i"><span class="rleg-d" style="background:' + d.c + ';"></span>' +
           '<span class="rleg-l">' + esc(d.l) + '</span>' +
           '<span class="rleg-v">' + d.v + ' <em>' + pcts[i].base + '%</em></span></div>';
    });
    s += '</div></div>';
    return s;
  }

  function _chartVazio() {
    return '<div class="rchart-vazio">Sem dados no período selecionado.</div>';
  }

  function _rcard(val, label, sub, cor) {
    return '<div class="rcard" style="border-top-color:' + cor + ';">' +
           '<div class="rcard-v">' + val + '</div>' +
           '<div class="rcard-l">' + esc(label) + '</div>' +
           '<div class="rcard-s">' + esc(sub || '') + '</div></div>';
  }

  function _bloco(titulo, corpo, sub) {
    return '<div class="rbloco"><div class="rbloco-h"><div class="rbloco-t">' + esc(titulo) + '</div>' +
           (sub ? '<div class="rbloco-s">' + esc(sub) + '</div>' : '') + '</div>' + corpo + '</div>';
  }

  // ── A PÁGINA ──────────────────────────────────────────────
  function _renderEquipamentos() {
    if (_globaisEstado === null) { _carregarGlobais(); }

    if (_globaisEstado === 'erro') {
      return '<div class="rbloco"><div class="rbloco-h"><div class="rbloco-t" style="color:var(--red);">Não foi possível carregar os dados</div></div>' +
             '<div style="padding:0 16px 16px;font-size:13px;color:var(--text-2);">' + esc(_globaisErro) + '</div>' +
             '<div style="padding:0 16px 16px;"><button class="btn btn-secondary btn-sm" onclick="Relatorios.recarregar()">Tentar de novo</button></div></div>';
    }
    if (_globaisEstado !== 'ok') {
      return '<div class="rchart-vazio" style="padding:40px;">A carregar estadias, visitas e checklists…</div>';
    }

    var eqs = (APP.equipamentos || []).filter(function(e) { return APP.podeVerEquipamento(e.id); });
    if (!eqs.length) return '<div class="rchart-vazio">Sem equipamentos.</div>';

    var eqId = _eqRel || eqs[0].id;
    if (!eqs.filter(function(e) { return e.id === eqId; }).length) eqId = eqs[0].id;
    var eq   = eqs.filter(function(e) { return e.id === eqId; })[0];
    var mes  = APP.repMes || null;
    var d    = _indicadores(eqId, mes);
    var tipo = getTipo(eq.tipo_id);

    var html = '';

    // Selector de equipamento + botão imprimir
    html += '<div class="rbar">';
    html += '<select class="eq-switch rbar-sel" onchange="Relatorios.setEqRel(this.value)">';
    eqs.forEach(function(e) {
      html += '<option value="' + e.id + '"' + (e.id === eqId ? ' selected' : '') + '>' + H(e.nome) + '</option>';
    });
    html += '</select>';
    html += '<button class="btn btn-primary btn-sm" onclick="Relatorios.imprimirMensal(\'' + eqId + '\')">🖨 Relatório mensal</button>';
    html += '</div>';

    // Cabeçalho do equipamento
    html += '<div class="rhead">';
    html += '<div class="rhead-n">' + H(eq.nome) + '</div>';
    html += '<div class="rhead-m">' + H(tipo ? tipo.nome : '—') + ' · ' + esc(_perLabel()) + '</div>';
    html += '</div>';

    // ── KPIs (só os módulos que o equipamento tem) ──
    html += '<div class="rgrid">';
    if (modAtivo(eq, 'estadias')) {
      html += _rcard(d.dormidas,   'Dormidas',    'pessoas × noites', CORES.teal);
      html += _rcard(d.estadias,   'Estadias',    d.hospedes + ' hóspedes', CORES.azul);
    }
    if (modAtivo(eq, 'visitas')) {
      html += _rcard(d.visitantes, 'Visitantes',  d.vAdultos + ' ad. · ' + d.vCriancas + ' cri.', CORES.roxo);
      html += _rcard(d.visitas,    'Visitas',     'grupos registados', CORES.azul);
    }
    if (modAtivo(eq, 'reservas'))  html += _rcard(d.reservas,   'Reservas',   'não canceladas', CORES.azul);
    if (modAtivo(eq, 'checklist')) html += _rcard(d.checklists, 'Checklists', 'registos preenchidos', CORES.verde);
    if (modAtivo(eq, 'escalas'))   html += _rcard(d.turnos,     'Turnos',     'na escala', CORES.teal);
    html += _rcard(d.memosAb, 'Reparações abertas', d.memosCo + ' concluídas', d.memosAb ? CORES.ambar : CORES.verde);
    html += '</div>';

    // ── Evolução mensal (o indicador principal do equipamento) ──
    var ind = _indicadorPrincipal(eq);
    var serie = [];
    for (var m = 1; m <= 12; m++) {
      var dm = _indicadores(eqId, m);
      serie.push({ l: MESES_C[m - 1], v: dm[ind.campo] || 0, destaque: (mes === m) });
    }
    html += _bloco('Evolução mensal — ' + ind.label,
                   _chipsInd(eq) + _chartBarras(serie, ind.cor),
                   'Ano de ' + (APP.anoTrabalho || new Date().getFullYear()) + (mes ? ' · mês selecionado a cheio' : ''));

    // ── Repartição (donut) ──
    if (modAtivo(eq, 'visitas') && d.visitas) {
      var porTipo = {};
      d.visitasL.forEach(function(v) {
        var t = v.tipo_visitante || 'outro';
        porTipo[t] = (porTipo[t] || 0) + _pessoasReg(v);
      });
      var paleta = [CORES.azul, CORES.teal, CORES.ambar, CORES.roxo, CORES.verde, CORES.vermelho];
      var dd = Object.keys(porTipo).map(function(k, i) {
        return { l: _labelTipoVisita(k), v: porTipo[k], c: paleta[i % paleta.length] };
      }).sort(function(a, b) { return b.v - a.v; });
      html += _bloco('Visitantes por tipo', _chartDonut(dd), esc(_perLabel()));
    }

    if (modAtivo(eq, 'estadias') && d.estadias) {
      var ad = 0, cr = 0;
      d.estadiasL.forEach(function(e) {
        ad += parseInt(e.n_adultos, 10) || 0;
        cr += parseInt(e.n_criancas, 10) || 0;
      });
      html += _bloco('Hóspedes por escalão',
                     _chartDonut([{ l: 'Adultos', v: ad, c: CORES.azul }, { l: 'Crianças', v: cr, c: CORES.ambar }]),
                     esc(_perLabel()));
    }

    // ── Comparação — só com equipamentos comparáveis ──
    // Não basta o mesmo tipo: o "Complexo de Vinha de Mouros" agrupa o
    // campismo, o CEAVM e o hípico, e só o campismo tem hóspedes. Só se
    // compara quem tem o MESMO TIPO e o MÓDULO que gera este indicador.
    if (APP.isDds() && ind.mod) {
      var comparaveis = eqs.filter(function(e) {
        return e.tipo_id === eq.tipo_id && modAtivo(e, ind.mod);
      });
      if (comparaveis.length > 1) {
        var comp = comparaveis.map(function(e) {
          var de = _indicadores(e.id, mes);
          return { l: e.nome, v: de[ind.campo] || 0 };
        }).sort(function(a, b) { return b.v - a.v; });
        html += _bloco('Comparação — ' + ind.label,
                       _chartBarrasH(comp, ind.cor),
                       comparaveis.length + ' equipamentos comparáveis · ' + _perLabel());
      }
    }

    // ── Detalhe: reparações do período ──
    var memosP = (APP.memos || []).filter(function(m) {
      return m.equipamento_id === eqId && _noPeriodo(m.created_at);
    });
    if (memosP.length) {
      var t = '<div class="dtw"><table class="dt"><thead><tr><th>Data</th><th>Assunto</th><th>Estado</th></tr></thead><tbody>';
      memosP.slice(0, 15).forEach(function(m) {
        t += '<tr><td class="td-mono">' + _fdataC(m.created_at) + '</td>' +
             '<td class="td-p">' + H(m.descricao || '—') + '</td>' +
             '<td>' + _estadoMemo(m) + '</td></tr>';
      });
      t += '</tbody></table></div>';
      html += _bloco('Reparações e memorandos', t, memosP.length + ' no período');
    }

    return html;
  }

  // Indicadores que fazem sentido para este equipamento (o 1.º é o omissão)
  // 'mod' = módulo que gera o indicador — usado para saber com quem comparar
  function _indicadoresDisp(eq) {
    var l = [];
    if (modAtivo(eq, 'estadias')) {
      l.push({ campo: 'hospedes', label: 'Hóspedes', cor: CORES.teal,  mod: 'estadias' });
      l.push({ campo: 'estadias', label: 'Estadias', cor: CORES.azul,  mod: 'estadias' });
      l.push({ campo: 'dormidas', label: 'Dormidas', cor: CORES.verde, mod: 'estadias' });
    }
    if (modAtivo(eq, 'visitas')) {
      l.push({ campo: 'visitantes', label: 'Visitantes', cor: CORES.roxo, mod: 'visitas' });
      l.push({ campo: 'visitas',    label: 'Grupos',     cor: CORES.azul, mod: 'visitas' });
    }
    if (modAtivo(eq, 'reservas')) l.push({ campo: 'reservas', label: 'Reservas', cor: CORES.azul, mod: 'reservas' });
    if (!l.length) l.push({ campo: 'memosCo', label: 'Reparações concluídas', cor: CORES.verde, mod: null });
    return l;
  }

  // Qual o indicador a desenhar: o escolhido, se for válido aqui; senão o 1.º
  function _indicadorPrincipal(eq) {
    var disp = _indicadoresDisp(eq);
    var esc = disp.filter(function(i) { return i.campo === _indRel; })[0];
    return esc || disp[0];
  }

  // Botões de escolha do indicador
  function _chipsInd(eq) {
    var disp = _indicadoresDisp(eq);
    if (disp.length <= 1) return '';
    var atual = _indicadorPrincipal(eq).campo;
    var s = '<div class="rchips">';
    disp.forEach(function(i) {
      s += '<button class="rchip' + (i.campo === atual ? ' active' : '') +
           '" onclick="Relatorios.setInd(\'' + i.campo + '\')">' + esc(i.label) + '</button>';
    });
    s += '</div>';
    return s;
  }

  function setInd(c) { _indRel = c; _rerender(); }

  var MESES_C = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  function _labelTipoVisita(t) {
    var m = { escola:'Escola', familia:'Família', grupo:'Grupo', particular:'Particular',
              instituicao:'Instituição', empresa:'Empresa', outro:'Outro' };
    return m[t] || t;
  }

  function _fdataC(iso) {
    if (!iso) return '—';
    var s = String(iso).slice(0, 10).split('-');
    if (s.length !== 3) return '—';
    return s[2] + '/' + s[1] + '/' + s[0];
  }

  function setEqRel(v) { _eqRel = v; _rerender(); }
  function recarregar() { _globaisEstado = null; _rerender(); }

  // ── RELATÓRIO MENSAL IMPRIMÍVEL ───────────────────────────
  function imprimirMensal(eqId) {
    var eq = getEq(eqId);
    if (!eq) { toast('Equipamento não encontrado.', 'error'); return; }
    if (_globaisEstado !== 'ok') { toast('Os dados ainda estão a carregar.', 'error'); return; }
    _print(_repEqMensal(eq));
  }

  function _repEqMensal(eq) {
    var mes  = APP.repMes || null;
    var d    = _indicadores(eq.id, mes);
    var tipo = getTipo(eq.tipo_id);

    var h = _cabecalho('Relatório de Atividade — ' + eq.nome, tipo ? tipo.nome : '');

    function _med(a, b) { return b ? (Math.round(a / b * 10) / 10).toString().replace('.', ',') : '—'; }

    // ── Indicadores (só os que dizem respeito à atividade do equipamento) ──
    h += '<div class="pr-sec">Indicadores do período</div>';
    h += '<div class="pr-kpis">';
    if (modAtivo(eq, 'estadias')) {
      h += _kpi(d.dormidas, 'Dormidas');
      h += _kpi(d.hospedes, 'Hóspedes');
      h += _kpi(d.estadias, 'Estadias');
      h += _kpi(d.noites,   'Noites');
      h += _kpi(_med(d.noites, d.estadias),   'Estadia média (noites)');
      h += _kpi(_med(d.hospedes, d.estadias), 'Pessoas por estadia');
    }
    if (modAtivo(eq, 'visitas')) {
      h += _kpi(d.visitantes, 'Visitantes');
      h += _kpi(d.visitas,    'Grupos');
      h += _kpi(_med(d.visitantes, d.visitas), 'Pessoas por grupo');
      h += _kpi(d.vAdultos,   'Adultos');
      h += _kpi(d.vCriancas,  'Crianças');
    }
    if (modAtivo(eq, 'reservas')) h += _kpi(d.reservas, 'Reservas');
    h += '</div>';

    // ── Gráficos de evolução, LADO A LADO ──
    var disp = _indicadoresDisp(eq);
    h += '<div class="pr-sec">Evolução mensal · ' + (APP.anoTrabalho || new Date().getFullYear()) + '</div>';
    h += '<div class="pr-charts" style="grid-template-columns:repeat(' + disp.length + ',1fr);">';
    disp.forEach(function(i) {
      var serie = [];
      for (var m = 1; m <= 12; m++) {
        serie.push({ l: MESES_C[m - 1], v: _indicadores(eq.id, m)[i.campo] || 0, destaque: (mes === m) });
      }
      h += '<div class="pr-chart"><div class="pr-chart-t">' + esc(i.label) + '</div>' +
           _chartBarras(serie, i.cor, true) + '</div>';
    });
    h += '</div>';

    // ── Repartições (donuts em par) ──
    var donuts = [];

    if (modAtivo(eq, 'visitas') && d.visitas) {
      var porTipo = {};
      d.visitasL.forEach(function(v) {
        var t = v.tipo_visitante || 'outro';
        porTipo[t] = (porTipo[t] || 0) + _pessoasReg(v);
      });
      var paleta = [CORES.azul, CORES.teal, CORES.ambar, CORES.roxo, CORES.verde, CORES.vermelho];
      var dv = Object.keys(porTipo).map(function(k, i2) {
        return { l: _labelTipoVisita(k), v: porTipo[k], c: paleta[i2 % paleta.length] };
      }).sort(function(a, b) { return b.v - a.v; });
      donuts.push({ t: 'Visitantes por tipo', d: dv });
    }

    if (modAtivo(eq, 'estadias') && d.estadias) {
      var ad = 0, cr = 0;
      d.estadiasL.forEach(function(e) {
        ad += parseInt(e.n_adultos, 10) || 0;
        cr += parseInt(e.n_criancas, 10) || 0;
      });
      donuts.push({ t: 'Hóspedes por escalão',
                    d: [{ l: 'Adultos', v: ad, c: CORES.azul }, { l: 'Crianças', v: cr, c: CORES.ambar }] });

      // tipo de alojamento — tenda, caravana, autocaravana…
      var porAloj = {};
      d.estadiasL.forEach(function(e) {
        var t = e.tipo_alojamento || 'outro';
        porAloj[t] = (porAloj[t] || 0) + 1;
      });
      var labA = { tenda:'Tenda', caravana:'Caravana', autocaravana:'Autocaravana', bungalow:'Bungalow', outro:'Outro' };
      var palA = [CORES.teal, CORES.roxo, CORES.azul, CORES.verde, CORES.ambar];
      var da = Object.keys(porAloj).map(function(k, i2) {
        return { l: labA[k] || k, v: porAloj[k], c: palA[i2 % palA.length] };
      }).sort(function(a, b) { return b.v - a.v; });
      donuts.push({ t: 'Tipo de alojamento', d: da });
    }

    if (donuts.length) {
      h += '<div class="pr-charts" style="grid-template-columns:repeat(' + Math.min(donuts.length, 2) + ',1fr);">';
      donuts.forEach(function(dn) {
        h += '<div class="pr-chart"><div class="pr-chart-t">' + esc(dn.t) + '</div>' + _chartDonut(dn.d) + '</div>';
      });
      h += '</div>';
    }

    // ── Proveniência dos hóspedes (indicador de turismo) ──
    if (modAtivo(eq, 'estadias') && d.estadias) {
      var porPais = {};
      d.estadiasL.forEach(function(e) {
        var p = e.nacionalidade || 'Não indicado';
        if (!porPais[p]) porPais[p] = { est: 0, pes: 0, dor: 0 };
        porPais[p].est += 1;
        porPais[p].pes += _pessoasReg(e);
        porPais[p].dor += _dormidasEst(e);
      });
      var paises = Object.keys(porPais).map(function(p) {
        return { p: p, est: porPais[p].est, pes: porPais[p].pes, dor: porPais[p].dor };
      }).sort(function(a, b) { return b.dor - a.dor; });

      if (paises.length) {
        h += '<div class="pr-bloco"><div class="pr-sec">Proveniência dos hóspedes</div>';
        h += '<table class="pr-table"><thead><tr><th>País</th><th>Estadias</th><th>Hóspedes</th><th>Dormidas</th><th>% dormidas</th></tr></thead><tbody>';
        paises.slice(0, 8).forEach(function(x) {
          var pct = d.dormidas ? Math.round(x.dor / d.dormidas * 100) : 0;
          h += '<tr><td>' + esc(x.p) + '</td><td>' + x.est + '</td><td>' + x.pes + '</td>' +
               '<td>' + x.dor + '</td><td>' + pct + '%</td></tr>';
        });
        h += '<tr class="pr-tot"><td>Total</td><td>' + d.estadias + '</td><td>' + d.hospedes +
             '</td><td>' + d.dormidas + '</td><td>100%</td></tr>';
        h += '</tbody></table></div>';
      }
    }

    // ── Resumo do ano, mês a mês ──
    var cols = _indicadoresDisp(eq);
    h += '<div class="pr-bloco"><div class="pr-sec">Resumo do ano · ' + (APP.anoTrabalho || new Date().getFullYear()) + '</div>';
    h += '<table class="pr-table"><thead><tr><th>Mês</th>';
    cols.forEach(function(c) { h += '<th>' + esc(c.label) + '</th>'; });
    h += '</tr></thead><tbody>';
    var tot = {};
    cols.forEach(function(c) { tot[c.campo] = 0; });
    for (var mm = 1; mm <= 12; mm++) {
      var dm = _indicadores(eq.id, mm);
      var vazio = cols.every(function(c) { return !(dm[c.campo] || 0); });
      if (vazio) continue; // não enche a página com meses a zero
      h += '<tr' + (mes === mm ? ' class="pr-tot"' : '') + '><td>' + MESES[mm - 1] + '</td>';
      cols.forEach(function(c) {
        var v = dm[c.campo] || 0;
        tot[c.campo] += v;
        h += '<td>' + v + '</td>';
      });
      h += '</tr>';
    }
    h += '<tr class="pr-tot"><td>Total do ano</td>';
    cols.forEach(function(c) { h += '<td>' + tot[c.campo] + '</td>'; });
    h += '</tr></tbody></table></div>';

    // Reparações — só as do período, para não estourar a página
    var memosP = (APP.memos || []).filter(function(m) {
      return m.equipamento_id === eq.id && _noPeriodo(m.created_at);
    });
    if (memosP.length) {
      h += '<div class="pr-bloco"><div class="pr-sec">Reparações e memorandos (' + memosP.length + ')</div>';
      h += '<table class="pr-table"><thead><tr><th>Data</th><th>Assunto</th><th>Estado</th></tr></thead><tbody>';
      memosP.slice(0, 12).forEach(function(m) {
        h += '<tr><td>' + _fdataC(m.created_at) + '</td><td>' + esc(m.descricao || '—') + '</td>' +
             '<td>' + (m.estado === 'concluido' ? 'Concluído' : 'Em curso') + '</td></tr>';
      });
      h += '</tbody></table>';
      if (memosP.length > 12) {
        h += '<div class="pr-meta2">… e mais ' + (memosP.length - 12) + '. Lista completa no módulo Memorandos.</div>';
      }
      h += '</div>';
    }

    return h + _rodape();
  }

  function _print(body) {
    var root = document.getElementById('print-root');
    if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
    root.innerHTML = body;
    window.print();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function init() {}

  return {
    render: render, init: init, setTab: setTab, setMes: setMes,
    setPeriodo: setPeriodo, setEqFiltro: setEqFiltro,
    exportarMemos: exportarMemos, exportarOcupacao: exportarOcupacao,
    imprimir: imprimir, imprimirFuncionarios: imprimirFuncionarios,
    imprimirEq: imprimirEq, imprimirEqSel: imprimirEqSel, imprimirExtrato: imprimirExtrato,
    setEqRel: setEqRel, setInd: setInd, recarregar: recarregar, imprimirMensal: imprimirMensal
  };

})();

</script>
<script>
/* ═════ inicio.js ═════ */
// ============================================================
// GestDDS — inicio.js  v6.1
// Página inicial: o que há para tratar + um cartão por
// equipamento. Cada cartão abre a página desse equipamento.
// (Mantém o nome "Dashboard" para compatibilidade.)
// ============================================================

var Dashboard = (function() {

  function _hoje() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  function _seletorAno() {
    var anoActual = new Date().getFullYear();
    var anoSel = APP.anoTrabalho || anoActual;
    var h = '<select class="fin ini-ano" onchange="App.mudarAno(this.value)" aria-label="Ano de trabalho">';
    for (var a = anoActual + 1; a >= anoActual - 4; a--) {
      h += '<option value="' + a + '"' + (a === anoSel ? ' selected' : '') + '>' + (a === anoActual ? a + ' (atual)' : a) + '</option>';
    }
    h += '</select>';
    if (anoSel !== anoActual) h += '<span class="ini-aviso-ano">A ver ' + anoSel + '</span>';
    return h;
  }

  function _eqsVisiveis() {
    return (APP.equipamentos || []).filter(function(e) { return APP.podeVerEquipamento(e.id); })
      .sort(compareEq);
  }

  // ── RENDER ────────────────────────────────────────────────
  function render() {
    var nome = APP.nomeUtilizador().split(' ')[0];
    var h = '';
    h += '<div class="ini-head"><div><div class="ini-ola">' + H(saudacao()) + ', ' + H(nome) + '</div>';
    h += '<div class="ini-sub">' + H(hojeExtenso()) + ' · ' + H(APP.perfilLabel()) + '</div></div>';
    h += '<div class="ini-head-r">' + _seletorAno() + '</div></div>';

    h += _acoesRapidas();
    h += _paraTratar();

    var eqs = _eqsVisiveis();
    if (!eqs.length) {
      h += emptyState('Sem equipamentos', 'Ainda não tem nenhum equipamento associado. Fale com o administrador.');
      return h;
    }
    h += '<div class="ini-sec-t">' + (eqs.length === 1 ? 'O seu equipamento' : 'Equipamentos') + '<span>Clique num equipamento para ver tudo: reservas, escala, checklists, relatório…</span>' +
         (APP.isAdmin() && eqs.length > 1 ? '<button class="btn btn-ghost btn-sm ini-ord" onclick="Equipamentos.abrirOrdem()">↕ Ordenar</button>' : '') + '</div>';
    h += '<div class="ini-eqs">' + eqs.map(_cartaoEq).join('') + '</div>';
    return h;
  }

  // ── CARTÃO DE EQUIPAMENTO ─────────────────────────────────
  function _cartaoEq(eq) {
    var tipo = getTipo(eq.tipo_id);
    var hoje = _hoje();
    var nums = [];

    if (modAtivo(eq, 'reservas')) {
      var nR = (APP.reservas || []).filter(function(r) {
        return r.equipamento_id === eq.id && r.estado !== 'cancelada' && Mensal.ocorrencias(r, { ini: hoje, fim: hoje }) > 0;
      }).length;
      nums.push({ v: nR, l: nR === 1 ? 'reserva hoje' : 'reservas hoje', tab: 'reservas' });
    }
    if (modAtivo(eq, 'escalas')) {
      var nE = {};
      (APP.escalas || []).forEach(function(t) {
        var a = String(t.data_inicio).slice(0, 10), b = String(t.data_fim || t.data_inicio).slice(0, 10);
        if (t.equipamento_id === eq.id && hoje >= a && hoje <= b && t.tipo_turno !== 'folga' && t.tipo_turno !== 'ferias') nE[t.funcionario_id] = 1;
      });
      var n = Object.keys(nE).length;
      nums.push({ v: n, l: n === 1 ? 'pessoa de serviço' : 'pessoas de serviço', tab: 'escalas' });
    }
    var nM = (APP.memos || []).filter(function(m) { return m.equipamento_id === eq.id && m.estado !== 'concluido'; }).length;
    if (APP.podeCriarMemorandos()) nums.push({ v: nM, l: nM === 1 ? 'reparação aberta' : 'reparações abertas', tab: 'reparacoes', alerta: nM > 0 });

    var tabs = Eq.tabs(eq).filter(function(t) { return t.k !== 'resumo'; });

    var h = '<article class="ini-eq" onclick="Eq.abrir(\'' + eq.id + '\')" tabindex="0" onkeydown="if(event.key===\'Enter\')Eq.abrir(\'' + eq.id + '\')">';
    h += '<div class="ini-eq-top"><span class="ini-eq-ic">' + H(tipo && tipo.emoji ? tipo.emoji : '🏢') + '</span>';
    h += '<div style="min-width:0;flex:1;"><div class="ini-eq-nome">' + H(eq.nome) + '</div>';
    h += '<div class="ini-eq-sub">' + H(tipo ? tipo.nome : '') + (eq.unidade ? ' · ' + H(eq.unidade) : '') + '</div></div>';
    if (eq.estado && eq.estado !== 'ativo') h += badgeEqEstado(eq.estado);
    h += '</div>';
    if (nums.length) {
      h += '<div class="ini-eq-nums">';
      nums.forEach(function(x) {
        h += '<button class="ini-eq-n' + (x.alerta ? ' al' : '') + '" onclick="event.stopPropagation();Eq.abrir(\'' + eq.id + '\',\'' + x.tab + '\')"><b>' + x.v + '</b><span>' + x.l + '</span></button>';
      });
      h += '</div>';
    }
    h += '<div class="ini-eq-tabs">';
    tabs.forEach(function(t) {
      h += '<button class="ini-eq-tab" onclick="event.stopPropagation();Eq.abrir(\'' + eq.id + '\',\'' + t.k + '\')">' + t.ic + ' ' + t.l + '</button>';
    });
    h += '</div></article>';
    return h;
  }

  // ── AÇÕES RÁPIDAS (gerais, não de um equipamento) ─────────
  function _acoesRapidas() {
    var a = [];
    function add(ic, t, s, js) { a.push('<button class="qa" onclick="' + js + '"><span class="qa-ic">' + ic + '</span><span><span class="qa-t">' + t + '</span><br><span class="qa-s">' + s + '</span></span></button>'); }
    var eqRes = APP.eqParaModulo ? APP.eqParaModulo('reservas') : null;
    if (eqRes && APP.acessoMenu('reservas') && APP.podeGerirReservas(eqRes)) add('📅', 'Nova reserva', 'Marcar um espaço', "Dashboard.acao('reserva')");
    if (APP.podeCriarMemorandos()) add('🔧', 'Pedir reparação', 'Novo memorando', 'Memorandos.openNovo()');
    if (APP.acessoMenu('horas')) add('⏱', 'Banco de horas', 'Registar horas ou folga', 'Horas.openNovo()');
    if (APP.acessoMenu('ferias')) add('🏖', 'Marcar férias', 'Pedido ao dirigente', 'Ferias.openMarcar()');
    if (APP.acessoMenu('relatorios')) add('📄', 'Relatórios do mês', 'Uma página A4 por equipamento', "App.nav('relatorios')");
    if (!a.length) return '';
    return '<div class="qa-grid">' + a.join('') + '</div>';
  }

  function acao(tipo) {
    if (tipo === 'reserva') {
      var eqs = (APP.equipamentos || []).filter(function(e) {
        return modAtivo(e, 'reservas') && APP.podeVerEquipamento(e.id) && APP.podeGerirReservas(e.id);
      });
      if (!eqs.length) { toast('Nenhum dos seus equipamentos tem reservas.', 'error'); return; }
      if (eqs.length === 1) { _novaReserva(eqs[0].id); return; }
      _escolherEq(eqs, 'Nova reserva', 'Em que equipamento quer marcar a reserva?', '_novaReserva');
    }
  }

  function _novaReserva(eqId) {
    closeModal('m-escolher-eq');
    Eq.abrir(eqId, 'reservas');
    setTimeout(function() { Reservas.openNova(eqId, 'confirmada'); }, 500);
  }

  // Janela para escolher um equipamento (com pesquisa quando a lista é grande)
  function _escolherEq(eqs, titulo, sub, fn) {
    var m = document.getElementById('m-escolher-eq');
    if (!m) { m = document.createElement('div'); m.className = 'modal-bd'; m.id = 'm-escolher-eq'; document.body.appendChild(m); }
    eqs = eqs.slice().sort(compareEq);
    var h = '<div class="modal" style="max-width:460px;">';
    h += '<div class="modal-header"><div class="mh-ic mhi-blue"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>';
    h += '<div><div class="modal-title">' + H(titulo) + '</div><div class="modal-sub">' + H(sub) + '</div></div>';
    h += '<button class="modal-close" onclick="closeModal(\'m-escolher-eq\')">✕</button></div>';
    h += '<div class="modal-body">';
    if (eqs.length > 6) h += '<input class="fin" id="esc-eq-q" placeholder="Procurar equipamento…" oninput="Dashboard.filtrarEsc(this.value)" style="margin-bottom:10px;">';
    h += '<div class="esc-eq-l">';
    eqs.forEach(function(e) {
      var t = getTipo(e.tipo_id);
      h += '<button class="esc-eq" data-n="' + H(String(e.nome).toLowerCase()) + '" onclick="Dashboard.' + fn + '(\'' + e.id + '\')">';
      h += '<span class="esc-eq-ic">' + H(t && t.emoji ? t.emoji : '🏢') + '</span>';
      h += '<span class="esc-eq-t">' + H(e.nome) + '<small>' + H(t ? t.nome : '') + (e.unidade ? ' · ' + H(e.unidade) : '') + '</small></span><span class="esc-eq-a">›</span></button>';
    });
    h += '</div></div></div>';
    m.innerHTML = h;
    openModal('m-escolher-eq');
  }

  function filtrarEsc(q) {
    q = String(q || '').toLowerCase().trim();
    document.querySelectorAll('#m-escolher-eq .esc-eq').forEach(function(b) {
      b.style.display = !q || b.getAttribute('data-n').indexOf(q) >= 0 ? '' : 'none';
    });
  }

  // ── PARA TRATAR ───────────────────────────────────────────
  function _paraTratar() {
    var itens = [];
    function add(n, cls, t, s, js) {
      if (!n) return;
      itens.push('<div class="todo-i" onclick="' + js + '"><div class="todo-n ' + cls + '">' + n + '</div><div class="todo-t">' + t + '<div class="todo-s">' + s + '</div></div><span style="color:var(--text-3);">›</span></div>');
    }
    var nH = (typeof Horas !== 'undefined' && Horas.pendentesParaMim) ? Horas.pendentesParaMim() : 0;
    add(nH, 'a', 'Pedidos de banco de horas para autorizar', 'Serviço prestado, folgas e alterações', "App.nav('horas')");
    var nF = (typeof Ferias !== 'undefined' && Ferias.pendentesParaMim) ? Ferias.pendentesParaMim() : 0;
    add(nF, 'a', 'Pedidos de férias para validar', 'Confirme sobreposições no mesmo equipamento', "App.nav('ferias')");

    if (APP.podeCriarMemorandos() && typeof Memorandos !== 'undefined') {
      var b = Memorandos.getBadges();
      add(b.sec1, 'c', 'Memorandos recebidos por aprovar', 'Pedidos dos equipamentos', "App.nav('memorandos','sec1')");
      var q = proximaQuarta();
      add(b.sec3, 'b', 'Memorandos a enviar aos serviços', 'Próximo envio: 4.ª feira, ' + fData(q.dt.toISOString()), "App.nav('memorandos','sec3')");
      var atr = (APP.memos || []).filter(function(m) {
        return m.estado !== 'concluido' && m.data_envio_servicos && diasDesde(m.data_envio_servicos) >= 15 &&
               (APP.isDds() || (APP.user && m.criado_por === APP.user.id));
      }).length;
      add(atr, 'c', 'Reparações há mais de 15 dias sem resposta', 'Pode pedir reforço', "App.nav('memorandos','" + (APP.isDds() ? 'sec4' : 'sec2') + "')");
    }

    var hoje = _hoje();
    var porEq = {};
    (APP.reservas || []).forEach(function(r) {
      if (r.estado !== 'pre_reserva' || !APP.podeGerirReservas(r.equipamento_id)) return;
      var fim = String(r.recorrente ? (r.data_fim_periodo || r.data_fim) : r.data_inicio).slice(0, 10);
      if (fim >= hoje) porEq[r.equipamento_id] = (porEq[r.equipamento_id] || 0) + 1;
    });
    Object.keys(porEq).forEach(function(eid) {
      var e = getEq(eid);
      add(porEq[eid], 'd', 'Pré-reservas por confirmar' + (e ? ' — ' + H(e.nome) : ''), 'Confirme ou cancele para manter o calendário fiável', "Eq.abrir('" + eid + "','reservas')");
    });

    if (!itens.length) {
      if (!(APP.isDds() || APP.isResponsavel())) return '';
      return '<div class="todo"><div class="todo-h">✅ Para tratar</div><div class="todo-ok">Está tudo em dia. Não há pedidos à sua espera.</div></div>';
    }
    return '<div class="todo"><div class="todo-h">📌 Para tratar <span class="sec-badge">' + itens.length + '</span></div>' + itens.join('') + '</div>';
  }

  // ── COMPATIBILIDADE com chamadas antigas ──────────────────
  function selectSpot(eqId) { Eq.abrir(eqId); }
  function goTab(eqId, k) {
    var map = { checklists: 'checklist', reparacoes: 'reparacoes', info: 'info', estadias: 'estadias', visitas: 'visitas', reservas: 'reservas', escalas: 'escalas' };
    Eq.abrir(eqId, map[k] || k);
  }
  function tabsFor(eq) { return Eq.tabs(eq); }
  function switchTab() {}
  function toggleSelector() {}
  function init() {}

  return {
    render: render, init: init, selectSpot: selectSpot, tabsFor: tabsFor,
    goTab: goTab, acao: acao, _novaReserva: _novaReserva, filtrarEsc: filtrarEsc, toggleSelector: toggleSelector, switchTab: switchTab
  };
})();

</script>
<script>
/* ═════ memorandos.js ═════ */
// ============================================================
// GestDDS — memorandos.js  v6.2
// Fluxo: Os Meus → A Enviar → Em Curso → Arquivo
// ============================================================

var Memorandos = (function() {

  // ── CLASSIFICAÇÃO ─────────────────────────────────────────
  // sec2 — Os Meus:    criados pelo utilizador atual, não concluídos, não enviados
  // sec3 — A Enviar:   aprovados, ainda não enviados (visível a DDS)
  // sec4 — Em Curso:   enviados, não concluídos (visível a DDS)
  // sec5 — Arquivo:    concluídos
  // sec1 — Recebidos:  criados por equipamento, não aprovados (só DDS vê)

  // Cada memo pode pertencer a múltiplas secções em simultâneo.
  // secMemos() filtra pela secção pedida com lógica própria por secção.

  function secMemos(n) {
    var u = APP.user;
    if (!u) return [];
    return APP.memos.filter(function(m) {
      var euCriei = m.criado_por && m.criado_por === u.id;
      // responsável/professor só vê memos do seu equipamento; DDS vê todos
      var meuAmbito = APP.isDds() || euCriei || (u.equipamento_id && m.equipamento_id === u.equipamento_id);

      if (m.estado === 'concluido') {
        // Arquivo — DDS vê todos os concluídos; responsável só os do seu âmbito
        return n === 5 && meuAmbito;
      }

      if (n === 5) return false;

      // sec2 — Os Meus: tudo o que criei, não concluído
      if (n === 2) return euCriei;

      // sec3 — A Enviar: aprovados não enviados (DDS vê todos; inclui os do próprio)
      if (n === 3) return APP.isDds() && m.aprovado_dds && !m.data_envio_servicos;

      // sec4 — Em Curso: enviados não concluídos (DDS vê todos)
      if (n === 4) return APP.isDds() && !!m.data_envio_servicos;

      // sec1 — Recebidos: criados por equipamento, não aprovados (só DDS)
      if (n === 1) return APP.isDds() && !m.criado_por_dds && !m.aprovado_dds && !euCriei;

      return false;
    });
  }

  function getBadges() {
    var u = APP.user;
    if (!u) return { sec1:0, sec2:0, sec3:0, sec4:0 };
    var s1=0, s2=0, s3=0, s4=0;
    APP.memos.forEach(function(m) {
      if (m.estado === 'concluido') return;
      var euCriei = m.criado_por && m.criado_por === u.id;
      if (euCriei) s2++;
      if (APP.isDds()) {
        if (!m.criado_por_dds && !m.aprovado_dds && !euCriei) s1++;
        if (m.aprovado_dds && !m.data_envio_servicos) s3++;
        if (m.data_envio_servicos) s4++;
      }
    });
    return { sec1:s1, sec2:s2, sec3:s3, sec4:s4 };
  }

  // ── RENDER ────────────────────────────────────────────────
  function render(subview) {
    // funcionário simples não acede aos memorandos
    if (!APP.podeCriarMemorandos()) {
      return _pageHeader('Memorandos', false) + accessDenied();
    }
    switch (subview) {
      case 'sec1': return _renderSec1();
      case 'sec2': return _renderSec2();
      case 'sec3': return _renderSec3();
      case 'sec4': return _renderSec4();
      case 'sec5': return _renderArquivo();
      case 'verif': return _renderVerif();
      default:     return _renderSec2();
    }
  }

  function _pageHeader(title, showNew) {
    var html = '<div class="dash-greeting">';
    html += '<div><div class="dash-hello" style="font-size:18px;">' + H(title) + '</div></div>';
    if (showNew !== false) {
      html += '<button class="btn btn-primary btn-sm" onclick="Memorandos.openNovo()">+ Novo memorando</button>';
    }
    html += '</div>';
    return html;
  }

  // SEC 1 — Recebidos dos equipamentos (só DDS)
  function _renderSec1() {
    if (!APP.isDds()) return _pageHeader('Recebidos', false) + accessDenied();
    var memos = secMemos(1);
    var html = _pageHeader('Recebidos dos Equipamentos', false);
    if (!memos.length) return html + emptyState('Sem memorandos recebidos', 'Não existem memorandos por aprovar.');
    return html + _comFiltros(memos, 'sec1');
  }

  // SEC 2 — Os Meus (criados pelo utilizador atual)
  function _renderSec2() {
    var memos = secMemos(2);
    var html = _pageHeader('Os Meus Memorandos');
    if (!memos.length) return html + emptyState('Sem memorandos', 'Crie o primeiro memorando.');
    return html + _comFiltros(memos, 'sec2');
  }

  // SEC 3 — A Enviar (aprovados, aguardam 4ª feira)
  function _renderSec3() {
    if (!APP.isDds()) return _pageHeader('A Enviar', false) + accessDenied();
    var memos = secMemos(3);
    var nw = proximaQuarta();
    var html = _pageHeader('A Enviar para os Serviços', false);
    html += '<div class="info-banner">📅 Próxima 4ª feira: <strong>' + fData(nw.dt.toISOString()) + '</strong> &nbsp;·&nbsp; faltam ' + nw.dias + ' dia(s)</div>';
    if (!memos.length) return html + emptyState('Sem memorandos a enviar', 'Nenhum memorando aprovado pendente de envio.');

    // ações: preparar o texto para o email (editável antes de copiar)
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">';
    html += '<button class="btn btn-primary btn-sm" onclick="Memorandos.preverEmail()">✉️ Preparar email (' + memos.length + ')</button>';
    html += '<button class="btn btn-secondary btn-sm" onclick="Memorandos.copiarDirecto()">📋 Copiar já</button>';
    html += '<span style="font-size:11.5px;color:var(--text-3);">Prepare para rever e editar; ou copie diretamente.</span>';
    html += '</div>';

    return html + _comFiltros(memos, 'sec3');
  }

  // ── Texto para email ──────────────────────────────────────
  function _textoEmail() {
    var memos = secMemos(3);
    var L = [];
    L.push('Exmos. Senhores,');
    L.push('');
    L.push('Junto se remetem os memorandos da Divisão de Desenvolvimento Social para intervenção dos serviços:');
    L.push('');

    // agrupar por brigada, que é como os serviços trabalham
    var porBrig = {};
    memos.forEach(function(m) {
      var b = m.brigada || 'Sem brigada atribuída';
      if (!porBrig[b]) porBrig[b] = [];
      porBrig[b].push(m);
    });

    Object.keys(porBrig).sort().forEach(function(b) {
      L.push('── ' + b.toUpperCase() + ' ──');
      L.push('');
      porBrig[b].forEach(function(m) {
        var eq = m.equipamento_id ? getEq(m.equipamento_id) : null;
        L.push('Local: ' + (eq ? eq.nome : '—'));
        L.push('Descrição: ' + (m.descricao || '—'));
        if (m.observacoes) L.push('Observações: ' + m.observacoes);
        if (m.num_reforcos > 0) L.push('*** REFORÇO (' + m.num_reforcos + '.ª insistência) ***');
        L.push('');
      });
    });

    L.push('Total: ' + memos.length + ' memorando(s).');
    L.push('');
    L.push('Com os melhores cumprimentos,');
    L.push('Divisão de Desenvolvimento Social');
    L.push('Município de Cabeceiras de Basto');

    return L.join('\n');
  }

  function copiarEmail() {
    var memos = secMemos(3);
    if (!memos.length) { toast('Não há memorandos a enviar.', 'error'); return; }

    // Se a caixa de pré-visualização tem texto, é essa que vale —
    // assim respeitamos as alterações feitas à mão.
    var box = document.getElementById('m-email-txt');
    var txt = (box && box.value && box.value.trim()) ? box.value : _textoEmail();

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function() {
        toast('Texto copiado. Cole no email.', 'success');
      }).catch(function() {
        _copiarFallback(txt);
      });
    } else {
      _copiarFallback(txt);
    }
  }

  // alternativa: seleciona o texto para o utilizador copiar à mão
  function _copiarFallback(txt) {
    var box = document.getElementById('m-email-txt');
    var modal = document.getElementById('m-memo-email');
    var aberto = modal && modal.classList && modal.classList.contains('open');

    // se a caixa já está à vista, basta selecioná-la
    if (aberto && box) {
      box.focus();
      box.select();
      var ok1 = false;
      try { ok1 = document.execCommand('copy'); } catch (e) { ok1 = false; }
      toast(ok1 ? 'Texto copiado. Cole no email.' : 'Texto selecionado — copie com o teclado.', ok1 ? 'success' : 'error');
      return;
    }

    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);

    if (ok) {
      toast('Texto copiado. Cole no email.', 'success');
    } else {
      preverEmail();
      toast('Copie o texto da caixa.', 'error');
    }
  }

  // "Copiar já" — ignora edições anteriores e copia o texto original
  function copiarDirecto() {
    var memos = secMemos(3);
    if (!memos.length) { toast('Não há memorandos a enviar.', 'error'); return; }
    var box = document.getElementById('m-email-txt');
    if (box) box.value = '';           // limpa, para gerar de novo
    copiarEmail();
  }

  function preverEmail() {
    var memos = secMemos(3);
    if (!memos.length) { toast('Não há memorandos a enviar.', 'error'); return; }
    var box = document.getElementById('m-email-txt');
    if (box) box.value = _textoEmail();
    openModal('m-memo-email');
  }

  // repor o texto original, desfazendo as alterações
  function reporEmail() {
    var box = document.getElementById('m-email-txt');
    if (box) box.value = _textoEmail();
    toast('Texto reposto.', 'success');
  }


  // SEC 4 — Em Curso (enviados, aguardam conclusão)
  function _renderSec4() {
    if (!APP.isDds()) return _pageHeader('Em Curso', false) + accessDenied();
    var memos = secMemos(4);
    var html = _pageHeader('Em Curso', false);
    if (!memos.length) return html + emptyState('Sem memorandos em curso', 'Nenhum memorando enviado pendente de conclusão.');
    return html + _comFiltros(memos, 'sec4');
  }

  // SEC 5 — Arquivo agrupado por mês
  function _renderArquivo() {
    // secMemos(5) já limita ao âmbito do utilizador (DDS vê tudo; os restantes
    // só o seu equipamento). Ler APP.memos diretamente expunha os concluídos
    // de todos os equipamentos.
    var memos = secMemos(5);
    var html = _pageHeader('Arquivo', false);

    if (APP.isAdmin() && memos.length) {
      html += '<div style="display:flex;justify-content:flex-end;margin-bottom:14px;">';
      html += '<button class="btn btn-danger btn-sm" onclick="Memorandos.openApagarTodos()">Limpar arquivo</button>';
      html += '</div>';
    }

    if (!memos.length) return html + emptyState('Arquivo vazio', 'Nenhum memorando concluído ainda.');
    html += _filtros(memos, true);
    memos = _filtrar(memos);
    if (!memos.length) return html + _semResultados();
    var filtroAtivo = _filtroAtivo();

    // agrupar por mês
    var groups = {}, keys = [];
    memos.forEach(function(m) {
      var d = new Date(m.data_conclusao || m.created_at);
      var k = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0');
      var lbl = d.toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });
      if (!groups[k]) { groups[k] = { label: lbl, items: [] }; keys.push(k); }
      groups[k].items.push(m);
    });
    keys.sort().reverse();

    html += '<div style="display:flex;flex-direction:column;gap:10px;">';
    keys.forEach(function(k, i) {
      var g = groups[k], open = i === 0 || filtroAtivo;
      html += '<div class="acc-card">';
      html += '<div class="acc-hdr" onclick="Memorandos.toggleAcc(\'' + k + '\')" style="display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;user-select:none;">';
      html += '<svg id="accv-' + k + '" style="width:13px;height:13px;fill:none;stroke:var(--text-3);stroke-width:2;stroke-linecap:round;transition:transform .2s;' + (open ? 'transform:rotate(180deg)' : '') + ';" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
      html += '<span style="font-size:13px;font-weight:700;color:var(--text);flex:1;">' + H(g.label) + '</span>';
      html += '<span class="acc-count">' + g.items.length + '</span>';
      html += '</div>';
      html += '<div id="acc-' + k + '" style="' + (open ? '' : 'display:none;') + 'border-top:1px solid var(--border);">';
      html += _tabela(g.items, 'sec5');
      html += '</div></div>';
    });
    html += '</div>';
    return html;
  }

  // ── FILTROS (comuns a todas as secções) ───────────────────
  function _mf() {
    if (!APP.memoFiltro) APP.memoFiltro = { q: '', eq: '', brig: '', mes: '', atraso: false, ord: 'antigos' };
    return APP.memoFiltro;
  }
  function _filtroAtivo() { var F = _mf(); return !!(F.q || F.eq || F.brig || F.mes || F.atraso); }
  function _norm(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function _dataM(m) { return String(m.data || m.created_at || '').slice(0, 10); }

  function _filtrar(memos) {
    var F = _mf();
    var termos = _norm(F.q).split(/\s+/).filter(Boolean);
    var r = memos.filter(function(m) {
      if (F.eq === '__sem__') { if (m.equipamento_id) return false; }
      else if (F.eq && m.equipamento_id !== F.eq) return false;
      if (F.brig && (m.brigada || '') !== F.brig) return false;
      if (F.mes && _dataM(m).slice(0, 7) !== F.mes) return false;
      if (F.atraso && !(m.estado !== 'concluido' && m.data_envio_servicos && diasDesde(m.data_envio_servicos) >= 15)) return false;
      if (termos.length) {
        var txt = _norm([m.numero, m.descricao, m.observacoes, m.brigada, localMemo(m)].join(' '));
        for (var i = 0; i < termos.length; i++) if (txt.indexOf(termos[i]) < 0) return false;
      }
      return true;
    });
    r.sort(function(a, b) {
      if (F.ord === 'eq') { var c = localMemo(a).localeCompare(localMemo(b), 'pt'); if (c) return c; }
      var x = _dataM(a) + (a.numero || ''), y = _dataM(b) + (b.numero || '');
      return F.ord === 'recentes' ? y.localeCompare(x) : x.localeCompare(y);
    });
    return r;
  }

  function _filtros(memos, arquivo) {
    var F = _mf();
    var eqIds = {}, brigs = {}, meses = {}, semEq = false;
    memos.forEach(function(m) {
      if (m.equipamento_id) eqIds[m.equipamento_id] = 1; else semEq = true;
      if (m.brigada) brigs[m.brigada] = 1;
      var mm = _dataM(m).slice(0, 7); if (mm) meses[mm] = 1;
    });
    var eqs = Object.keys(eqIds).map(getEq).filter(Boolean).sort(compareEq);
    var MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    var n = _filtrar(memos).length;

    var h = '<div class="mf">';
    h += '<div class="mf-q"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>';
    h += '<input id="mf-q" class="fin" placeholder="Procurar nº, assunto, local…" value="' + H(F.q) + '" oninput="Memorandos.filtroTexto(this.value)"></div>';
    h += '<select class="fin" onchange="Memorandos.setFiltro(\'eq\',this.value)"><option value="">Todos os equipamentos</option>';
    eqs.forEach(function(e) { h += '<option value="' + e.id + '"' + (F.eq === e.id ? ' selected' : '') + '>' + H(e.nome) + '</option>'; });
    if (semEq) h += '<option value="__sem__"' + (F.eq === '__sem__' ? ' selected' : '') + '>Sem equipamento / outros locais</option>';
    h += '</select>';
    h += '<select class="fin" onchange="Memorandos.setFiltro(\'brig\',this.value)"><option value="">Todas as brigadas</option>';
    Object.keys(brigs).sort().forEach(function(b) { h += '<option' + (F.brig === b ? ' selected' : '') + '>' + H(b) + '</option>'; });
    h += '</select>';
    h += '<select class="fin" onchange="Memorandos.setFiltro(\'mes\',this.value)"><option value="">Qualquer mês</option>';
    Object.keys(meses).sort().reverse().forEach(function(k) { var p = k.split('-'); h += '<option value="' + k + '"' + (F.mes === k ? ' selected' : '') + '>' + MES[+p[1] - 1] + ' ' + p[0] + '</option>'; });
    h += '</select>';
    h += '<select class="fin" onchange="Memorandos.setFiltro(\'ord\',this.value)">';
    [['antigos', 'Antigos primeiro'], ['recentes', 'Recentes primeiro'], ['eq', 'Por equipamento']].forEach(function(o) {
      h += '<option value="' + o[0] + '"' + (F.ord === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; });
    h += '</select>';
    if (!arquivo) h += '<label class="mf-chk"><input type="checkbox"' + (F.atraso ? ' checked' : '') + ' onchange="Memorandos.setFiltro(\'atraso\',this.checked)"> Só +15 dias sem resposta</label>';
    h += '</div>';
    h += '<div class="mf-info">' + (_filtroAtivo() ? '<b>' + n + '</b> de ' + memos.length + ' memorandos <button class="btn btn-ghost btn-sm" onclick="Memorandos.limparFiltros()">✕ Limpar filtros</button>' : memos.length + ' memorandos') + '</div>';
    return h;
  }

  function _semResultados() {
    return emptyState('Nenhum resultado', 'Nenhum memorando corresponde aos filtros.') ;
  }

  function _comFiltros(memos, ctx) {
    var h = _filtros(memos, false);
    var f = _filtrar(memos);
    return h + (f.length ? _tabela(f, ctx) : _semResultados());
  }

  function setFiltro(k, v) { _mf()[k] = v; App.renderContent(); }
  function limparFiltros() { var o = _mf().ord; APP.memoFiltro = null; _mf().ord = o; App.renderContent(); }
  var _tq = null;
  function filtroTexto(v) {
    _mf().q = v;
    clearTimeout(_tq);
    _tq = setTimeout(function() {
      App.renderContent();
      var el = document.getElementById('mf-q');
      if (el) { el.focus(); var n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {} }

  // ── TABELA ────────────────────────────────────────────────
  function _tabela(memos, ctx) {
    if (!memos.length) return emptyState('Sem memorandos', 'Não existem registos.');

    var html = '<div class="dtw"><table class="dt">';
    html += '<thead><tr><th>Nº</th><th>Descrição</th><th>Equipamento</th><th>Brigada</th><th>Data</th><th>Estado</th><th>Dias</th><th></th></tr></thead>';
    html += '<tbody>';

    memos.forEach(function(m) {
      var dCriacao = diasDesde(m.created_at);
      var dEnvio   = m.data_envio_servicos ? diasDesde(m.data_envio_servicos) : null;
      // mostrar dias desde envio se enviado, senão desde criação
      var dShow  = dEnvio !== null ? dEnvio : dCriacao;
      var dLabel = dEnvio !== null ? (dShow + 'd envio') : (dShow + 'd');

      html += '<tr class="memo-row" onclick="Memorandos.ver(\'' + m.id + '\')" title="Clique para ver o memorando completo">';
      html += '<td class="td-mono">' + H(m.numero || '—') + '</td>';
      html += '<td class="td-p memo-desc"><span class="memo-desc-t">' + H(m.descricao || '—') + '</span></td>';
      html += '<td class="td-m">' + H(localMemo(m)) + '</td>';
      html += '<td class="td-m">' + H(m.brigada || '—') + '</td>';
      html += '<td class="td-m">' + fData(m.data || m.created_at) + '</td>';
      html += '<td>' + _badgeMemoEstado(m);
      if (m.num_reforcos > 0) html += ' <span class="bdg" style="background:var(--red-bg);color:var(--red);">' + m.num_reforcos + '× reforço</span>';
      html += '</td>';
      html += '<td><span class="days-bdg ' + diasCls(dShow) + '">' + dLabel + '</span></td>';
      html += '<td onclick="event.stopPropagation()"><div class="td-act">' + _acoes(m, ctx) + '</div></td>';
      html += '</tr>';
    });

    html += '</tbody></table></div>';

  function _badgeMemoEstado(m) {
    if (m.estado === 'concluido')         return '<span class="bdg bdg-concluido"><span class="bdg-dot"></span>Concluído</span>';
    if (m.estado === 'reforco_pedido')    return '<span class="bdg bdg-reforco"><span class="bdg-dot"></span>Reforço</span>';
    if (m.data_envio_servicos)            return '<span class="bdg bdg-andamento"><span class="bdg-dot"></span>Em curso</span>';
    if (m.aprovado_dds)                   return '<span class="bdg bdg-enviado"><span class="bdg-dot"></span>A enviar</span>';
    return '<span class="bdg bdg-pendente"><span class="bdg-dot"></span>Pendente</span>';
  }

  // ── ACÇÕES POR SECÇÃO ─────────────────────────────────────
  function _acoes(m, ctx) {
    var id = m.id;
    var isAdmin  = APP.isAdmin();
    var isDds    = APP.isDds();
    var euCriei  = APP.user && m.criado_por === APP.user.id;
    var podeConcluir = euCriei || isAdmin;

    // reforço só disponível 15+ dias após envio
    var diasEnvio = m.data_envio_servicos ? diasDesde(m.data_envio_servicos) : 0;
    var podeReforco = m.data_envio_servicos && diasEnvio >= 15;

    var btns = '';

    // SEC 1 — Recebidos: DDS aprova
    if (ctx === 'sec1') {
      btns += '<button class="btn btn-primary btn-sm" onclick="Memorandos.aprovar(\'' + id + '\')">Aprovar para envio</button>';
      if (isAdmin) btns += ' <button class="btn btn-success btn-sm" onclick="Memorandos.openConcluir(\'' + id + '\')">Concluir</button>';
    }

    // SEC 2 — Os Meus: criador acompanha em todas as fases
    if (ctx === 'sec2') {
      if (!m.aprovado_dds) {
        // Fase 1: pendente, aguarda aprovação DDS
        btns += '<span style="font-size:11.5px;color:var(--text-3);">Aguarda aprovação DDS</span>';
      } else if (!m.data_envio_servicos) {
        // Fase 2: aprovado, aguarda envio na 4ª feira
        btns += '<span style="font-size:11.5px;color:var(--purple);font-weight:600;">✓ Aprovado — a aguardar envio</span>';
      } else if (m.data_envio_servicos && podeConcluir) {
        // Fase 3: enviado, pode concluir
        btns += '<button class="btn btn-success btn-sm" onclick="Memorandos.openConcluir(\'' + id + '\')">Concluir</button>';
      } else if (m.data_envio_servicos) {
        // Fase 3: enviado, sem permissão para concluir
        btns += '<span style="font-size:11.5px;color:var(--text-3);">Enviado — em curso</span>';
      }
      // reforço só após 15 dias do envio
      if (podeReforco) {
        btns += ' <button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Memorandos.openReforco(\'' + id + '\')">Reforço</button>';
      }
    }

    // SEC 3 — A Enviar: DDS envia para serviços
    if (ctx === 'sec3') {
      btns += '<button class="btn btn-secondary btn-sm" onclick="Memorandos.openEnviar(\'' + id + '\')">Marcar como enviado</button>';
    }

    // SEC 4 — Em Curso: pode pedir confirmação ou concluir
    if (ctx === 'sec4') {
      if (isDds) btns += '<button class="btn btn-ghost btn-sm" onclick="Memorandos.pedirConf(\'' + id + '\')">Pedir conf.</button> ';
      if (podeConcluir) btns += '<button class="btn btn-success btn-sm" onclick="Memorandos.openConcluir(\'' + id + '\')">Concluir</button>';
      if (podeReforco) btns += ' <button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Memorandos.openReforco(\'' + id + '\')">Reforço</button>';
    }

    return btns;
  }

  function openNovo() {
    gerarNumMemo().then(function(num) {
      var el = document.getElementById('m-memo-num');
      if (el) el.textContent = num;
    });
    var desc = document.getElementById('m-memo-desc');
    var obs  = document.getElementById('m-memo-obs');
    if (desc) desc.value = '';
    if (obs)  obs.value  = '';

    // equipamentos — cada perfil só vê aqueles a que tem acesso
    var eqSel = document.getElementById('m-memo-eq');
    if (eqSel) {
      eqSel.innerHTML = '<option value="">Selecione o equipamento...</option>';

      var eqList = (APP.equipamentos || []).filter(function(e) {
        return APP.podeVerEquipamento(e.id);
      });

      // fallback: se ainda não tem nenhum atribuído, mostra o seu (se existir)
      if (!eqList.length && APP.user && APP.user.equipamento_id) {
        eqList = (APP.equipamentos || []).filter(function(e) { return e.id === APP.user.equipamento_id; });
      }

      eqList.forEach(function(e) {
        var o = document.createElement('option');
        o.value = e.id;
        o.textContent = e.nome;
        // pré-selecionar o spotlight ou o equipamento do utilizador
        if (e.id === APP.spotEqId || e.id === (APP.user && APP.user.equipamento_id)) {
          o.selected = true;
        }
        eqSel.appendChild(o);
      });

      // "Outro" — para situações fora dos equipamentos a que tem acesso
      var oOutro = document.createElement('option');
      oOutro.value = '__outro__';
      oOutro.textContent = 'Outro (indicar)…';
      eqSel.appendChild(oOutro);

      // esconder o campo de texto livre ao abrir
      var wo = document.getElementById('m-memo-eq-outro-wrap');
      if (wo) wo.style.display = 'none';
      var io = document.getElementById('m-memo-eq-outro');
      if (io) io.value = '';
    }

    // brigadas
    var sel = document.getElementById('m-memo-brig');
    if (sel) {
      var list = getBrigadas();
      sel.innerHTML = '';
      list.forEach(function(b) {
        var o = document.createElement('option');
        o.value = b; o.textContent = b;
        sel.appendChild(o);
      });
      var nova = document.createElement('option');
      nova.value = '__nova__'; nova.textContent = '+ Nova brigada...';
      sel.appendChild(nova);
      sel.onchange = function() {
        if (sel.value !== '__nova__') return;
        var n = prompt('Nome da nova brigada:');
        if (n && n.trim()) {
          Brigadas.adicionarNome(n.trim(), function(ok) {
            if (!ok) return;
            var o = document.createElement('option');
            o.value = n.trim(); o.textContent = n.trim();
            sel.insertBefore(o, sel.lastChild);
            sel.value = n.trim();
          });
        } else sel.selectedIndex = 0;
      };
    }
    openModal('m-memo-novo');
  }

  function criar() {
    var desc = document.getElementById('m-memo-desc');
    if (!desc || !desc.value.trim()) { toast('O assunto é obrigatório.', 'error'); return; }

    // equipamento opcional se não houver nenhum criado ainda

    var brigSel = document.getElementById('m-memo-brig');
    var brig = brigSel ? brigSel.value : '';
    if (brig === '__nova__') brig = '';
    var obs = document.getElementById('m-memo-obs');

    // criado_por_dds = true se o utilizador for DDS
    var cDds = APP.isDds();

    // UUID válido
    var criadoPor = null;
    if (APP.user && APP.user.id) {
      var uuidRx = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      if (uuidRx.test(APP.user.id)) criadoPor = APP.user.id;
    }

    gerarNumMemo().then(function(num) {
      var hoje = new Date().toISOString().split('T')[0];

      // equipamento: pode ser um da lista, "Outro" (texto livre), ou nenhum
      var eqEl  = document.getElementById('m-memo-eq');
      var eqVal = eqEl ? eqEl.value : '';
      var eqId  = null;
      var obsTxt = obs ? obs.value.trim() : '';

      if (eqVal === '__outro__') {
        var outro = (document.getElementById('m-memo-eq-outro') || {}).value || '';
        outro = outro.trim();
        if (!outro) {
          toast('Indique a que equipamento ou local se refere.', 'error');
          throw new Error('__validacao__');
        }
        // não é uma FK válida — fica registado nas observações
        obsTxt = 'Local: ' + outro + (obsTxt ? '\n' + obsTxt : '');
      } else if (eqVal) {
        eqId = eqVal;
      } else {
        eqId = APP.spotEqId || null;
      }

      return sbPost('memorandos_dds', {
        numero:         num,
        data:           hoje,
        descricao:      desc.value.trim(),
        brigada:        brig,
        observacoes:    obsTxt,
        criado_por:     criadoPor,
        criado_por_dds: cDds,
        estado:         'pendente',
        // se criado por DDS, aprovado automaticamente → vai direto para A Enviar
        aprovado_dds:   cDds,
        num_reforcos:   0,
        equipamento_id: eqId
      });
    }).then(function() {
      toast('Memorando criado.', 'success');
      closeModal('m-memo-novo');
      loadAll(function() { App.renderContent(); });
    }).catch(function(e) {
      if (e && e.message === '__validacao__') return;  // já foi avisado
      console.error('Erro criar memo:', e);
      toast('Erro ao criar. ' + (e && e.message ? e.message : ''), 'error');
    });
  }

  function execConcluir() {
    if (!APP.actionId) return;
    var hoje = new Date().toISOString().split('T')[0];
    sbPatch('memorandos_dds', 'id=eq.' + APP.actionId, { estado: 'concluido', data_conclusao: hoje })

        toast('Memorando concluído.', 'success');

  function openReforco(id) {
    APP.actionId     = id;
    APP.actionRecord = APP.memos.filter(function(m) { return m.id === id; })[0] || null;
    if (!APP.actionRecord) return;

    // verificar 15 dias
    var diasEnvio = APP.actionRecord.data_envio_servicos ? diasDesde(APP.actionRecord.data_envio_servicos) : 0;
    if (diasEnvio < 15) {
      toast('O reforço só está disponível 15 dias após o envio. Faltam ' + (15 - diasEnvio) + ' dias.', 'error');
      return;
    }

    var n   = document.getElementById('m-ref-num');
    var mot = document.getElementById('m-ref-motivo');
    var hw  = document.getElementById('m-ref-hist-w');
    var ht  = document.getElementById('m-ref-hist');
    if (n)   n.textContent = APP.actionRecord.numero || '—';
    if (mot) mot.value = '';
    if (hw && ht) {
      if (APP.actionRecord.observacoes && APP.actionRecord.num_reforcos > 0) {
        hw.style.display = 'block';
        ht.textContent = APP.actionRecord.observacoes;
      } else {
        hw.style.display = 'none';
      }
    }
    openModal('m-memo-ref');
  }

  function execReforco() {
    if (!APP.actionId || !APP.actionRecord) return;
    var mot = document.getElementById('m-ref-motivo');
    if (!mot || !mot.value.trim()) { toast('Introduza o motivo.', 'error'); return; }
    var n   = (APP.actionRecord.num_reforcos || 0) + 1;
    var ts  = new Date().toLocaleString('pt-PT');
    var obs = (APP.actionRecord.observacoes ? APP.actionRecord.observacoes + '\n\n' : '') +
              '[REFORÇO #' + n + ' — ' + ts + ']\n' + mot.value.trim();
    sbPatch('memorandos_dds', 'id=eq.' + APP.actionId, {
      observacoes:         obs,
      num_reforcos:        n,
      estado:              'reforco_pedido',
      aprovado_dds:        true,
      data_envio_servicos: null
    }).then(function() {
      toast('Reforço registado — memorando volta para "A Enviar".', 'success');
      closeModal('m-memo-ref');
      loadAll(function() { App.renderContent(); });
    }).catch(function() { toast('Erro ao registar reforço.', 'error'); });
  }

  function openEnviar(id) {

    APP.actionRecord = APP.memos.filter(function(m) { return m.id === id; })[0] || null;
    if (!APP.actionRecord) return;

        (APP.actionRecord.brigada ? '\n\nBrigada/Serviço: ' + APP.actionRecord.brigada : '') +
        '\n\nSolicita-se a devida atenção e tramitação.\n\n' +
        'Com os melhores cumprimentos,\nDivisão de Desenvolvimento Social';
