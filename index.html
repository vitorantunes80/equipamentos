    h += 'A alteração <strong>só produz efeito depois de autorizada</strong> pelo responsável do equipamento e, em seguida, pelo chefe de unidade. Até lá, mantêm-se os valores actuais.';
    h += '</div>';
    h += '</div>';
    h += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-horas-alterar\')">Cancelar</button>';
    h += '<button class="btn btn-primary" onclick="Horas.salvarAlteracao()">Submeter alteração</button></div>';
    h += '</div></div>';

    return h;
  }
  // texto de ajuda conforme o tipo de pedido
  function onTipoChange() {
    var t = (document.getElementById('h-tipo') || {}).value;
    var el = document.getElementById('h-tipo-help');
    if (el) {
      el.textContent = (t === 'gozada')
        ? 'Pedido para usar horas já acumuladas no seu banco (folga, saída antecipada).'
        : 'Serviço prestado além do horário normal, já articulado com a chefia. As horas acumulam no seu banco após confirmação.';
    }
    // o período só se aplica a pedidos de gozo
    var gozo = (t === 'gozada');
    var pw = document.getElementById('h-periodo-wrap');
    if (pw) pw.style.display = gozo ? 'block' : 'none';

    // equipamento e iniciativa só fazem sentido nas horas extraordinárias
    var ow = document.getElementById('h-onde-wrap');
    if (ow) ow.style.display = gozo ? 'none' : 'block';

    var mot = document.getElementById('h-motivo');
    if (mot) mot.placeholder = gozo ? 'ex: Assuntos pessoais' : 'ex: Abertura e fecho do pavilhão — torneio de sábado';

    var circ = document.getElementById('h-circuito');
    if (circ) {
      circ.innerHTML = gozo
        ? '<strong>Circuito:</strong> o pedido segue para o responsável do equipamento e, só depois deste autorizar, para o chefe da sua unidade. Depois de autorizado, é lançado na sua escala e descontado do saldo.'
        : '<strong>Circuito de confirmação:</strong> o registo é confirmado pelo responsável do equipamento e, só depois, pelo chefe da sua unidade. Serve de controlo — só conta no saldo depois de confirmado.';
    }

    if (gozo) onPeriodoChange();
    else {
      var hw = document.getElementById('h-horas-wrap');
      if (hw) hw.style.display = 'none';
    }
  }

  // horas por defeito de cada período (ajustáveis pelo utilizador)
  var HORAS_PERIODO = { dia: 7, manha: 3.5, tarde: 3.5 };

  function onPeriodoChange() {
    var p  = (document.getElementById('h-periodo') || {}).value;
    var hw = document.getElementById('h-horas-wrap');
    var hs = document.getElementById('h-horas');

    if (hw) hw.style.display = (p === 'horas') ? 'flex' : 'none';

    if (p === 'horas') {
      _calcHorasIntervalo();
    } else if (HORAS_PERIODO[p] && hs) {
      hs.value = HORAS_PERIODO[p];
    }
  }

  // calcula automaticamente as horas a partir do intervalo indicado
  function _calcHorasIntervalo() {
    var hi = (document.getElementById('h-hi') || {}).value;
    var hf = (document.getElementById('h-hf') || {}).value;
    var hs = document.getElementById('h-horas');
    if (!hi || !hf || !hs) return;
    var a = hi.split(':'), b = hf.split(':');
    var mins = (parseInt(b[0], 10) * 60 + parseInt(b[1], 10)) - (parseInt(a[0], 10) * 60 + parseInt(a[1], 10));
    if (mins > 0) hs.value = (mins / 60).toFixed(2).replace(/\.00$/, '');
  }
  function onHoraChange() { _calcHorasIntervalo(); }

  function _labelPeriodo(r) {
    if (r.tipo !== 'gozada') return '';
    if (r.periodo === 'manha') return 'Manhã completa';
    if (r.periodo === 'tarde') return 'Tarde completa';
    if (r.periodo === 'dia')   return 'Dia completo';
    if (r.periodo === 'horas' && r.hora_inicio && r.hora_fim) {
      return r.hora_inicio.slice(0, 5) + '–' + r.hora_fim.slice(0, 5);
    }
    return '';
  }

  // ── ACÇÕES ────────────────────────────────────────────────
  function openNovo() {
    APP.editId = null;
    var hoje = new Date().toISOString().split('T')[0];
    var set = function(id, v) { var el = document.getElementById(id); if (el) el.value = v; };
    set('h-tipo', 'efetuada');
    set('h-data', hoje);
    set('h-horas', '');
    set('h-motivo', '');
    set('h-iniciativa', '');
    set('h-periodo', 'dia');
    set('h-hi', '');
    set('h-hf', '');
    onTipoChange();

    // quem valida pode registar por outro funcionário
    var podeOutro = _ehChefe() || _ehResponsavel();
    var fw = document.getElementById('h-func-wrap');
    if (fw) fw.style.display = podeOutro ? 'block' : 'none';
    if (podeOutro) _popularFuncs();

    _popularEqs();
    openModal('m-horas-novo');
  }

  function _popularFuncs() {
    var sel = document.getElementById('h-func');
    if (!sel) return;
    var lista = (APP.utilizadores || []).slice();

    if (!_isDdsTop()) {
      var uni = _unidadeChefe();
      if (uni) {
        lista = lista.filter(function(u) { return u.unidade === uni; });
      } else if (_ehResponsavel()) {
        var meus = _meusEquipamentos();
        lista = lista.filter(function(u) { return meus.indexOf(u.equipamento_id) >= 0; });
      }
    }

    sel.innerHTML = '<option value="">Eu próprio</option>';
    lista.sort(function(a, b) { return (a.nome || '').localeCompare(b.nome || ''); })
      .forEach(function(u) {
        var o = document.createElement('option');
        o.value = u.id;
        o.textContent = u.nome;
        sel.appendChild(o);
      });
  }

  function _popularEqs() {
    var sel = document.getElementById('h-eq');
    if (!sel) return;
    // TODOS os equipamentos — um funcionário pode fazer horas em qualquer um
    sel.innerHTML = '<option value="">Nenhum / não se aplica</option>';
    (APP.equipamentos || []).slice()
      .sort(function(a, b) { return (a.nome || '').localeCompare(b.nome || ''); })
      .forEach(function(e) {
        var o = document.createElement('option');
        o.value = e.id;
        o.textContent = e.nome + (e.unidade ? ' (' + e.unidade + ')' : '');
        sel.appendChild(o);
      });
    // sugere o equipamento principal, mas pode trocar-se
    if (APP.user && APP.user.equipamento_id) sel.value = APP.user.equipamento_id;

    // sugestões de iniciativas já usadas
    var dl = document.getElementById('iniciativa-opcoes');
    if (dl) {
      var vistos = {};
      _registos.forEach(function(r) {
        if (r.iniciativa && !vistos[r.iniciativa]) vistos[r.iniciativa] = true;
      });
      dl.innerHTML = Object.keys(vistos).map(function(v) {
        return '<option value="' + H(v) + '"></option>';
      }).join('');
    }
  }

  function salvar() {
    var tipo  = (document.getElementById('h-tipo')  || {}).value || 'efetuada';
    var data  = (document.getElementById('h-data')  || {}).value;
    var horas = parseFloat((document.getElementById('h-horas') || {}).value);
    var gozo = (tipo === 'gozada');
    var eq    = gozo ? null : ((document.getElementById('h-eq') || {}).value || null);
    var inic  = gozo ? '' : ((document.getElementById('h-iniciativa') || {}).value || '').trim();
    var motivo= ((document.getElementById('h-motivo') || {}).value || '').trim();

    if (!data)  { toast('Indique a data.', 'error'); return; }
    if (!horas || horas <= 0) { toast('Indique um número de horas válido.', 'error'); return; }
    if (horas > 24) { toast('O número de horas não pode exceder 24 num dia.', 'error'); return; }
    if (!motivo) { toast('Descreva o serviço / motivo.', 'error'); return; }

    // período (só para gozo de horas)
    var periodo = null, hIni = null, hFim = null;
    if (tipo === 'gozada') {
      periodo = (document.getElementById('h-periodo') || {}).value || 'dia';
      if (periodo === 'horas') {
        hIni = (document.getElementById('h-hi') || {}).value || null;
        hFim = (document.getElementById('h-hf') || {}).value || null;
        if (!hIni || !hFim) { toast('Indique a hora de início e de fim.', 'error'); return; }
        if (hFim <= hIni)   { toast('A hora de fim deve ser posterior à de início.', 'error'); return; }
      }
    }

    // por quem é o registo
    var fwSel = document.getElementById('h-func');
    var fw    = document.getElementById('h-func-wrap');
    var paraOutro = fw && fw.style.display !== 'none' && fwSel && fwSel.value;
    var funcId = paraOutro ? fwSel.value : APP.user.id;
    var func   = _getFunc(funcId);

    // se for gozar horas, avisar se não há saldo
    if (tipo === 'gozada') {
      var s = saldoDe(funcId);
      if (horas > s.saldo) {
        if (!confirm('Atenção: o saldo disponível é de ' + _fmtH(s.saldo) + ' e está a pedir ' + _fmtH(horas) + '.\n\nQuer continuar mesmo assim?')) return;
      }
    }

    var body = {
      funcionario_id: funcId,
      equipamento_id: eq,
      unidade:        func ? func.unidade : null,
      tipo:           tipo,
      data:           data,
      horas:          horas,
      iniciativa:     inic || null,
      periodo:        periodo,
      hora_inicio:    hIni,
      hora_fim:       hFim,
      motivo:         motivo || null,
      estado:         'pendente',
      criado_por:     APP.user.id
    };

    // Todos os pedidos entram na cadeia normal:
    // responsável do equipamento → chefe de unidade.
    // O admin não autoriza (supervisiona e pode apagar).
    sbPost('banco_horas', body).then(function(resp) {
      var criado = Array.isArray(resp) ? resp[0] : null;
      toast('Registo submetido. Aguarda autorização.', 'success');
      closeModal('m-horas-novo');
      if (criado) _notificarResponsavel(criado, func);
      load(function() { App.renderContent(); App.updateBadges(); });
    }).catch(function(e) {
      console.error('Erro banco_horas:', e);
      var msg = [e && e.code, e && e.message, e && e.details, e && e.hint].filter(Boolean).join(' · ');
      toast('Erro ao submeter: ' + (msg || 'desconhecido'), 'error');
    });
  }

  // ── NOTIFICAÇÕES ──────────────────────────────────────────
  // 1º nível: avisa o(s) responsável(eis) dos equipamentos onde a pessoa trabalha
  function _notificarResponsavel(r, func) {
    var destinos = _responsaveisDe(func);

    // sem responsável definido em nenhum equipamento → não há 1º nível;
    // o pedido segue para o chefe da unidade (senão ficaria bloqueado)
    if (!destinos.length) {
      sbPatch('banco_horas', 'id=eq.' + r.id, {
        estado: 'validado_resp',
        data_valid_resp: new Date().toISOString()
      }).then(function() { _notificarChefe(r, func); }).catch(function() {});
      return;
    }

    var tipoTxt = r.tipo === 'gozada' ? 'gozo de horas' : 'serviço prestado';
    var perTxt  = _labelPeriodo(r);
    destinos.forEach(function(uid) {
      if (uid === APP.user.id) return;
      sbPost('avisos', {
        destinatario_id: uid,
        titulo: 'Banco de horas — pedido para autorizar',
        mensagem: (func ? func.nome : 'Um funcionário') + ' registou ' + _fmtH(r.horas) + ' (' + tipoTxt + ') em ' + _fdata(r.data) + (perTxt ? ' — ' + perTxt : '') + '. Aguarda a sua autorização.',
        lido: false,
        tipo: 'notificacao',
        remetente_id: APP.user.id,
        remetente_nome: APP.user.nome
      }).catch(function() {});
    });
  }

  // 2º nível: avisa o chefe da unidade do funcionário
  function _notificarChefe(r, func) {
    if (!func || !func.unidade) return;
    var perfilDir = func.unidade === 'UDAJ' ? 'supervisor_udaj'
                  : func.unidade === 'UASE' ? 'supervisor_uase' : null;
    if (!perfilDir) return;

    var tipoTxt = r.tipo === 'gozada' ? 'gozo de horas' : 'horas extraordinárias';
    (APP.utilizadores || []).filter(function(u) { return u.perfil === perfilDir; })
      .forEach(function(dir) {
        if (dir.id === APP.user.id) return;
        sbPost('avisos', {
          destinatario_id: dir.id,
          titulo: 'Banco de horas — autorização final',
          mensagem: (func ? func.nome : 'Um funcionário') + ': ' + _fmtH(r.horas) + ' (' + tipoTxt + ') em ' + _fdata(r.data) + ' foi autorizado pelo responsável. Aguarda a sua autorização final.',
          lido: false,
          tipo: 'notificacao',
          remetente_id: APP.user.id,
          remetente_nome: APP.user.nome
        }).catch(function() {});
      });
  }

  // avisa o admin quando o dirigente dá a autorização final (supervisão)
  function _notificarAdmin(r, func) {
    var tipoTxt = r.tipo === 'gozada' ? 'gozo de horas' : 'serviço prestado';
    var perTxt  = _labelPeriodo(r);
    (APP.utilizadores || []).filter(function(u) { return u.perfil === 'admin'; })
      .forEach(function(a) {
        if (a.id === APP.user.id) return;
        sbPost('avisos', {
          destinatario_id: a.id,
          titulo: 'Banco de horas — autorizado pelo dirigente',
          mensagem: (func ? func.nome : 'Um funcionário') + ': ' + _fmtH(r.horas) + ' (' + tipoTxt + ') em ' + _fdata(r.data) + (perTxt ? ' — ' + perTxt : '') + ' foi autorizado por ' + (APP.user.nome || 'um dirigente') + '.',
          lido: false,
          tipo: 'notificacao',
          remetente_id: APP.user.id,
          remetente_nome: APP.user.nome
        }).catch(function() {});
      });
  }

  // avisa o funcionário do desfecho
  function _notificarFuncionario(r, aprovado, motivo) {
    if (!r.funcionario_id || r.funcionario_id === APP.user.id) return;
    var tipoTxt = r.tipo === 'gozada' ? 'gozo de horas' : 'horas extraordinárias';
    sbPost('avisos', {
      destinatario_id: r.funcionario_id,
      titulo: aprovado ? 'Banco de horas — autorizado' : 'Banco de horas — recusado',
      mensagem: aprovado
        ? 'As suas ' + _fmtH(r.horas) + ' (' + tipoTxt + ') de ' + _fdata(r.data) + ' foram autorizadas e já contam no seu saldo.'
        : 'As suas ' + _fmtH(r.horas) + ' (' + tipoTxt + ') de ' + _fdata(r.data) + ' foram recusadas.' + (motivo ? ' Motivo: ' + motivo : ''),
      lido: false,
      tipo: 'notificacao',
      remetente_id: APP.user.id,
      remetente_nome: APP.user.nome
    }).catch(function() {});
  }

  // ── PEDIDO DE ALTERAÇÃO (mesmo circuito de autorização) ────
  function openAlterar(id) {
    var r = _registos.filter(function(x) { return x.id === id; })[0];
    if (!r) return;
    APP.actionId = id;

    var f = _getFunc(r.funcionario_id);
    var sub = document.getElementById('m-alt-sub');
    if (sub) sub.textContent = (f ? f.nome : '?') + ' · ' + (r.tipo === 'gozada' ? 'Gozo de horas' : 'Serviço prestado');

    var per = _labelPeriodo(r);
    var atual = document.getElementById('m-alt-atual');
    if (atual) {
      atual.innerHTML = '<strong>Valores actuais:</strong><br>' +
        _fdata(r.data) + ' · ' + _fmtH(r.horas) + (per ? ' · ' + H(per) : '') +
        (r.motivo ? '<br>' + H(r.motivo) : '');
    }

    var set = function(i, v) { var el = document.getElementById(i); if (el) el.value = v; };
    set('alt-data', r.data);
    set('alt-horas', r.horas);
    set('alt-periodo', r.periodo || 'dia');
    set('alt-motivo', '');

    var pw = document.getElementById('alt-periodo-wrap');
    if (pw) pw.style.display = (r.tipo === 'gozada') ? 'block' : 'none';

    openModal('m-horas-alterar');
  }

  function salvarAlteracao() {
    if (!APP.actionId) return;
    var r = _registos.filter(function(x) { return x.id === APP.actionId; })[0];
    if (!r) return;

    var data   = (document.getElementById('alt-data')   || {}).value;
    var horas  = parseFloat((document.getElementById('alt-horas') || {}).value);
    var per    = (document.getElementById('alt-periodo') || {}).value;
    var motivo = ((document.getElementById('alt-motivo') || {}).value || '').trim();

    if (!data) { toast('Indique a data.', 'error'); return; }
    if (!horas || horas <= 0 || horas > 24) { toast('Indique um número de horas válido.', 'error'); return; }
    if (!motivo) { toast('Explique o motivo da alteração.', 'error'); return; }

    var alt = {
      data: data,
      horas: horas,
      periodo: (r.tipo === 'gozada') ? per : null,
      motivo: motivo,
      estado: 'pendente',
      pedida_por: APP.user.id,
      data_pedido: new Date().toISOString()
    };

    sbPatch('banco_horas', 'id=eq.' + r.id, { alteracao: alt }).then(function() {
      toast('Alteração submetida. Aguarda autorização.', 'success');
      closeModal('m-horas-alterar');
      _notificarAlteracao(r, alt);
      load(function() { App.renderContent(); App.updateBadges(); });
    }).catch(function(e) {
      console.error('Erro alteração:', e);
      toast('Erro ao submeter a alteração.', 'error');
    });
  }

  function _notificarAlteracao(r, alt) {
    var func = _getFunc(r.funcionario_id);
    var destinos = _responsaveisDe(func);
    if (!destinos.length) return;
    destinos.forEach(function(uid) {
      if (uid === APP.user.id) return;
      sbPost('avisos', {
        destinatario_id: uid,
        titulo: 'Banco de horas — pedido de alteração',
        mensagem: (func ? func.nome : 'Um funcionário') + ' pediu para alterar um registo autorizado de ' + _fdata(r.data) + ' (' + _fmtH(r.horas) + ') para ' + _fdata(alt.data) + ' (' + _fmtH(alt.horas) + '). Motivo: ' + alt.motivo,
        lido: false,
        tipo: 'notificacao',
        remetente_id: APP.user.id,
        remetente_nome: APP.user.nome
      }).catch(function() {});
    });
  }

  // autorizar / recusar uma alteração
  function aprovarAlteracao(id) {
    var r = _registos.filter(function(x) { return x.id === id; })[0];
    if (!r || !r.alteracao) return;
    var alt = r.alteracao;
    var func = _getFunc(r.funcionario_id);
    var agora = new Date().toISOString();

    // 1ª autorização — responsável
    if (alt.estado === 'pendente' && _podeValidarResp(r)) {
      alt.estado = 'validado_resp';
      alt.valid_resp_por = APP.user.id;
      alt.data_valid_resp = agora;
      sbPatch('banco_horas', 'id=eq.' + id, { alteracao: alt }).then(function() {
        toast('Alteração autorizada. Segue para o chefe de unidade.', 'success');
        _notificarChefeAlteracao(r, alt, func);
        load(function() { App.renderContent(); App.updateBadges(); });
      }).catch(function() { toast('Erro ao autorizar.', 'error'); });
      return;
    }

    // 2ª autorização — chefe: aplica de facto a alteração
    if (alt.estado === 'validado_resp' && _podeValidarChefe(r)) {
      var body = {
        data: alt.data,
        horas: alt.horas,
        alteracao: null,
        motivo: (r.motivo || '') + ' [alterado: ' + alt.motivo + ']'
      };
      if (r.tipo === 'gozada') body.periodo = alt.periodo;

      sbPatch('banco_horas', 'id=eq.' + id, body).then(function() {
        toast('Alteração aplicada.', 'success');
        _notificarFuncAlteracao(r, alt, true);
        _notificarAdmin(r, func);
        _actualizarEscala(r, alt);
        load(function() { App.renderContent(); App.updateBadges(); });
      }).catch(function() { toast('Erro ao aplicar a alteração.', 'error'); });
      return;
    }

    toast('Não pode autorizar esta alteração nesta fase.', 'error');
  }

  function recusarAlteracao(id) {
    var r = _registos.filter(function(x) { return x.id === id; })[0];
    if (!r || !r.alteracao) return;
    sbPatch('banco_horas', 'id=eq.' + id, { alteracao: null }).then(function() {
      toast('Alteração recusada. O registo mantém-se como estava.', 'success');
      _notificarFuncAlteracao(r, r.alteracao, false);
      load(function() { App.renderContent(); App.updateBadges(); });
    }).catch(function() { toast('Erro ao recusar.', 'error'); });
  }

  function _notificarChefeAlteracao(r, alt, func) {
    if (!func || !func.unidade) return;
    var perfilDir = func.unidade === 'UDAJ' ? 'supervisor_udaj'
                  : func.unidade === 'UASE' ? 'supervisor_uase' : null;
    if (!perfilDir) return;
    (APP.utilizadores || []).filter(function(u) { return u.perfil === perfilDir; })
      .forEach(function(dir) {
        if (dir.id === APP.user.id) return;
        sbPost('avisos', {
          destinatario_id: dir.id,
          titulo: 'Banco de horas — alteração para autorizar',
          mensagem: (func ? func.nome : 'Um funcionário') + ': alteração de ' + _fdata(r.data) + ' (' + _fmtH(r.horas) + ') para ' + _fdata(alt.data) + ' (' + _fmtH(alt.horas) + ') foi autorizada pelo responsável. Aguarda a sua autorização final.',
          lido: false, tipo: 'notificacao',
          remetente_id: APP.user.id, remetente_nome: APP.user.nome
        }).catch(function() {});
      });
  }

  function _notificarFuncAlteracao(r, alt, aprovada) {
    if (!r.funcionario_id || r.funcionario_id === APP.user.id) return;
    sbPost('avisos', {
      destinatario_id: r.funcionario_id,
      titulo: aprovada ? 'Banco de horas — alteração aplicada' : 'Banco de horas — alteração recusada',
      mensagem: aprovada
        ? 'A alteração que pediu foi autorizada. O registo passou a ' + _fdata(alt.data) + ' · ' + _fmtH(alt.horas) + '.'
        : 'A alteração que pediu foi recusada. O registo mantém-se como estava.',
      lido: false, tipo: 'notificacao',
      remetente_id: APP.user.id, remetente_nome: APP.user.nome
    }).catch(function() {});
  }

  // corrigir a folga na escala depois da alteração
  function _actualizarEscala(r, alt) {
    if (r.tipo !== 'gozada') return;
    // apaga as folgas antigas e lança as novas
    sbDelete('escalas', 'funcionario_id=eq.' + r.funcionario_id + '&data_inicio=eq.' + r.data + '&tipo_turno=eq.folga')
      .then(function() {
        var novo = {};
        for (var k in r) novo[k] = r[k];
        novo.data = alt.data;
        novo.horas = alt.horas;
        novo.periodo = alt.periodo;
        _lancarNaEscala(novo);
      }).catch(function() {});
  }

  // ── ESCALA: lançar a folga nos equipamentos onde o funcionário trabalha ──
  function _lancarNaEscala(r) {
    if (!r || r.tipo !== 'gozada') return;
    var func = _getFunc(r.funcionario_id);
    if (!func) return;

    // todos os equipamentos onde a pessoa trabalha (principal + adicionais)
    var eqs = (typeof eqsDoFunc === 'function') ? eqsDoFunc(func) : (func.equipamento_id ? [func.equipamento_id] : []);
    if (!eqs.length) return;

    var lbl = _labelPeriodo(r) || 'Folga';
    var body = eqs.map(function(eqId) {
      var b = {
        equipamento_id: eqId,
        funcionario_id: r.funcionario_id,
        data_inicio: r.data,
        data_fim: r.data,
        tipo_turno: 'folga',
        funcao: 'Folga (banco de horas) — ' + lbl,
        observacoes: r.motivo || null
      };
      // se foi um intervalo concreto, guardar as horas
      if (r.periodo === 'horas' && r.hora_inicio && r.hora_fim) {
        b.hora_entrada = r.hora_inicio;
        b.hora_saida   = r.hora_fim;
      }
      return b;
    });

    sbPost('escalas', body).catch(function(e) {
      console.error('Erro ao lançar folga na escala:', e);
    });
  }

  // ── VALIDAÇÃO ─────────────────────────────────────────────
  function aprovar(id) {
    var r = _registos.filter(function(x) { return x.id === id; })[0];
    if (!r) return;
    var func = _getFunc(r.funcionario_id);
    var agora = new Date().toISOString();
    var body, fase;

    if (r.estado === 'pendente' && _podeValidarResp(r)) {
      // 1ª autorização — responsável do equipamento
      body = { estado: 'validado_resp', validado_resp_por: APP.user.id, data_valid_resp: agora };
      fase = 'resp';
    } else if (r.estado === 'validado_resp' && _podeValidarChefe(r)) {
      // 2ª e última autorização — chefe de unidade
      body = { estado: 'aprovado', validado_chefe_por: APP.user.id, data_valid_chefe: agora };
      fase = 'aprovado';
    } else {
      toast('Não pode autorizar este pedido nesta fase.', 'error');
      return;
    }

    sbPatch('banco_horas', 'id=eq.' + id, body).then(function() {
      if (fase === 'aprovado') {
        toast('Autorizado. Já conta no saldo.', 'success');
        _notificarFuncionario(r, true);
        _notificarAdmin(r, func);   // supervisão
        _lancarNaEscala(r);
      } else {
        toast('Autorizado. Segue para o chefe de unidade.', 'success');
        _notificarChefe(r, func);
      }
      load(function() { App.renderContent(); App.updateBadges(); });
    }).catch(function(e) {
      console.error('Erro ao validar:', e);
      toast('Erro ao autorizar.', 'error');
    });
  }

  function openRejeitar(id) {
    APP.actionId = id;
    var r = _registos.filter(function(x) { return x.id === id; })[0];
    var f = r ? _getFunc(r.funcionario_id) : null;
    var sub = document.getElementById('m-horas-rej-sub');
    if (sub) sub.textContent = r ? ((f ? f.nome : '?') + ' · ' + _fmtH(r.horas) + ' · ' + _fdata(r.data)) : '—';
    var m = document.getElementById('h-motivo-rej');
    if (m) m.value = '';
    openModal('m-horas-rejeitar');
  }

  function rejeitar() {
    if (!APP.actionId) return;
    var motivo = ((document.getElementById('h-motivo-rej') || {}).value || '').trim();
    if (!motivo) { toast('Indique o motivo da recusa.', 'error'); return; }

    var r = _registos.filter(function(x) { return x.id === APP.actionId; })[0];

    sbPatch('banco_horas', 'id=eq.' + APP.actionId, {
      estado: 'rejeitado',
      motivo_rejeicao: motivo,
      rejeitado_por: APP.user.id
    }).then(function() {
      toast('Pedido recusado.', 'success');
      closeModal('m-horas-rejeitar');
      if (r) _notificarFuncionario(r, false, motivo);
      load(function() { App.renderContent(); App.updateBadges(); });
    }).catch(function() { toast('Erro ao recusar.', 'error'); });
  }

  // ── APAGAR ────────────────────────────────────────────────
  function confirmarApagar(id) {
    APP.actionId = id;
    openModal('m-horas-apagar');
  }
  function execApagar() {
    if (!APP.actionId) return;
    var r = _registos.filter(function(x) { return x.id === APP.actionId; })[0];

    sbDelete('banco_horas', 'id=eq.' + APP.actionId).then(function() {
      // se era um gozo já autorizado, retirar também a folga da escala
      if (r && r.tipo === 'gozada' && r.estado === 'aprovado') {
        return sbDelete('escalas',
          'funcionario_id=eq.' + r.funcionario_id +
          '&data_inicio=eq.' + r.data +
          '&tipo_turno=eq.folga'
        ).catch(function(e) {
          console.error('Folga na escala não removida:', e);
        });
      }
    }).then(function() {
      // retirar da memória, para desaparecer do ecrã sem recarregar a página
      if (r && r.tipo === 'gozada') {
        APP.escalas = (APP.escalas || []).filter(function(e) {
          return !(e.funcionario_id === r.funcionario_id &&
                   e.data_inicio === r.data &&
                   e.tipo_turno === 'folga');
        });
      }
      toast('Registo apagado. A folga foi retirada da escala.', 'success');
      closeModal('m-horas-apagar');
      load(function() { App.renderContent(); App.updateBadges(); });
    }).catch(function(e) {
      console.error('Erro ao apagar:', e);
      var msg = [e && e.code, e && e.message].filter(Boolean).join(' · ');
      toast('Erro ao apagar: ' + (msg || 'desconhecido'), 'error');
    });
  }

  // ── API PÚBLICA para relatórios/badges ────────────────────
  // nº de registos à espera da validação do utilizador atual
  function pendentesParaMim() {
    if (!APP.user) return 0;
    var n = _registos.filter(function(r) {
      if (r.estado === 'pendente')      return _podeValidarResp(r);
      if (r.estado === 'validado_resp') return _podeValidarChefe(r);
      return false;
    }).length;
    n += _registos.filter(function(r) {
      if (!r.alteracao || !r.alteracao.estado) return false;
      if (r.alteracao.estado === 'pendente')      return _podeValidarResp(r);
      if (r.alteracao.estado === 'validado_resp') return _podeValidarChefe(r);
      return false;
    }).length;
    return n;
  }

  function registos() { return _registos; }

  function init() {
    if (document.getElementById('m-horas-novo')) return;
    var w = document.createElement('div');
    w.id = 'horas-modais';
    w.innerHTML = getModaisHTML();
    document.body.appendChild(w);
  }

  return {
    render: render, init: init, load: load,
    openNovo: openNovo, salvar: salvar, onTipoChange: onTipoChange,
    onPeriodoChange: onPeriodoChange, onHoraChange: onHoraChange,
    labelPeriodo: _labelPeriodo,
    aprovar: aprovar, openRejeitar: openRejeitar, rejeitar: rejeitar,
    openAlterar: openAlterar, salvarAlteracao: salvarAlteracao,
    aprovarAlteracao: aprovarAlteracao, recusarAlteracao: recusarAlteracao,
    setEqFiltro: setEqFiltro,
    confirmarApagar: confirmarApagar, execApagar: execApagar,
    saldoDe: saldoDe, registos: registos, pendentesParaMim: pendentesParaMim,
    fmtH: _fmtH
  };

})();

</script>
<script>
/* ═════ estadias.js ═════ */
// ============================================================
// GestDDS — estadias.js  v1.0
// Estadias — check-in / check-out (parque de campismo e outros)
//
// Regista quem está no equipamento, em que lugar, quantas pessoas
// e de onde vêm — para produzir estatísticas de ocupação e dormidas.
//
// Módulo ativável por equipamento (chave 'estadias').
// ============================================================

var Estadias = (function() {

  var _lista = [];
  var _eqId  = null;

  var TIPOS = [
    { v: 'tenda',        l: 'Tenda',         i: '⛺' },
    { v: 'caravana',     l: 'Caravana',      i: '🚐' },
    { v: 'autocaravana', l: 'Autocaravana',  i: '🚍' },
    { v: 'bungalow',     l: 'Bungalow',      i: '🏠' },
    { v: 'outro',        l: 'Outro',         i: '📍' }
  ];

  // países mais frequentes em primeiro; o campo aceita qualquer valor
  var PAISES = [
    'Portugal', 'Espanha', 'França', 'Alemanha', 'Reino Unido', 'Países Baixos',
    'Bélgica', 'Itália', 'Suíça', 'Polónia', 'Brasil', 'Estados Unidos', 'Outro'
  ];

  // ── DADOS ─────────────────────────────────────────────────
  // Ocupação ao vivo — vai SEMPRE ao servidor, não depende de _lista
  // (que só é carregada quando se abre o separador Check-in/Check-out).
  function ocupacao(eqId, cb) {
    sbGet('estadias', 'equipamento_id=eq.' + eqId + '&estado=eq.ativa').then(function(d) {
      var l = Array.isArray(d) ? d : [];
      var pes = 0;
      l.forEach(function(e) { pes += _pessoas(e); });
      cb(null, { lugares: l.length, pessoas: pes });
    }).catch(function(e) {
      cb(e || new Error('Erro desconhecido'));
    });
  }

  function load(eqId, cb) {
    _eqId = eqId;
    sbGet('estadias', 'equipamento_id=eq.' + eqId + '&order=data_checkin.desc').then(function(d) {
      _lista = Array.isArray(d) ? d : [];
      if (cb) cb();
    }).catch(function() {
      _lista = [];
      if (cb) cb();
    });
  }

  function _tipo(v) {
    return TIPOS.filter(function(t) { return t.v === v; })[0] || TIPOS[4];
  }

  function _pessoas(e) {
    return (parseInt(e.n_adultos, 10) || 0) + (parseInt(e.n_criancas, 10) || 0);
  }

  // noites entre check-in e check-out (real, ou previsto, ou hoje se ainda cá está)
  function _noites(e) {
    var ini = e.data_checkin ? new Date(e.data_checkin) : null;
    if (!ini) return 0;
    var fim = e.data_checkout_real ? new Date(e.data_checkout_real)
            : (e.estado === 'ativa' ? new Date() : (e.data_checkout_prev ? new Date(e.data_checkout_prev) : null));
    if (!fim) return 0;
    var n = Math.round((fim - ini) / 86400000);
    return n > 0 ? n : (e.estado === 'ativa' ? 0 : 1);
  }

  // dormidas = pessoas × noites  (o indicador oficial de turismo)
  function _dormidas(e) { return _pessoas(e) * _noites(e); }

  function _fdata(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
  }

  function _hoje() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  // ── RENDER (dentro da aba do equipamento) ─────────────────
  function renderPainel(eqId) {
    var eq = getEq(eqId);

    // sem autorização não mostra nada (dados pessoais de hóspedes)
    if (APP.podeVerEstadias && !APP.podeVerEstadias(eqId)) {
      return '<div class="mod-ph"><div class="mod-ph-t">Sem acesso</div><div class="mod-ph-s">Não tem autorização para consultar os check-ins deste equipamento. Peça acesso ao administrador.</div></div>';
    }

    var pode = APP.podeGerirEstadias ? APP.podeGerirEstadias(eqId) : true;

    var hoje = _hoje();
    var ativas   = _lista.filter(function(e) { return e.estado === 'ativa'; });
    var reservas = _lista.filter(function(e) {
      return e.estado === 'reservada' && (!e.data_checkout_prev || e.data_checkout_prev >= hoje);
    });
    var saemHoje  = ativas.filter(function(e) { return e.data_checkout_prev === hoje; });
    var chegamHoje = reservas.filter(function(e) { return e.data_checkin === hoje; });

    var h = '';

    // ── KPIs ao vivo ──
    var pessoasAgora = 0;
    ativas.forEach(function(e) { pessoasAgora += _pessoas(e); });

    h += '<div class="rep-cards" style="margin-bottom:14px;">';
    h += _card(ativas.length, 'Ocupados agora', 'tendas / caravanas', '#1D4ED8');
    h += _card(pessoasAgora, 'Pessoas no parque', 'neste momento', '#15803D');
    h += _card(chegamHoje.length, 'Chegadas hoje', 'reservas por entrar', '#7C3AED');
    h += _card(saemHoje.length, 'Saídas hoje', 'check-outs previstos', '#D97706');
    h += '</div>';

    var tab = APP.estadiaTab || 'ativas';

    // ── Botões ──
    if (pode) {
      h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">';
      h += '<button class="btn btn-primary btn-sm" onclick="Estadias.openNovo(\'' + eqId + '\',\'reserva\')">+ Nova reserva</button>';
      h += '<button class="btn btn-secondary btn-sm" onclick="Estadias.openNovo(\'' + eqId + '\',\'checkin\')">+ Check-in direto</button>';
      h += '</div>';
    }

    // ── Separadores ──
    h += '<div class="eq-tabs" style="margin-bottom:14px;">';
    h += _tab('reservas',  'Reservas', reservas.length, tab);
    h += _tab('ativas',    'No parque', ativas.length, tab);
    h += _tab('historico', 'Histórico', 0, tab);
    h += _tab('stats',     '📊 Estatísticas', 0, tab);
    h += '</div>';

    if (tab === 'stats')          h += _renderStats();
    else if (tab === 'historico') h += _renderHistorico(pode);
    else if (tab === 'reservas')  h += _renderReservas(reservas, pode);
    else                          h += _renderLista(ativas, pode, false);

    _garantirModais();
    return h;
  }

  // Histórico — filtrado pelo mês escolhido, senão a lista fica interminável
  function _renderHistorico(pode) {
    var doPeriodo = _lista.filter(_noPeriodoEst);
    var h = _barraMeses();

    var rot = APP.repMes
      ? MESES_C[APP.repMes - 1] + ' de ' + (APP.anoTrabalho || new Date().getFullYear())
      : 'Ano de ' + (APP.anoTrabalho || new Date().getFullYear());

    if (!doPeriodo.length) {
      h += '<div class="est-hist-h">0 estadias · ' + H(rot) + '</div>';
      return h + emptyState('Sem estadias', 'Não há estadias registadas em ' + rot + '.');
    }

    // Resumo sempre à vista — dá os números sem desenhar a tabela toda
    var dorm = 0, hosp = 0;
    doPeriodo.forEach(function(e) { dorm += _dormidas(e); hosp += _pessoas(e); });
    h += '<div class="est-resumo">';
    h += '<div class="est-resumo-i"><div class="est-resumo-v">' + doPeriodo.length + '</div><div class="est-resumo-l">Estadias</div></div>';
    h += '<div class="est-resumo-i"><div class="est-resumo-v">' + hosp + '</div><div class="est-resumo-l">Hóspedes</div></div>';
    h += '<div class="est-resumo-i"><div class="est-resumo-v">' + dorm + '</div><div class="est-resumo-l">Dormidas</div></div>';
    h += '</div>';
    h += '<div class="est-hist-cap">' + H(rot) + '</div>';

    // A lista só é desenhada depois de tocar no botão: com dezenas de estadias
    // por mês, desenhá-la sempre tornava a consulta lenta e o ecrã interminável.
    if (!APP.estHistLista) {
      h += '<button class="btn btn-secondary est-hist-btn" onclick="Estadias.mostrarLista()">' +
           'Mostrar lista de estadias (' + doPeriodo.length + ')</button>';
      return h;
    }

    h += '<button class="btn btn-secondary est-hist-btn" onclick="Estadias.ocultarLista()">Ocultar lista</button>';
    return h + _renderLista(doPeriodo, pode, true);
  }

  function mostrarLista() { APP.estHistLista = true;  _redesenhar(); }
  function ocultarLista() { APP.estHistLista = false; _redesenhar(); }

  function _tab(id, label, n, atual) {
    var h = '<div class="eq-tab' + (atual === id ? ' active' : '') + '" onclick="Estadias.setTab(\'' + id + '\')">';
    h += label;
    if (n > 0) h += ' <span style="background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;margin-left:3px;">' + n + '</span>';
    h += '</div>';
    return h;
  }

  // ── LISTA DE RESERVAS (ainda não chegaram) ────────────────
  function _renderReservas(lista, pode) {
    if (!lista.length) {
      return emptyState('Sem reservas', 'Não há reservas de lugares por ocupar.');
    }

    var hoje = _hoje();
    lista = lista.slice().sort(function(a, b) { return (a.data_checkin || '').localeCompare(b.data_checkin || ''); });

    var h = '<div class="dtw"><table class="dt">';
    h += '<thead><tr><th>Chegada</th><th>Lugar</th><th>Tipo</th><th>Responsável</th><th>Pessoas</th><th>Noites</th><th>País</th><th></th></tr></thead><tbody>';

    lista.forEach(function(e) {
      var t = _tipo(e.tipo_alojamento);
      var hojeChega = e.data_checkin === hoje;
      var atrasada  = e.data_checkin < hoje;

      h += '<tr' + (hojeChega ? ' style="background:#F5F3FF;"' : (atrasada ? ' style="background:#FEF2F2;"' : '')) + '>';
      h += '<td><span class="td-p">' + _fdata(e.data_checkin) + '</span>';
      if (hojeChega) h += '<div style="font-size:10.5px;color:#7C3AED;font-weight:700;">HOJE</div>';
      else if (atrasada) h += '<div style="font-size:10.5px;color:var(--red);font-weight:600;">Não compareceu?</div>';
      h += '</td>';
      h += '<td class="td-m">' + H(e.lugar || '—') + '</td>';
      h += '<td class="td-m">' + t.i + ' ' + t.l + '</td>';
      h += '<td><span class="td-p">' + H(e.responsavel_nome) + '</span>';
      if (e.contacto) h += '<div class="td-m" style="font-size:10.5px;">' + H(e.contacto) + '</div>';
      h += '</td>';
      h += '<td class="td-m">' + _pessoas(e) + '</td>';
      h += '<td class="td-m">' + (e.data_checkout_prev ? _noitesPrev(e) : '—') + '</td>';
      h += '<td class="td-m">' + H(e.nacionalidade || '—') + '</td>';
      h += '<td style="text-align:right;white-space:nowrap;">';
      if (pode) {
        h += '<button class="btn btn-primary btn-sm" onclick="Estadias.fazerCheckin(\'' + e.id + '\')">Check-in</button>';
        h += '<button class="btn btn-ghost btn-sm" onclick="Estadias.openEditar(\'' + e.id + '\')">Editar</button>';
        h += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Estadias.cancelar(\'' + e.id + '\')">Cancelar</button>';
        h += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Estadias.apagar(\'' + e.id + '\')">Apagar</button>';
      }
      h += '</td></tr>';
    });

    h += '</tbody></table></div>';
    return h;
  }

  // noites previstas de uma reserva
  function _noitesPrev(e) {
    if (!e.data_checkin || !e.data_checkout_prev) return '—';
    var n = Math.round((new Date(e.data_checkout_prev) - new Date(e.data_checkin)) / 86400000);
    return n > 0 ? n : 1;
  }

  // os modais vivem no body (fora do painel), para não serem destruídos ao redesenhar
  function _garantirModais() {
    if (document.getElementById('m-est-novo')) return;
    var wrap = document.createElement('div');
    wrap.id = 'estadias-modais';
    wrap.innerHTML = _modais();
    document.body.appendChild(wrap);
  }

  function _card(v, t, s, cor) {
    var h = '<div class="rep-card">';
    h += '<div class="rep-card-v" style="color:' + cor + ';">' + v + '</div>';
    h += '<div class="rep-card-t">' + t + '</div>';
    h += '<div class="rep-card-s">' + s + '</div>';
    h += '</div>';
    return h;
  }

  // ── LISTA ─────────────────────────────────────────────────
  function _renderLista(lista, pode, historico) {
    if (!lista.length) {
      return emptyState(historico ? 'Sem estadias' : 'Parque vazio',
        historico ? 'Ainda não há estadias registadas.' : 'Não há ninguém no parque neste momento.');
    }

    var h = '<div class="dtw"><table class="dt">';
    h += '<thead><tr>';
    h += '<th>Lugar</th><th>Tipo</th><th>Responsável</th><th>Pessoas</th><th>País</th><th>Check-in</th><th>Check-out</th>';
    if (historico) h += '<th>Noites</th><th>Dormidas</th>';
    h += '<th></th></tr></thead><tbody>';

    lista.forEach(function(e) {
      var t = _tipo(e.tipo_alojamento);
      var atrasado = e.estado === 'ativa' && e.data_checkout_prev && e.data_checkout_prev < _hoje();

      h += '<tr' + (atrasado ? ' style="background:#FEF2F2;"' : '') + '>';
      h += '<td><span class="td-p">' + H(e.lugar || '—') + '</span>';
      if (e.matricula) h += '<div class="td-m" style="font-size:10.5px;">' + H(e.matricula) + '</div>';
      h += '</td>';
      h += '<td class="td-m">' + t.i + ' ' + t.l + '</td>';
      h += '<td><span class="td-p">' + H(e.responsavel_nome) + '</span>';
      if (e.contacto) h += '<div class="td-m" style="font-size:10.5px;">' + H(e.contacto) + '</div>';
      h += '</td>';
      h += '<td class="td-m">' + _pessoas(e);
      if (e.n_criancas > 0) h += ' <span style="font-size:10.5px;color:var(--text-3);">(' + e.n_adultos + 'A + ' + e.n_criancas + 'C)</span>';
      h += '</td>';
      h += '<td class="td-m">' + H(e.nacionalidade || '—') + '</td>';
      h += '<td class="td-m">' + _fdata(e.data_checkin);
      if (historico && e.estado === 'cancelada') {
        h += '<div style="font-size:10.5px;color:var(--red);font-weight:600;">Cancelada</div>';
      } else if (historico && e.estado === 'reservada') {
        h += '<div style="font-size:10.5px;color:#7C3AED;font-weight:600;">Por chegar</div>';
      }
      h += '</td>';
      h += '<td class="td-m">';
      if (e.estado === 'ativa') {
        h += (e.data_checkout_prev ? _fdata(e.data_checkout_prev) : '—');
        if (atrasado) h += '<div style="font-size:10.5px;color:var(--red);font-weight:600;">Em atraso</div>';
        else h += '<div style="font-size:10.5px;color:var(--text-3);">previsto</div>';
      } else {
        h += _fdata(e.data_checkout_real);
      }
      h += '</td>';

      if (historico) {
        h += '<td class="td-m">' + _noites(e) + '</td>';
        h += '<td><strong>' + _dormidas(e) + '</strong></td>';
      }

      h += '<td style="text-align:right;white-space:nowrap;">';
      if (pode && e.estado === 'ativa') {
        h += '<button class="btn btn-primary btn-sm" onclick="Estadias.checkout(\'' + e.id + '\')">Check-out</button>';
      }
      if (pode) {
        h += '<button class="btn btn-ghost btn-sm" onclick="Estadias.openEditar(\'' + e.id + '\')">Editar</button>';
        h += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Estadias.apagar(\'' + e.id + '\')">Apagar</button>';
      }
      h += '</td>';
      h += '</tr>';
    });

    h += '</tbody></table></div>';
    return h;
  }

  // ── ESTATÍSTICAS ──────────────────────────────────────────
  var MESES_C = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  // Barra de meses — partilhada pelo Histórico e pelas Estatísticas
  function _barraMeses() {
    var anoW = APP.anoTrabalho || new Date().getFullYear();
    var hp = '<div class="rep-periodo">';
    hp += '<span class="rep-periodo-l">Período</span>';
    hp += '<button class="rep-mes' + (!APP.repMes ? ' active' : '') + '" onclick="Estadias.setMes(null)">Ano ' + anoW + '</button>';
    for (var mi = 1; mi <= 12; mi++) {
      hp += '<button class="rep-mes' + (APP.repMes === mi ? ' active' : '') + '" onclick="Estadias.setMes(' + mi + ')">' + MESES_C[mi - 1] + '</button>';
    }
    hp += '</div>';
    return hp;
  }

  // Uma estadia pertence ao período selecionado? (pela data de entrada)
  function _noPeriodoEst(e) {
    var ano = String(APP.anoTrabalho || new Date().getFullYear());
    var s = String(e.data_checkin || '').slice(0, 10);
    if (s.slice(0, 4) !== ano) return false;
    if (!APP.repMes) return true;
    return s.slice(5, 7) === ('0' + APP.repMes).slice(-2);
  }

  function _renderStats() {
    var anoW = APP.anoTrabalho || new Date().getFullYear();

    // barra de período
    var hp = _barraMeses();

    // filtrar pelo período
    var fechadas = _lista.filter(function(e) {
      if (e.estado === 'cancelada') return false;
      var s = String(e.data_checkin || '').slice(0, 10);
      if (s.slice(0, 4) !== String(anoW)) return false;
      if (APP.repMes && s.slice(5, 7) !== ('0' + APP.repMes).slice(-2)) return false;
      return true;
    });

    if (!fechadas.length) return hp + emptyState('Sem dados', 'Não há estadias neste período.');

    var totEstadias = fechadas.length;
    var totPessoas = 0, totDormidas = 0, totNoites = 0;
    var porPais = {}, porTipo = {}, porMes = {};

    fechadas.forEach(function(e) {
      var p = _pessoas(e), n = _noites(e), d = _dormidas(e);
      totPessoas  += p;
      totNoites   += n;
      totDormidas += d;

      var pais = e.nacionalidade || 'Não indicado';
      if (!porPais[pais]) porPais[pais] = { estadias: 0, pessoas: 0, dormidas: 0 };
      porPais[pais].estadias++;
      porPais[pais].pessoas  += p;
      porPais[pais].dormidas += d;

      var tp = e.tipo_alojamento || 'outro';
      if (!porTipo[tp]) porTipo[tp] = { estadias: 0, dormidas: 0 };
      porTipo[tp].estadias++;
      porTipo[tp].dormidas += d;

      if (e.data_checkin) {
        var mes = e.data_checkin.slice(0, 7);
        if (!porMes[mes]) porMes[mes] = { estadias: 0, pessoas: 0, dormidas: 0 };
        porMes[mes].estadias++;
        porMes[mes].pessoas  += p;
        porMes[mes].dormidas += d;
      }
    });

    var mediaEstadia = totEstadias ? (totNoites / totEstadias) : 0;

    var h = hp;
    h += '<div class="rep-cards" style="margin-bottom:14px;">';
    h += _card(totEstadias, 'Estadias', 'no total', '#1D4ED8');
    h += _card(totPessoas, 'Hóspedes', 'pessoas recebidas', '#15803D');
    h += _card(totDormidas, 'Dormidas', 'pessoas × noites', '#7C3AED');
    h += _card(mediaEstadia.toFixed(1), 'Estadia média', 'noites', '#D97706');
    h += '</div>';

    // por nacionalidade
    var paises = Object.keys(porPais).sort(function(a, b) { return porPais[b].dormidas - porPais[a].dormidas; });
    h += '<div class="card" style="margin-bottom:14px;">';
    h += '<div class="sec-head"><div class="sec-title" style="font-size:14px;">Por nacionalidade</div>';
    h += '<button class="btn btn-secondary btn-sm" onclick="Estadias.imprimir()">🖨️ Imprimir</button></div>';
    h += '<div class="dtw"><table class="dt">';
    h += '<thead><tr><th>País</th><th>Estadias</th><th>Hóspedes</th><th>Dormidas</th><th>%</th></tr></thead><tbody>';
    paises.forEach(function(p) {
      var pct = totDormidas ? Math.round(porPais[p].dormidas / totDormidas * 100) : 0;
      h += '<tr><td><span class="td-p">' + H(p) + '</span></td>';
      h += '<td class="td-m">' + porPais[p].estadias + '</td>';
      h += '<td class="td-m">' + porPais[p].pessoas + '</td>';
      h += '<td><strong>' + porPais[p].dormidas + '</strong></td>';
      h += '<td><div style="display:flex;align-items:center;gap:6px;"><div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;max-width:70px;"><div style="width:' + pct + '%;height:100%;background:var(--accent);"></div></div><span style="font-size:11.5px;">' + pct + '%</span></div></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div></div>';

    // por tipo de alojamento
    h += '<div class="card" style="margin-bottom:14px;">';
    h += '<div class="sec-head"><div class="sec-title" style="font-size:14px;">Por tipo de alojamento</div></div>';
    h += '<div class="dtw"><table class="dt">';
    h += '<thead><tr><th>Tipo</th><th>Estadias</th><th>Dormidas</th></tr></thead><tbody>';
    Object.keys(porTipo).sort(function(a, b) { return porTipo[b].dormidas - porTipo[a].dormidas; }).forEach(function(t) {
      var td = _tipo(t);
      h += '<tr><td>' + td.i + ' ' + td.l + '</td><td class="td-m">' + porTipo[t].estadias + '</td><td><strong>' + porTipo[t].dormidas + '</strong></td></tr>';
    });
    h += '</tbody></table></div></div>';

    // evolução mensal
    var meses = Object.keys(porMes).sort();
    if (meses.length) {
      var maxD = Math.max.apply(null, meses.map(function(m) { return porMes[m].dormidas; }));
      h += '<div class="card">';
      h += '<div class="sec-head"><div class="sec-title" style="font-size:14px;">Evolução mensal (dormidas)</div></div>';
      meses.forEach(function(m) {
        var pct = maxD ? Math.round(porMes[m].dormidas / maxD * 100) : 0;
        var nm = _nomeMes(m);
        h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px;">';
        h += '<div style="width:80px;font-size:12px;color:var(--text-2);">' + nm + '</div>';
        h += '<div style="flex:1;height:20px;background:var(--border);border-radius:4px;overflow:hidden;">';
        h += '<div style="width:' + pct + '%;height:100%;background:var(--accent);border-radius:4px;"></div>';
        h += '</div>';
        h += '<div style="width:100px;font-size:12px;text-align:right;"><strong>' + porMes[m].dormidas + '</strong> <span style="color:var(--text-3);">(' + porMes[m].estadias + ' est.)</span></div>';
        h += '</div>';
      });
      h += '</div>';
    }

    return h;
  }

  function _nomeMes(iso) {
    var MS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    var p = iso.split('-');
    return MS[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }

  // ── MODAIS ────────────────────────────────────────────────
  function _modais() {
    var h = '';

    h += '<div class="modal-bd" id="m-est-novo">';
    h += '<div class="modal" style="max-width:560px;">';
    h += '<div class="modal-header"><div class="mh-ic mhi-green"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M12 3L2 21h20L12 3z"/></svg></div>';
    h += '<div><div class="modal-title" id="m-est-ttl">Novo check-in</div><div class="modal-sub" id="m-est-eq">—</div></div>';
    h += '<button class="modal-close" onclick="closeModal(\'m-est-novo\')">✕</button></div>';
    h += '<div class="modal-body">';

    h += '<div class="form-sec-t">Alojamento</div>';
    h += '<div class="form-row">';
    h += '<div class="fi"><label class="fl">Tipo *</label><select id="est-tipo" class="fin">';
    TIPOS.forEach(function(t) { h += '<option value="' + t.v + '">' + t.i + ' ' + t.l + '</option>'; });
    h += '</select></div>';
    h += '<div class="fi"><label class="fl">Lugar / alvéolo *</label><input type="text" id="est-lugar" class="fin" placeholder="ex: A12"></div>';
    h += '</div>';
    h += '<div class="fi"><label class="fl">Matrícula</label><input type="text" id="est-matricula" class="fin" placeholder="Para caravanas e autocaravanas"></div>';

    h += '<div class="form-sec-t">Hóspedes</div>';
    h += '<div class="fi"><label class="fl">Nome do responsável *</label><input type="text" id="est-nome" class="fin"></div>';
    h += '<div class="form-row">';
    h += '<div class="fi"><label class="fl">Contacto</label><input type="text" id="est-contacto" class="fin" placeholder="Telefone ou email"></div>';
    h += '<div class="fi"><label class="fl">Documento</label><input type="text" id="est-doc" class="fin" placeholder="CC / Passaporte"></div>';
    h += '</div>';
    h += '<div class="form-row">';
    h += '<div class="fi"><label class="fl">Adultos *</label><input type="number" id="est-adultos" class="fin" min="1" value="1"></div>';
    h += '<div class="fi"><label class="fl">Crianças</label><input type="number" id="est-criancas" class="fin" min="0" value="0"></div>';
    h += '</div>';
    h += '<div class="fi"><label class="fl">Nacionalidade *</label>';
    h += '<input type="text" id="est-pais" class="fin" list="paises-lista" placeholder="ex: Portugal">';
    h += '<datalist id="paises-lista">';
    PAISES.forEach(function(p) { h += '<option value="' + p + '"></option>'; });
    h += '</datalist></div>';

    h += '<div class="form-sec-t">Datas</div>';
    h += '<div class="form-row">';
    h += '<div class="fi"><label class="fl" id="est-lbl-ci">Check-in *</label><input type="date" id="est-ci" class="fin"></div>';
    h += '<div class="fi"><label class="fl">Saída prevista</label><input type="date" id="est-co" class="fin"></div>';
    h += '</div>';
    h += '<div id="est-ajuda" style="border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.5;margin-bottom:12px;display:none;"></div>';
    h += '<div class="fi"><label class="fl">Observações</label><textarea id="est-obs" class="fin" rows="2"></textarea></div>';

    h += '</div>';
    h += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-est-novo\')">Cancelar</button>';
    h += '<button class="btn btn-primary" id="est-btn-salvar" onclick="Estadias.salvar()">Registar</button></div>';
    h += '</div></div>';

    // CHECK-OUT
    h += '<div class="modal-bd" id="m-est-checkout">';
    h += '<div class="modal"><div class="modal-header"><div class="mh-ic mhi-amber"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>';
    h += '<div><div class="modal-title">Fazer check-out</div><div class="modal-sub" id="m-est-co-sub">—</div></div>';

    h += '<div class="modal-body">';
    h += '<div class="fi"><label class="fl">Data de saída *</label><input type="date" id="est-co-data" class="fin"></div>';
    h += '<div id="est-co-resumo" style="background:var(--bg);border-radius:8px;padding:12px;font-size:13px;color:var(--text-2);line-height:1.7;"></div>';
    h += '</div>';
    h += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-est-checkout\')">Cancelar</button>';

    h += '</div></div>';

    return h;

  // ── ACÇÕES ────────────────────────────────────────────────
  function setTab(t) {
    APP.estadiaTab = t;
    APP.estHistLista = false; // ao trocar de separador, a lista volta recolhida
    _redesenhar();
  }

  function setMes(m) {
    APP.repMes = m || null;
    APP.estHistLista = false; // novo mês → resumo primeiro, lista só se pedida
    _redesenhar();
  }

  // redesenha apenas o painel das estadias (dashboard ou ficha do equipamento)
  function _redesenhar() {
    App.renderContent();
  }

  function openNovo(eqId, modo) {
    _garantirModais();
    APP.editId = null;
    APP.estModo = modo || 'checkin';   // 'reserva' | 'checkin'
    _eqId = eqId || _eqId;
    var eq = getEq(_eqId);
    var set = function(i, v) { var el = document.getElementById(i); if (el) el.value = v; };

    var eReserva = (APP.estModo === 'reserva');

    var ttl = document.getElementById('m-est-ttl');
    if (ttl) ttl.textContent = eReserva ? 'Nova reserva de lugar' : 'Novo check-in';
    var eqEl = document.getElementById('m-est-eq');
    if (eqEl) eqEl.textContent = eq ? eq.nome : '—';

    // rótulos e ajuda mudam conforme o modo
    var lblCi = document.getElementById('est-lbl-ci');
    if (lblCi) lblCi.textContent = eReserva ? 'Data de chegada *' : 'Check-in *';
    var ajuda = document.getElementById('est-ajuda');
    if (ajuda) {
      ajuda.style.display = 'block';
      ajuda.innerHTML = eReserva
        ? 'A reserva fica <strong>à espera</strong>. Quando o hóspede chegar, faça o check-in a partir da lista de reservas.'
        : 'O hóspede <strong>já chegou</strong> — a estadia começa hoje.';
      ajuda.style.background = eReserva ? '#F5F3FF' : '#DCFCE7';
      ajuda.style.color = eReserva ? '#5B21B6' : '#15803D';
    }
    var btn = document.getElementById('est-btn-salvar');
    if (btn) btn.textContent = eReserva ? 'Reservar lugar' : 'Registar entrada';

    set('est-tipo', 'tenda');
    set('est-lugar', '');
    set('est-matricula', '');
    set('est-nome', '');
    set('est-contacto', '');
    set('est-doc', '');
    set('est-adultos', 1);
    set('est-criancas', 0);
    set('est-pais', '');
    set('est-ci', _hoje());
    set('est-co', '');
    set('est-obs', '');

    openModal('m-est-novo');
  }

  // ── Check-in de uma reserva: passa de 'reservada' a 'ativa' ──
  function fazerCheckin(id) {
    if (APP.podeGerirEstadias && !APP.podeGerirEstadias(_eqId)) {
      toast('Não tem autorização.', 'error');
      return;
    }
    var e = _lista.filter(function(x) { return x.id === id; })[0];
    if (!e) return;

    var hoje = _hoje();
    var msg = 'Confirmar a entrada de ' + e.responsavel_nome + ' no lugar ' + (e.lugar || '—') + '?';
    if (e.data_checkin !== hoje) {
      msg += '\n\nA reserva era para ' + _fdata(e.data_checkin) + '. A estadia passa a começar hoje (' + _fdata(hoje) + ').';
    }
    if (!confirm(msg)) return;

    sbPatch('estadias', 'id=eq.' + id, {
      estado: 'ativa',
      data_checkin: hoje    // a estadia conta a partir da entrada real
    }).then(function() {
      toast('Check-in feito. Bem-vindos!', 'success');
      APP.estadiaTab = 'ativas';
      load(_eqId, function() { _redesenhar(); });
    }).catch(function(err) {
      console.error('Erro no check-in:', err);
      var m = [err && err.code, err && err.message].filter(Boolean).join(' · ');
      toast('Erro no check-in: ' + (m || 'desconhecido'), 'error');
    });
  }

  // Apagar definitivamente — o registo sai das estatísticas.
  // Diferente de "Cancelar" (que mantém o histórico da desistência).
  function apagar(id) {
    if (APP.podeGerirEstadias && !APP.podeGerirEstadias(_eqId)) {
      toast('Não tem autorização.', 'error');
      return;
    }
    var e = _lista.filter(function(x) { return x.id === id; })[0];
    if (!e) return;

    var aviso = 'Apagar definitivamente o registo de ' + e.responsavel_nome + '?';
    if (e.estado === 'concluida') {
      aviso += '\n\nAtenção: as ' + _dormidas(e) + ' dormidas desta estadia deixam de contar nas estatísticas.';
    } else if (e.estado === 'ativa') {
      aviso += '\n\nEsta estadia está ACTIVA — o lugar ' + (e.lugar || '') + ' fica livre.';
    }
    aviso += '\n\nEsta ação não pode ser desfeita.';
    if (!confirm(aviso)) return;

    sbDelete('estadias', 'id=eq.' + id).then(function() {
      _lista = _lista.filter(function(x) { return x.id !== id; });
      toast('Registo apagado.', 'success');
      _redesenhar();
    }).catch(function(err) {
      console.error('Erro ao apagar estadia:', err);
      var m = [err && err.code, err && err.message].filter(Boolean).join(' · ');
      toast('Erro ao apagar: ' + (m || 'desconhecido'), 'error');
    });
  }

  function cancelar(id) {
    if (APP.podeGerirEstadias && !APP.podeGerirEstadias(_eqId)) return;
    var e = _lista.filter(function(x) { return x.id === id; })[0];
    if (!e) return;
    if (!confirm('Cancelar a reserva de ' + e.responsavel_nome + '?\n\nO lugar ' + (e.lugar || '') + ' fica livre.')) return;

    sbPatch('estadias', 'id=eq.' + id, { estado: 'cancelada' }).then(function() {
      toast('Reserva cancelada.', 'success');
      load(_eqId, function() { _redesenhar(); });
    }).catch(function() { toast('Erro ao cancelar.', 'error'); });
  }

  function openEditar(id) {
    _garantirModais();
    var e = _lista.filter(function(x) { return x.id === id; })[0];
    if (!e) return;
    APP.editId = id;
    var eq = getEq(e.equipamento_id);
    var set = function(i, v) { var el = document.getElementById(i); if (el) el.value = (v == null ? '' : v); };

    APP.estModo = (e.estado === 'reservada') ? 'reserva' : 'checkin';

    var ttl = document.getElementById('m-est-ttl');
    if (ttl) ttl.textContent = (e.estado === 'reservada') ? 'Editar reserva' : 'Editar estadia';
    var eqEl = document.getElementById('m-est-eq');
    if (eqEl) eqEl.textContent = eq ? eq.nome : '—';

    var lblCi = document.getElementById('est-lbl-ci');
    if (lblCi) lblCi.textContent = (e.estado === 'reservada') ? 'Data de chegada *' : 'Check-in *';
    var ajuda = document.getElementById('est-ajuda');
    if (ajuda) ajuda.style.display = 'none';
    var btn = document.getElementById('est-btn-salvar');
    if (btn) btn.textContent = 'Guardar alterações';

    set('est-tipo', e.tipo_alojamento);
    set('est-lugar', e.lugar);
    set('est-matricula', e.matricula);
    set('est-nome', e.responsavel_nome);
    set('est-contacto', e.contacto);
    set('est-doc', e.documento);
    set('est-adultos', e.n_adultos);
    set('est-criancas', e.n_criancas);
    set('est-pais', e.nacionalidade);
    set('est-ci', e.data_checkin);
    set('est-co', e.data_checkout_prev);
    set('est-obs', e.observacoes);

    openModal('m-est-novo');
  }

  function salvar() {
    if (APP.podeGerirEstadias && !APP.podeGerirEstadias(_eqId)) {
      toast('Não tem autorização para registar check-ins.', 'error');
      return;
    }
    var v = function(i) { var el = document.getElementById(i); return el ? el.value : ''; };

    var nome  = (v('est-nome') || '').trim();
    var lugar = (v('est-lugar') || '').trim();
    var pais  = (v('est-pais') || '').trim();
    var ci    = v('est-ci');
    var co    = v('est-co');
    var ad    = parseInt(v('est-adultos'), 10) || 0;
    var cr    = parseInt(v('est-criancas'), 10) || 0;

    if (!nome)  { toast('Indique o nome do responsável.', 'error'); return; }
    if (!lugar) { toast('Indique o lugar / alvéolo.', 'error'); return; }
    if (!pais)  { toast('Indique a nacionalidade.', 'error'); return; }
    if (!ci)    { toast('Indique a data de check-in.', 'error'); return; }
    if (ad < 1) { toast('Tem de haver pelo menos 1 adulto.', 'error'); return; }
    if (co && co < ci) { toast('O check-out não pode ser anterior ao check-in.', 'error'); return; }

    var body = {
      equipamento_id:     _eqId,
      tipo_alojamento:    v('est-tipo') || 'tenda',
      lugar:              lugar,
      matricula:          (v('est-matricula') || '').trim() || null,
      responsavel_nome:   nome,
      contacto:           (v('est-contacto') || '').trim() || null,
      documento:          (v('est-doc') || '').trim() || null,
      nacionalidade:      pais,
      n_adultos:          ad,
      n_criancas:         cr,
      data_checkin:       ci,
      data_checkout_prev: co || null,
      observacoes:        (v('est-obs') || '').trim() || null,
      criado_por:         APP.user ? APP.user.id : null
    };
    if (!APP.editId) {
      body.estado = (APP.estModo === 'reserva') ? 'reservada' : 'ativa';
    }

    var p = APP.editId
      ? sbPatch('estadias', 'id=eq.' + APP.editId, body)
      : sbPost('estadias', body);

    p.then(function() {
      var msg = APP.editId ? 'Registo atualizado.'
              : (APP.estModo === 'reserva' ? 'Lugar reservado.' : 'Check-in registado.');
      toast(msg, 'success');
      closeModal('m-est-novo');
      if (!APP.editId) APP.estadiaTab = (APP.estModo === 'reserva') ? 'reservas' : 'ativas';
      load(_eqId, function() { _redesenhar(); });
    }).catch(function(e) {
      console.error('Erro estadia:', e);
      var msg = [e && e.code, e && e.message].filter(Boolean).join(' · ');
      toast('Erro ao guardar: ' + (msg || 'desconhecido'), 'error');
    });
  }

  function checkout(id) {
    _garantirModais();
    var e = _lista.filter(function(x) { return x.id === id; })[0];
    if (!e) return;
    APP.actionId = id;

    var sub = document.getElementById('m-est-co-sub');
    if (sub) sub.textContent = (e.lugar || '') + ' · ' + e.responsavel_nome;

    var d = document.getElementById('est-co-data');
    if (d) d.value = _hoje();

    _resumoCheckout(e);
    openModal('m-est-checkout');
  }

  function _resumoCheckout(e) {
    var box = document.getElementById('est-co-resumo');
    if (!box) return;
    var simulado = {};
    for (var k in e) simulado[k] = e[k];
    simulado.data_checkout_real = _hoje();
    simulado.estado = 'concluida';

    var h = '<div><strong>Check-in:</strong> ' + _fdata(e.data_checkin) + '</div>';
    h += '<div><strong>Pessoas:</strong> ' + _pessoas(e) + '</div>';
    h += '<div><strong>Noites:</strong> ' + _noites(simulado) + '</div>';
    h += '<div style="margin-top:4px;padding-top:6px;border-top:1px solid var(--border);"><strong>Dormidas:</strong> ' + _dormidas(simulado) + '</div>';
    box.innerHTML = h;
  }

  function confirmarCheckout() {
    if (!APP.actionId) return;
    if (APP.podeGerirEstadias && !APP.podeGerirEstadias(_eqId)) {
      toast('Não tem autorização para fazer check-out.', 'error');
      return;
    }
    var data = (document.getElementById('est-co-data') || {}).value;
    if (!data) { toast('Indique a data de saída.', 'error'); return; }

    var e = _lista.filter(function(x) { return x.id === APP.actionId; })[0];
    if (e && data < e.data_checkin) { toast('A saída não pode ser anterior à entrada.', 'error'); return; }

    sbPatch('estadias', 'id=eq.' + APP.actionId, {
      estado: 'concluida',
      data_checkout_real: data
    }).then(function() {
      toast('Check-out registado.', 'success');
      closeModal('m-est-checkout');
      load(_eqId, function() { _redesenhar(); });
    }).catch(function() { toast('Erro ao fazer check-out.', 'error'); });
  }

  // ── IMPRESSÃO ─────────────────────────────────────────────
  function imprimir() {
    var eq = getEq(_eqId);
    var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    var ano = APP.anoTrabalho || new Date().getFullYear();
    var mes = APP.repMes;
    var perLabel = mes ? (MESES[mes - 1] + ' de ' + ano) : ('Ano de ' + ano);

    // estadias do período (pela data de check-in)
    var fechadas = _lista.filter(function(e) {
      if (e.estado === 'cancelada') return false;
      var s = String(e.data_checkin || '').slice(0, 10);
      if (s.slice(0, 4) !== String(ano)) return false;
      if (mes && s.slice(5, 7) !== ('0' + mes).slice(-2)) return false;
      return true;
    });

    var totPessoas = 0, totDormidas = 0, totNoites = 0;
    var porPais = {}, porTipo = {};
    fechadas.forEach(function(e) {
      var p = _pessoas(e), n = _noites(e), d = _dormidas(e);
      totPessoas += p; totNoites += n; totDormidas += d;
      var pais = e.nacionalidade || 'Não indicado';
      if (!porPais[pais]) porPais[pais] = { estadias: 0, pessoas: 0, dormidas: 0 };
      porPais[pais].estadias++;
      porPais[pais].pessoas += p;
      porPais[pais].dormidas += d;
      var tp = e.tipo_alojamento || 'outro';
      if (!porTipo[tp]) porTipo[tp] = { estadias: 0, dormidas: 0 };
      porTipo[tp].estadias++;
      porTipo[tp].dormidas += d;
    });

    var hoje = new Date();
    var dh = ('0' + hoje.getDate()).slice(-2) + '/' + ('0' + (hoje.getMonth() + 1)).slice(-2) + '/' + hoje.getFullYear();

    var h = '<div class="pr-head"><div class="pr-head-top"><div>';
    h += '<div class="pr-org">Município de Cabeceiras de Basto · Divisão de Desenvolvimento Social</div>';
    h += '<div class="pr-title">Estatísticas de Ocupação</div>';
    h += '<div class="pr-meta">' + H(eq ? eq.nome : '') + ' · Emitido em ' + dh + '</div>';
    h += '</div><div class="pr-chip">' + H(perLabel) + '</div></div></div>';

    if (!fechadas.length) {
      h += '<div class="pr-empty">Não há estadias registadas neste período.</div>';
      h += '<div class="pr-foot">GestDDS · Divisão de Desenvolvimento Social · Município de Cabeceiras de Basto</div>';
      _print(h);
      return;
    }

    h += '<div class="pr-kpis">';
    h += '<div class="pr-kpi"><div class="pr-kpi-v">' + fechadas.length + '</div><div class="pr-kpi-l">Estadias</div></div>';
    h += '<div class="pr-kpi"><div class="pr-kpi-v">' + totPessoas + '</div><div class="pr-kpi-l">Hóspedes</div></div>';
    h += '<div class="pr-kpi"><div class="pr-kpi-v">' + totDormidas + '</div><div class="pr-kpi-l">Dormidas</div></div>';
    h += '<div class="pr-kpi"><div class="pr-kpi-v">' + (totNoites / fechadas.length).toFixed(1) + '</div><div class="pr-kpi-l">Estadia média</div></div>';
    h += '</div>';

    h += '<div class="pr-sec">Por nacionalidade</div>';
    h += '<table class="pr-table"><colgroup><col style="width:34%"><col style="width:16%"><col style="width:16%"><col style="width:17%"><col style="width:17%"></colgroup>';
    h += '<thead><tr><th>País</th><th>Estadias</th><th>Hóspedes</th><th>Dormidas</th><th>% dormidas</th></tr></thead><tbody>';
    Object.keys(porPais).sort(function(a, b) { return porPais[b].dormidas - porPais[a].dormidas; }).forEach(function(p) {
      var pct = totDormidas ? Math.round(porPais[p].dormidas / totDormidas * 100) : 0;
      h += '<tr><td>' + H(p) + '</td><td>' + porPais[p].estadias + '</td><td>' + porPais[p].pessoas + '</td><td>' + porPais[p].dormidas + '</td><td>' + pct + '%</td></tr>';
    });
    h += '<tr class="pr-tot"><td>Total</td><td>' + fechadas.length + '</td><td>' + totPessoas + '</td><td>' + totDormidas + '</td><td>100%</td></tr>';
    h += '</tbody></table>';

    h += '<div class="pr-sec">Por tipo de alojamento</div>';
    h += '<table class="pr-table"><colgroup><col style="width:50%"><col style="width:25%"><col style="width:25%"></colgroup>';
    h += '<thead><tr><th>Tipo</th><th>Estadias</th><th>Dormidas</th></tr></thead><tbody>';
    Object.keys(porTipo).sort(function(a, b) { return porTipo[b].dormidas - porTipo[a].dormidas; }).forEach(function(t) {
      h += '<tr><td>' + _tipo(t).l + '</td><td>' + porTipo[t].estadias + '</td><td>' + porTipo[t].dormidas + '</td></tr>';
    });
    h += '</tbody></table>';

    // detalhe das estadias
    h += '<div class="pr-sec">Detalhe das estadias (' + fechadas.length + ')</div>';
    h += '<table class="pr-table"><colgroup><col style="width:10%"><col style="width:14%"><col style="width:22%"><col style="width:14%"><col style="width:11%"><col style="width:11%"><col style="width:9%"><col style="width:9%"></colgroup>';
    h += '<thead><tr><th>Lugar</th><th>Tipo</th><th>Responsável</th><th>País</th><th>Entrada</th><th>Saída</th><th>Pess.</th><th>Dorm.</th></tr></thead><tbody>';
    fechadas.slice().sort(function(a, b) { return new Date(a.data_checkin) - new Date(b.data_checkin); }).forEach(function(e) {
      h += '<tr><td>' + H(e.lugar || '—') + '</td><td>' + _tipo(e.tipo_alojamento).l + '</td><td>' + H(e.responsavel_nome) + '</td><td>' + H(e.nacionalidade || '—') + '</td>';
      h += '<td>' + _fdata(e.data_checkin) + '</td><td>' + _fdata(e.data_checkout_real || e.data_checkout_prev) + '</td>';
      h += '<td>' + _pessoas(e) + '</td><td>' + _dormidas(e) + '</td></tr>';
    });
    h += '</tbody></table>';

    h += '<div class="pr-foot">GestDDS · Divisão de Desenvolvimento Social · Município de Cabeceiras de Basto</div>';
    _print(h);
  }

  function _print(html) {
    var root = document.getElementById('print-root');
    if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
    root.innerHTML = html;
    window.print();
  }

  function init() {}

  return {
    init: init, load: load, renderPainel: renderPainel,
    ocupacao: ocupacao, mostrarLista: mostrarLista, ocultarLista: ocultarLista,
    openNovo: openNovo, openEditar: openEditar, salvar: salvar,
    checkout: checkout, confirmarCheckout: confirmarCheckout,
    setTab: setTab, setMes: setMes, imprimir: imprimir,
    fazerCheckin: fazerCheckin, cancelar: cancelar, apagar: apagar,
    lista: function() { return _lista; },
    dormidas: _dormidas, pessoas: _pessoas, noites: _noites
  };

})();

</script>
<script>
/* ═════ visitas.js ═════ */
// ============================================================
// GestDDS — visitas.js  v1.0
// Registo de Visitas — visitantes que não passam por reserva
//
// Ex: uma escola que visita o CEAVM, uma família que aparece.
// Não há reserva, mas conta para os indicadores mensais.
//
// Módulo ativável por equipamento (chave 'visitas').
// ============================================================

var Visitas = (function() {

  var _lista = [];
  var _eqId  = null;

  var TIPOS = [
    { v: 'escola',      l: 'Escola',              i: '🎒' },
    { v: 'instituicao', l: 'Instituição / IPSS',  i: '🏛' },
    { v: 'grupo',       l: 'Grupo organizado',    i: '👥' },
    { v: 'particular',  l: 'Particular / família', i: '👨‍👩‍👧' },
    { v: 'outro',       l: 'Outro',               i: '📍' }
  ];

  var PAISES = ['Portugal', 'Espanha', 'França', 'Alemanha', 'Reino Unido', 'Países Baixos', 'Brasil', 'Outro'];

  var MESES   = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var MESES_C = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  // ── DADOS ─────────────────────────────────────────────────
  function load(eqId, cb) {
    _eqId = eqId;
    sbGet('visitas', 'equipamento_id=eq.' + eqId + '&order=data.desc').then(function(d) {
      _lista = Array.isArray(d) ? d : [];
      if (cb) cb();
    }).catch(function() {
      _lista = [];
      if (cb) cb();
    });
  }

  function _tipo(v) { return TIPOS.filter(function(t){ return t.v === v; })[0] || TIPOS[4]; }
  function _pessoas(v) { return (parseInt(v.n_adultos,10)||0) + (parseInt(v.n_criancas,10)||0); }
  function _hoje() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  function _fdata(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return ('0'+d.getDate()).slice(-2) + '/' + ('0'+(d.getMonth()+1)).slice(-2) + '/' + d.getFullYear();
  }

  // filtro de período (ano de trabalho + mês opcional)
  function _noPeriodo(iso) {
    if (!iso) return false;
    var ano = String(APP.anoTrabalho || new Date().getFullYear());
    var s = String(iso).slice(0,10);
    if (s.slice(0,4) !== ano) return false;
    if (!APP.repMes) return true;
    return s.slice(5,7) === ('0'+APP.repMes).slice(-2);
  }

  function _perLabel() {
    var ano = APP.anoTrabalho || new Date().getFullYear();
    return APP.repMes ? (MESES[APP.repMes-1] + ' de ' + ano) : ('Ano de ' + ano);
  }

  // ── PERMISSÕES ────────────────────────────────────────────
  function _podeGerir(eqId) {
    if (typeof APP.podeGerirVisitas === 'function') return APP.podeGerirVisitas(eqId);
    return true;
  }

  // ── RENDER ────────────────────────────────────────────────
  function renderPainel(eqId) {
    _eqId = eqId;
    if (typeof APP.podeVerVisitas === 'function' && !APP.podeVerVisitas(eqId)) {
      return '<div class="mod-ph"><div class="mod-ph-t">Sem acesso</div><div class="mod-ph-s">Não tem autorização para consultar o registo de visitas. Peça acesso ao administrador.</div></div>';
    }
    var pode = _podeGerir(eqId);
    var anoW = APP.anoTrabalho || new Date().getFullYear();

    var h = '';

    // barra de período
    h += '<div class="rep-periodo">';
    h += '<span class="rep-periodo-l">Período</span>';
    h += '<button class="rep-mes' + (!APP.repMes ? ' active' : '') + '" onclick="Visitas.setMes(null)">Ano ' + anoW + '</button>';
    for (var mi = 1; mi <= 12; mi++) {
      h += '<button class="rep-mes' + (APP.repMes === mi ? ' active' : '') + '" onclick="Visitas.setMes(' + mi + ')">' + MESES_C[mi-1] + '</button>';
    }
    h += '</div>';

    var doPeriodo = _lista.filter(function(v){ return _noPeriodo(v.data); });

    // KPIs
    var nVis = doPeriodo.length, nAd = 0, nCr = 0;
    doPeriodo.forEach(function(v) {
      nAd += parseInt(v.n_adultos,10)||0;
      nCr += parseInt(v.n_criancas,10)||0;
    });

    h += '<div class="rep-cards" style="margin-bottom:14px;">';
    h += _card(nVis, 'Visitas', 'no período', '#1D4ED8');
    h += _card(nAd + nCr, 'Visitantes', 'total de pessoas', '#15803D');
    h += _card(nCr, 'Crianças', 'até 12 anos', '#7C3AED');
    h += _card(nAd, 'Adultos', '', '#D97706');
    h += '</div>';

    if (pode) {
      h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">';
      h += '<button class="btn btn-primary btn-sm" onclick="Visitas.openNovo(\'' + eqId + '\')">+ Registar visita</button>';
      h += '<button class="btn btn-secondary btn-sm" onclick="Visitas.imprimir()">🖨️ Relatório mensal</button>';
      h += '</div>';
    }

    // por tipo de visitante
    if (doPeriodo.length) {
      var porTipo = {};
      doPeriodo.forEach(function(v) {
        var t = v.tipo_visitante || 'outro';
        if (!porTipo[t]) porTipo[t] = { n: 0, pessoas: 0, criancas: 0 };
        porTipo[t].n++;
        porTipo[t].pessoas  += _pessoas(v);
        porTipo[t].criancas += parseInt(v.n_criancas,10)||0;
      });

      h += '<div class="card" style="margin-bottom:14px;">';
      h += '<div class="sec-head"><div class="sec-title" style="font-size:14px;">Por tipo de visitante</div></div>';
      h += '<div class="dtw"><table class="dt">';
      h += '<thead><tr><th>Tipo</th><th>Visitas</th><th>Pessoas</th><th>Crianças</th></tr></thead><tbody>';
      Object.keys(porTipo).sort(function(a,b){ return porTipo[b].pessoas - porTipo[a].pessoas; }).forEach(function(t) {
        var td = _tipo(t);
        h += '<tr><td>' + td.i + ' ' + td.l + '</td><td class="td-m">' + porTipo[t].n + '</td><td><strong>' + porTipo[t].pessoas + '</strong></td><td class="td-m">' + porTipo[t].criancas + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
    }

    // lista
    h += '<div class="card">';
    h += '<div class="sec-head"><div class="sec-title" style="font-size:14px;">Registos — ' + H(_perLabel()) + '</div></div>';

    if (!doPeriodo.length) {
      h += emptyState('Sem visitas', 'Não há visitas registadas neste período.');
    } else {
      h += '<div class="dtw"><table class="dt">';
      h += '<thead><tr><th>Data</th><th>Tipo</th><th>Entidade / Nome</th><th>Adultos</th><th>Crianças</th><th>Total</th><th>País</th>';
      if (pode) h += '<th></th>';
      h += '</tr></thead><tbody>';
      doPeriodo.forEach(function(v) {
        var t = _tipo(v.tipo_visitante);
        h += '<tr>';
        h += '<td class="td-m">' + _fdata(v.data) + '</td>';
        h += '<td class="td-m">' + t.i + ' ' + t.l + '</td>';
        h += '<td><span class="td-p">' + H(v.entidade || '—') + '</span></td>';
        h += '<td class="td-m">' + (v.n_adultos || 0) + '</td>';
        h += '<td class="td-m">' + (v.n_criancas || 0) + '</td>';
        h += '<td><strong>' + _pessoas(v) + '</strong></td>';
        h += '<td class="td-m">' + H(v.nacionalidade || '—') + '</td>';
        if (pode) {
          h += '<td style="text-align:right;white-space:nowrap;">';
          h += '<button class="btn btn-ghost btn-sm" onclick="Visitas.openEditar(\'' + v.id + '\')">Editar</button>';
          h += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Visitas.apagar(\'' + v.id + '\')">Apagar</button>';
          h += '</td>';
        }
        h += '</tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '</div>';

    _garantirModais();
    return h;
  }

  function _card(v, t, s, cor) {
    return '<div class="rep-card"><div class="rep-card-v" style="color:' + cor + ';">' + v + '</div>'
         + '<div class="rep-card-t">' + t + '</div><div class="rep-card-s">' + s + '</div></div>';
  }

  // ── MODAL ─────────────────────────────────────────────────
  function _garantirModais() {
    if (document.getElementById('m-vis-novo')) return;
    var w = document.createElement('div');
    w.id = 'visitas-modais';
    w.innerHTML = _modalHTML();
    document.body.appendChild(w);
  }

  function _modalHTML() {
    var h = '<div class="modal-bd" id="m-vis-novo">';
    h += '<div class="modal" style="max-width:500px;">';
