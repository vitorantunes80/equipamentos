  function _relKpi(v, l, d) {
    return '<div class="rel-kpi"><div class="rel-kpi-v">' + v + '</div><div class="rel-kpi-l">' + l + '</div>' + (d || '') + '</div>';
  }
  function _relDelta(cur, prev) {
    if (prev === null || prev === undefined) return '';
    if (!prev) return cur ? '<div class="rel-d">novo</div>' : '';
    if (prev < 10) return '<div class="rel-d">mês ant.: ' + nf(prev) + '</div>';
    var p = Math.round((cur - prev) / prev * 100);
    if (!p) return '<div class="rel-d">= mês ant.</div>';
    return '<div class="rel-d ' + (p > 0 ? 'up' : 'down') + '">' + (p > 0 ? '▲' : '▼') + ' ' + Math.abs(p) + '% vs mês ant.</div>';
  }

  function folhaEq(eqId, ano, mes) {
    var eq = getEq(eqId);
    if (!eq) return '';
    ano = ano || _ano();
    if (mes === undefined || mes === null) mes = mesAtual();
    var per = periodo(ano, mes);
    var R = calc(per, '', eqId);
    var P = mes > 1 ? calc(periodo(ano, mes - 1), '', eqId) : null;
    var tipo = getTipo(eq.tipo_id);
    var resp = eq.responsavel_id ? (APP.utilizadores || []).filter(function(u) { return u.id === eq.responsavel_id; })[0] : null;
    var mRes = modAtivo(eq, 'reservas'), mEst = modAtivo(eq, 'estadias'), mVis = modAtivo(eq, 'visitas'), mChk = modAtivo(eq, 'checklist');
    var hoje = new Date();
    var e = function(x) { return H(x); };
    var pd = function(k) { return P ? P[k] : null; };

    var h = '<div class="rel-page">';
    h += '<div class="rel-head"><div>';
    h += '<div class="rel-org">Município de Cabeceiras de Basto · Divisão de Desenvolvimento Social</div>';
    h += '<div class="rel-tit">Relatório mensal de atividade</div>';
    h += '<div class="rel-eq">' + (tipo && tipo.emoji ? tipo.emoji + ' ' : '') + e(eq.nome) + '</div>';
    h += '<div class="rel-meta">' + e(tipo ? tipo.nome : '') + (eq.unidade ? ' · ' + e(eq.unidade) : '') + (resp ? ' · Responsável: ' + e(resp.nome) : '') + '</div>';
    h += '</div><div class="rel-chip">' + e(per.label) + '</div></div>';

    // indicadores (só os que fazem sentido para este equipamento)
    var k = [];
    k.push(_relKpi(nf(R.aflu), 'Afluência total', _relDelta(R.aflu, pd('aflu'))));
    if (mRes) { k.push(_relKpi(nf(R.res), 'Utilizações', _relDelta(R.res, pd('res')))); k.push(_relKpi(nf(R.resPes), 'Participantes', _relDelta(R.resPes, pd('resPes')))); }
    if (mVis) k.push(_relKpi(nf(R.visPes), 'Visitantes', _relDelta(R.visPes, pd('visPes'))));
    if (mEst) { k.push(_relKpi(nf(R.hosp), 'Hóspedes', _relDelta(R.hosp, pd('hosp')))); k.push(_relKpi(nf(R.dorm), 'Dormidas', _relDelta(R.dorm, pd('dorm')))); }
    k.push(_relKpi(R.memF + '<small>/' + R.memC + '</small>', 'Reparações concl./novas'));
    if (mChk) k.push(_relKpi(nf(R.chk), 'Verificações'));
    h += '<div class="rel-kpis" style="grid-template-columns:repeat(' + Math.min(k.length, 6) + ',1fr);">' + k.slice(0, 6).join('') + '</div>';

    h += '<div class="rel-sec">Síntese</div>';
    gerarTexto(R, P, eq.nome).split(/\n\s*\n/).forEach(function(p) { if (p.trim()) h += '<p class="rel-txt">' + e(p.trim()) + '</p>'; });

    // blocos que fazem sentido para este equipamento, dispostos dois a dois
    var B = [];
    var b;
    if (mRes) {
      b = '<div class="rel-sec">Utilização por entidade</div>';
      if (!R.entidadesL.length) b += '<div class="rel-vazio">Sem reservas confirmadas no mês.</div>';
      else {
        b += '<table class="rel-t"><thead><tr><th>Entidade</th><th class="n">Utiliz.</th><th class="n">Partic.</th></tr></thead><tbody>';
        R.entidadesL.slice(0, 8).forEach(function(x) { b += '<tr><td>' + e(x.nome) + '</td><td class="n">' + x.n + '</td><td class="n">' + x.p + '</td></tr>'; });
        if (R.entidadesL.length > 8) b += '<tr><td colspan="3" class="rel-mais">+ ' + (R.entidadesL.length - 8) + ' entidades</td></tr>';
        b += '</tbody></table>';
      }
      B.push(b);
    }
    var linhasC = [['Afluência total', 'aflu']];
    if (mRes) linhasC.push(['Utilizações', 'res'], ['Participantes', 'resPes']);
    if (mVis) linhasC.push(['Visitantes', 'visPes']);
    if (mEst) linhasC.push(['Hóspedes', 'hosp'], ['Dormidas', 'dorm']);
    linhasC.push(['Reparações novas', 'memC']);
    b = '<div class="rel-sec">Comparação com o mês anterior</div>';
    if (!P) b += '<div class="rel-vazio">' + (mes ? 'Sem mês anterior no ano de trabalho.' : 'Relatório anual.') + '</div>';
    else {
      b += '<table class="rel-t"><thead><tr><th>Indicador</th><th class="n">' + MESES_C[mes - 2] + '</th><th class="n">' + MESES_C[mes - 1] + '</th><th class="n">Var.</th></tr></thead><tbody>';
      linhasC.forEach(function(l) {
        var a = P[l[1]], c = R[l[1]];
        var v;
        if (!a) v = c ? 'novo' : '—';
        else if (a < 10) v = (c - a > 0 ? '+' : '') + (c - a);
        else { var pc = Math.round((c - a) / a * 100); v = (pc > 0 ? '+' : '') + pc + '%'; }
        b += '<tr><td>' + l[0] + '</td><td class="n">' + nf(a) + '</td><td class="n"><b>' + nf(c) + '</b></td><td class="n">' + v + '</td></tr>';
      });
      b += '</tbody></table>';
    }
    B.push(b);
    if (mEst) {
      b = '<div class="rel-sec">Proveniência dos hóspedes</div>';
      if (!R.paisesL.length) b += '<div class="rel-vazio">Sem estadias no mês.</div>';
      else {
        b += '<table class="rel-t"><thead><tr><th>País</th><th class="n">Estadias</th><th class="n">Hósp.</th><th class="n">Dorm.</th></tr></thead><tbody>';
        R.paisesL.slice(0, 8).forEach(function(x) { b += '<tr><td>' + e(x.nome) + '</td><td class="n">' + x.est + '</td><td class="n">' + x.hosp + '</td><td class="n">' + x.dorm + '</td></tr>'; });
        b += '<tr class="tot"><td>Total</td><td class="n">' + R.est + '</td><td class="n">' + R.hosp + '</td><td class="n">' + R.dorm + '</td></tr></tbody></table>';
      }
      B.push(b);
    }
    if (mVis) {
      b = '<div class="rel-sec">Visitantes por tipo</div>';
      if (!R.tiposVisL.length) b += '<div class="rel-vazio">Sem visitas registadas no mês.</div>';
      else {
        b += '<table class="rel-t"><thead><tr><th>Tipo</th><th class="n">Visitas</th><th class="n">Pessoas</th></tr></thead><tbody>';
        R.tiposVisL.forEach(function(x) { b += '<tr><td>' + e(_cap(TIPOS_VIS[x.tipo] || x.tipo)) + '</td><td class="n">' + x.n + '</td><td class="n">' + x.p + '</td></tr>'; });
        b += '<tr class="tot"><td>Total</td><td class="n">' + R.vis + '</td><td class="n">' + R.visPes + '</td></tr></tbody></table>';
      }
      B.push(b);
    }
    b = '<div class="rel-sec">Manutenção</div>';
    b += '<table class="rel-t"><tbody>';
    b += '<tr><td>Memorandos emitidos no mês</td><td class="n"><b>' + R.memC + '</b></td></tr>';
    b += '<tr><td>Concluídos no mês</td><td class="n"><b>' + R.memF + '</b></td></tr>';
    b += '<tr><td>Em curso no fim do mês</td><td class="n"><b>' + R.memAb + '</b></td></tr>';
    b += '</tbody></table>';
    B.push(b);
    B.push('<div class="rel-sec">Afluência ao longo de ' + ano + '</div>' + grafico(serieAnual(ano, '', eqId), mes));
    for (var bi = 0; bi < B.length; bi += 2) {
      h += '<div class="rel-cols"><div>' + B[bi] + '</div><div>' + (B[bi + 1] || '') + '</div></div>';
    }

    h += '<div class="rel-foot">GestDDS · Emitido em ' + p2(hoje.getDate()) + '/' + p2(hoje.getMonth() + 1) + '/' + hoje.getFullYear() +
         ' · Só contam reservas confirmadas; dormidas contadas no mês de cada noite.</div>';
    h += '</div>';
    return h;
  }

  function _imprimirHTML(html) {
    var root = document.getElementById('print-root');
    if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
    root.innerHTML = html;
    setTimeout(function() { window.print(); }, 50);
  }

  function imprimirEq(eqId) {
    if (_estado !== 'ok') { toast('Os dados ainda estão a carregar.', 'error'); return; }
    _imprimirHTML(folhaEq(eqId));
  }

  // todos os equipamentos com atividade no mês, uma página cada
  function imprimirTodos(soComAtividade) {
    if (_estado !== 'ok') { toast('Os dados ainda estão a carregar.', 'error'); return; }
    var per = periodo(_ano(), mesAtual());
    var R = calc(per, uniEfetiva());
    var lista = R.lista.filter(function(x) { return !soComAtividade || x.ativo; }).sort(function(a, b) { return compareEq(a.eq, b.eq); });
    if (!lista.length) { toast('Nenhum equipamento com atividade neste mês.', 'error'); return; }
    _imprimirHTML(lista.map(function(x) { return folhaEq(x.eq.id); }).join(''));
  }

  function copiarTextoEq(eqId) {
    var ano = _ano(), mes = mesAtual();
    var R = calc(periodo(ano, mes), '', eqId);
    var P = mes > 1 ? calc(periodo(ano, mes - 1), '', eqId) : null;
    var eq = getEq(eqId);
    var txt = gerarTexto(R, P, eq ? eq.nome : '');
    function ok() { toast('Texto copiado. Cole no relatório.', 'success'); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, function() { prompt('Copie o texto:', txt); });
    else prompt('Copie o texto:', txt);
  }

  function mesesBarra() {
    var mes = mesAtual(), ano = _ano();
    var h = '<div class="mn-meses">';
    for (var m = 1; m <= 12; m++) h += '<button class="rep-mes' + (mes === m ? ' active' : '') + '" onclick="Mensal.setMes(' + m + ')">' + MESES_C[m - 1] + '</button>';
    return h + '</div>';
  }

  // força nova leitura (ex.: depois de registar dados noutro módulo)
  function invalidar() { _estado = null; }

  function init() {}

  return {
    init: init, load: load, render: render, invalidar: invalidar,
    setMes: setMes, setUni: setUni, setVista: setVista,
    copiarTexto: copiarTexto, reporTexto: reporTexto,
    exportarCSV: exportarCSV, imprimir: imprimir,
    calc: calc, periodo: periodo, ocorrencias: ocorrencias,
    folhaEq: folhaEq, imprimirEq: imprimirEq, imprimirTodos: imprimirTodos,
    copiarTextoEq: copiarTextoEq, mesesBarra: mesesBarra, mesAtual: mesAtual,
    pronto: function() { return _estado === 'ok'; }
  };

})();

</script>
<script>
/* ═════ equipamento.js ═════ */
// ============================================================
// GestDDS — equipamento.js  v6.1
// Página de um equipamento: tudo o que lhe diz respeito num só
// sítio — resumo do dia, reservas, check-in, visitas, escala,
// checklists, reparações, equipa, informações e relatório A4.
// ============================================================

var Eq = (function() {

  // ── SEPARADORES DISPONÍVEIS PARA ESTE EQUIPAMENTO ─────────
  function tabs(eq) {
    if (!eq) return [];
    var t = [{ k: 'resumo', l: 'Resumo', ic: '🏠' }];
    if (modAtivo(eq, 'reservas') && APP.acessoMenu('reservas')) t.push({ k: 'reservas', l: 'Reservas', ic: '📅' });
    if (modAtivo(eq, 'estadias') && APP.podeVerEstadias(eq.id)) t.push({ k: 'estadias', l: 'Check-in / Check-out', ic: '⛺' });
    if (modAtivo(eq, 'visitas') && APP.podeVerVisitas(eq.id)) t.push({ k: 'visitas', l: 'Visitas', ic: '👥' });
    if (modAtivo(eq, 'escalas') && APP.acessoMenu('escalas')) t.push({ k: 'escalas', l: 'Escala', ic: '🗓' });
    if (modAtivo(eq, 'checklist') && APP.acessoMenu('checklists')) t.push({ k: 'checklist', l: 'Checklists', ic: '✅' });
    if (APP.podeCriarMemorandos()) t.push({ k: 'reparacoes', l: 'Reparações', ic: '🔧' });
    t.push({ k: 'equipa', l: 'Equipa', ic: '👤' });
    t.push({ k: 'info', l: 'Informações', ic: 'ℹ️' });
    if (APP.acessoMenu('relatorios')) t.push({ k: 'relatorio', l: 'Relatório mensal', ic: '📄' });
    return t;
  }

  // dados que cada separador precisa de ir buscar antes de desenhar
  var LOAD = {
    resumo:    function(eq, cb) { Mensal.load(cb); },
    reservas:  function(eq, cb) { Reservas.load(cb); },
    estadias:  function(eq, cb) { Estadias.load(eq.id, cb); },
    visitas:   function(eq, cb) { Visitas.load(eq.id, cb); },
    escalas:   function(eq, cb) { Escalas.load(cb); },
    checklist: function(eq, cb) { Checklist.load(cb); },
    equipa:    function(eq, cb) { Horas.load(cb); },
    relatorio: function(eq, cb) { Mensal.load(cb); }
  };

  // ── ABRIR UM EQUIPAMENTO (e opcionalmente um separador) ───
  function abrir(eqId, tab) {
    var eq = getEq(eqId);
    if (!eq || !APP.podeVerEquipamento(eqId)) { toast('Equipamento indisponível.', 'error'); return; }
    var lista = tabs(eq);
    var k = tab || (APP.spotEqId === eqId && APP.eqTab) || 'resumo';
    if (!lista.some(function(t) { return t.k === k; })) k = 'resumo';

    var mudouEq = APP.spotEqId !== eqId;
    APP.spotEqId = eqId;
    APP.eqTab = k;
    APP.view = 'eq';
    APP.subview = null;
    if (mudouEq) { APP.repMes = null; APP.estadiaTab = null; APP.estHistLista = false; }

    App.depoisDeNavegar();
    var c = document.getElementById('main-content');
    var loader = LOAD[k];
    if (loader) {
      c.innerHTML = _cabecalho(eq, lista, k) + loadingState();
      loader(eq, function() { if (APP.view === 'eq' && APP.spotEqId === eqId && APP.eqTab === k) App.renderContent(); });
    } else {
      App.renderContent();
    }
  }

  function tab(k) { abrir(APP.spotEqId, k); }

  // ── RENDER ────────────────────────────────────────────────
  function render() {
    var eq = getEq(APP.spotEqId);
    if (!eq) return emptyState('Sem equipamento', 'Escolha um equipamento no menu.');
    var lista = tabs(eq);
    var k = APP.eqTab || 'resumo';
    var corpo = '';
    switch (k) {
      case 'reservas':   corpo = Reservas.render(eq.id); break;
      case 'estadias':   corpo = Estadias.renderPainel(eq.id); break;
      case 'visitas':    corpo = Visitas.renderPainel(eq.id); break;
      case 'escalas':    corpo = Escalas.render(eq.id); break;
      case 'checklist':  corpo = Checklist.render(eq.id); break;
      case 'reparacoes': corpo = _reparacoes(eq); break;
      case 'equipa':     corpo = Equipamentos.painelResponsavel(eq) + '<div style="height:16px;"></div>' + Equipamentos.painelFuncionarios(eq); break;
      case 'info':       corpo = _info(eq); break;
      case 'relatorio':  corpo = _relatorio(eq); break;
      default:           corpo = _resumo(eq);
    }
    return _cabecalho(eq, lista, k) + '<div class="eqp-corpo">' + corpo + '</div>';
  }

  function _cabecalho(eq, lista, atual) {
    var tipo = getTipo(eq.tipo_id);
    var resp = eq.responsavel_id ? (APP.utilizadores || []).filter(function(u) { return u.id === eq.responsavel_id; })[0] : null;
    var h = '<div class="eqp-head">';
    h += '<div class="eqp-id"><span class="eqp-emoji">' + H(tipo && tipo.emoji ? tipo.emoji : '🏢') + '</span><div style="min-width:0;">';
    h += '<div class="eqp-nome">' + H(eq.nome) + '</div>';
    h += '<div class="eqp-meta">' + H(tipo ? tipo.nome : 'Equipamento') + (eq.unidade ? ' · ' + H(eq.unidade) : '') +
         (resp ? ' · Responsável: ' + H(resp.nome) : '') + '</div></div></div>';
    h += '<div class="eqp-estado">' + badgeEqEstado(eq.estado) + '</div>';
    h += '</div>';
    h += '<nav class="eqp-tabs" aria-label="Secções do equipamento">';
    lista.forEach(function(t) {
      h += '<button class="eqp-tab' + (t.k === atual ? ' on' : '') + '" onclick="Eq.tab(\'' + t.k + '\')"><span>' + t.ic + '</span>' + t.l + '</button>';
    });
    h += '</nav>';
    return h;
  }

  // ── RESUMO ────────────────────────────────────────────────
  function _hoje() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function _hora(iso) { var d = new Date(iso); return isNaN(d) ? '' : ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

  function _resumo(eq) {
    var hoje = _hoje();
    var h = '';

    // ações rápidas deste equipamento
    var a = [];
    function act(ic, t, js) { a.push('<button class="qa" onclick="' + js + '"><span class="qa-ic">' + ic + '</span><span class="qa-t">' + t + '</span></button>'); }
    if (modAtivo(eq, 'reservas') && APP.podeGerirReservas(eq.id)) act('📅', 'Nova reserva', "Eq.tab('reservas');setTimeout(function(){Reservas.openNova('" + eq.id + "','confirmada')},400)");
    if (modAtivo(eq, 'estadias') && APP.podeGerirEstadias(eq.id)) act('⛺', 'Check-in', "Estadias.openNovo('" + eq.id + "','checkin')");
    if (modAtivo(eq, 'visitas') && APP.podeGerirVisitas(eq.id)) act('👥', 'Registar visita', "Visitas.openNovo('" + eq.id + "')");
    if (modAtivo(eq, 'escalas') && APP.podeGerirEscalas(eq.id)) act('🗓', 'Novo turno', "Eq.tab('escalas');setTimeout(function(){Escalas.openNovo('" + eq.id + "')},400)");
    if (modAtivo(eq, 'checklist') && APP.acessoMenu('checklists')) act('✅', 'Preencher checklist', "Eq.tab('checklist');setTimeout(function(){Checklist.openNovoRegisto('" + eq.id + "')},400)");
    if (APP.podeCriarMemorandos()) act('🔧', 'Pedir reparação', 'Memorandos.openNovo()');
    if (a.length) h += '<div class="qa-grid qa-compacto">' + a.join('') + '</div>';

    // indicadores do mês corrente
    if (Mensal.pronto()) {
      var d = new Date();
      var R = Mensal.calc(Mensal.periodo(d.getFullYear(), d.getMonth() + 1), '', eq.id);
      var k = [];
      function kpi(v, l) { k.push('<div class="eqp-kpi"><div class="eqp-kpi-v">' + v + '</div><div class="eqp-kpi-l">' + l + '</div></div>'); }
      if (modAtivo(eq, 'reservas')) { kpi(R.res, 'utilizações este mês'); kpi(R.resPes, 'participantes'); }
      if (modAtivo(eq, 'visitas')) kpi(R.visPes, 'visitantes este mês');
      if (modAtivo(eq, 'estadias')) { kpi(R.hosp, 'hóspedes este mês'); kpi(R.dorm, 'dormidas'); }
      kpi(R.memAb, 'reparações em curso');
      h += '<div class="eqp-kpis">' + k.join('') + '</div>';
    }

    h += '<div class="eqp-grid">';

    // Hoje: reservas
    if (modAtivo(eq, 'reservas')) {
      var hj = { ini: hoje, fim: hoje };
      var rs = (APP.reservas || []).filter(function(r) {
        return r.equipamento_id === eq.id && r.estado !== 'cancelada' && Mensal.ocorrencias(r, hj) > 0;
      }).map(function(r) {
        var hi = r.recorrente ? String(r.hora_inicio || '').slice(0, 5) : _hora(r.data_inicio);
        var hf = r.recorrente ? String(r.hora_fim || '').slice(0, 5) : _hora(r.data_fim);
        return { r: r, hi: hi, hf: hf };
      }).sort(function(a, b) { return a.hi.localeCompare(b.hi); });
      h += '<section class="mn-bloco"><div class="mn-bloco-h"><div class="mn-bloco-t">Reservas de hoje</div>';
      h += '<button class="btn btn-ghost btn-sm" onclick="Eq.tab(\'reservas\')">Calendário →</button></div>';
      if (!rs.length) h += '<div class="mn-vazio">Sem reservas para hoje.</div>';
      else rs.forEach(function(x) {
        h += '<div class="eqp-li" onclick="Reservas.abrirDetalhe(\'' + x.r.id + '\')"><span class="eqp-li-h">' + H(x.hi) + (x.hf ? '–' + H(x.hf) : '') + '</span>';
        h += '<span class="eqp-li-t">' + H(x.r.titulo || '—') + (x.r.entidade ? '<small>' + H(x.r.entidade) + '</small>' : '') + '</span>';
        if (x.r.estado === 'pre_reserva') h += '<span class="bdg bdg-pendente">Pré-reserva</span>';
        h += '</div>';
      });
      h += '</section>';
    }

    // Ocupação (campismo)
    if (modAtivo(eq, 'estadias') && APP.podeVerEstadias(eq.id)) {
      h += '<section class="mn-bloco"><div class="mn-bloco-h"><div class="mn-bloco-t">Ocupação agora</div>';
      h += '<button class="btn btn-ghost btn-sm" onclick="Eq.tab(\'estadias\')">Check-in →</button></div>';
      h += '<div class="mn-mini" style="grid-template-columns:1fr 1fr;"><div><b id="eqp-ocup-l">…</b><span>lugares ocupados</span></div><div><b id="eqp-ocup-p">…</b><span>pessoas no parque</span></div></div>';
      h += '</section>';
      setTimeout(function() {
        Estadias.ocupacao(eq.id, function(err, o) {
          var l = document.getElementById('eqp-ocup-l'), p = document.getElementById('eqp-ocup-p');
          if (l) l.textContent = err ? '—' : o.lugares;
          if (p) p.textContent = err ? '—' : o.pessoas;
        });
      }, 0);
    }

    // De serviço hoje
    if (modAtivo(eq, 'escalas')) {
      var ts = (APP.escalas || []).filter(function(t) {
        var a1 = String(t.data_inicio).slice(0, 10), b1 = String(t.data_fim || t.data_inicio).slice(0, 10);
        return t.equipamento_id === eq.id && hoje >= a1 && hoje <= b1;
      });
      h += '<section class="mn-bloco"><div class="mn-bloco-h"><div class="mn-bloco-t">Quem está hoje</div>';
      h += '<button class="btn btn-ghost btn-sm" onclick="Eq.tab(\'escalas\')">Escala →</button></div>';
      if (!ts.length) h += '<div class="mn-vazio">Sem turnos marcados para hoje.</div>';
      else {
        var porF = {};
        ts.forEach(function(t) { (porF[t.funcionario_id] = porF[t.funcionario_id] || []).push(t); });
        Object.keys(porF).forEach(function(fid) {
          var u = (APP.utilizadores || []).filter(function(x) { return x.id === fid; })[0];
          var txt = porF[fid].map(function(t) {
            if (t.tipo_turno === 'ferias') return 'Férias';
            if (t.tipo_turno === 'folga') return 'Folga';
            return t.hora_entrada ? String(t.hora_entrada).slice(0, 5) + '–' + String(t.hora_saida || '').slice(0, 5) : (t.tipo_turno || 'Turno');
          }).join(' · ');
          h += '<div class="eqp-li"><span class="eqp-av">' + iniciais(u ? u.nome : '?') + '</span><span class="eqp-li-t">' + H(u ? u.nome : '—') + '</span><span class="eqp-li-h">' + H(txt) + '</span></div>';
        });
      }
      h += '</section>';
    }

    // Reparações em aberto
    if (APP.podeCriarMemorandos()) {
      var ms = (APP.memos || []).filter(function(m) { return m.equipamento_id === eq.id && m.estado !== 'concluido'; });
      h += '<section class="mn-bloco"><div class="mn-bloco-h"><div class="mn-bloco-t">Reparações em aberto</div>';
      h += '<button class="btn btn-ghost btn-sm" onclick="Eq.tab(\'reparacoes\')">Ver todas →</button></div>';
      if (!ms.length) h += '<div class="mn-vazio">Nenhuma reparação pendente. 👍</div>';
      else ms.slice(0, 5).forEach(function(m) {
        h += '<div class="eqp-li" onclick="Memorandos.ver(\'' + m.id + '\')"><span class="eqp-li-t"><span class="eqp-clamp" title="' + H(m.descricao || '') + '">' + H(m.descricao || '—') + '</span><small>' + H(m.numero || '') + ' · há ' + diasDesde(m.created_at) + ' dias</small></span>' + _badgeMemo(m) + '</div>';
      });
      h += '</section>';
    }

    // Checklists em atraso
    if (modAtivo(eq, 'checklist') && APP.acessoMenu('checklists')) {
      var tpl = (APP.checklist_templates || []).filter(function(t) { return t.equipamento_id === eq.id && t.ativo; });
      var atraso = tpl.filter(function(t) {
        var regs = (APP.checklist_registos || []).filter(function(r) { return r.template_id === t.id; })
          .sort(function(a, b) { return new Date(b.data_registo) - new Date(a.data_registo); });
        var dd = regs[0] ? diasDesde(regs[0].data_registo) : 999;
        var lim = t.periodicidade === 'diaria' ? 1 : t.periodicidade === 'semanal' ? 7 : 30;
        return dd >= lim;
      });
      h += '<section class="mn-bloco"><div class="mn-bloco-h"><div class="mn-bloco-t">Checklists por fazer</div>';
      h += '<button class="btn btn-ghost btn-sm" onclick="Eq.tab(\'checklist\')">Checklists →</button></div>';
      if (!tpl.length) h += '<div class="mn-vazio">Ainda não há checklists definidas.</div>';
      else if (!atraso.length) h += '<div class="mn-vazio">Tudo em dia. ✓</div>';
      else atraso.forEach(function(t) {
        h += '<div class="eqp-li" onclick="Checklist.openNovoRegistoTemplate(\'' + eq.id + '\',\'' + t.id + '\')"><span class="eqp-li-t">' + H(t.nome) + '<small>' + ({ diaria: 'Diária', semanal: 'Semanal', mensal: 'Mensal' }[t.periodicidade] || '') + '</small></span><span class="btn btn-primary btn-sm">Preencher</span></div>';
      });
      h += '</section>';
    }

    h += '</div>';
    return h;
  }

  function _badgeMemo(m) {
    if (m.estado === 'concluido') return '<span class="bdg bdg-concluido"><span class="bdg-dot"></span>Concluído</span>';
    if (m.data_envio_servicos) return '<span class="bdg bdg-andamento"><span class="bdg-dot"></span>Em curso</span>';
    if (m.aprovado_dds) return '<span class="bdg bdg-enviado"><span class="bdg-dot"></span>A enviar</span>';
    return '<span class="bdg bdg-pendente"><span class="bdg-dot"></span>Pendente</span>';
  }

  // ── REPARAÇÕES ────────────────────────────────────────────
  function _reparacoes(eq) {
    var todos = (APP.memos || []).filter(function(m) { return m.equipamento_id === eq.id; })
      .sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    var abertos = todos.filter(function(m) { return m.estado !== 'concluido'; });
    var concl = todos.filter(function(m) { return m.estado === 'concluido'; });

    var h = '<div class="eq-toolbar"><div class="eq-toolbar-t">' + abertos.length + ' em aberto · ' + concl.length + ' concluídas este ano</div>';
    h += '<div><button class="btn btn-secondary btn-sm" onclick="Memorandos.verifEq(\'' + eq.id + '\')">🖨 Folha de verificação</button>';
    h += '<button class="btn btn-primary btn-sm" onclick="Memorandos.openNovo()">+ Pedir reparação</button></div></div>';

    function tabela(lista, vazio) {
      if (!lista.length) return '<div class="mn-vazio">' + vazio + '</div>';
      var t = '<div class="dtw"><table class="dt"><thead><tr><th>Nº</th><th>Assunto</th><th>Pedido em</th><th>Estado</th><th></th></tr></thead><tbody>';
      lista.forEach(function(m) {
        var euCriei = APP.user && m.criado_por === APP.user.id;
        var acts = '';
        if (APP.isDds() && !m.aprovado_dds && m.estado !== 'concluido') acts += '<button class="btn btn-primary btn-sm" onclick="Memorandos.aprovar(\'' + m.id + '\')">Aprovar</button>';
        if (m.estado !== 'concluido' && m.data_envio_servicos && (euCriei || APP.isAdmin())) acts += '<button class="btn btn-success btn-sm" onclick="Memorandos.openConcluir(\'' + m.id + '\')">Concluir</button>';
        if (m.estado !== 'concluido' && m.data_envio_servicos && diasDesde(m.data_envio_servicos) >= 15) acts += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Memorandos.openReforco(\'' + m.id + '\')">Reforço</button>';
        t += '<tr class="memo-row" onclick="Memorandos.ver(\'' + m.id + '\')"><td class="td-mono">' + H(m.numero || '—') + '</td><td class="td-p"><span class="eqp-clamp" title="' + H(m.descricao || '') + '">' + H(m.descricao || '—') + '</span></td>';
        t += '<td class="td-m">' + fData(m.data || m.created_at) + '</td><td>' + _badgeMemo(m) + (m.num_reforcos ? ' <span class="bdg bdg-reforco">' + m.num_reforcos + '× reforço</span>' : '') + '</td>';
        t += '<td onclick="event.stopPropagation()"><div class="td-act">' + acts + '</div></td></tr>';
      });
      return t + '</tbody></table></div>';
    }
    h += '<section class="mn-bloco"><div class="mn-bloco-h"><div class="mn-bloco-t">Em aberto</div></div>' + tabela(abertos, 'Nenhuma reparação pendente.') + '</section>';
    h += '<section class="mn-bloco"><div class="mn-bloco-h"><div class="mn-bloco-t">Concluídas</div></div>' + tabela(concl.slice(0, 20), 'Ainda nenhuma reparação concluída este ano.') + '</section>';
    return h;
  }

  // ── INFORMAÇÕES ───────────────────────────────────────────
  function _info(eq) {
    var tipo = getTipo(eq.tipo_id);
    var h = '<div class="eq-toolbar"><div class="eq-toolbar-t">Ficha do equipamento</div>';
    if (APP.isAdmin()) h += '<button class="btn btn-secondary btn-sm" onclick="Equipamentos.openEditar(\'' + eq.id + '\')">✎ Editar ficha e módulos</button>';
    h += '</div>';
    function linha(l, v) { return '<div class="detail-row"><span class="detail-lbl">' + l + '</span><span class="detail-val">' + v + '</span></div>'; }
    h += '<section class="mn-bloco"><div class="detail-box">';
    h += linha('Tipo', H(tipo ? tipo.nome : '—'));
    h += linha('Unidade', H(eq.unidade || '—'));
    h += linha('Código', H(eq.codigo || '—'));
    h += linha('Morada', H([eq.morada, eq.localidade].filter(Boolean).join(', ') || '—'));
    h += linha('Telefone', eq.telefone ? '<a href="tel:' + H(eq.telefone) + '">' + H(eq.telefone) + '</a>' : '—');
    h += linha('Capacidade', eq.capacidade ? eq.capacidade + ' pessoas' : '—');
    h += linha('Estado', badgeEqEstado(eq.estado));
    if (eq.descricao) h += linha('Notas', H(eq.descricao));
    var mods = MOD_DEFS.filter(function(m) { return modAtivo(eq, m.k); }).map(function(m) { return '<span class="chip-mod">' + m.l + '</span>'; }).join('');
    h += linha('Módulos ativos', mods || '—');
    h += '</div></section>';

    var esp = (APP.espacos || []).filter(function(x) { return x.equipamento_id === eq.id; })
      .sort(function(a, b) { return (a.ordem || 0) - (b.ordem || 0); });
    h += '<section class="mn-bloco"><div class="mn-bloco-h"><div><div class="mn-bloco-t">Espaços reserváveis</div><div class="mn-bloco-s">Aparecem no formulário de reserva.</div></div>';
    if (APP.isAdmin()) h += '<button class="btn btn-secondary btn-sm" onclick="Equipamentos.gerirEspacos(\'' + eq.id + '\')">⚙ Gerir espaços</button>';
    h += '</div>';
    if (!esp.length) h += '<div class="mn-vazio">Sem espaços definidos.</div>';
    else h += '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + esp.map(function(x) { return '<span class="chip-mod" style="font-size:12.5px;padding:5px 11px;">' + H(x.nome) + '</span>'; }).join('') + '</div>';
    h += '</section>';
    return h;
  }

  // ── RELATÓRIO A4 ──────────────────────────────────────────
  function _relatorio(eq) {
    if (!Mensal.pronto()) return loadingState();
    var h = '<div class="eq-toolbar"><div>' + Mensal.mesesBarra() + '</div>';
    h += '<div class="mn-actions"><button class="btn btn-secondary btn-sm" onclick="Mensal.copiarTextoEq(\'' + eq.id + '\')">📋 Copiar texto</button>';
    h += '<button class="btn btn-primary btn-sm" onclick="Mensal.imprimirEq(\'' + eq.id + '\')">🖨 Imprimir / PDF</button></div></div>';
    h += '<div class="rel-wrap">' + Mensal.folhaEq(eq.id) + '</div>';
    return h;
  }

  function init() {}

  return { init: init, abrir: abrir, tab: tab, render: render, tabs: tabs };
})();

</script>
<script>
/* ═════ app.js ═════ */
// ============================================================
// GestDDS — app.js  v6.2
// Orquestrador: login, navegação, barra lateral, pesquisa
// ============================================================
var App = (function() {

  // ── TÍTULOS DAS PÁGINAS (barra superior) ──────────────────
  var TITULOS = {
    dashboard:    ['GestorDDS', 'Início'],
    ferias:       ['Pessoal', 'Férias'],
    horas:        ['Pessoal', 'Banco de horas'],
    funcionarios: ['Pessoal', 'Funcionários'],
    memorandos:   ['Manutenção', 'Memorandos'],
    relatorios:   ['Relatórios', 'Relatórios mensais'],
    outros:       ['Relatórios', 'Outros relatórios e impressões'],
    utilizadores: ['Administração', 'Utilizadores e acessos'],
    brigadas:     ['Manutenção', 'Brigadas e serviços']
  };
  var SUB_MEMO = { sec1: 'Recebidos', sec2: 'Os meus', sec3: 'A enviar', sec4: 'Em curso', sec5: 'Arquivo', verif: 'Folha de verificação' };

  function _atualizarTitulo() {
    var t = TITULOS[APP.view] || ['', ''];
    var a = t[0], b = t[1];
    if (APP.view === 'equipamentos') {
      a = 'Administração';
      b = APP.subview === 'tipos' ? 'Tipos de equipamento' : 'Lista de equipamentos';
    }
    if (APP.view === 'eq') {
      var e = getEq(APP.spotEqId);
      var tb = e && typeof Eq !== 'undefined' ? Eq.tabs(e).filter(function(x) { return x.k === APP.eqTab; })[0] : null;
      a = e ? e.nome : 'Equipamento';
      b = tb ? tb.l : 'Resumo';
    }
    if (APP.view === 'memorandos' && SUB_MEMO[APP.subview]) b = 'Memorandos · ' + SUB_MEMO[APP.subview];
    var ea = document.getElementById('tb-titulo-a'), eb = document.getElementById('tb-titulo-b');
    if (ea) ea.textContent = a;
    if (eb) eb.textContent = b;
    document.title = (APP.view === 'eq' ? b + ' · ' + a : b) + ' · GestorDDS';
  }

  // ── LOGIN ──────────────────────────────────────────────────
  function login() {
    var codigo = document.getElementById('l-codigo').value.trim().toUpperCase();
    var err = document.getElementById('l-err');
    if (!codigo) { err.textContent = 'Introduza o seu código.'; err.style.display = 'block'; return; }
    err.style.display = 'none';

    sbGet('utilizadores', 'codigo=eq.' + encodeURIComponent(codigo) + '&limit=1').then(function(rows) {
      if (!Array.isArray(rows) || !rows.length) {
        err.textContent = 'Código inválido. Tente novamente.';
        err.style.display = 'block';
        return;
      }
      if (rows[0].tem_acesso === false) { err.textContent = 'Este código não tem acesso à aplicação.'; err.style.display = 'block'; return; }
      if (rows[0].ativo === false) { err.textContent = 'Esta conta está inativa.'; err.style.display = 'block'; return; }
      APP.user = rows[0];
      try { _boot(); } catch (e) {
        console.error('Erro no arranque:', e);
        err.textContent = 'Erro ao iniciar: ' + (e && e.message ? e.message : e);
        err.style.display = 'block';
      }
    }).catch(function(e) {
      console.error('Erro no login:', e);
      err.textContent = 'Erro ao ligar ao servidor. Tente novamente.';
      err.style.display = 'block';
    });
  }

  function _carregarTemaInicial() {
    var tema = 'light';
    try { tema = localStorage.getItem('gestdds-tema') || ((window.name || '').indexOf('gestdds-tema:dark') >= 0 ? 'dark' : 'light'); } catch (e) {}
    _aplicarTema(tema);
  }

  function _boot() {
    _carregarTemaInicial();
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    ['Dashboard','Memorandos','Equipamentos','Utilizadores','Funcionarios','Avisos','Reservas',
     'Escalas','Checklist','Relatorios','Ferias','Horas','Estadias','Visitas','Mensal','Eq'].forEach(function(n) {
      try { var m = window[n]; if (m && m.init) m.init(); else if (!m) console.warn('Módulo não carregado:', n); }
      catch (e) { console.error('Erro init ' + n + ':', e); }
    });

    APP.view = 'dashboard';
    loadAll(function(err) {
      try { _updateUserUI(); } catch (e) { console.error(e); }
      try { buildSidebar(); } catch (e) { console.error(e); }
      try { renderContent(); } catch (e) { console.error(e); }
      try { _updateBadges(); } catch (e) { console.error(e); }
      // Banco de horas e férias em segundo plano — alimentam os pendentes
      var faltam = 2;
      function fim() {
        if (--faltam > 0) return;
        _updateBadges();
        try { buildSidebar(); } catch (e) {}
        if (APP.view === 'dashboard') renderContent();
      }
      try { Horas.load(fim); } catch (e) { fim(); }
      try { Ferias.load(fim); } catch (e) { fim(); }
      try { Brigadas.load(); } catch (e) {}
      if (err) toast('Aviso: alguns dados podem não ter carregado.', 'error');
    });
  }

  function logout() {
    APP.user = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-wrap').style.display = 'flex';
    var lc = document.getElementById('l-codigo'); if (lc) lc.value = '';
    var m = document.getElementById('tb-menu'); if (m) m.classList.remove('open');
  }

  function toggleTema() {
    var novo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    _aplicarTema(novo);
    try { localStorage.setItem('gestdds-tema', novo); } catch (e) {}
    try { window.name = 'gestdds-tema:' + novo; } catch (e) {}
  }

  function _aplicarTema(tema) {
    if (tema === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    var escuro = tema === 'dark';
    var ic = document.getElementById('tema-ic-tb'), lb = document.getElementById('tema-lbl-tb');
    if (ic) ic.textContent = escuro ? '☀️' : '🌙';
    if (lb) lb.textContent = escuro ? 'Modo claro' : 'Modo escuro';
  }

  function _updateUserUI() {
    var u = APP.user; if (!u) return;
    var nome = u.nome || u.username || 'Utilizador';
    var pal = PERFIL_PALETTES[u.perfil] || ['#DBEAFE','#1D4ED8'];
    var av = document.getElementById('tb-av');
    if (av) { av.textContent = iniciais(nome); av.style.background = pal[0]; av.style.color = pal[1]; }
    var n = document.getElementById('tb-menu-nome'); if (n) n.textContent = nome;
    var p = document.getElementById('tb-menu-perfil'); if (p) p.textContent = APP.perfilLabel();
  }

  // ── BARRA LATERAL ─────────────────────────────────────────
  var IC = {
    inicio:  '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
    cal:     '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
    escala:  '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="10" x2="9" y2="22"/><line x1="15" y1="10" x2="15" y2="22"/>',
    check:   '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>',
    ferias:  '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    horas:   '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    pessoas: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>',
    memo:    '<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>',
    mensal:  '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>',
    graf:    '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
    chave:   '<circle cx="8" cy="15" r="4"/><path d="M10.85 12.15L19 4M18 5l2 2M15 8l2 2"/>',
    arr:     '<polyline points="6 9 12 15 18 9"/>'
  };

  function _item(id, onclick, icon, label, extra, cls) {
    return '<div class="sbi' + (cls ? ' ' + cls : '') + '" id="' + id + '" onclick="' + onclick + '"><svg viewBox="0 0 24 24">' + IC[icon] +
           '</svg><span class="sbi-lbl">' + label + '</span>' + (extra || '') + '</div>';
  }
  function _cnt(n, warn) { return n ? '<span class="sb-cnt' + (warn ? ' warn' : '') + '">' + n + '</span>' : ''; }

  var _sbAbertos = {};
  var _ultChaveSb = '';
  function sbGrupo(k) {
    var el = document.querySelector('.sb-eqg[onclick*="\'' + k + '\'"]');
    _sbAbertos[k] = !(el && el.classList.contains('open'));
    buildSidebar();
  }
  function _memosAbertos(eqId) {
    return (APP.memos || []).filter(function(m) { return m.equipamento_id === eqId && m.estado !== 'concluido'; }).length;
  }
  function _plural(w) {
    if (/[sx]$/i.test(w)) return w;                       // já no plural (Edifícios, Complexos)
    if (/ão$/i.test(w)) return w.replace(/ão$/i, 'ões');  // Pavilhão → Pavilhões
    if (/m$/i.test(w)) return w.replace(/m$/i, 'ns');     // Armazém → Armazéns
    if (/[aeiouáéíóúâêôãõ]$/i.test(w)) return w + 's';    // Piscina → Piscinas
    if (/l$/i.test(w)) return w.replace(/l$/i, 'is');     // Centro... / Canal → Canais
    return w + 'es';                                      // Bar → Bares
  }
  // Agrupa pela 1.ª palavra do tipo (ex.: "Piscina Coberta" + "Piscina Descoberta" → "Piscinas")
  function _gruposEq(eqs) {
    var g = {};
    eqs.forEach(function(e) {
      var t = getTipo(e.tipo_id);
      var nomeT = (t && t.nome) || 'Outros';
      var w = nomeT.split(/\s+/)[0];
      var k = w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
      if (!g[k]) g[k] = { k: k, w: w, tipos: {}, ic: (t && t.emoji) || '🏢', eqs: [] };
      g[k].tipos[nomeT] = 1;
      g[k].eqs.push(e);
    });
    return Object.keys(g).map(function(k) {
      var x = g[k];
      x.l = x.k === 'outros' ? 'Outros' : _plural(x.w);
      x.pref = x.w;
      x.eqs.sort(compareEq);
      return x;
    }).sort(function(a, b) {
      // o grupo fica na posição do seu primeiro equipamento
      return compareEq(a.eqs[0], b.eqs[0]);
    });
  }
  // Dentro de um grupo "Piscinas", "Piscina Coberta de Refojos" mostra-se como "Coberta de Refojos"
  function _itemEq(e, pref) {
    var tipo = getTipo(e.tipo_id);
    var nome = String(e.nome);
    if (pref) {
      var re = new RegExp('^' + pref.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s+', 'i');
      if (re.test(nome)) { nome = nome.replace(re, ''); nome = nome.charAt(0).toUpperCase() + nome.slice(1); }
    }
    var ativo = APP.view === 'eq' && APP.spotEqId === e.id;
    var n = APP.podeCriarMemorandos() ? _memosAbertos(e.id) : 0;
    var h = '<div class="sb-eq' + (ativo ? ' on' : '') + (pref ? ' sub' : '') + '" data-eqid="' + e.id + '" onclick="Eq.abrir(\'' + e.id + '\',\'resumo\')" title="' + H(e.nome) + (n ? ' · ' + n + (n === 1 ? ' reparação em aberto' : ' reparações em aberto') : '') + '">';
    if (!pref) h += '<span class="sb-eq-ic">' + H(tipo && tipo.emoji ? tipo.emoji : '🏢') + '</span>';
    h += '<span class="sb-eq-nm">' + H(nome) + '</span>' + _cnt(n) + '</div>';
    return h;
  }

  function buildSidebar() {
    var isAdmin = APP.isAdmin();
    var html = '';

    html += _item('sbn-dashboard', "App.nav('dashboard')", 'inicio', 'Início');

    // ── Equipamentos: agrupados por tipo; só o grupo do equipamento aberto fica expandido ──
    var eqs = (APP.equipamentos || []).filter(function(e) { return APP.podeVerEquipamento(e.id); });
    if (eqs.length) {
      html += '<div class="sb-group">Equipamentos</div>';
      _gruposEq(eqs).forEach(function(g) {
        if (g.eqs.length === 1) { html += _itemEq(g.eqs[0], ''); return; }
        var temAtivo = APP.view === 'eq' && g.eqs.some(function(e) { return e.id === APP.spotEqId; });
        var aberto = _sbAbertos.hasOwnProperty(g.k) ? _sbAbertos[g.k] : temAtivo;
        if (temAtivo && APP._ultimoEqSb !== APP.spotEqId) aberto = _sbAbertos[g.k] = true;
        var nMemo = 0;
        if (APP.podeCriarMemorandos()) g.eqs.forEach(function(e) { nMemo += _memosAbertos(e.id); });
        html += '<div class="sb-eqg' + (aberto ? ' open' : '') + (temAtivo ? ' tem-on' : '') + '" onclick="App.sbGrupo(\'' + g.k + '\')">';
        html += '<span class="sb-eq-ic">' + H(g.ic) + '</span><span class="sb-eq-nm">' + H(g.l) + ' <small>' + g.eqs.length + '</small></span>';
        if (!aberto) html += _cnt(nMemo);
        html += '<svg class="sb-eqg-arr" viewBox="0 0 24 24">' + IC.arr + '</svg></div>';
        if (aberto) {
          html += '<div class="sb-eqg-l">';
          g.eqs.forEach(function(e) { html += _itemEq(e, g.pref); });
          html += '</div>';
        }
      });
      APP._ultimoEqSb = APP.view === 'eq' ? APP.spotEqId : null;
    }

    // ── Relatórios ──
    if (APP.acessoMenu('relatorios')) {
      html += '<div class="sb-group">Relatórios</div>';
      html += _item('sbn-relatorios', "App.nav('relatorios')", 'mensal', 'Relatórios mensais (A4)', '', 'sbi-destaque');
      html += _item('sbn-outros', "App.nav('outros')", 'graf', 'Outros relatórios');
    }

    // ── Pessoal ──
    var pe = '';
    if (APP.acessoMenu('ferias')) pe += _item('sbn-ferias', "App.nav('ferias')", 'ferias', 'Férias', '<span class="sb-cnt warn" id="sb-badge-ferias" style="display:none;"></span>');
    if (APP.acessoMenu('horas')) pe += _item('sbn-horas', "App.nav('horas')", 'horas', 'Banco de horas', '<span class="sb-cnt warn" id="sb-badge-horas" style="display:none;"></span>');
    if (APP.acessoMenu('funcionarios')) pe += _item('sbn-funcionarios', "App.nav('funcionarios')", 'pessoas', 'Funcionários');
    if (pe) html += '<div class="sb-group">Pessoal</div>' + pe;

    // ── Manutenção ──
    if (APP.podeCriarMemorandos()) {
      var b = (typeof Memorandos !== 'undefined' && Memorandos.getBadges) ? Memorandos.getBadges() : {};
      var aberto = APP.view === 'memorandos' || APP.view === 'brigadas';
      html += '<div class="sb-group">Manutenção</div>';
      html += '<div class="sbi' + (aberto ? ' grp-open' : '') + '" id="sbn-memo-p" onclick="_tGrp(\'sbs-memo\',\'sbn-memo-p\',\'sba-memo\')"><svg viewBox="0 0 24 24">' + IC.memo + '</svg><span class="sbi-lbl">Memorandos</span>';
      var tot = APP.isDds() ? (b.sec1 || 0) : 0;
      html += _cnt(tot, true) + '<svg class="sbi-arr' + (aberto ? ' grp-open' : '') + '" id="sba-memo" viewBox="0 0 24 24">' + IC.arr + '</svg></div>';
      html += '<div class="sb-sub' + (aberto ? ' open' : '') + '" id="sbs-memo">';
      if (APP.isDds()) html += '<div class="sb-eq-item" id="sbn-sec1" onclick="App.nav(\'memorandos\',\'sec1\')">Recebidos' + _cnt(b.sec1, true) + '</div>';
      html += '<div class="sb-eq-item" id="sbn-sec2" onclick="App.nav(\'memorandos\',\'sec2\')">Os meus' + _cnt(b.sec2) + '</div>';
      if (APP.isDds()) {
        html += '<div class="sb-eq-item" id="sbn-sec3" onclick="App.nav(\'memorandos\',\'sec3\')">A enviar' + _cnt(b.sec3) + '</div>';
        html += '<div class="sb-eq-item" id="sbn-sec4" onclick="App.nav(\'memorandos\',\'sec4\')">Em curso' + _cnt(b.sec4) + '</div>';
      }
      html += '<div class="sb-eq-item" id="sbn-sec5" onclick="App.nav(\'memorandos\',\'sec5\')">Arquivo</div>';
      html += '<div class="sb-eq-item" id="sbn-verif" onclick="App.nav(\'memorandos\',\'verif\')">🖨 Folha de verificação</div>';
      if (APP.isDds()) html += '<div class="sb-eq-item" id="sbn-brigadas" onclick="App.nav(\'brigadas\')">⚙ Brigadas</div>';
      html += '</div>';
    }

    // ── Administração ──
    var ad = '';
    if (APP.podeGerirUtilizadores()) ad += _item('sbn-utilizadores', "App.nav('utilizadores')", 'chave', 'Utilizadores e acessos');
    if (APP.isDds()) ad += _item('sbn-eq-lista', "App.nav('equipamentos','lista')", 'inicio', 'Lista de equipamentos');
    if (isAdmin) ad += _item('sbn-eq-tipos', "App.nav('equipamentos','tipos')", 'check', 'Tipos de equipamento');
    if (ad) html += '<div class="sb-group">Administração</div>' + ad;

    document.getElementById('sb-nav').innerHTML = html;
    _updateNavActive();
    _updateBadges();
  }

  // ── NAVEGAÇÃO ──────────────────────────────────────────────
  // Menus antigos que agora vivem dentro de cada equipamento
  var DENTRO_EQ = { reservas: 'reservas', escalas: 'escalas', checklists: 'checklist' };

  function nav(module, subview) {
    if (module === 'mensal') module = 'relatorios';
    if (module === 'equipamentos' && subview === 'ficha') { Eq.abrir(APP.spotEqId, 'resumo'); return; }
    if (DENTRO_EQ[module]) {
      var modK = DENTRO_EQ[module] === 'checklist' ? 'checklist' : DENTRO_EQ[module];
      var cur = getEq(APP.spotEqId);
      var eqId = (cur && modAtivo(cur, modK) && APP.podeVerEquipamento(cur.id)) ? cur.id : APP.eqParaModulo(modK);
      if (!eqId) { toast('Nenhum dos seus equipamentos tem este módulo.', 'error'); return; }
      Eq.abrir(eqId, DENTRO_EQ[module]);
      return;
    }
    if (module === 'brigadas' && !APP.isDds()) { toast('Sem permissão.', 'error'); return; }
    if (module === 'utilizadores' && !APP.podeGerirUtilizadores()) { toast('Sem permissão para aceder a Utilizadores.', 'error'); return; }
    var guard = { memorandos: 1, ferias: 1, horas: 1, relatorios: 1, outros: 1, funcionarios: 1 };
    var chave = module === 'outros' ? 'relatorios' : module;
    if (guard[module] && !APP.acessoMenu(chave)) { toast('Sem permissão para aceder a este menu.', 'error'); return; }

    APP.view = module;
    APP.subview = subview || null;
    depoisDeNavegar();

    var loaders = {
      ferias:     function(cb) { Ferias.load(cb); },
      horas:      function(cb) { Horas.load(cb); },
      relatorios: function(cb) { Mensal.invalidar(); Mensal.load(cb); }
    };
    if (loaders[module]) {
      document.getElementById('main-content').innerHTML = loadingState();
      loaders[module](function() { if (APP.view === module) renderContent(); });
      return;
    }
    renderContent();
  }

  // Comum a qualquer mudança de página (inclui as páginas de equipamento)
  function depoisDeNavegar() {
    var chaveSb = APP.view + '|' + (APP.view === 'eq' ? APP.spotEqId : '');
    if (chaveSb !== _ultChaveSb) { _sbAbertos = {}; _ultChaveSb = chaveSb; }
    try { buildSidebar(); } catch (e) { console.error(e); }
    _atualizarTitulo();
    window.scrollTo(0, 0);
    var tm = document.getElementById('tb-menu'); if (tm) tm.classList.remove('open');
    if (window.innerWidth <= 768) {
      var sb = document.getElementById('sidebar'), ov = document.getElementById('sb-overlay');
      if (sb) sb.classList.remove('open');
      if (ov) ov.classList.remove('open');
    }
  }

  function _updateNavActive() {
    document.querySelectorAll('.sbi, .sb-eq-item').forEach(function(el) { el.classList.remove('active'); });
    var map = { dashboard: 'sbn-dashboard', relatorios: 'sbn-relatorios', outros: 'sbn-outros', ferias: 'sbn-ferias', horas: 'sbn-horas',
                utilizadores: 'sbn-utilizadores', brigadas: 'sbn-brigadas', funcionarios: 'sbn-funcionarios' };
    var el = map[APP.view] && document.getElementById(map[APP.view]);
    if (el) el.classList.add('active');
    if (APP.view === 'memorandos' && APP.subview) {
      var m = document.getElementById('sbn-' + APP.subview); if (m) m.classList.add('active');
    }
    if (APP.view === 'equipamentos') {
      var e3 = document.getElementById(APP.subview === 'tipos' ? 'sbn-eq-tipos' : 'sbn-eq-lista');
      if (e3) e3.classList.add('active');
    }
  }

  function renderContent() {
    var c = document.getElementById('main-content');
    if (!c) return;
    _atualizarTitulo();
    var html = '';
    try {
      switch (APP.view) {
        case 'dashboard':    html = Dashboard.render(); break;
        case 'memorandos':   html = Memorandos.render(APP.subview); break;
        case 'equipamentos': html = Equipamentos.render(APP.subview); break;
        case 'utilizadores': html = Utilizadores.render(APP.subview); break;
        case 'brigadas':     html = Brigadas.render(); break;
        case 'funcionarios': html = Funcionarios.render(APP.subview); break;
        case 'eq':           html = Eq.render(); break;
        case 'relatorios':   html = Mensal.render(); break;
        case 'outros':       html = Relatorios.render(); break;
        case 'ferias':       html = Ferias.render(); break;
        case 'horas':        html = Horas.render(); break;
        default:             html = loadingState();
      }
    } catch (err) {
      console.error('Erro ao renderizar "' + APP.view + '":', err);
      html = '<div class="card" style="border-left:3px solid var(--red);">' +
             '<div class="sec-title" style="color:var(--red);">Erro ao abrir esta página</div>' +
             '<p style="font-size:13.5px;color:var(--text-2);margin:8px 0;">' + H(err && err.message ? err.message : 'Erro desconhecido') + '</p>' +
             '<button class="btn btn-primary btn-sm" onclick="location.reload()">Recarregar</button></div>';
    }
    c.innerHTML = html;
  }

  function _updateBadges() {
    if (typeof Memorandos !== 'undefined' && Memorandos.getBadges) {
      var b = Memorandos.getBadges();
      ['sec1','sec2','sec3','sec4'].forEach(function(k) {
        var el = document.querySelector('#sbn-' + k + ' .sb-cnt');
        if (el) el.textContent = b[k];
      });
    }
    var nH = (typeof Horas !== 'undefined' && Horas.pendentesParaMim) ? Horas.pendentesParaMim() : 0;
    var bh = document.getElementById('sb-badge-horas');
    if (bh) { bh.textContent = nH; bh.style.display = nH > 0 ? 'inline-block' : 'none'; }
    var nF = (typeof Ferias !== 'undefined' && Ferias.pendentesParaMim) ? Ferias.pendentesParaMim() : 0;
    var bf = document.getElementById('sb-badge-ferias');
    if (bf) { bf.textContent = nF; bf.style.display = nF > 0 ? 'inline-block' : 'none'; }
  }

  function toggleSidebar() {
    var sb = document.getElementById('sidebar'), ma = document.getElementById('main-area');
    if (window.innerWidth <= 768) {
      sb.classList.toggle('open');
      var ov = document.getElementById('sb-overlay');
      if (!ov) {
        ov = document.createElement('div');
        ov.id = 'sb-overlay';
        ov.onclick = function() { toggleSidebar(); };
        document.body.appendChild(ov);
      }
      ov.classList.toggle('open', sb.classList.contains('open'));
    } else {
      sb.classList.toggle('hidden');
      ma.classList.toggle('full');
    }
  }

  function mudarAno(ano) {
    document.getElementById('main-content').innerHTML = loadingState();
    mudarAnoTrabalho(ano);
  }

  // ── PESQUISA ──────────────────────────────────────────────
  function pesquisar(termo) {
    var res = document.getElementById('search-results');
    if (!res) return;
    termo = (termo || '').trim().toLowerCase();
    if (termo.length < 2) { res.classList.remove('open'); res.innerHTML = ''; return; }
    var norm = function(s) { return String(s || '').toLowerCase(); };
    var html = '';

    var eqs = (APP.equipamentos || []).filter(function(e) {
      return APP.podeVerEquipamento(e.id) && (norm(e.nome).indexOf(termo) >= 0 || norm(e.codigo).indexOf(termo) >= 0);
    }).slice(0, 5);
    if (eqs.length) {
      html += '<div class="sr-group">Equipamentos</div>';
      eqs.forEach(function(e) {
        var t = getTipo(e.tipo_id);
        html += '<div class="sr-item" onclick="App.abrirResultado(\'eq\',\'' + e.id + '\')"><div class="sr-item-ic">' + (t && t.emoji ? t.emoji : '🏢') + '</div>';
        html += '<div class="sr-item-txt"><div class="sr-item-nome">' + H(e.nome) + '</div><div class="sr-item-sub">' + H(e.codigo || (t ? t.nome : '')) + '</div></div></div>';
      });
    }
    if (APP.acessoMenu('funcionarios')) {
      var fs = (APP.utilizadores || []).filter(function(u) {
        return norm(u.nome).indexOf(termo) >= 0 || norm(u.num_mecanografico).indexOf(termo) >= 0;
      }).slice(0, 6);
      if (fs.length) {
        html += '<div class="sr-group">Funcionários</div>';
        fs.forEach(function(u) {
          html += '<div class="sr-item" onclick="App.abrirResultado(\'func\',\'' + u.id + '\')"><div class="sr-item-ic">' + iniciais(u.nome) + '</div>';
          html += '<div class="sr-item-txt"><div class="sr-item-nome">' + H(u.nome) + '</div><div class="sr-item-sub">' + H(u.funcao || u.unidade || '') + '</div></div></div>';
        });
      }
    }
    if (APP.podeCriarMemorandos()) {
      var ms = (APP.memos || []).filter(function(m) { return norm(m.descricao).indexOf(termo) >= 0 || norm(m.numero).indexOf(termo) >= 0; }).slice(0, 4);
      if (ms.length) {
        html += '<div class="sr-group">Memorandos</div>';
        ms.forEach(function(m) {
          html += '<div class="sr-item" onclick="App.abrirResultado(\'memo\',\'' + m.id + '\')"><div class="sr-item-ic">🔧</div>';
          html += '<div class="sr-item-txt"><div class="sr-item-nome">' + H(m.descricao || m.numero || '—') + '</div><div class="sr-item-sub">' + H(m.numero || '') + '</div></div></div>';
        });
      }
    }
    if (!html) html = '<div class="sr-empty">Sem resultados para "' + H(termo) + '"</div>';
    res.innerHTML = html;
    var inp = document.getElementById('tb-search-input');
    if (inp) {
      var r = inp.getBoundingClientRect();
      res.style.top = (r.bottom + 10) + 'px';
      res.style.left = Math.max(8, Math.min(r.left - 30, window.innerWidth - 356)) + 'px';
      res.style.width = Math.min(window.innerWidth - 16, 340) + 'px';
    }
    res.classList.add('open');
  }

  function abrirResultado(tipo, id) {
    var res = document.getElementById('search-results'), inp = document.getElementById('tb-search-input');
    if (res) res.classList.remove('open');
    if (inp) inp.value = '';
    if (tipo === 'eq') { Eq.abrir(id, 'resumo'); }
    else if (tipo === 'func') {
      nav('funcionarios');
      if (APP.podeGerirUtilizadores() && typeof Funcionarios !== 'undefined') setTimeout(function() { Funcionarios.openEditar(id); }, 60);
    } else if (tipo === 'memo') {
      var m = (APP.memos || []).filter(function(x) { return x.id === id; })[0];
      var sec = 'sec2';
      if (m && APP.isDds()) {
        if (m.estado === 'concluido') sec = 'sec5';
        else if (m.data_envio_servicos) sec = 'sec4';
        else if (m.aprovado_dds) sec = 'sec3';
        else if (!m.criado_por_dds) sec = 'sec1';
      }
      nav('memorandos', sec);
    }
  }

  function toggleTbMenu() {
    var m = document.getElementById('tb-menu'), btn = document.getElementById('tb-user-btn');
    if (!m) return;
    if (m.classList.contains('open')) { m.classList.remove('open'); return; }
    if (btn) {
      var r = btn.getBoundingClientRect();
      m.style.position = 'fixed';
      m.style.top = (r.bottom + 8) + 'px';
      m.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
      m.style.left = 'auto';
    }
    _updateUserUI();
    m.classList.add('open');
  }

  document.addEventListener('click', function(e) {
    var tbm = document.getElementById('tb-menu'), tbb = document.getElementById('tb-user-btn');
    if (tbm && tbb && !tbb.contains(e.target)) tbm.classList.remove('open');
    var sr = document.getElementById('search-results'), si = document.getElementById('tb-search-input');
    if (sr && si && !si.contains(e.target) && !sr.contains(e.target)) sr.classList.remove('open');
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.getElementById('login-wrap').style.display !== 'none') App.login();
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-bd.open').forEach(function(m) { m.classList.remove('open'); });
      if (typeof Avisos !== 'undefined') Avisos.fechar();
    }
  });

  // tema ainda antes do login
  _carregarTemaInicial();

  return {
    login: login, logout: logout, toggleTema: toggleTema, nav: nav,
    buildSidebar: buildSidebar, renderContent: renderContent,
    toggleSidebar: toggleSidebar, toggleSw: function() {}, mudarAno: mudarAno,
    pesquisar: pesquisar, abrirResultado: abrirResultado, toggleTbMenu: toggleTbMenu,
    updateBadges: _updateBadges, depoisDeNavegar: depoisDeNavegar, sbGrupo: sbGrupo
  };
})();

// Abrir/fechar grupos da barra lateral
function _tGrp(sid, pid, aid) {
  var s = document.getElementById(sid), p = document.getElementById(pid), a = document.getElementById(aid);
  if (s) s.classList.toggle('open');
  if (p) p.classList.toggle('grp-open');
  if (a) a.classList.toggle('grp-open');
}

</script>

</body>
</html>
