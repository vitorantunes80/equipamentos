  // copia o ENDEREÇO de email (no modal "Marcar como enviado")
  function copiarEndereco() {
    var em = document.getElementById('m-env-email');
    if (!em) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(em.textContent).then(function() { toast('Texto copiado.', 'success'); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = em.textContent;
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      toast('Texto copiado.', 'success');
    }
  }

  function execEnviar() {
    if (!APP.actionId) return;
    var hoje = new Date().toISOString().split('T')[0];
    sbPatch('memorandos_dds', 'id=eq.' + APP.actionId, { data_envio_servicos: hoje })
      .then(function() {
        toast('Marcado como enviado — movido para "Em Curso".', 'success');
        closeModal('m-memo-env');
        loadAll(function() { App.renderContent(); });
      })
      .catch(function() { toast('Erro ao marcar como enviado.', 'error'); });
  }

  function pedirConf(id) {
    var m = APP.memos.filter(function(x) { return x.id === id; })[0];
    if (!m) return;
    var uuidRx = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

    // destinatário: criador do memorando
    // se criado_por for null (memos antigos), usar o utilizador atual
    var destId = null;
    if (m.criado_por && uuidRx.test(m.criado_por)) {
      destId = m.criado_por;
    } else if (APP.user && APP.user.id && uuidRx.test(APP.user.id)) {
      destId = APP.user.id;
    }

    if (!destId) {
      toast('Não foi possível identificar o destinatário.', 'error');
      return;
    }

    sbPost('avisos', {
      destinatario_id: destId,
      titulo: 'Confirmação pendente — ' + (m.numero || ''),
      mensagem: 'O memorando ' + (m.numero || '') + ' foi enviado para os serviços e aguarda confirmação de conclusão.',
      lido: false
    }).then(function() {
      toast('Aviso enviado.', 'success');
      // atualizar o sino imediatamente
      if (typeof Avisos !== 'undefined') Avisos.carregar();
    }).catch(function() {
      toast('Erro ao enviar aviso.', 'error');
    });
  }

  function openApagarTodos() {
    var conf = prompt('Escreva CONFIRMAR para eliminar todo o arquivo:');
    if (conf !== 'CONFIRMAR') return;
    var arch = secMemos(5);
    if (!arch.length) { toast('Arquivo vazio.', 'error'); return; }
    var ids = arch.map(function(m) { return m.id; }).join(',');
    sbDelete('memorandos_dds', 'id=in.(' + ids + ')').then(function() {
      toast('Arquivo limpo.', 'success');
      loadAll(function() { App.renderContent(); });
    }).catch(function() { toast('Erro ao limpar arquivo.', 'error'); });
  }

  function toggleAcc(k) {
    var b = document.getElementById('acc-' + k);
    var v = document.getElementById('accv-' + k);
    if (b) {
      var open = b.style.display !== 'none';
      b.style.display = open ? 'none' : 'block';
      if (v) v.style.transform = open ? '' : 'rotate(180deg)';
    }
  }

  // ── LOCAL (equipamento ou "Outro" guardado nas observações) ──
  function localMemo(m) {
    var e = m.equipamento_id ? getEq(m.equipamento_id) : null;
    if (e) return e.nome;
    var mm = /^Local:\s*(.+)$/m.exec(m.observacoes || '');
    return mm ? mm[1].trim() : '—';
  }
  function _obsSemLocal(m) {
    return String(m.observacoes || '').replace(/^Local:\s*.+\n?/, '').trim();
  }
  function _fD(d) { return d ? fData(d) : '—'; }

  // ── VER MEMORANDO COMPLETO ────────────────────────────────
  function ver(id) {
    var m = APP.memos.filter(function(x) { return x.id === id; })[0];
    if (!m) return;
    var dEnv = m.data_envio_servicos ? diasDesde(m.data_envio_servicos) : null;
    document.getElementById('m-ver-num').textContent = m.numero || 'Memorando';
    document.getElementById('m-ver-sub').textContent = localMemo(m) + (m.brigada ? ' · ' + m.brigada : '');

    var b = '<div class="memo-ver-estado">' + _badgeMemoEstado(m);
    if (m.num_reforcos > 0) b += ' <span class="bdg" style="background:var(--red-bg);color:var(--red);">' + m.num_reforcos + '× reforço</span>';
    if (m.estado !== 'concluido') b += ' <span class="days-bdg ' + diasCls(dEnv !== null ? dEnv : diasDesde(m.created_at)) + '">' + (dEnv !== null ? dEnv + ' dias desde o envio' : diasDesde(m.created_at) + ' dias desde o pedido') + '</span>';
    b += '</div>';
    b += '<div class="fl" style="margin-top:4px;">Assunto</div>';
    b += '<div class="memo-ver-txt">' + H(m.descricao || '—') + '</div>';
    var obs = _obsSemLocal(m);
    if (obs) b += '<div class="fl" style="margin-top:14px;">Observações e reforços</div><div class="memo-ver-txt memo-ver-obs">' + H(obs) + '</div>';
    b += '<div class="detail-box" style="margin-top:14px;">';
    function row(l, v) { b += '<div class="detail-row"><span class="detail-lbl">' + l + '</span><span class="detail-val">' + v + '</span></div>'; }
    row('Equipamento / local', H(localMemo(m)));
    row('Brigada / serviço', H(m.brigada || '—'));
    row('Pedido em', _fD(m.data || m.created_at));
    row('Aprovado pela DDS', m.aprovado_dds ? 'Sim' : 'Ainda não');
    row('Enviado aos serviços', _fD(m.data_envio_servicos));
    row('Concluído em', _fD(m.data_conclusao));
    b += '</div>';
    document.getElementById('m-ver-body').innerHTML = b;

    var f = '<button class="btn btn-ghost btn-sm" onclick="Memorandos.imprimirUm(\'' + m.id + '\')">🖨 Imprimir</button>';
    f += '<span style="flex:1;"></span>';
    var ctx = m.estado === 'concluido' ? 'sec5' : (APP.isDds() && m.data_envio_servicos ? 'sec4' : (APP.isDds() && m.aprovado_dds ? 'sec3' : (APP.isDds() && !m.aprovado_dds && !(APP.user && m.criado_por === APP.user.id) ? 'sec1' : 'sec2')));
    f += '<span class="memo-ver-acts" onclick="setTimeout(function(){closeModal(\'m-memo-ver\')},0)">' + _acoes(m, ctx) + '</span>';
    f += '<button class="btn btn-ghost" onclick="closeModal(\'m-memo-ver\')">Fechar</button>';
    document.getElementById('m-ver-foot').innerHTML = f;
    openModal('m-memo-ver');
  }

  // ── FOLHA DE VERIFICAÇÃO (para imprimir e confirmar no terreno) ──
  function _fv() {
    if (!APP.memoVerif) {
      var d = new Date();
      APP.memoVerif = { eq: '', estado: 'aberto', per: 'todos',
        mes: d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2), de: '', ate: '' };
    }
    return APP.memoVerif;
  }
  function setVerif(k, v) { _fv()[k] = v; App.renderContent(); }
  function verifEq(eqId) { _fv().eq = eqId || ''; App.nav('memorandos', 'verif'); }

  function _noAmbito(m) {
    if (APP.isDds()) return true;
    if (APP.user && m.criado_por === APP.user.id) return true;
    return !!(m.equipamento_id && APP.podeVerEquipamento(m.equipamento_id));
  }

  function _memosVerif() {
    var F = _fv();
    return APP.memos.filter(function(m) {
      if (!_noAmbito(m)) return false;
      if (F.eq === '__sem__') { if (m.equipamento_id) return false; }
      else if (F.eq && m.equipamento_id !== F.eq) return false;
      var conc = m.estado === 'concluido';
      if (F.estado === 'aberto' && conc) return false;
      if (F.estado === 'curso' && (conc || !m.data_envio_servicos)) return false;
      if (F.estado === 'pendente' && (conc || m.data_envio_servicos)) return false;
      if (F.estado === 'concluido' && !conc) return false;
      var d = String(m.data || m.created_at || '').slice(0, 10);
      if (F.per === 'mes' && d.slice(0, 7) !== F.mes) return false;
      if (F.per === 'datas') {
        if (F.de && d < F.de) return false;
        if (F.ate && d > F.ate) return false;
      }
      return true;
    }).sort(function(a, b) {
      var ea = localMemo(a), eb = localMemo(b);
      if (ea !== eb) return ea.localeCompare(eb, 'pt');
      return String(a.data || a.created_at).localeCompare(String(b.data || b.created_at));
    });
  }

  function _grupos(lista) {
    var g = [], idx = {};
    lista.forEach(function(m) {
      var k = localMemo(m);
      if (!(k in idx)) { idx[k] = g.length; g.push({ nome: k, items: [] }); }
      g[idx[k]].items.push(m);
    });
    return g;
  }

  var _ESTADOS = { aberto: 'Todos em aberto', curso: 'Enviados (em curso)', pendente: 'Ainda não enviados', concluido: 'Concluídos', todos: 'Todos' };
  var _MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  function _descFiltros() {
    var F = _fv(), t = [];
    var e = F.eq === '__sem__' ? 'Sem equipamento / outros locais' : (F.eq ? (getEq(F.eq) || {}).nome : 'Todos os equipamentos');
    t.push(e);
    t.push(_ESTADOS[F.estado]);
    if (F.per === 'mes') { var p = F.mes.split('-'); t.push('Pedidos em ' + _MESES[+p[1] - 1] + ' de ' + p[0]); }
    else if (F.per === 'datas' && (F.de || F.ate)) t.push('Pedidos ' + (F.de ? 'de ' + fData(F.de) : '') + (F.ate ? ' até ' + fData(F.ate) : ''));
    else t.push('Qualquer data');
    return t.join(' · ');
  }

  function _renderVerif() {
    var F = _fv();
    var lista = _memosVerif();
    var h = '<div class="dash-greeting"><div><div class="dash-hello" style="font-size:18px;">Folha de verificação</div>';
    h += '<div style="font-size:12.5px;color:var(--text-3);margin-top:3px;">Imprima a lista, verifique no terreno o que já foi feito e depois atualize aqui.</div></div>';
    h += '<button class="btn btn-primary btn-sm" onclick="Memorandos.imprimirVerif()"' + (lista.length ? '' : ' disabled') + '>🖨 Imprimir folha (' + lista.length + ')</button></div>';

    // filtros
    var eqs = (APP.equipamentos || []).filter(function(e) { return APP.isDds() || APP.podeVerEquipamento(e.id); })
      .sort(compareEq);
    h += '<div class="memo-filtros">';
    h += '<div class="fi"><label class="fl">Equipamento</label><select class="fin" onchange="Memorandos.setVerif(\'eq\',this.value)">';
    h += '<option value="">Todos os equipamentos</option>';
    eqs.forEach(function(e) { h += '<option value="' + e.id + '"' + (F.eq === e.id ? ' selected' : '') + '>' + H(e.nome) + '</option>'; });
    if (APP.isDds()) h += '<option value="__sem__"' + (F.eq === '__sem__' ? ' selected' : '') + '>Sem equipamento / outros locais</option>';
    h += '</select></div>';
    h += '<div class="fi"><label class="fl">Estado</label><select class="fin" onchange="Memorandos.setVerif(\'estado\',this.value)">';
    Object.keys(_ESTADOS).forEach(function(k) { h += '<option value="' + k + '"' + (F.estado === k ? ' selected' : '') + '>' + _ESTADOS[k] + '</option>'; });
    h += '</select></div>';
    h += '<div class="fi"><label class="fl">Data do pedido</label><select class="fin" onchange="Memorandos.setVerif(\'per\',this.value)">';
    [['todos', 'Qualquer data'], ['mes', 'Um mês'], ['datas', 'Entre datas']].forEach(function(o) { h += '<option value="' + o[0] + '"' + (F.per === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; });
    h += '</select></div>';
    if (F.per === 'mes') h += '<div class="fi"><label class="fl">Mês</label><input type="month" class="fin" value="' + F.mes + '" onchange="Memorandos.setVerif(\'mes\',this.value)"></div>';
    if (F.per === 'datas') {
      h += '<div class="fi"><label class="fl">De</label><input type="date" class="fin" value="' + F.de + '" onchange="Memorandos.setVerif(\'de\',this.value)"></div>';
      h += '<div class="fi"><label class="fl">Até</label><input type="date" class="fin" value="' + F.ate + '" onchange="Memorandos.setVerif(\'ate\',this.value)"></div>';
    }
    h += '</div>';

    if (!lista.length) return h + emptyState('Nenhum memorando', 'Não há memorandos com estes filtros.');

    var nAnt = lista.filter(function(m) { return m.estado !== 'concluido' && m.data_envio_servicos && diasDesde(m.data_envio_servicos) >= 15; }).length;
    h += '<div class="memo-resumo"><b>' + lista.length + '</b> ' + (lista.length === 1 ? 'memorando' : 'memorandos') + ' · ' + H(_descFiltros());
    if (nAnt) h += ' · <span style="color:var(--red);font-weight:600;">' + nAnt + ' há mais de 15 dias sem resposta</span>';
    h += '</div>';

    _grupos(lista).forEach(function(g) {
      h += '<div class="memo-grp"><div class="memo-grp-h">' + H(g.nome) + ' <span>' + g.items.length + '</span></div>';
      g.items.forEach(function(m) {
        var conc = m.estado === 'concluido';
        var podeConc = !conc && (APP.isAdmin() || (APP.user && m.criado_por === APP.user.id));
        var dEnv = m.data_envio_servicos ? diasDesde(m.data_envio_servicos) : null;
        h += '<div class="memo-vi' + (conc ? ' conc' : '') + '" onclick="Memorandos.ver(\'' + m.id + '\')">';
        h += '<div class="memo-vi-l"><div class="memo-vi-top"><span class="td-mono">' + H(m.numero || '—') + '</span> · ' + fData(m.data || m.created_at) + (m.brigada ? ' · ' + H(m.brigada) : '') + ' ' + _badgeMemoEstado(m);
        if (dEnv !== null && !conc) h += ' <span class="days-bdg ' + diasCls(dEnv) + '">' + dEnv + 'd envio</span>';
        h += '</div><div class="memo-vi-d">' + H(m.descricao || '—') + '</div></div>';
        h += '<div class="memo-vi-a" onclick="event.stopPropagation()">';
        if (podeConc) h += '<button class="btn btn-success btn-sm" onclick="Memorandos.openConcluir(\'' + m.id + '\')">✓ Feito</button>';
        if (!conc && dEnv !== null && dEnv >= 15) h += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Memorandos.openReforco(\'' + m.id + '\')">Reforço</button>';
        h += '</div></div>';
      });
      h += '</div>';
    });
    return h;
  }

  function _imprimir(html) {
    var root = document.getElementById('print-root');
    if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
    root.innerHTML = html;
    setTimeout(function() { window.print(); }, 60);
  }

  function _cab(titulo, sub) {
    var d = new Date();
    return '<div class="mv-head"><div><div class="mv-org">Município de Cabeceiras de Basto · Divisão de Desenvolvimento Social</div>' +
      '<div class="mv-tit">' + H(titulo) + '</div><div class="mv-sub">' + H(sub) + '</div></div>' +
      '<div class="mv-data">Impresso em<br><b>' + ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear() + '</b></div></div>';
  }

  function imprimirVerif() {
    var lista = _memosVerif();
    if (!lista.length) return;
    var h = '<style>@page{size:A4 landscape;margin:10mm;}</style><div class="mv">';
    h += _cab('Folha de verificação de memorandos', lista.length + ' memorandos · ' + _descFiltros());
    h += '<div class="mv-instr">Assinale o estado de cada memorando após verificação no local. Depois atualize na aplicação (Memorandos → Folha de verificação → "✓ Feito").</div>';
    _grupos(lista).forEach(function(g) {
      h += '<table class="mv-t"><thead><tr class="mv-gh"><th colspan="8">' + H(g.nome) + ' — ' + g.items.length + '</th></tr>';
      h += '<tr><th style="width:24mm;">Nº / Data</th><th>Assunto</th><th style="width:24mm;">Brigada</th><th style="width:17mm;">Estado na app</th>';
      h += '<th class="mv-c">Feito</th><th class="mv-c">Parcial</th><th class="mv-c">Por fazer</th><th style="width:52mm;">Observações</th></tr></thead><tbody>';
      g.items.forEach(function(m) {
        var est = m.estado === 'concluido' ? 'Concluído' : m.data_envio_servicos ? 'Enviado há ' + diasDesde(m.data_envio_servicos) + 'd' : m.aprovado_dds ? 'A enviar' : 'Pendente';
        h += '<tr><td><b>' + H(m.numero || '—') + '</b><br>' + fData(m.data || m.created_at) + '</td>';
        h += '<td class="mv-d">' + H(m.descricao || '—') + '</td>';
        h += '<td>' + H(m.brigada || '—') + '</td><td>' + est + (m.num_reforcos ? '<br>' + m.num_reforcos + '× reforço' : '') + '</td>';
        h += '<td class="mv-c"><span class="mv-box"></span></td><td class="mv-c"><span class="mv-box"></span></td><td class="mv-c"><span class="mv-box"></span></td><td></td></tr>';
      });
      h += '</tbody></table>';
    });
    h += '<div class="mv-assin"><span>Verificado por: ____________________________________</span><span>Data: ____ / ____ / ________</span><span>Assinatura: ____________________________</span></div>';
    h += '</div>';
    _imprimir(h);
  }

  function imprimirUm(id) {
    var m = APP.memos.filter(function(x) { return x.id === id; })[0];
    if (!m) return;
    var h = '<style>@page{size:A4 portrait;margin:15mm;}</style><div class="mv">';
    h += _cab('Memorando ' + (m.numero || ''), localMemo(m) + (m.brigada ? ' · ' + m.brigada : ''));
    h += '<div class="mv-sec">Assunto</div><div class="mv-txt">' + H(m.descricao || '—') + '</div>';
    var obs = _obsSemLocal(m);
    if (obs) h += '<div class="mv-sec">Observações e reforços</div><div class="mv-txt">' + H(obs) + '</div>';
    h += '<table class="mv-t mv-det"><tbody>';
    [['Equipamento / local', localMemo(m)], ['Brigada / serviço', m.brigada || '—'], ['Pedido em', _fD(m.data || m.created_at)],
     ['Enviado aos serviços', _fD(m.data_envio_servicos)], ['Concluído em', _fD(m.data_conclusao)]].forEach(function(r) {
      h += '<tr><th>' + r[0] + '</th><td>' + H(r[1]) + '</td></tr>';
    });
    h += '</tbody></table>';
    h += '<div class="mv-sec">Verificação no local</div><div class="mv-ver"><span><span class="mv-box"></span> Feito</span><span><span class="mv-box"></span> Parcial</span><span><span class="mv-box"></span> Por fazer</span></div>';
    h += '<div class="mv-linhas"></div>';
    h += '<div class="mv-assin"><span>Verificado por: ______________________________</span><span>Data: ____ / ____ / ________</span></div></div>';
    _imprimir(h);
  }

  function init() {
    var cont = document.getElementById('modais-memorandos');
    if (cont) cont.innerHTML = getModaisHTML();
  }

  return {
    copiarEmail: copiarEmail, copiarDirecto: copiarDirecto,
    preverEmail: preverEmail, reporEmail: reporEmail,
    onEqChange: onEqChange,
    render: render,
    init: init,
    getBadges: getBadges,
    openNovo: openNovo,
    criar: criar,
    aprovar: aprovar,
    openConcluir: openConcluir,
    execConcluir: execConcluir,
    openReforco: openReforco,
    execReforco: execReforco,
    openEnviar: openEnviar,
    copiarEndereco: copiarEndereco,
    execEnviar: execEnviar,
    pedirConf: pedirConf,
    openApagarTodos: openApagarTodos,
    toggleAcc: toggleAcc,
    ver: ver, localMemo: localMemo,
    setFiltro: setFiltro, limparFiltros: limparFiltros, filtroTexto: filtroTexto,
    setVerif: setVerif, verifEq: verifEq, imprimirVerif: imprimirVerif, imprimirUm: imprimirUm
  };

})();

<script>
/* ═════ brigadas.js ═════ */
// ============================================================
// GestDDS — brigadas.js  v6.2
// Lista de brigadas / serviços usada nos memorandos.
// Guardada na tabela "brigadas" do Supabase (partilhada por
// todos). Se a tabela ainda não existir, usa a lista guardada
// neste computador, como acontecia antes.
// ============================================================

var Brigadas = (function() {

  var _db = false;      // true quando a tabela existe
  var _rows = [];       // linhas da tabela (inclui inativas)
  var _carregado = false;

  function _local() {
    try {
      var s = localStorage.getItem(BRIGADAS_KEY);
      if (s) return JSON.parse(s);
    } catch (e) {}
    return ['Brigada A', 'Brigada B', 'Manutenção', 'Limpeza'];
  }
  function _guardarLocal(l) { try { localStorage.setItem(BRIGADAS_KEY, JSON.stringify(l)); } catch (e) {} }

  function load(cb) {
    sbGet('brigadas', 'select=*&order=ordem.asc,nome.asc').then(function(r) {
      if (Array.isArray(r)) { _db = true; _rows = r; }
      else _db = false;
      _carregado = true;
      if (cb) cb();
    }).catch(function() { _db = false; _carregado = true; if (cb) cb(); });
  }

  // nomes ativos, pela ordem definida
  function lista() {
    if (_db) return _rows.filter(function(r) { return r.ativo !== false; }).map(function(r) { return r.nome; });
    return _local();
  }

  function _usos(nome) {
    return (APP.memos || []).filter(function(m) { return (m.brigada || '') === nome; }).length;
  }

  // ── PÁGINA ────────────────────────────────────────────────
  function render() {
    if (!_carregado) { load(function() { App.renderContent(); }); return loadingState(); }
    var l = lista();
    var h = '<div class="dash-greeting"><div><div class="dash-hello" style="font-size:18px;">Brigadas e serviços</div>';
    h += '<div style="font-size:12.5px;color:var(--text-3);margin-top:3px;">A lista que aparece ao criar um memorando. A ordem aqui é a ordem na lista.</div></div></div>';

    if (!_db) {
      h += '<div class="mn-aviso" style="margin-bottom:14px;"><b>Atenção:</b> esta lista está guardada só neste computador. ' +
           'Para que fique igual para todos, é preciso criar a tabela <code>brigadas</code> na base de dados (uma única vez). ' +
           '<button class="btn btn-ghost btn-sm" onclick="Brigadas.mostrarSQL()">Ver instruções</button></div>';
    }

    h += '<section class="mn-bloco" style="max-width:640px;">';
    h += '<div class="brg-add"><input id="brg-nova" class="fin" placeholder="Nome da nova brigada (ex.: Pedreiros)" onkeydown="if(event.key===\'Enter\')Brigadas.adicionar()">';
    h += '<button class="btn btn-primary" onclick="Brigadas.adicionar()">+ Acrescentar</button></div>';
    if (!l.length) h += '<div class="mn-vazio">Ainda não há brigadas.</div>';
    l.forEach(function(nome, i) {
      var u = _usos(nome);
      h += '<div class="brg-row">';
      h += '<div class="brg-ord"><button class="brg-mv" title="Subir" onclick="Brigadas.mover(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + '>▲</button>';
      h += '<button class="brg-mv" title="Descer" onclick="Brigadas.mover(' + i + ',1)"' + (i === l.length - 1 ? ' disabled' : '') + '>▼</button></div>';
      h += '<div class="brg-nome">' + H(nome) + '<small>' + (u ? u + (u === 1 ? ' memorando este ano' : ' memorandos este ano') : 'sem memorandos este ano') + '</small></div>';
      h += '<button class="btn btn-ghost btn-sm" onclick="Brigadas.renomear(' + i + ')">✎ Mudar nome</button>';
      h += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Brigadas.remover(' + i + ')">Retirar</button>';
      h += '</div>';
    });
    h += '</section>';
    return h;
  }

  // ── AÇÕES ─────────────────────────────────────────────────
  function _depois(msg) {
    load(function() { App.renderContent(); if (msg) toast(msg, 'success'); });
  }
  function _erro(e) { console.error(e); toast('Não foi possível guardar. Tente novamente.', 'error'); }

  // acrescenta e chama cb(true) quando estiver guardada
  function adicionarNome(nome, cb) {
    nome = String(nome || '').trim();
    if (!nome) return;
    var l = lista();
    if (l.some(function(x) { return x.toLowerCase() === nome.toLowerCase(); })) { if (cb) cb(true); return; }
    if (!_db) { l.push(nome); _guardarLocal(l); if (cb) cb(true); return; }
    var antiga = _rows.filter(function(r) { return r.nome.toLowerCase() === nome.toLowerCase(); })[0];
    var ord = _rows.reduce(function(m, r) { return Math.max(m, r.ordem || 0); }, 0) + 1;
    var p = antiga ? sbPatch('brigadas', 'id=eq.' + antiga.id, { ativo: true, ordem: ord })
                   : sbPost('brigadas', { nome: nome, ordem: ord, ativo: true });
    p.then(function() { load(function() { if (cb) cb(true); }); }).catch(function(e) { _erro(e); if (cb) cb(false); });
  }

  function adicionar() {
    var el = document.getElementById('brg-nova');
    var nome = el ? el.value.trim() : '';
    if (!nome) { toast('Escreva o nome da brigada.', 'error'); if (el) el.focus(); return; }
    if (lista().some(function(x) { return x.toLowerCase() === nome.toLowerCase(); })) { toast('Essa brigada já existe.', 'error'); return; }
    adicionarNome(nome, function(ok) {
      if (!ok) return;
      App.renderContent(); toast('Brigada acrescentada.', 'success');
      var e2 = document.getElementById('brg-nova'); if (e2) e2.focus();
    });
  }

  function renomear(i) {
    var l = lista(), velho = l[i];
    if (velho === undefined) return;
    var novo = prompt('Novo nome para "' + velho + '":', velho);
    if (novo === null) return;
    novo = novo.trim();
    if (!novo || novo === velho) return;
    if (l.some(function(x, j) { return j !== i && x.toLowerCase() === novo.toLowerCase(); })) { toast('Já existe uma brigada com esse nome.', 'error'); return; }
    var u = _usos(velho);
    var mudarMemos = u > 0 && confirm('Há ' + u + (u === 1 ? ' memorando' : ' memorandos') + ' com "' + velho + '".\n\nAtualizar também esses memorandos para "' + novo + '"?');

    var p;
    if (!_db) { l[i] = novo; _guardarLocal(l); p = Promise.resolve(); }
    else {
      var row = _rows.filter(function(r) { return r.nome === velho; })[0];
      p = sbPatch('brigadas', 'id=eq.' + row.id, { nome: novo });
    }
    p.then(function() {
      if (!mudarMemos) return;
      return sbPatch('memorandos_dds', 'brigada=eq.' + encodeURIComponent(velho), { brigada: novo }).then(function() {
        (APP.memos || []).forEach(function(m) { if (m.brigada === velho) m.brigada = novo; });
      });
    }).then(function() { _depois('Nome alterado.'); }).catch(_erro);
  }

  function mover(i, d) {
    var l = lista(), j = i + d;
    if (j < 0 || j >= l.length) return;
    var t = l[i]; l[i] = l[j]; l[j] = t;
    if (!_db) { _guardarLocal(l); App.renderContent(); return; }
    var ps = l.map(function(nome, k) {
      var row = _rows.filter(function(r) { return r.nome === nome; })[0];
      return row && row.ordem !== k + 1 ? sbPatch('brigadas', 'id=eq.' + row.id, { ordem: k + 1 }) : null;
    }).filter(Boolean);
    Promise.all(ps).then(function() { _depois(); }).catch(_erro);
  }

  function remover(i) {
    var l = lista(), nome = l[i];
    if (nome === undefined) return;
    var u = _usos(nome);
    if (!confirm('Retirar "' + nome + '" da lista?' + (u ? '\n\nOs ' + u + ' memorandos que já a usam não são alterados.' : ''))) return;
    if (!_db) { l.splice(i, 1); _guardarLocal(l); App.renderContent(); toast('Brigada retirada.', 'success'); return; }
    var row = _rows.filter(function(r) { return r.nome === nome; })[0];
    sbPatch('brigadas', 'id=eq.' + row.id, { ativo: false }).then(function() { _depois('Brigada retirada.'); }).catch(_erro);
  }

  // ── INSTRUÇÕES PARA CRIAR A TABELA ────────────────────────
  var SQL = [
    "create table if not exists public.brigadas (",
    "  id uuid primary key default gen_random_uuid(),",
    "  nome text not null unique,",
    "  ordem integer not null default 0,",
    "  ativo boolean not null default true,",
    "  created_at timestamptz not null default now()",
    ");",
    "alter table public.brigadas enable row level security;",
    "create policy \"brigadas_acesso\" on public.brigadas for all to anon, authenticated using (true) with check (true);",
    "-- copiar as brigadas que já foram usadas nos memorandos",
    "insert into public.brigadas (nome, ordem)",
    "select brigada, row_number() over (order by brigada) from (select distinct brigada from public.memorandos_dds where coalesce(brigada,'') <> '') b",
    "on conflict (nome) do nothing;"
  ].join('\n');

  function mostrarSQL() {
    var m = document.getElementById('m-brg-sql');
    if (!m) { m = document.createElement('div'); m.className = 'modal-bd'; m.id = 'm-brg-sql'; document.body.appendChild(m); }
    var h = '<div class="modal" style="max-width:640px;"><div class="modal-header"><div><div class="modal-title">Partilhar as brigadas com todos</div>';
    h += '<div class="modal-sub">Feito uma única vez, por quem gere a base de dados</div></div>';
    h += '<button class="modal-close" onclick="closeModal(\'m-brg-sql\')">✕</button></div><div class="modal-body">';
    h += '<ol style="margin:0 0 12px 18px;font-size:13px;line-height:1.7;"><li>Abra o projeto no Supabase → <b>SQL Editor</b>.</li><li>Cole o texto abaixo e carregue em <b>Run</b>.</li><li>Recarregue a GestorDDS. As brigadas já usadas nos memorandos aparecem na lista.</li></ol>';
    h += '<textarea class="fin" id="brg-sql" readonly style="height:230px;font-family:monospace;font-size:11.5px;">' + H(SQL) + '</textarea>';
    h += '</div><div class="modal-footer"><button class="btn btn-secondary" onclick="Brigadas.copiarSQL()">📋 Copiar</button><button class="btn btn-ghost" onclick="closeModal(\'m-brg-sql\')">Fechar</button></div></div>';
    m.innerHTML = h;
    openModal('m-brg-sql');
  }
  function copiarSQL() {
    var t = document.getElementById('brg-sql');
    if (navigator.clipboard) navigator.clipboard.writeText(SQL).then(function() { toast('Copiado.', 'success'); });
    else if (t) { t.select(); document.execCommand('copy'); toast('Copiado.', 'success'); }
  }

  function init() {}

  return { init: init, load: load, lista: lista, adicionarNome: adicionarNome, render: render, adicionar: adicionar, renomear: renomear,
           mover: mover, remover: remover, mostrarSQL: mostrarSQL, copiarSQL: copiarSQL, dbAtiva: function() { return _db; } };
})();

</script>
<script>
/* ═════ equipamentos.js ═════ */
// ============================================================
// GestDDS — equipamentos.js
// Módulo de Equipamentos (lista, tipos, ficha)
// ============================================================

var Equipamentos = (function() {

  // ── RENDER ────────────────────────────────────────────────
  function render(subview) {
    switch (subview) {
      case 'tipos': return _renderTipos();
      case 'ficha': return _renderFicha();
      default:      return _renderLista();
    }
  }

  // ── LISTA ─────────────────────────────────────────────────
  function _renderLista() {
    var isAdmin = APP.isAdmin();
    var html = '<div class="dash-greeting">';
    html += '<div><div class="dash-hello" style="font-size:18px;">Equipamentos</div>';
    html += '<div class="dash-sub">Todos os equipamentos da divisão.</div></div>';
    if (isAdmin) {
      html += '<div style="display:flex;gap:8px;"><button class="btn btn-secondary" onclick="Equipamentos.abrirOrdem()">↕ Ordenar</button>';
      html += '<button class="btn btn-primary" onclick="Equipamentos.openNovo()">+ Novo equipamento</button></div>';
    }
    html += '</div>';

    if (!APP.equipamentos.length) return html + emptyState('Sem equipamentos', 'Crie o primeiro equipamento para começar.');

    // só os equipamentos visíveis para este perfil
    var visiveis = APP.equipamentos.filter(function(e) { return APP.podeVerEquipamento(e.id); });
    if (!visiveis.length) return html + emptyState('Sem equipamentos', 'Não há equipamentos atribuídos a si.');

    // mini stats
    var ativos  = visiveis.filter(function(e) { return e.estado === 'ativo'; }).length;
    var manut   = visiveis.filter(function(e) { return e.estado === 'manutencao'; }).length;
    var inativo = visiveis.filter(function(e) { return e.estado === 'inativo'; }).length;

    html += '<div class="stats-grid stats-grid-3" style="margin-bottom:20px;">';
    html += _statCard('si-green', ativos,  'Ativos');
    html += _statCard('si-amber', manut,   'Em manutenção');
    html += _statCard('si-red',   inativo, 'Inativos');
    html += '</div>';

    html += '<div class="dtw"><table class="dt">';
    html += '<thead><tr><th>Código</th><th>Equipamento</th><th>Tipo</th><th>Localidade</th><th>Módulos</th><th>Estado</th><th></th></tr></thead>';
    html += '<tbody>';

    visiveis.forEach(function(e, idx) {
      var tipo = getTipo(e.tipo_id);
      var cor  = EQ_COLORS[idx % EQ_COLORS.length];

      html += '<tr>';
      html += '<td class="td-mono">' + H(e.codigo || '—') + '</td>';
      html += '<td><div style="display:flex;align-items:center;gap:8px;cursor:pointer;" onclick="Equipamentos.abrirFicha(\'' + e.id + '\')">';
      html += '<span style="width:8px;height:8px;border-radius:50%;background:' + cor + ';flex-shrink:0;display:inline-block;"></span>';
      html += '<span class="td-p">' + H(e.nome) + '</span></div>';
      if (e.morada) html += '<div class="td-m" style="padding-left:16px;">' + H(e.morada) + '</div>';
      html += '</td>';
      html += '<td><span class="bdg" style="background:var(--teal-bg);color:var(--teal);">' + H(tipo ? tipo.nome : '—') + '</span></td>';
      html += '<td class="td-m">' + H(e.localidade || '—') + '</td>';
      html += '<td>' + modChips(tipo) + '</td>';
      html += '<td>' + badgeEqEstado(e.estado) + '</td>';
      html += '<td><div class="td-act">';
      html += '<button class="btn btn-secondary btn-sm" onclick="Equipamentos.abrirFicha(\'' + e.id + '\')">Ver ficha</button>';
      if (isAdmin) {
        html += ' <button class="btn btn-ghost btn-sm" onclick="Equipamentos.openEditar(\'' + e.id + '\')">Editar</button>';
      }
      html += '</div></td>';
      html += '</tr>';
    });

    html += '</tbody></table></div>';
    return html;
  }

  // ── TIPOS ─────────────────────────────────────────────────
  function _renderTipos() {
    if (!APP.isAdmin()) return accessDenied();

    var html = '<div class="dash-greeting">';
    html += '<div><div class="dash-hello" style="font-size:18px;">Tipos de Equipamento</div>';
    html += '<div class="dash-sub">Configure os módulos disponíveis por tipo.</div></div>';
    html += '<button class="btn btn-primary" onclick="Equipamentos.openNovoTipo()">+ Novo tipo</button>';
    html += '</div>';

    if (!APP.tiposEq.length) return html + emptyState('Sem tipos', 'Crie o primeiro tipo de equipamento.');

    html += '<div class="dtw"><table class="dt">';
    html += '<thead><tr><th></th><th>Tipo</th><th>Módulos ativos</th><th>Equipamentos</th><th></th></tr></thead>';
    html += '<tbody>';

    APP.tiposEq.forEach(function(t) {
      var nEq = APP.equipamentos.filter(function(e) { return e.tipo_id === t.id; }).length;
      html += '<tr>';
      html += '<td style="font-size:22px;text-align:center;">' + H(t.emoji || '🏢') + '</td>';
      html += '<td><div class="td-p">' + H(t.nome) + '</div>' + (t.descricao ? '<div class="td-m">' + H(t.descricao) + '</div>' : '') + '</td>';
      html += '<td>' + modChips(t) + '</td>';
      html += '<td class="td-mono">' + nEq + '</td>';
      html += '<td><div class="td-act"><button class="btn btn-ghost btn-sm" onclick="Equipamentos.openEditarTipo(\'' + t.id + '\')">Editar</button></div></td>';
      html += '</tr>';
    });

    html += '</tbody></table></div>';
    return html;
  }

  // ── FICHA ─────────────────────────────────────────────────
  function _renderFicha() {
    var eq = APP.equipamentos.filter(function(e) { return e.id === APP.spotEqId; })[0] || null;
    if (!eq) return emptyState('Equipamento não encontrado', 'Selecione um equipamento na lista.');

    var tipo = getTipo(eq.tipo_id);

    var html = '<div style="margin-bottom:14px;">';
    html += '<button class="btn btn-ghost btn-sm" onclick="App.nav(\'equipamentos\',\'lista\')">← Voltar à lista</button>';
    html += '</div>';

    // Header card
    html += '<div class="eq-spotlight">';
    html += '<div class="eqs-hdr">';
    html += '<div class="eqs-left">';
    html += '<span class="eqs-emoji">' + (tipo ? (tipo.emoji || '🏢') : '🏢') + '</span>';
    html += '<div>';
    html += '<div class="eqs-title">' + H(eq.nome) + '</div>';
    html += '<div style="font-size:12.5px;color:var(--text-3);">' + H(tipo ? tipo.nome : 'Sem tipo') + '</div>';
    html += '</div></div>';
    html += badgeEqEstado(eq.estado);
    if (APP.isAdmin()) {
      html += ' <button class="btn btn-secondary btn-sm" onclick="Equipamentos.openEditar(\'' + eq.id + '\')">Editar</button>';
    }
    html += '</div>';

    // Tabs — módulos ativos deste equipamento (tipo + override do equipamento)
    var tabs = [{ id: 'info', label: 'Informações' }];
    MOD_DEFS.forEach(function(m) {
      if (!modAtivo(eq, m.k)) return;
      // check-in/check-out exige autorização específica
      if (m.k === 'estadias' && typeof APP.podeVerEstadias === 'function' && !APP.podeVerEstadias(eq.id)) return;
      if (m.k === 'visitas' && typeof APP.podeVerVisitas === 'function' && !APP.podeVerVisitas(eq.id)) return;
      tabs.push({ id: m.k, label: m.l });
    });

    html += '<div class="eq-tabs">';
    tabs.forEach(function(t, i) {
      html += '<div class="eq-tab' + (i === 0 ? ' active' : '') + '" onclick="Equipamentos.switchTab(this, \'ftab-' + t.id + '\')">' + t.label + '</div>';
    });
    html += '</div>';

    // Tab panels
    html += '<div>';

    // Info tab
    html += '<div class="eq-tab-panel active" id="ftab-info" style="padding:16px;">';
    html += '<div class="detail-box">';
    html += '<div class="detail-row"><span class="detail-lbl">Código</span><span class="detail-val td-mono">' + H(eq.codigo || '—') + '</span></div>';
    html += '<div class="detail-row"><span class="detail-lbl">Morada</span><span class="detail-val">' + H(eq.morada || '—') + '</span></div>';
    html += '<div class="detail-row"><span class="detail-lbl">Localidade</span><span class="detail-val">' + H(eq.localidade || '—') + '</span></div>';
    html += '<div class="detail-row"><span class="detail-lbl">Telefone</span><span class="detail-val">' + H(eq.telefone || '—') + '</span></div>';
    html += '<div class="detail-row"><span class="detail-lbl">Capacidade</span><span class="detail-val">' + (eq.capacidade ? eq.capacidade + ' pessoas' : '—') + '</span></div>';
    if (eq.descricao) html += '<div class="detail-row"><span class="detail-lbl">Notas</span><span class="detail-val">' + H(eq.descricao) + '</span></div>';
    html += '</div>';

    // Secção de espaços/valências
    var espacos = (APP.espacos || []).filter(function(x){ return x.equipamento_id === eq.id; });
    espacos.sort(function(a,b){ return (a.ordem||0)-(b.ordem||0); });
    html += '<div class="sec-head" style="margin-top:18px;"><div class="sec-title">Espaços / Valências para reservas</div>';
    if (APP.isAdmin()) html += '<button class="btn btn-primary btn-sm" onclick="Equipamentos.gerirEspacos(\'' + eq.id + '\')">⚙ Gerir espaços</button>';
    html += '</div>';
    if (!espacos.length) {
      html += '<div style="padding:14px;background:var(--bg);border:1px dashed var(--border);border-radius:var(--r);font-size:12.5px;color:var(--text-3);text-align:center;">Sem espaços definidos. ' + (APP.isAdmin() ? 'Clique em "Gerir espaços" para adicionar.' : '') + '</div>';
    } else {
      html += '<div class="dtw"><table class="dt"><thead><tr><th>Espaço</th><th>Contagem 1</th><th>Contagem 2</th></tr></thead><tbody>';
      espacos.forEach(function(esp) {
        html += '<tr><td class="td-p">' + H(esp.nome) + '</td>';
        html += '<td class="td-m">' + H(esp.label_contagem || '—') + '</td>';
        html += '<td class="td-m">' + H(esp.label_contagem2 || '—') + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    // Módulos ativos — conteúdo real
    MOD_DEFS.forEach(function(m) {
      if (!modAtivo(eq, m.k)) return;
        html += '<div class="eq-tab-panel" id="ftab-' + m.k + '" style="padding:16px;">';
        if (m.k === 'reservas' && typeof Reservas !== 'undefined') {
          html += '<div id="ftab-reservas-content"><div class="loading-wrap"><div class="spinner"></div></div></div>';
        } else if (m.k === 'escalas' && typeof Escalas !== 'undefined') {
          html += '<div id="ftab-escalas-content"><div class="loading-wrap"><div class="spinner"></div></div></div>';
        } else if (m.k === 'checklist' && typeof Checklist !== 'undefined') {
          html += '<div id="ftab-checklist-content"><div class="loading-wrap"><div class="spinner"></div></div></div>';
        } else if (m.k === 'estadias' && typeof Estadias !== 'undefined') {
          html += '<div id="ftab-estadias-content"><div class="loading-wrap"><div class="spinner"></div></div></div>';
        } else if (m.k === 'visitas' && typeof Visitas !== 'undefined') {
          html += '<div id="ftab-visitas-content"><div class="loading-wrap"><div class="spinner"></div></div></div>';
        } else if (m.k === 'funcionarios') {
          html += _painelFuncionarios(eq);
        } else if (m.k === 'responsavel') {
          html += _painelResponsavel(eq);
        } else {
          html += '<div class="mod-ph"><div class="mod-ph-t">' + m.l + '</div><div class="mod-ph-s">' + m.s + '</div></div>';
        }
        html += '</div>';
    });

    html += '</div></div>'; // panels + spotlight
    return html;
  }

  // ── PAINEL: Funcionários afectos a ESTE equipamento ────────
  // Filtra pelo equipamento (principal + adicionais), não pelo tipo/complexo.
  // ── PAINEL: Responsável do equipamento ────────────────────
  function _painelResponsavel(eq) {
    var resp = eq.responsavel_id
      ? (APP.utilizadores || []).filter(function(u) { return u.id === eq.responsavel_id; })[0]
      : null;

    var podeEditar = APP.podeGerirEquipamento ? APP.podeGerirEquipamento(eq.id) : false;

    if (!resp) {
      var h0 = '<div class="mod-ph"><div class="mod-ph-t">Sem responsável atribuído</div>';
      h0 += '<div class="mod-ph-s">Ainda não foi definido um responsável técnico para ' + H(eq.nome) + '.';
      if (podeEditar) h0 += '<br>Atribua na ficha do equipamento (Editar → Responsável).';
      h0 += '</div>';
      if (podeEditar) {
        h0 += '<div style="margin-top:12px;"><button class="btn btn-primary btn-sm" onclick="Equipamentos.openEditar(\'' + eq.id + '\')">Atribuir responsável</button></div>';
      }
      h0 += '</div>';
      return h0;
    }

    // iniciais para o avatar
    var partes = (resp.nome || '').trim().split(/\s+/);
    var ini = (partes[0] || '').charAt(0) + (partes.length > 1 ? partes[partes.length - 1].charAt(0) : '');
    ini = ini.toUpperCase();

    // equipamentos por que responde
    var outros = (APP.equipamentos || []).filter(function(e) {
      return e.responsavel_id === resp.id && e.id !== eq.id;
    });

    // equipa que tem a seu cargo neste equipamento
    var equipa = (typeof funcsDoEq === 'function') ? funcsDoEq(eq.id) : [];
    var nEquipa = equipa.filter(function(u) { return u.id !== resp.id; }).length;

    var h = '<div class="card">';

    // cartão principal
    h += '<div style="display:flex;align-items:center;gap:14px;padding:4px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px;">';
    h += '<div style="width:52px;height:52px;border-radius:50%;background:var(--accent-light);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;">' + H(ini) + '</div>';
    h += '<div style="flex:1;min-width:0;">';
    h += '<div style="font-size:17px;font-weight:700;color:var(--text);">' + H(resp.nome) + '</div>';
    h += '<div style="font-size:13px;color:var(--text-2);margin-top:2px;">' + H(resp.cargo || _labelPerfil(resp.perfil)) + '</div>';
    h += '<div style="margin-top:6px;">';
    h += '<span style="display:inline-block;font-size:11px;font-weight:700;background:var(--accent-light);color:var(--accent-dark);border-radius:20px;padding:2px 9px;">Responsável técnico</span>';
    if (resp.unidade) {
      h += '<span style="display:inline-block;font-size:11px;font-weight:600;background:var(--bg);color:var(--text-2);border-radius:20px;padding:2px 9px;margin-left:5px;">' + H(resp.unidade) + '</span>';
    }
    h += '</div>';
    h += '</div>';
    if (podeEditar) {
      h += '<button class="btn btn-ghost btn-sm" onclick="Equipamentos.openEditar(\'' + eq.id + '\')">Alterar</button>';
    }
    h += '</div>';

    // contactos
    h += '<div class="form-sec-t" style="margin-top:0;">Contactos</div>';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px;">';
    h += _linhaInfo('Email', resp.email || '—', resp.email ? 'mailto:' + resp.email : null);
    h += _linhaInfo('Telefone', resp.telefone || '—', resp.telefone ? 'tel:' + resp.telefone : null);
    if (APP.isAdmin()) h += _linhaInfo('Código de acesso', resp.codigo || '—');
    h += _linhaInfo('Vínculo', resp.vinculo || '—');
    h += '</div>';

    // âmbito da responsabilidade
    h += '<div class="form-sec-t">Âmbito</div>';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;">';

    h += '<div style="background:var(--bg);border-radius:8px;padding:11px 13px;">';
    h += '<div style="font-size:20px;font-weight:800;color:var(--accent);">' + nEquipa + '</div>';
    h += '<div style="font-size:11.5px;color:var(--text-3);margin-top:2px;">' + (nEquipa === 1 ? 'funcionário a cargo' : 'funcionários a cargo') + '</div>';
    h += '</div>';

    h += '<div style="background:var(--bg);border-radius:8px;padding:11px 13px;">';
    h += '<div style="font-size:20px;font-weight:800;color:var(--accent);">' + (outros.length + 1) + '</div>';
    h += '<div style="font-size:11.5px;color:var(--text-3);margin-top:2px;">' + (outros.length ? 'equipamentos sob responsabilidade' : 'equipamento') + '</div>';
    h += '</div>';

    h += '</div>';

    if (outros.length) {
      h += '<div style="margin-top:12px;">';
      h += '<div style="font-size:12px;color:var(--text-3);margin-bottom:6px;">Responde também por:</div>';
      outros.forEach(function(e) {
        h += '<span style="display:inline-block;font-size:12px;background:var(--bg);color:var(--text-2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;margin:0 4px 4px 0;cursor:pointer;" onclick="Dashboard.selectSpot(\'' + e.id + '\')">' + H(e.nome) + '</span>';
      });
      h += '</div>';
    }

    h += '<p style="font-size:11.5px;color:var(--text-3);line-height:1.6;margin:16px 0 0;padding-top:12px;border-top:1px solid var(--border);">';
    h += 'O responsável faz a escala deste equipamento, valida os pedidos de banco de horas da sua equipa e acompanha os memorandos de manutenção.';
    h += '</p>';

    h += '</div>';
    return h;
  }

  function _linhaInfo(label, valor, link) {
    var h = '<div>';
    h += '<div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:3px;">' + H(label) + '</div>';
    if (link && valor !== '—') {
      h += '<a href="' + H(link) + '" style="font-size:13.5px;color:var(--accent);text-decoration:none;font-weight:500;word-break:break-word;">' + H(valor) + '</a>';
    } else {
      h += '<div style="font-size:13.5px;color:' + (valor === '—' ? 'var(--text-3)' : 'var(--text)') + ';font-weight:500;word-break:break-word;">' + H(valor) + '</div>';
    }
    h += '</div>';
    return h;
  }

  function _labelPerfil(p) {
    var M = {
      admin: 'Administrador',
      responsavel_dds: 'Responsável DDS',
      supervisor_udaj: 'Chefe de Unidade — UDAJ',
      supervisor_uase: 'Chefe de Unidade — UASE',
      responsavel: 'Responsável de equipamento',
      professor_responsavel: 'Professor responsável',
      funcionario: 'Funcionário'
    };
    return M[p] || p || '—';
  }

  function _painelFuncionarios(eq) {
    var funcs = (typeof funcsDoEq === 'function')
      ? funcsDoEq(eq.id)
      : APP.utilizadores.filter(function(u) { return u.equipamento_id === eq.id; });

    funcs = funcs.slice().sort(function(a, b) { return (a.nome || '').localeCompare(b.nome || ''); });

    if (!funcs.length) {
      return '<div class="mod-ph"><div class="mod-ph-t">Sem funcionários afectos</div><div class="mod-ph-s">Nenhum funcionário está afecto a ' + H(eq.nome) + '. Atribua em Funcionários → Equipamento.</div></div>';
    }

    var temHoras = (typeof Horas !== 'undefined' && Horas.saldoDe);

    var h = '<div style="padding:2px 0 4px;font-size:12.5px;color:var(--text-3);">' + funcs.length + ' funcionário(s) afecto(s) a <strong>' + H(eq.nome) + '</strong></div>';

    // horas registadas NESTE equipamento
    var horasEq = {};
    if (temHoras) {
      Horas.registos().forEach(function(r) {
        if (r.equipamento_id !== eq.id || r.estado !== 'aprovado') return;
        if (!horasEq[r.funcionario_id]) horasEq[r.funcionario_id] = 0;
        horasEq[r.funcionario_id] += (r.tipo === 'gozada' ? -1 : 1) * (parseFloat(r.horas) || 0);
      });
    }

    h += '<div class="dtw"><table class="dt">';
    h += '<thead><tr><th>Funcionário</th><th>Função</th><th>Vínculo</th>';
    if (temHoras) h += '<th>Serviço aqui</th><th>Saldo total</th>';
    h += '</tr></thead><tbody>';

    funcs.forEach(function(u) {
      var principal = (u.equipamento_id === eq.id);
      h += '<tr>';
      h += '<td><span class="td-p">' + H(u.nome) + '</span>';
      if (!principal) h += '<div class="td-m" style="font-size:10.5px;color:var(--accent);">Apoio (equipamento adicional)</div>';
      if (u.unidade === 'EXTERNA') h += '<div class="td-m" style="font-size:10.5px;color:var(--amber);">Externo — ' + H(u.divisao_origem || 'outra divisão') + '</div>';
      h += '</td>';
      h += '<td class="td-m">' + H(u.funcao || '—') + '</td>';
      h += '<td class="td-m">' + H(u.vinculo || '—') + '</td>';
      if (temHoras) {
        var aqui = horasEq[u.id] || 0;
        var s = Horas.saldoDe(u.id);
        var cor = s.saldo > 0 ? 'var(--green)' : (s.saldo < 0 ? 'var(--red)' : 'var(--text-2)');
        h += '<td class="td-m">' + (aqui ? Horas.fmtH(aqui) : '—') + '</td>';
        h += '<td><strong style="color:' + cor + ';">' + Horas.fmtH(s.saldo) + '</strong></td>';
      }
      h += '</tr>';
    });

    h += '</tbody></table></div>';

    if (temHoras) {
      h += '<p style="font-size:11.5px;color:var(--text-3);margin:8px 0 0;line-height:1.5;">';
      h += '<strong>Serviço aqui</strong>: horas autorizadas com este equipamento indicado. <strong>Saldo total</strong>: banco de horas da pessoa em toda a DDS.';
      h += '</p>';
    }

    return h;
  }

  // ── TAB SWITCH ────────────────────────────────────────────
  function switchTab(el, panelId) {
    el.parentNode.querySelectorAll('.eq-tab').forEach(function(t) { t.classList.remove('active'); });
    el.classList.add('active');
    var parent = el.parentNode.nextSibling;
    if (parent) {
      parent.querySelectorAll('.eq-tab-panel').forEach(function(p) { p.classList.remove('active'); });
    }
    var target = document.getElementById(panelId);
    if (target) target.classList.add('active');

    // carregar conteúdo do módulo se necessário
    var eqId = APP.spotEqId;
    if (panelId === 'ftab-reservas' && typeof Reservas !== 'undefined') {
      Reservas.load(function() {
        var cont = document.getElementById('ftab-reservas-content');
        if (cont) cont.innerHTML = Reservas.render(eqId);
      });
    } else if (panelId === 'ftab-escalas' && typeof Escalas !== 'undefined') {
      Escalas.load(function() {
        var cont = document.getElementById('ftab-escalas-content');
        if (cont) cont.innerHTML = Escalas.render(eqId);
      });
    } else if (panelId === 'ftab-checklist' && typeof Checklist !== 'undefined') {
      Checklist.load(function() {
        var cont = document.getElementById('ftab-checklist-content');
        if (cont) cont.innerHTML = Checklist.render(eqId);
      });
    } else if (panelId === 'ftab-estadias' && typeof Estadias !== 'undefined') {
      Estadias.load(eqId, function() {
        var cont = document.getElementById('ftab-estadias-content');
        if (cont) cont.innerHTML = Estadias.renderPainel(eqId);
      });
    } else if (panelId === 'ftab-visitas' && typeof Visitas !== 'undefined') {
      Visitas.load(eqId, function() {
        var cont = document.getElementById('ftab-visitas-content');
        if (cont) cont.innerHTML = Visitas.renderPainel(eqId);
      });
    }
  }

  // ── ORDENAR EQUIPAMENTOS ─────────────────────────────────
  var _ord = null;
  function abrirOrdem() {
    _ord = (APP.equipamentos || []).slice().sort(compareEq).map(function(e) { return e.id; });
    var m = document.getElementById('m-eq-ordem');
    if (!m) { m = document.createElement('div'); m.className = 'modal-bd'; m.id = 'm-eq-ordem'; document.body.appendChild(m); }
    _desenharOrdem();
    openModal('m-eq-ordem');
  }
  function _desenharOrdem(foco) {
    var m = document.getElementById('m-eq-ordem');
    var h = '<div class="modal" style="max-width:520px;"><div class="modal-header"><div><div class="modal-title">Ordenar equipamentos</div>';
    h += '<div class="modal-sub">Esta ordem é usada no Início, no menu e nos relatórios</div></div>';
    h += '<button class="modal-close" onclick="closeModal(\'m-eq-ordem\')">✕</button></div>';
    h += '<div class="modal-body" style="max-height:62vh;overflow:auto;"><div class="ord-l">';
    _ord.forEach(function(id, i) {
      var e = getEq(id), t = e ? getTipo(e.tipo_id) : null;
      h += '<div class="ord-i' + (id === foco ? ' foco' : '') + '"><span class="ord-n">' + (i + 1) + '</span>';
      h += '<span class="ord-ic">' + H(t && t.emoji ? t.emoji : '🏢') + '</span>';
      h += '<span class="ord-t">' + H(e ? e.nome : '?') + '<small>' + H(t ? t.nome : '') + '</small></span>';
      h += '<button class="ord-b" title="Para o início" onclick="Equipamentos.moverOrdem(' + i + ',-999)"' + (i === 0 ? ' disabled' : '') + '>⤒</button>';
      h += '<button class="ord-b" title="Subir" onclick="Equipamentos.moverOrdem(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + '>▲</button>';
      h += '<button class="ord-b" title="Descer" onclick="Equipamentos.moverOrdem(' + i + ',1)"' + (i === _ord.length - 1 ? ' disabled' : '') + '>▼</button>';
      h += '</div>';
    });
    h += '</div></div><div class="modal-footer">';
    h += '<button class="btn btn-ghost" onclick="Equipamentos.ordemAlfabetica()">A→Z</button><span style="flex:1;"></span>';
    h += '<button class="btn btn-ghost" onclick="closeModal(\'m-eq-ordem\')">Cancelar</button>';
    h += '<button class="btn btn-primary" id="ord-guardar" onclick="Equipamentos.guardarOrdem()">Guardar ordem</button></div></div>';
    var sc = m.querySelector('.modal-body') ? m.querySelector('.modal-body').scrollTop : 0;
    m.innerHTML = h;
    var b = m.querySelector('.modal-body'); if (b) b.scrollTop = sc;
  }
  function moverOrdem(i, d) {
    var j = d === -999 ? 0 : i + d;
    if (j < 0 || j >= _ord.length) return;
    var id = _ord.splice(i, 1)[0];
    _ord.splice(j, 0, id);
    _desenharOrdem(id);
  }
  function ordemAlfabetica() {
    _ord.sort(function(a, b) { return String(getEq(a).nome).localeCompare(String(getEq(b).nome), 'pt'); });
    _desenharOrdem();
  }
  function guardarOrdem() {
    var btn = document.getElementById('ord-guardar');
    if (btn) { btn.disabled = true; btn.textContent = 'A guardar…'; }
    var ps = _ord.map(function(id, i) {
      var e = getEq(id);
      return e && e.ordem === i + 1 ? null : sbPatch('equipamentos', 'id=eq.' + id, { ordem: i + 1 });
    }).filter(Boolean);
    Promise.all(ps).then(function() {
      _ord.forEach(function(id, i) { var e = getEq(id); if (e) e.ordem = i + 1; });
      APP.equipamentos.sort(compareEq);
      closeModal('m-eq-ordem');
      App.buildSidebar(); App.renderContent();
      toast('Ordem guardada.', 'success');
    }).catch(function(err) {
      console.error(err);
      if (btn) { btn.disabled = false; btn.textContent = 'Guardar ordem'; }
      var semColuna = err && (err.code === 'PGRST204' || /ordem/i.test(err.message || ''));
      if (!semColuna) { toast('Não foi possível guardar a ordem.', 'error'); return; }
      var body = document.querySelector('#m-eq-ordem .modal-body');
      body.insertAdjacentHTML('afterbegin', '<div class="mn-aviso" style="margin-bottom:12px;"><b>Falta um passo na base de dados.</b> No Supabase → SQL Editor, corra esta linha e depois carregue outra vez em "Guardar ordem":' +
        '<pre class="ord-sql">alter table public.equipamentos add column if not exists ordem integer;</pre></div>');
      body.scrollTop = 0;
    });
  }

  function abrirFicha(eqId) {
    Eq.abrir(eqId, 'resumo');
  }

    html += '<p style="font-size:12px;color:var(--text-3);margin:-2px 0 10px;line-height:1.5;">Por defeito herdam do tipo. Aqui podes ligar ou desligar módulos só para este equipamento (ex: só o Centro Hípico tem Aulas).</p>';
    MOD_DEFS.forEach(function(m) {
      html += '<div class="form-row"><div class="fi"><label class="fl">' + m.l + '</label>';
      html += '<select id="eqmod-' + m.k + '" class="fin">';
      html += '<option value="">Herdar do tipo</option>';
      html += '<option value="on">Ligar neste equipamento</option>';
      html += '<option value="off">Desligar neste equipamento</option>';
      html += '</select></div></div>';
    });

    // Opção do módulo Reservas: permitir agendamentos recorrentes/permanentes
    html += '<div class="form-row"><div class="fi"><label class="fl">Reservas recorrentes</label>';
    html += '<select id="eq-rec" class="fin">';
    html += '<option value="on">Permitir pontuais e recorrentes</option>';
    html += '<option value="off">Só reservas pontuais</option>';
    html += '</select>';
    html += '<div class="form-hint">Recorrentes = agendamento semanal durante um período (ex: treinos nos pavilhões). Nos equipamentos de eventos pontuais (ex: CEAVM), escolhe “Só pontuais”.</div>';
    html += '</div></div>';

    html += '</div>';
    html += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-eq-novo\')">Cancelar</button><button class="btn btn-primary" onclick="Equipamentos.salvar()">Guardar equipamento</button></div>';
    html += '</div></div>';

    // MODAL GERIR ESPAÇOS
    html += '<div class="modal-bd" id="m-eq-espacos">';
    html += '<div class="modal" style="max-width:560px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-teal"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div><div><div class="modal-title">Gerir espaços</div><div class="modal-sub" id="m-esp-eq">—</div></div><button class="modal-close" onclick="closeModal(\'m-eq-espacos\')">✕</button></div>';
    html += '<div class="modal-body"><div class="form-hint" style="margin-bottom:10px;">Cada espaço reservável com o que contar (ex: Parque de Campismo → Nº de pessoas + Nº de tendas).</div><div id="eq-espacos-list"></div><button class="btn btn-ghost btn-sm" onclick="Equipamentos.addEspaco()" style="margin-top:6px;">+ Adicionar espaço</button></div>';
    html += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-eq-espacos\')">Cancelar</button><button class="btn btn-primary" onclick="Equipamentos.guardarEspacos()">Guardar espaços</button></div>';
    html += '</div></div>';

    // MODAL TIPO
    html += '<div class="modal-bd" id="m-tipo-novo">';
    html += '<div class="modal" style="max-width:560px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-teal"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div><div><div class="modal-title" id="m-tipo-ttl">Novo tipo de equipamento</div><div class="modal-sub">Configure os módulos disponíveis</div></div><button class="modal-close" onclick="closeModal(\'m-tipo-novo\')">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="form-row"><div class="fi"><label class="fl">Nome *</label><input type="text" id="tipo-nome" class="fin" placeholder="ex: Pavilhão Gimnodesportivo"></div><div class="fi"><label class="fl">Emoji</label><input type="text" id="tipo-emoji" class="fin" placeholder="🏟️" maxlength="4" style="font-size:20px;text-align:center;"></div></div>';
    html += '<div class="fi"><label class="fl">Descrição</label><input type="text" id="tipo-desc" class="fin" placeholder="Descrição breve"></div>';
    html += '<div class="form-sec-t">Reservas — espaços e contagem</div>';
    html += '<div class="fi"><label class="fl">Espaços disponíveis</label><input type="text" id="tipo-espacos" class="fin" placeholder="ex: Espaço 1, Espaço 2, Espaço 3"><div class="form-hint">Separe por vírgulas. Deixe vazio se não aplicável.</div></div>';
    html += '<div class="form-row"><div class="fi"><label class="fl">Rótulo da contagem</label><input type="text" id="tipo-lbl-cont" class="fin" placeholder="ex: Nº de alunos"><div class="form-hint">Ex: Nº de pessoas, Nº de alunos</div></div>';
    html += '<div class="fi"><label class="fl">Contagem secundária</label><input type="text" id="tipo-lbl-cont2" class="fin" placeholder="ex: Nº de tendas"><div class="form-hint">Opcional (ex: campismo)</div></div></div>';
    html += '<div class="form-sec-t">Módulos ativos</div>';
    html += '<div id="tipo-mods"></div>';
    html += '</div>';
    html += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-tipo-novo\')">Cancelar</button><button class="btn btn-primary" onclick="Equipamentos.salvarTipo()">Guardar tipo</button></div>';
    html += '</div></div>';

    return html;
  }

  // ── ACÇÕES EQUIPAMENTO ────────────────────────────────────
  function openNovo() {
    APP.editId = null;
    document.getElementById('m-eq-ttl').textContent = 'Novo equipamento';
    ['eq-nome','eq-codigo','eq-morada','eq-local','eq-tel','eq-desc'].forEach(function(id) {
      var el = document.getElementById(id); if (el) el.value = '';
    });
    var cap = document.getElementById('eq-cap'); if (cap) cap.value = '';
    var est = document.getElementById('eq-estado'); if (est) est.value = 'ativo';
    var uni = document.getElementById('eq-unidade'); if (uni) uni.value = '';
    MOD_DEFS.forEach(function(m) {
      var el = document.getElementById('eqmod-' + m.k); if (el) el.value = '';
    });
    var rec = document.getElementById('eq-rec'); if (rec) rec.value = 'on';
    _popularResponsaveis();
    _popularTiposSelect();
    openModal('m-eq-novo');
  }

  function openEditar(id) {
    var eq = APP.equipamentos.filter(function(e) { return e.id === id; })[0];
    if (!eq) return;
    APP.editId = id;
    document.getElementById('m-eq-ttl').textContent = 'Editar equipamento';
    var set = function(eid, val) { var el = document.getElementById(eid); if (el) el.value = val || ''; };
    set('eq-nome',   eq.nome);
    set('eq-codigo', eq.codigo);
    set('eq-morada', eq.morada);
    set('eq-local',  eq.localidade);
    set('eq-tel',    eq.telefone);
    set('eq-desc',   eq.descricao);
    set('eq-estado', eq.estado || 'ativo');
    var cap = document.getElementById('eq-cap'); if (cap) cap.value = eq.capacidade || '';
    set('eq-unidade', eq.unidade);
    var mods = eq.modulos && typeof eq.modulos === 'object' ? eq.modulos : {};
    MOD_DEFS.forEach(function(m) {
      var el = document.getElementById('eqmod-' + m.k);
      if (!el) return;
      if (mods[m.k] === true) el.value = 'on';
      else if (mods[m.k] === false) el.value = 'off';
      else el.value = '';
    });
    var rec = document.getElementById('eq-rec');
    if (rec) rec.value = (mods.reservas_recorrentes === false) ? 'off' : 'on';
    _popularResponsaveis(eq.responsavel_id);
    _popularTiposSelect(eq.tipo_id);
    openModal('m-eq-novo');
  }

  // popula o select de responsável com funcionários com perfil de responsável
  function _popularResponsaveis(selId) {
    var sel = document.getElementById('eq-responsavel');
    if (!sel) return;
    sel.innerHTML = '<option value="">—</option>';
    (APP.utilizadores || [])
      .filter(function(u) {
        return ['responsavel','professor_responsavel'].indexOf(u.perfil) >= 0;
      })
      .sort(function(a, b) { return (a.nome || '').localeCompare(b.nome || ''); })
      .forEach(function(u) {
        var o = document.createElement('option');
        o.value = u.id;
        o.textContent = u.nome;
        if (selId && u.id === selId) o.selected = true;
        sel.appendChild(o);
      });
  }

  function _popularTiposSelect(selId) {
    var sel = document.getElementById('eq-tipo');
    if (!sel) return;
    sel.innerHTML = '<option value="">Selecione o tipo...</option>';
    APP.tiposEq.forEach(function(t) {
      var o = document.createElement('option');
      o.value = t.id;
      o.textContent = (t.emoji ? t.emoji + ' ' : '') + t.nome;
      if (selId && t.id === selId) o.selected = true;
      sel.appendChild(o);
    });
  }

  var _espacoIdx = 0;

  function _renderEspacosList(espacos) {
    _espacoIdx = 0;
    var cont = document.getElementById('eq-espacos-list');
    if (cont) cont.innerHTML = '';
    if (espacos && espacos.length) {
      espacos.forEach(function(e) { addEspaco(e); });
    }
  }

  var _espEqId = null;

  function gerirEspacos(eqId) {
    _espEqId = eqId;
    var eq = getEq(eqId);
    var sub = document.getElementById('m-esp-eq');
    if (sub) sub.textContent = eq ? eq.nome : '—';
    var espacos = (APP.espacos || []).filter(function(x){ return x.equipamento_id === eqId; });
    espacos.sort(function(a,b){ return (a.ordem||0)-(b.ordem||0); });
    _renderEspacosList(espacos);
    openModal('m-eq-espacos');
  }

  function guardarEspacos() {
    if (!_espEqId) return;
    _salvarEspacos(_espEqId, function() {
      toast('Espaços guardados.', 'success');
      closeModal('m-eq-espacos');
      loadAll(function() { App.renderContent(); });
    });
  }

  function addEspaco(e) {
    _espacoIdx++;
    var idx = _espacoIdx;
    var cont = document.getElementById('eq-espacos-list');
    if (!cont) return;
    var div = document.createElement('div');
    div.className = 'esp-row';
    div.dataset.espId = e && e.id ? e.id : '';
    div.style.cssText = 'border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-bottom:8px;background:var(--bg);';
    div.innerHTML =
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:7px;">' +
        '<input type="text" class="fin esp-nome" placeholder="Nome do espaço (ex: Parque de Campismo)" value="' + (e ? H(e.nome||'') : '') + '" style="flex:1;">' +
        '<button class="btn btn-ghost btn-sm" style="color:var(--red);flex-shrink:0;" onclick="this.closest(\'.esp-row\').remove()">✕</button>' +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
        '<input type="text" class="fin esp-cont1" placeholder="Contagem 1 (ex: Nº de pessoas)" value="' + (e ? H(e.label_contagem||'') : 'Nº de pessoas') + '" style="flex:1;font-size:12px;">' +
        '<input type="text" class="fin esp-cont2" placeholder="Contagem 2 (opcional)" value="' + (e ? H(e.label_contagem2||'') : '') + '" style="flex:1;font-size:12px;">' +
      '</div>';
    cont.appendChild(div);
  }

  function _salvarEspacos(eqId, cb) {
    var rows = document.querySelectorAll('#eq-espacos-list .esp-row');
    // apagar os antigos e recriar (simples e fiável)
    sbDelete('equipamento_espacos', 'equipamento_id=eq.' + eqId).then(function() {
      var inserts = [];
      rows.forEach(function(row, i) {
        var nome = (row.querySelector('.esp-nome').value || '').trim();
        if (!nome) return;
        inserts.push(sbPost('equipamento_espacos', {
          equipamento_id: eqId,
          nome: nome,
          label_contagem:  (row.querySelector('.esp-cont1').value || 'Nº de pessoas').trim(),
          label_contagem2: (row.querySelector('.esp-cont2').value || '').trim() || null,
          ordem: i
        }));
      });
      if (!inserts.length) { if (cb) cb(); return; }
      Promise.all(inserts).then(function() { if (cb) cb(); }).catch(function() { if (cb) cb(); });
    }).catch(function() { if (cb) cb(); });
  }

  function salvar() {
    var nome  = document.getElementById('eq-nome');
    var tipo  = document.getElementById('eq-tipo');
    if (!nome || !nome.value.trim()) { toast('Nome obrigatório.', 'error'); return; }
    if (!tipo || !tipo.value) { toast('Selecione o tipo.', 'error'); return; }
    var cap = document.getElementById('eq-cap');
    var body = {
      nome:       nome.value.trim(),
      tipo_id:    tipo.value,
      codigo:     (document.getElementById('eq-codigo') || {}).value || '',
      morada:     (document.getElementById('eq-morada') || {}).value || '',
      localidade: (document.getElementById('eq-local')  || {}).value || '',
      telefone:   (document.getElementById('eq-tel')    || {}).value || '',
      descricao:  (document.getElementById('eq-desc')   || {}).value || '',
      estado:     (document.getElementById('eq-estado') || {}).value || 'ativo',
      capacidade: cap && cap.value ? parseInt(cap.value, 10) : null,
      unidade:        (document.getElementById('eq-unidade')     || {}).value || null,
      responsavel_id: (document.getElementById('eq-responsavel') || {}).value || null
    };
    // módulos: só guarda as excepções ao tipo
    var mods = {};
    MOD_DEFS.forEach(function(m) {
      var el = document.getElementById('eqmod-' + m.k);
      if (!el) return;
      if (el.value === 'on') mods[m.k] = true;
      else if (el.value === 'off') mods[m.k] = false;
    });
    // reservas recorrentes: só grava a excepção quando é "off" (o default é permitir)
    var recEl = document.getElementById('eq-rec');
    if (recEl && recEl.value === 'off') mods.reservas_recorrentes = false;
    body.modulos = mods;
    var p = APP.editId
      ? sbPatch('equipamentos', 'id=eq.' + APP.editId, body)
      : sbPost('equipamentos', body);
    p.then(function() {
      toast(APP.editId ? 'Equipamento atualizado.' : 'Equipamento criado.', 'success');
      closeModal('m-eq-novo');
      loadAll(function() { App.renderContent(); App.buildSidebar(); });
    }).catch(function() { toast('Erro ao guardar.', 'error'); });
  }

  // ── ACÇÕES TIPO ───────────────────────────────────────────
  function openNovoTipo() {
    APP.editId = null;
    document.getElementById('m-tipo-ttl').textContent = 'Novo tipo de equipamento';
    var n = document.getElementById('tipo-nome'); if (n) n.value = '';
    var e = document.getElementById('tipo-emoji'); if (e) e.value = '';
    var d = document.getElementById('tipo-desc'); if (d) d.value = '';
    var es = document.getElementById('tipo-espacos'); if (es) es.value = '';
    var lc = document.getElementById('tipo-lbl-cont'); if (lc) lc.value = '';
    var lc2 = document.getElementById('tipo-lbl-cont2'); if (lc2) lc2.value = '';
    _renderTogglesMods({});
    openModal('m-tipo-novo');
  }

  function openEditarTipo(id) {
    var tipo = APP.tiposEq.filter(function(t) { return t.id === id; })[0];
    if (!tipo) return;
    APP.editId = id;
    document.getElementById('m-tipo-ttl').textContent = 'Editar tipo';
    var n = document.getElementById('tipo-nome'); if (n) n.value = tipo.nome || '';
    var e = document.getElementById('tipo-emoji'); if (e) e.value = tipo.emoji || '';
    var d = document.getElementById('tipo-desc'); if (d) d.value = tipo.descricao || '';
    var es = document.getElementById('tipo-espacos'); if (es) es.value = tipo.espacos || '';
    var lc = document.getElementById('tipo-lbl-cont'); if (lc) lc.value = tipo.label_contagem || '';
    var lc2 = document.getElementById('tipo-lbl-cont2'); if (lc2) lc2.value = tipo.label_contagem2 || '';
    _renderTogglesMods(tipo);
    openModal('m-tipo-novo');
  }

  function _renderTogglesMods(tipo) {
    var c = document.getElementById('tipo-mods');
    if (!c) return;
    c.innerHTML = '';
    MOD_DEFS.forEach(function(m) {
      var on = !!(tipo && tipo['mod_' + m.k]);
      var row = document.createElement('label');
      row.className = 'toggle-row' + (on ? ' on' : '');
      row.innerHTML = '<div class="t-body"><div class="t-title">' + H(m.l) + '</div><div class="t-sub">' + H(m.s) + '</div></div>' +
        '<div class="t-sw"><input type="checkbox" id="tmod-' + m.k + '"' + (on ? ' checked' : '') + '><div class="t-track"></div><div class="t-thumb"></div></div>';
      var cb = row.querySelector('input');
      cb.onchange = function() { row.classList.toggle('on', cb.checked); };
      c.appendChild(row);
    });
  }

  function salvarTipo() {
    var n = document.getElementById('tipo-nome');
    if (!n || !n.value.trim()) { toast('Nome obrigatório.', 'error'); return; }
    var body = {
      nome:      n.value.trim(),
      emoji:     (document.getElementById('tipo-emoji') || {}).value || '🏢',
      descricao: (document.getElementById('tipo-desc')  || {}).value || '',
      espacos:         (document.getElementById('tipo-espacos')   || {}).value || '',
      label_contagem:  (document.getElementById('tipo-lbl-cont')  || {}).value || 'Nº de pessoas',
      label_contagem2: (document.getElementById('tipo-lbl-cont2') || {}).value || ''
    };
    MOD_DEFS.forEach(function(m) {
      var cb = document.getElementById('tmod-' + m.k);
      body['mod_' + m.k] = cb ? cb.checked : false;
    });
    var p = APP.editId
      ? sbPatch('tipos_equipamento', 'id=eq.' + APP.editId, body)
      : sbPost('tipos_equipamento', body);
    p.then(function() {
      toast(APP.editId ? 'Tipo atualizado.' : 'Tipo criado.', 'success');
      closeModal('m-tipo-novo');
      loadAll(function() { App.renderContent(); App.buildSidebar(); });
    }).catch(function() { toast('Erro ao guardar.', 'error'); });
  }

  // ── HELPERS ───────────────────────────────────────────────
  function _statCard(ic, val, label) {
    return '<div class="stat-card"><div class="stat-ic ' + ic + '"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div><div class="stat-body"><div class="stat-lbl">' + H(label) + '</div><div class="stat-val">' + val + '</div></div></div>';
  }

  function init() {
    var cont = document.getElementById('modais-equipamentos');
    if (cont) cont.innerHTML = getModaisHTML();
  }

  return {
    render: render,
    init: init,
    openNovo: openNovo,
    openEditar: openEditar,
    addEspaco: addEspaco,
    gerirEspacos: gerirEspacos,
    guardarEspacos: guardarEspacos,
    salvar: salvar,
    openNovoTipo: openNovoTipo,
    openEditarTipo: openEditarTipo,
    salvarTipo: salvarTipo,
    abrirFicha: abrirFicha,
    abrirOrdem: abrirOrdem, moverOrdem: moverOrdem, ordemAlfabetica: ordemAlfabetica, guardarOrdem: guardarOrdem,
    painelFuncionarios: _painelFuncionarios,
    painelResponsavel: _painelResponsavel,
    switchTab: switchTab
  };

})();

</script>
<script>
/* ═════ utilizadores.js ═════ */
// ============================================================
// GestDDS — utilizadores.js  v5.1
// Gestão completa de utilizadores e perfis de acesso
// ============================================================

var Utilizadores = (function() {

  // Menus configuráveis nos acessos personalizados
  // (Utilizadores fica de fora — é sempre só admin)
  var MENUS_ACESSO = [
    ['memorandos',  'Memorandos'],
    ['reservas',    'Reservas'],
    ['escalas',     'Escalas e Turnos'],
    ['checklists',  'Checklists'],
    ['ferias',      'Férias'],
    ['horas',       'Banco de Horas'],
    ['estadias',    'Check-in / Check-out'],
    ['visitas',     'Registo de Visitas'],
    ['relatorios',  'Relatórios'],
    ['funcionarios','Funcionários']
  ];

  var PERFIS = [
    { v: 'admin',                 l: 'Administrador' },
    { v: 'responsavel_dds',       l: 'Responsável DDS' },
    { v: 'supervisor_udaj',       l: 'Chefe de Unidade — UDAJ' },
    { v: 'supervisor_uase',       l: 'Chefe de Unidade — UASE' },
    { v: 'responsavel',           l: 'Responsável de Equipamento' },
    { v: 'professor_responsavel', l: 'Professor Responsável' },
    { v: 'funcionario',           l: 'Funcionário' }
  ];

  // ── RENDER ────────────────────────────────────────────────
  function render() {
    if (!APP.isDds()) return accessDenied();

    var isAdmin = APP.isAdmin();
    var html = '<div class="dash-greeting">';
    html += '<div><div class="dash-hello" style="font-size:18px;">Utilizadores</div>';
    html += '<div class="dash-sub">Funcionários com acesso à plataforma — códigos, perfis e permissões. Para dar acesso a alguém, use o menu Funcionários.</div></div>';
    html += '</div>';

    // só quem tem acesso à app
    var comAcesso = APP.utilizadores.filter(function(u) { return u.tem_acesso === true; });

    if (!comAcesso.length) {
      return html + emptyState('Sem utilizadores com acesso', 'Nenhum funcionário tem acesso à app. Dê acesso no menu Funcionários.');
    }

    // Separar DDS de Equipamentos
    var dds = comAcesso.filter(function(u) { return u.isDds; });
    var eqs = comAcesso.filter(function(u) { return !u.isDds; });

    html += _secHead('Equipa DDS', dds.length);
    html += _tabela(dds, isAdmin);

    if (eqs.length) {
      html += '<div style="margin-top:20px;">';
      html += _secHead('Responsáveis e Funcionários', eqs.length);
      html += _tabela(eqs, isAdmin);
      html += '</div>';
    }

    return html;
  }

  function _secHead(title, count) {
    return '<div class="sec-head"><div class="sec-title">' + H(title) +
      ' <span class="sec-badge">' + count + '</span></div></div>';
  }

  function _tabela(utilizadores, isAdmin) {
    if (!utilizadores.length) return emptyState('Sem registos', '');

    var html = '<div class="dtw"><table class="dt">';
    html += '<thead><tr><th>Utilizador</th><th>Nome</th><th>Perfil</th><th>Equipamento</th><th>Código</th><th>Estado</th>';
    if (isAdmin) html += '<th></th>';
    html += '</tr></thead><tbody>';

    utilizadores.forEach(function(u) {
      var pal = PERFIL_PALETTES[u.perfil] || ['#F1F5F9','#475569'];
      var ini = iniciais(u.nome);
      var eq  = u.equipamento_id ? getEq(u.equipamento_id) : null;
      var ativo = u.ativo !== false;

      html += '<tr>';
      html += '<td><div style="display:flex;align-items:center;gap:8px;">';
      html += '<div style="width:30px;height:30px;border-radius:50%;background:' + pal[0] + ';color:' + pal[1] + ';font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">' + ini + '</div>';
      html += '<span class="td-mono">' + H(u.username || '—') + '</span></div></td>';
      html += '<td class="td-p">' + H(u.nome) + '</td>';
      html += '<td><span class="bdg" style="background:' + pal[0] + ';color:' + pal[1] + ';">' + H(_labelPerfil(u.perfil)) + '</span>';
      var nExc = u.permissoes_extra ? Object.keys(u.permissoes_extra).length : 0;
      if (nExc > 0) html += '<div class="td-m" style="font-size:10.5px;margin-top:3px;color:var(--amber);" title="Acessos personalizados ativos">🔑 ' + nExc + ' excepç' + (nExc > 1 ? 'ões' : 'ão') + '</div>';
      html += '</td>';
      html += '<td class="td-m">' + H(eq ? eq.nome : (u.isDds ? 'Acesso global' : '—')) + '</td>';
      html += '<td><span class="td-mono" style="font-size:12px;background:var(--bg);padding:2px 8px;border-radius:6px;border:1px solid var(--border);">' + H(u.codigo || '—') + '</span></td>';
      html += '<td>' + (ativo
        ? '<span class="bdg bdg-ativo"><span class="bdg-dot"></span>Ativo</span>'
        : '<span class="bdg bdg-inativo">Inativo</span>') + '</td>';

      if (isAdmin) {
        html += '<td><div class="td-act">';
        html += '<button class="btn btn-ghost btn-sm" onclick="Utilizadores.openEditar(\'' + u.id + '\')">Editar</button>';
        // não permitir retirar o próprio acesso
        if (APP.user && u.id !== APP.user.id) {
          html += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Utilizadores.confirmarApagar(\'' + u.id + '\',\'' + H(u.nome) + '\')">Retirar acesso</button>';
        }
        html += '</div></td>';
      }
      html += '</tr>';
    });

    html += '</tbody></table></div>';
    return html;
  }

  function _labelPerfil(p) {
    var found = PERFIS.filter(function(x) { return x.v === p; })[0];
    return found ? found.l : (p || '—');
  }

  // ── MODAL HTML ────────────────────────────────────────────
  function getModaisHTML() {
    var html = '';

    // MODAL UTILIZADOR
    html += '<div class="modal-bd" id="m-util-novo">';
    html += '<div class="modal" style="max-width:520px;">';
    html += '<div class="modal-header">';
