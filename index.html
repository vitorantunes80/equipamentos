    h += '<div class="modal-header"><div class="mh-ic mhi-green"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg></div>';
    h += '<div><div class="modal-title" id="m-vis-ttl">Registar visita</div><div class="modal-sub" id="m-vis-eq">—</div></div>';
    h += '<button class="modal-close" onclick="closeModal(\'m-vis-novo\')">✕</button></div>';
    h += '<div class="modal-body">';

    h += '<div class="form-row">';
    h += '<div class="fi"><label class="fl">Data *</label><input type="date" id="vis-data" class="fin"></div>';
    h += '<div class="fi"><label class="fl">Tipo *</label><select id="vis-tipo" class="fin">';
    TIPOS.forEach(function(t){ h += '<option value="' + t.v + '">' + t.i + ' ' + t.l + '</option>'; });
    h += '</select></div>';
    h += '</div>';

    h += '<div class="fi"><label class="fl">Entidade / Nome</label>';
    h += '<input type="text" id="vis-entidade" class="fin" placeholder="ex: EB1 de Cabeceiras, Família Silva">';
    h += '<p style="font-size:11.5px;color:var(--text-3);margin:4px 0 0;">Deixe em branco se for uma visita anónima.</p></div>';

    h += '<div class="form-row">';
    h += '<div class="fi"><label class="fl">Adultos *</label><input type="number" id="vis-adultos" class="fin" min="0" value="0"></div>';
    h += '<div class="fi"><label class="fl">Crianças (até 12 anos)</label><input type="number" id="vis-criancas" class="fin" min="0" value="0"></div>';
    h += '</div>';

    h += '<div class="fi"><label class="fl">Nacionalidade</label>';
    h += '<input type="text" id="vis-pais" class="fin" list="vis-paises" placeholder="Portugal">';
    h += '<datalist id="vis-paises">';
    PAISES.forEach(function(p){ h += '<option value="' + p + '"></option>'; });
    h += '</datalist></div>';

    h += '<div class="fi"><label class="fl">Observações</label><textarea id="vis-obs" class="fin" rows="2" placeholder="ex: Visita guiada aos animais"></textarea></div>';

    h += '</div>';
    h += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-vis-novo\')">Cancelar</button>';
    h += '<button class="btn btn-primary" onclick="Visitas.salvar()">Guardar</button></div>';
    h += '</div></div>';
    return h;
  }

  // ── ACÇÕES ────────────────────────────────────────────────
  function _redesenhar() {
    App.renderContent();
  }

  function setMes(m) {
    APP.repMes = m || null;
    _redesenhar();
  }

  function openNovo(eqId) {
    _garantirModais();
    APP.editId = null;
    _eqId = eqId || _eqId;
    var eq = getEq(_eqId);
    var set = function(i,v){ var el = document.getElementById(i); if (el) el.value = v; };

    var t = document.getElementById('m-vis-ttl'); if (t) t.textContent = 'Registar visita';
    var e = document.getElementById('m-vis-eq');  if (e) e.textContent = eq ? eq.nome : '—';

    set('vis-data', _hoje());
    set('vis-tipo', 'escola');
    set('vis-entidade', '');
    set('vis-adultos', 0);
    set('vis-criancas', 0);
    set('vis-pais', 'Portugal');
    set('vis-obs', '');
    openModal('m-vis-novo');
  }

  function openEditar(id) {
    _garantirModais();
    var v = _lista.filter(function(x){ return x.id === id; })[0];
    if (!v) return;
    APP.editId = id;
    var eq = getEq(v.equipamento_id);
    var set = function(i,val){ var el = document.getElementById(i); if (el) el.value = (val == null ? '' : val); };

    var t = document.getElementById('m-vis-ttl'); if (t) t.textContent = 'Editar visita';
    var e = document.getElementById('m-vis-eq');  if (e) e.textContent = eq ? eq.nome : '—';

    set('vis-data', v.data);
    set('vis-tipo', v.tipo_visitante);
    set('vis-entidade', v.entidade);
    set('vis-adultos', v.n_adultos);
    set('vis-criancas', v.n_criancas);
    set('vis-pais', v.nacionalidade);
    set('vis-obs', v.observacoes);
    openModal('m-vis-novo');
  }

  function salvar() {
    if (!_podeGerir(_eqId)) { toast('Não tem autorização para registar visitas.', 'error'); return; }

    var v = function(i){ var el = document.getElementById(i); return el ? el.value : ''; };
    var data = v('vis-data');
    var ad = parseInt(v('vis-adultos'),10) || 0;
    var cr = parseInt(v('vis-criancas'),10) || 0;

    if (!data) { toast('Indique a data.', 'error'); return; }
    if (ad + cr < 1) { toast('Indique pelo menos uma pessoa.', 'error'); return; }

    var body = {
      equipamento_id: _eqId,
      data:           data,
      tipo_visitante: v('vis-tipo') || 'particular',
      entidade:       (v('vis-entidade') || '').trim() || null,
      n_adultos:      ad,
      n_criancas:     cr,
      nacionalidade:  (v('vis-pais') || '').trim() || null,
      observacoes:    (v('vis-obs') || '').trim() || null,
      criado_por:     APP.user ? APP.user.id : null
    };

    var p = APP.editId
      ? sbPatch('visitas', 'id=eq.' + APP.editId, body)
      : sbPost('visitas', body);

    p.then(function() {
      toast(APP.editId ? 'Visita atualizada.' : 'Visita registada.', 'success');
      closeModal('m-vis-novo');
      load(_eqId, function() { _redesenhar(); });
    }).catch(function(e) {
      console.error('Erro visita:', e);
      var msg = [e && e.code, e && e.message].filter(Boolean).join(' · ');
      toast('Erro ao guardar: ' + (msg || 'desconhecido'), 'error');
    });
  }

  function apagar(id) {
    if (!_podeGerir(_eqId)) return;
    if (!confirm('Apagar este registo de visita?')) return;
    sbDelete('visitas', 'id=eq.' + id).then(function() {
      toast('Visita apagada.', 'success');
      load(_eqId, function() { _redesenhar(); });
    }).catch(function() { toast('Erro ao apagar.', 'error'); });
  }

  // ── RELATÓRIO MENSAL (visitas + reservas do equipamento) ──
  function imprimir() {
    var eq = getEq(_eqId);
    var ano = APP.anoTrabalho || new Date().getFullYear();

    var vis = _lista.filter(function(v){ return _noPeriodo(v.data); });

    // reservas do mesmo equipamento e período
    var res = (APP.reservas || []).filter(function(r) {
      return r.equipamento_id === _eqId && _noPeriodo(r.data_inicio || r.data);
    });

    var vAd = 0, vCr = 0;
    var porTipo = {}, porPais = {};
    vis.forEach(function(v) {
      var a = parseInt(v.n_adultos,10)||0, c = parseInt(v.n_criancas,10)||0;
      vAd += a; vCr += c;
      var t = v.tipo_visitante || 'outro';
      if (!porTipo[t]) porTipo[t] = { n:0, pessoas:0, criancas:0 };
      porTipo[t].n++; porTipo[t].pessoas += a+c; porTipo[t].criancas += c;
      var p = v.nacionalidade || 'Não indicado';
      if (!porPais[p]) porPais[p] = { n:0, pessoas:0 };
      porPais[p].n++; porPais[p].pessoas += a+c;
    });

    var rPessoas = 0;
    res.forEach(function(r) { rPessoas += (parseInt(r.num_pessoas,10) || 0); });

    var totalPessoas = vAd + vCr + rPessoas;

    var hoje = new Date();
    var dh = ('0'+hoje.getDate()).slice(-2)+'/'+('0'+(hoje.getMonth()+1)).slice(-2)+'/'+hoje.getFullYear();

    var h = '<div class="pr-head"><div class="pr-head-top"><div>';
    h += '<div class="pr-org">Município de Cabeceiras de Basto · Divisão de Desenvolvimento Social</div>';
    h += '<div class="pr-title">Relatório de Atividade</div>';
    h += '<div class="pr-meta">' + H(eq ? eq.nome : '') + ' · Emitido em ' + dh + '</div>';
    h += '</div><div class="pr-chip">' + H(_perLabel()) + '</div></div></div>';

    // KPIs
    h += '<div class="pr-kpis">';
    h += '<div class="pr-kpi"><div class="pr-kpi-v">' + totalPessoas + '</div><div class="pr-kpi-l">Total de pessoas</div></div>';
    h += '<div class="pr-kpi"><div class="pr-kpi-v">' + vis.length + '</div><div class="pr-kpi-l">Visitas</div></div>';
    h += '<div class="pr-kpi"><div class="pr-kpi-v">' + res.length + '</div><div class="pr-kpi-l">Reservas</div></div>';
    h += '<div class="pr-kpi"><div class="pr-kpi-v">' + vCr + '</div><div class="pr-kpi-l">Crianças</div></div>';
    h += '</div>';

    // resumo
    h += '<div class="pr-sec">Resumo da afluência</div>';
    h += '<table class="pr-table"><colgroup><col style="width:44%"><col style="width:18%"><col style="width:19%"><col style="width:19%"></colgroup>';
    h += '<thead><tr><th>Origem</th><th>Ocorrências</th><th>Pessoas</th><th>% do total</th></tr></thead><tbody>';
    var pctV = totalPessoas ? Math.round((vAd+vCr)/totalPessoas*100) : 0;
    var pctR = totalPessoas ? Math.round(rPessoas/totalPessoas*100) : 0;
    h += '<tr><td>Visitas (sem reserva)</td><td>' + vis.length + '</td><td>' + (vAd+vCr) + '</td><td>' + pctV + '%</td></tr>';
    h += '<tr><td>Reservas</td><td>' + res.length + '</td><td>' + rPessoas + '</td><td>' + pctR + '%</td></tr>';
    h += '<tr class="pr-tot"><td>Total</td><td>' + (vis.length + res.length) + '</td><td>' + totalPessoas + '</td><td>100%</td></tr>';
    h += '</tbody></table>';

    // visitas por tipo
    if (vis.length) {
      h += '<div class="pr-sec">Visitas por tipo de visitante</div>';
      h += '<table class="pr-table"><colgroup><col style="width:40%"><col style="width:15%"><col style="width:15%"><col style="width:15%"><col style="width:15%"></colgroup>';
      h += '<thead><tr><th>Tipo</th><th>Visitas</th><th>Adultos</th><th>Crianças</th><th>Total</th></tr></thead><tbody>';
      Object.keys(porTipo).sort(function(a,b){ return porTipo[b].pessoas - porTipo[a].pessoas; }).forEach(function(t) {
        var d = porTipo[t];
        h += '<tr><td>' + _tipo(t).l + '</td><td>' + d.n + '</td><td>' + (d.pessoas - d.criancas) + '</td><td>' + d.criancas + '</td><td><strong>' + d.pessoas + '</strong></td></tr>';
      });
      h += '<tr class="pr-tot"><td>Total</td><td>' + vis.length + '</td><td>' + vAd + '</td><td>' + vCr + '</td><td>' + (vAd+vCr) + '</td></tr>';
      h += '</tbody></table>';

      // nacionalidade
      h += '<div class="pr-sec">Visitas por nacionalidade</div>';
      h += '<table class="pr-table"><colgroup><col style="width:50%"><col style="width:25%"><col style="width:25%"></colgroup>';
      h += '<thead><tr><th>País</th><th>Visitas</th><th>Pessoas</th></tr></thead><tbody>';
      Object.keys(porPais).sort(function(a,b){ return porPais[b].pessoas - porPais[a].pessoas; }).forEach(function(p) {
        h += '<tr><td>' + H(p) + '</td><td>' + porPais[p].n + '</td><td><strong>' + porPais[p].pessoas + '</strong></td></tr>';
      });
      h += '</tbody></table>';
    }

    // reservas detalhadas
    if (res.length) {
      h += '<div class="pr-sec">Reservas (' + res.length + ')</div>';
      h += '<table class="pr-table"><colgroup><col style="width:14%"><col style="width:30%"><col style="width:26%"><col style="width:15%"><col style="width:15%"></colgroup>';
      h += '<thead><tr><th>Data</th><th>Título</th><th>Entidade</th><th>Espaço</th><th>Pessoas</th></tr></thead><tbody>';
      res.slice().sort(function(a,b){ return new Date(a.data_inicio||a.data) - new Date(b.data_inicio||b.data); }).forEach(function(r) {
        var esp = r.espaco_id ? ((APP.espacos||[]).filter(function(x){ return x.id === r.espaco_id; })[0]||{}).nome : null;
        h += '<tr><td>' + _fdata(r.data_inicio || r.data) + '</td><td>' + H(r.titulo || '—') + '</td><td>' + H(r.entidade || '—') + '</td><td>' + H(esp || '—') + '</td><td>' + (r.num_pessoas || 0) + '</td></tr>';
      });
      h += '<tr class="pr-tot"><td colspan="4">Total</td><td>' + rPessoas + '</td></tr>';
      h += '</tbody></table>';
    }

    // detalhe das visitas
    if (vis.length) {
      h += '<div class="pr-sec">Detalhe das visitas (' + vis.length + ')</div>';
      h += '<table class="pr-table"><colgroup><col style="width:12%"><col style="width:20%"><col style="width:28%"><col style="width:11%"><col style="width:11%"><col style="width:18%"></colgroup>';
      h += '<thead><tr><th>Data</th><th>Tipo</th><th>Entidade</th><th>Adultos</th><th>Crianças</th><th>País</th></tr></thead><tbody>';
      vis.slice().sort(function(a,b){ return new Date(a.data) - new Date(b.data); }).forEach(function(v) {
        h += '<tr><td>' + _fdata(v.data) + '</td><td>' + _tipo(v.tipo_visitante).l + '</td><td>' + H(v.entidade || '—') + '</td><td>' + (v.n_adultos||0) + '</td><td>' + (v.n_criancas||0) + '</td><td>' + H(v.nacionalidade || '—') + '</td></tr>';
      });
      h += '</tbody></table>';
    }

    if (!vis.length && !res.length) {
      h += '<div class="pr-empty">Não há atividade registada neste período.</div>';
    }

    h += '<div class="pr-foot">GestDDS · Divisão de Desenvolvimento Social · Município de Cabeceiras de Basto</div>';

    var root = document.getElementById('print-root');
    if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
    root.innerHTML = h;
    window.print();
  }

  function init() {}

  return {
    init: init, load: load, renderPainel: renderPainel,
    openNovo: openNovo, openEditar: openEditar, salvar: salvar, apagar: apagar,
    setMes: setMes, imprimir: imprimir,
    lista: function() { return _lista; },
    pessoas: _pessoas
  };

})();

</script>
<script>
/* ═════ funcionarios.js ═════ */
// ============================================================
// GestDDS — funcionarios.js  v5.1
// Gestão de funcionários afectos aos equipamentos
// ============================================================

var Funcionarios = (function() {

  // ── RENDER ────────────────────────────────────────────────
  function render() {
    var isAdmin = APP.isAdmin();
    var isDds   = APP.isDds();
    var podeGerir = isAdmin || isDds || APP.isResponsavel();

    var html = '<div class="dash-greeting">';
    html += '<div><div class="dash-hello" style="font-size:18px;">Funcionários</div>';
    html += '<div class="dash-sub">Funcionários afectos aos equipamentos da divisão.</div></div>';
    if (podeGerir) {
      html += '<button class="btn btn-primary" onclick="Funcionarios.openNovo()">+ Novo funcionário</button>';
    }
    html += '</div>';

    // Funcionários = lista mestra de TODO o pessoal.
    // (o menu Utilizadores é que filtra só quem tem acesso à app)
    var funcs = APP.utilizadores.slice();

    // Se não-DDS, mostrar só do seu equipamento
    if (!isDds && APP.user && APP.user.equipamento_id) {
      funcs = funcs.filter(function(u) {
        return u.equipamento_id === APP.user.equipamento_id;
      });
    }

    if (!funcs.length) {
      return html + emptyState('Sem funcionários', 'Nenhum funcionário registado.');
    }

    // Agrupar por equipamento
    var groups = {};
    var semEq = [];
    funcs.forEach(function(u) {
      if (u.equipamento_id) {
        if (!groups[u.equipamento_id]) groups[u.equipamento_id] = [];
        groups[u.equipamento_id].push(u);
      } else {
        semEq.push(u);
      }
    });

    // Por equipamento
    APP.equipamentos.forEach(function(eq) {
      if (!groups[eq.id] || !groups[eq.id].length) return;
      html += '<div style="margin-bottom:20px;">';
      html += '<div class="sec-head"><div class="sec-title">';
      var tipo = eq.tipo_id ? APP.tiposEq.filter(function(t) { return t.id === eq.tipo_id; })[0] : null;
      html += (tipo && tipo.emoji ? tipo.emoji + ' ' : '') + H(eq.nome);
      html += ' <span class="sec-badge">' + groups[eq.id].length + '</span></div></div>';
      html += _tabela(groups[eq.id], podeGerir);
      html += '</div>';
    });

    // Sem equipamento
    if (semEq.length) {
      html += '<div style="margin-bottom:20px;">';
      html += '<div class="sec-head"><div class="sec-title">Sem equipamento atribuído <span class="sec-badge">' + semEq.length + '</span></div></div>';
      html += _tabela(semEq, podeGerir);
      html += '</div>';
    }

    return html;
  }

  function _opcoesGuardadas(campo, predefinidos) {
    // reunir valores únicos: predefinidos + os já usados nos utilizadores
    var set = {};
    (predefinidos || []).forEach(function(v) { if (v) set[v] = true; });
    (APP.utilizadores || []).forEach(function(u) {
      var v = u[campo];
      if (v && String(v).trim()) set[String(v).trim()] = true;
    });
    var opcoes = Object.keys(set).sort();
    return opcoes.map(function(v) { return '<option value="' + H(v) + '"></option>'; }).join('');
  }

  function _tabela(funcs, podeEditar) {
    var isAdmin = APP.isAdmin();
    var html = '<div class="dtw"><table class="dt">';
    html += '<thead><tr><th>Nome</th><th>Perfil</th><th>Unidade / Categoria</th><th>Código</th><th>Estado</th><th>Acesso à app</th>';
    if (podeEditar) html += '<th></th>';
    html += '</tr></thead><tbody>';

    funcs.forEach(function(u) {
      var pal  = PERFIL_PALETTES[u.perfil] || ['#F1F5F9','#475569'];
      var ini  = iniciais(u.nome);
      var ativo = u.ativo !== false;

      html += '<tr>';
      html += '<td><div style="display:flex;align-items:center;gap:10px;">';
      html += '<div style="width:34px;height:34px;border-radius:50%;background:' + pal[0] + ';color:' + pal[1] + ';font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">' + ini + '</div>';
      html += '<div><div class="td-p">' + H(u.nome) + '</div>';
      if (u.funcao) html += '<div class="td-m">' + H(u.funcao) + '</div>';
      if (u.num_mecanografico) html += '<div class="td-m" style="font-size:11px;">Nº ' + H(u.num_mecanografico) + '</div>';
      html += '</div></div></td>';
      html += '<td><span class="bdg" style="background:' + pal[0] + ';color:' + pal[1] + ';">' + H(_labelPerfil(u.perfil)) + '</span></td>';
      html += '<td>';
      if (u.unidade === 'EXTERNA') {
        html += '<span class="td-p" style="font-size:12.5px;color:var(--amber);">Externo à DDS</span>';
        if (u.divisao_origem) html += '<div class="td-m" style="font-size:11px;">' + H(u.divisao_origem) + '</div>';
      } else if (u.unidade) {
        html += '<span class="td-p" style="font-size:12.5px;">' + H(u.unidade) + '</span>';
      }
      if (u.area) html += '<div class="td-m">' + H(u.area) + '</div>';
      if (u.categoria) html += '<div class="td-m" style="font-size:11px;">' + H(u.categoria) + '</div>';
      if (u.vinculo) html += '<div class="td-m" style="font-size:10.5px;margin-top:2px;color:' + (u.vinculo === 'Recibo verde' || u.vinculo === 'Avença' ? 'var(--amber)' : 'var(--text-3)') + ';">' + H(u.vinculo) + '</div>';
      if (!u.unidade && !u.area && !u.categoria) html += '<span class="td-m">—</span>';
      html += '</td>';
      html += '<td><span class="td-mono" style="font-size:12px;background:var(--bg);padding:2px 8px;border-radius:6px;border:1px solid var(--border);">' + (isAdmin ? H(u.codigo || '—') : (u.codigo ? '••••' : '—')) + '</span></td>';
      html += '<td>' + (ativo
        ? '<span class="bdg bdg-ativo"><span class="bdg-dot"></span>Ativo</span>'
        : '<span class="bdg bdg-inativo">Inativo</span>') + '</td>';

      // Acesso à app
      var temAcesso = u.tem_acesso === true;
      html += '<td>';
      html += temAcesso
        ? '<span class="bdg" style="background:#DCFCE7;color:#15803D;">💻 Com acesso</span>'
        : '<span class="bdg" style="background:var(--bg);color:var(--text-3);">Sem acesso</span>';
      if (isAdmin && APP.user && u.id !== APP.user.id) {
        html += temAcesso
          ? '<div style="margin-top:4px;"><button class="btn btn-ghost btn-sm" style="color:var(--red);font-size:11px;" onclick="Funcionarios.retirarAcesso(\'' + u.id + '\')">Retirar acesso</button></div>'
          : '<div style="margin-top:4px;"><button class="btn btn-ghost btn-sm" style="color:var(--accent);font-size:11px;" onclick="Funcionarios.darAcesso(\'' + u.id + '\')">Dar acesso</button></div>';
      }
      html += '</td>';

      if (podeEditar) {
        html += '<td><div class="td-act">';
        html += '<button class="btn btn-ghost btn-sm" onclick="Funcionarios.openEditar(\'' + u.id + '\')">Editar</button>';
        if (APP.user && u.id !== APP.user.id) {
          html += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Funcionarios.confirmarApagar(\'' + u.id + '\',\'' + H(u.nome) + '\')">Apagar</button>';
        }
        html += '</div></td>';
      }
      html += '</tr>';
    });

    html += '</tbody></table></div>';
    return html;
  }

  function _labelPerfil(p) {
    var labels = {
      admin: 'Administrador',
      responsavel_dds: 'Responsável DDS',
      supervisor_udaj: 'Chefe UDAJ',
      supervisor_uase: 'Chefe UASE',
      responsavel: 'Responsável',
      professor_responsavel: 'Prof. Responsável',
      funcionario: 'Funcionário'
    };
    return labels[p] || p || '—';
  }

  // ── MODAL HTML ────────────────────────────────────────────
  function getModaisHTML() {
    var html = '';

    html += '<div class="modal-bd" id="m-func-novo">';
    html += '<div class="modal" style="max-width:520px;">';
    html += '<div class="modal-header">';
    html += '<div class="mh-ic mhi-blue"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>';
    html += '<div><div class="modal-title" id="m-func-ttl">Novo funcionário</div><div class="modal-sub">Dados do funcionário</div></div>';
    html += '<button class="modal-close" onclick="closeModal(\'m-func-novo\')">✕</button>';
    html += '</div>';
    html += '<div class="modal-body">';

    html += '<div class="form-sec-t">Identificação</div>';
    html += '<div class="form-row">';
    html += '<div class="fi"><label class="fl">Nome completo *</label><input type="text" id="func-nome" class="fin" placeholder="ex: Ana Silva"></div>';
    html += '<div class="fi" id="func-codigo-wrap"><label class="fl">Código de acesso *</label><input type="text" id="func-codigo" class="fin" placeholder="ex: AS2026" style="font-family:\'JetBrains Mono\',monospace;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()"></div>';
    html += '</div>';
    html += '<div class="form-row">';
    html += '<div class="fi"><label class="fl">Email</label><input type="email" id="func-email" class="fin" placeholder="email@cm-cabeceiras.pt"></div>';
    html += '<div class="fi"><label class="fl">Nº mecanográfico</label><input type="text" id="func-mecanografico" class="fin" placeholder="ex: 12345"></div>';
    html += '</div>';

    html += '<div class="form-sec-t">Equipamento</div>';
    html += '<div class="form-row">';
    html += '<div class="fi"><label class="fl">Equipamento principal</label>';
    html += '<select id="func-eq" class="fin"><option value="">Nenhum</option></select>';
    html += '</div></div>';
    html += '<div class="fi"><label class="fl">Também desempenha funções em</label>';
    html += '<p style="font-size:12px;color:var(--text-3);margin:0 0 6px;line-height:1.5;">Marque outros equipamentos onde este funcionário trabalha (iniciativas, apoios pontuais). Passa a aparecer nas escalas e no banco de horas desses equipamentos.</p>';
    html += '<div id="func-eq-extra" style="display:flex;flex-wrap:wrap;gap:6px;"></div>';
    html += '</div>';

    html += '<div class="form-sec-t">Enquadramento orgânico</div>';
    html += '<div class="form-row">';
    html += '<div class="fi"><label class="fl">Unidade</label>';
    html += '<select id="func-unidade" class="fin" onchange="Funcionarios.onUnidadeChange()">';
    html += '<option value="">Nenhuma</option>';
    html += '<option value="UASE">UASE — Unidade de Ação Social, Saúde e Educação</option>';
    html += '<option value="UDAJ">UDAJ — Unidade de Desporto, Associativismo e Juventude</option>';
    html += '<option value="EXTERNA">Externo à DDS — outra divisão do município</option>';
    html += '</select></div>';
    html += '<div class="fi" id="func-divisao-wrap" style="display:none;"><label class="fl">Divisão de origem</label>';
    html += '<input type="text" id="func-divisao" class="fin" list="divisao-opcoes" placeholder="ex: Divisão de Obras Municipais">';
    html += '<datalist id="divisao-opcoes">' + _opcoesGuardadas('divisao_origem', ['Divisão Administrativa e Geral','Divisão de Obras Municipais','Divisão de Ambiente','Divisão de Cultura','Divisão de Urbanismo']) + '</datalist>';
    html += '</div>';
    html += '<div class="fi"><label class="fl">Área</label>';
    html += '<input type="text" id="func-area" class="fin" list="area-opcoes" placeholder="Escreva ou escolha">';
    html += '<datalist id="area-opcoes">' + _opcoesGuardadas('area', ['Ação Social','Saúde','Educação','Desporto','Associativismo','Juventude']) + '</datalist>';
    html += '</div>';
    html += '</div>';
    html += '<div class="form-row">';
    html += '<div class="fi"><label class="fl">Função</label>';
    html += '<input type="text" id="func-funcao" class="fin" list="funcao-opcoes" placeholder="ex: Coordenador de instalações">';
    html += '<datalist id="funcao-opcoes">' + _opcoesGuardadas('funcao', []) + '</datalist>';
    html += '</div>';
    html += '<div class="fi"><label class="fl">Categoria</label>';
    html += '<input type="text" id="func-categoria" class="fin" list="categoria-opcoes" placeholder="Escreva ou escolha">';
    html += '<datalist id="categoria-opcoes">' + _opcoesGuardadas('categoria', ['Assistente Operacional','Assistente Técnico','Técnico Superior','Dirigente']) + '</datalist>';
    html += '</div>';
    html += '</div>';

    html += '<div class="form-row">';
    html += '<div class="fi"><label class="fl">Vínculo</label>';
    html += '<select id="func-vinculo" class="fin">';
    html += '<option value="">—</option>';
    html += '<option value="Contrato sem termo">Contrato sem termo</option>';
    html += '<option value="Contrato a termo">Contrato a termo</option>';
    html += '<option value="Recibo verde">Recibo verde</option>';
    html += '<option value="Avença">Avença</option>';
    html += '<option value="Estágio">Estágio</option>';
    html += '<option value="Outro">Outro</option>';
    html += '</select></div>';
    html += '</div>';

    html += '<div class="form-row">';
    html += '<div class="fi"><label class="fl">Estado</label>';
    html += '<select id="func-ativo" class="fin"><option value="true">Ativo</option><option value="false">Inativo</option></select>';
    html += '</div></div>';

    html += '</div>'; // modal-body
    html += '<div class="modal-footer">';
    html += '<button class="btn btn-ghost" onclick="closeModal(\'m-func-novo\')">Cancelar</button>';
    html += '<button class="btn btn-primary" onclick="Funcionarios.salvar()">Guardar</button>';
    html += '</div>';
    html += '</div></div>';

    // APAGAR
    html += '<div class="modal-bd" id="m-func-apagar"><div class="modal">';
    html += '<div class="modal-header"><div class="mh-ic mhi-red"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></div>';
    html += '<div><div class="modal-title">Apagar funcionário</div><div class="modal-sub" id="m-func-ap-nome">—</div></div>';
    html += '<button class="modal-close" onclick="closeModal(\'m-func-apagar\')">✕</button></div>';
    html += '<div class="modal-body"><p style="font-size:13.5px;color:var(--text-2);">Esta ação é irreversível.</p></div>';
    html += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-func-apagar\')">Cancelar</button>';
    html += '<button class="btn btn-danger" onclick="Funcionarios.execApagar()">Apagar</button></div>';
    html += '</div></div>';

    return html;
  }

  // ── ACÇÕES ────────────────────────────────────────────────
  function _popularEqSelect(selId, selValue) {
    var sel = document.getElementById(selId);
    if (!sel) return;
    sel.innerHTML = '<option value="">Nenhum</option>';
    APP.equipamentos.forEach(function(e) {
      var o = document.createElement('option');
      o.value = e.id;
      o.textContent = e.nome;
      if (selValue && e.id === selValue) o.selected = true;
      sel.appendChild(o);
    });
  }

  function openNovo() {
    APP.editId = null;
    document.getElementById('m-func-ttl').textContent = 'Novo funcionário';
    ['func-nome','func-codigo','func-email','func-mecanografico','func-funcao'].forEach(function(id) {
      var el = document.getElementById(id); if (el) el.value = '';
    });
    ['func-unidade','func-area','func-categoria','func-vinculo','func-divisao'].forEach(function(id) {
      var el = document.getElementById(id); if (el) el.value = '';
    });
    var a = document.getElementById('func-ativo'); if (a) a.value = 'true';
    onUnidadeChange();
    var cw0 = document.getElementById('func-codigo-wrap'); if (cw0) cw0.style.display = '';
    _popularEqSelect('func-eq');
    _popularEqExtra([]);
    // Se não-DDS, pré-selecionar o seu equipamento
    if (!APP.isDds() && APP.user && APP.user.equipamento_id) {
      var eqSel = document.getElementById('func-eq');
      if (eqSel) eqSel.value = APP.user.equipamento_id;
    }
    openModal('m-func-novo');
  }

  function openEditar(id) {
    var u = APP.utilizadores.filter(function(x) { return x.id === id; })[0];
    if (!u) return;
    APP.editId = id;
    document.getElementById('m-func-ttl').textContent = 'Editar funcionário';
    var set = function(eid, val) {
      var el = document.getElementById(eid);
      if (el) el.value = val !== null && val !== undefined ? val : '';
    };
    set('func-nome',     u.nome);
    set('func-codigo',   u.codigo);
    set('func-email',    u.email);
    set('func-mecanografico', u.num_mecanografico);
    set('func-unidade',  u.unidade);
    set('func-divisao',  u.divisao_origem);
    onUnidadeChange();
    set('func-vinculo',  u.vinculo);
    set('func-area',     u.area);
    set('func-funcao',   u.funcao);
    set('func-categoria',u.categoria);
    set('func-ativo',    u.ativo !== false ? 'true' : 'false');
    var cw = document.getElementById('func-codigo-wrap');
    if (cw) cw.style.display = APP.isAdmin() ? '' : 'none';
    _popularEqSelect('func-eq', u.equipamento_id);
    _popularEqExtra(Array.isArray(u.equipamentos_extra) ? u.equipamentos_extra : []);
    openModal('m-func-novo');
  }

  function salvar() {
    var nome   = document.getElementById('func-nome');
    var codigo = document.getElementById('func-codigo');
    if (!nome || !nome.value.trim()) { toast('O nome é obrigatório.', 'error'); return; }
    var mexeCodigo = !APP.editId || APP.isAdmin();
    if (mexeCodigo && (!codigo || !codigo.value.trim())) { toast('O código de acesso é obrigatório.', 'error'); return; }

    var eqSel  = document.getElementById('func-eq');
    var atvSel = document.getElementById('func-ativo');

    var body = {
      nome:           nome.value.trim(),
      codigo:         (codigo.value || '').trim().toUpperCase() || null,
      email:          ((document.getElementById('func-email') || {}).value || '').trim() || null,
      num_mecanografico: (document.getElementById('func-mecanografico').value || '').trim() || null,
      equipamento_id: (eqSel && eqSel.value) ? eqSel.value : null,
      unidade:        (document.getElementById('func-unidade')   || {}).value || null,
      area:           (document.getElementById('func-area')      || {}).value || null,
      funcao:         ((document.getElementById('func-funcao')   || {}).value || '').trim() || null,
      categoria:      (document.getElementById('func-categoria') || {}).value || null,
      vinculo:        (document.getElementById('func-vinculo')   || {}).value || null,
      divisao_origem: ((document.getElementById('func-unidade') || {}).value === 'EXTERNA')
                        ? (((document.getElementById('func-divisao') || {}).value || '').trim() || null)
                        : null,
      ativo:          atvSel ? atvSel.value === 'true' : true
    };

    if (!mexeCodigo) delete body.codigo;

    // equipamentos adicionais (exclui o principal para não duplicar)
    var extras = [];
    document.querySelectorAll('.func-eqx').forEach(function(cb) {
      if (cb.checked && cb.value !== body.equipamento_id) extras.push(cb.value);
    });
    body.equipamentos_extra = extras;

    // novo funcionário nasce sem acesso à app e com perfil base;
    // perfil, acessos e permissões gerem-se no menu Utilizadores
    if (!APP.editId) {
      body.perfil = 'funcionario';
      body.isDds = false;
      body.tem_acesso = false;
      body.permissoes_extra = {};
    }

    var p = APP.editId
      ? sbPatch('utilizadores', 'id=eq.' + APP.editId, body)
      : sbPost('utilizadores', body);

    p.then(function() {
      toast(APP.editId ? 'Funcionário atualizado.' : 'Funcionário criado.', 'success');
      closeModal('m-func-novo');
      loadAll(function() { App.renderContent(); App.buildSidebar(); });
    }).catch(function(e) {
      console.error('Erro ao guardar funcionário:', e);
      if (e && e.message && e.message.indexOf('unique') >= 0) {
        toast('Esse código já está em uso.', 'error');
      } else {
        var msg = [e && e.code, e && e.message, e && e.details, e && e.hint].filter(Boolean).join(' · ');
        toast('Erro ao guardar: ' + (msg || 'desconhecido'), 'error');
      }
    });
  }

  // ── ACESSO À APP ──────────────────────────────────────────
  function darAcesso(id) {
    sbPatch('utilizadores', 'id=eq.' + id, { tem_acesso: true }).then(function() {
      toast('Acesso concedido. Configure o perfil no menu Utilizadores.', 'success');
      loadAll(function() { App.renderContent(); });
    }).catch(function() { toast('Erro ao conceder acesso.', 'error'); });
  }

  function retirarAcesso(id) {
    sbPatch('utilizadores', 'id=eq.' + id, { tem_acesso: false }).then(function() {
      toast('Acesso à app retirado.', 'success');
      loadAll(function() { App.renderContent(); });
    }).catch(function() { toast('Erro ao retirar acesso.', 'error'); });
  }

  // checkboxes dos equipamentos adicionais
  function _popularEqExtra(selecionados) {
    var wrap = document.getElementById('func-eq-extra');
    if (!wrap) return;
    selecionados = Array.isArray(selecionados) ? selecionados : [];
    var h = '';
    (APP.equipamentos || []).slice()
      .sort(function(a, b) { return (a.nome || '').localeCompare(b.nome || ''); })
      .forEach(function(e) {
        var on = selecionados.indexOf(e.id) >= 0;
        h += '<label style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border:1px solid var(--border);border-radius:6px;padding:5px 9px;cursor:pointer;">';
        h += '<input type="checkbox" class="func-eqx" value="' + e.id + '"' + (on ? ' checked' : '') + ' style="margin:0;">';
        h += H(e.nome) + '</label>';
      });
    wrap.innerHTML = h || '<span style="font-size:12px;color:var(--text-3);">Sem equipamentos.</span>';
  }

  // mostra o campo "Divisão de origem" só quando a unidade é EXTERNA
  function onUnidadeChange() {
    var sel  = document.getElementById('func-unidade');
    var wrap = document.getElementById('func-divisao-wrap');
    if (!sel || !wrap) return;
    wrap.style.display = (sel.value === 'EXTERNA') ? 'block' : 'none';
    if (sel.value !== 'EXTERNA') {
      var d = document.getElementById('func-divisao');
      if (d) d.value = '';
    }
  }

  function confirmarApagar(id, nome) {
    APP.actionId = id;
    var el = document.getElementById('m-func-ap-nome');
    if (el) el.textContent = nome;
    openModal('m-func-apagar');
  }

  function execApagar() {
    if (!APP.actionId) return;
    sbDelete('utilizadores', 'id=eq.' + APP.actionId).then(function() {
      toast('Funcionário eliminado.', 'success');
      closeModal('m-func-apagar');
      loadAll(function() { App.renderContent(); App.buildSidebar(); });
    }).catch(function() { toast('Erro ao eliminar.', 'error'); });
  }

  function init() {
    var cont = document.getElementById('modais-funcionarios');
    if (cont) cont.innerHTML = getModaisHTML();
  }

  return {
    render: render,
    init: init,
    openNovo: openNovo,
    openEditar: openEditar,
    salvar: salvar,
    onUnidadeChange: onUnidadeChange,
    darAcesso: darAcesso,
    retirarAcesso: retirarAcesso,
    confirmarApagar: confirmarApagar,
    execApagar: execApagar
  };

})();

</script>
<script>
/* ═════ mensal.js ═════ */
// ============================================================
// GestDDS — mensal.js  v6.0
// Relatório Mensal de Atividades — visão consolidada de todos os
// equipamentos num mês, pronta a colar no relatório mensal.
//
//  • indicadores com comparação ao mês anterior
//  • texto descritivo gerado automaticamente (editável)
//  • quadro por equipamento, entidades, nacionalidades, visitas
//  • manutenção (memorandos) e recursos humanos
//  • impressão / PDF e exportação CSV
// ============================================================

var Mensal = (function() {

  var MESES   = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var MESES_C = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  var _dados = { estadias: [], visitas: [], checks: [] };
  var _estado = null;        // null | 'a-carregar' | 'ok' | 'erro'
  var _anoCarregado = null;
  var _erro = '';
  var _mes = null;           // 1..12, 0 = ano completo, null = automático
  var _uni = '';
  var _vista = 'eq';         // 'eq' (A4 por equipamento) | 'dds' (resumo)             // '' | 'UASE' | 'UDAJ'

  // ── UTILITÁRIOS ───────────────────────────────────────────
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function nf(n) { return (Math.round(n * 10) / 10).toLocaleString('pt-PT'); }
  function int(v) { return parseInt(v, 10) || 0; }
  // "1 visita" / "3 visitas"
  function pl(n, um, varios) { return nf(n) + ' ' + (n === 1 ? um : varios); }
  function _ano() { return APP.anoTrabalho || new Date().getFullYear(); }

  // Mês por omissão: nos primeiros 15 dias do mês o relatório que interessa
  // é o do mês anterior (o que acabou de fechar).
  function mesAtual() {
    if (_mes !== null) return _mes;
    var h = new Date();
    if (_ano() !== h.getFullYear()) return 12;
    var m = h.getMonth() + 1;
    if (h.getDate() <= 15 && m > 1) return m - 1;
    return m;
  }

  function periodo(ano, mes) {
    if (!mes) return { ini: ano + '-01-01', fim: ano + '-12-31', label: 'Ano de ' + ano, curto: String(ano), mes: 0, ano: ano };
    var nd = new Date(ano, mes, 0).getDate();
    return {
      ini: ano + '-' + p2(mes) + '-01',
      fim: ano + '-' + p2(mes) + '-' + p2(nd),
      label: MESES[mes - 1] + ' de ' + ano,
      curto: MESES[mes - 1].toLowerCase(),
      mes: mes, ano: ano
    };
  }

  function noPer(iso, per) {
    if (!iso) return false;
    var s = String(iso).slice(0, 10);
    return s >= per.ini && s <= per.fim;
  }

  // unidade efetiva: chefes de unidade vêem sempre a sua
  function uniEfetiva() {
    var u = APP._unidadeChefe ? APP._unidadeChefe() : null;
    return u || _uni;
  }

  function eqsAmbito(uni, eqId) {
    return (APP.equipamentos || []).filter(function(e) {
      if (!APP.podeVerEquipamento(e.id)) return false;
      if (eqId) return e.id === eqId;
      return !uni || e.unidade === uni;
    });
  }

  function verRH() {
    return APP.user && (APP._veTudo() || !!APP._unidadeChefe());
  }

  // ── CARREGAR (estadias, visitas e checklists de todos os equipamentos) ──
  function load(cb) {
    var ano = _ano();
    if (_estado === 'ok' && _anoCarregado === ano) { if (cb) cb(); return; }
    _estado = 'a-carregar';
    var ini = ano + '-01-01', fim = ano + '-12-31';
    function arr(d) { return Array.isArray(d) ? d : []; }
    function seguro(p) { return p.catch(function() { return []; }); }

    Promise.all([
      seguro(sbGet('estadias', 'data_checkin=gte.' + (ano - 1) + '-12-01&data_checkin=lte.' + fim)),
      seguro(sbGet('visitas', 'data=gte.' + ini + '&data=lte.' + fim)),
      seguro(sbGet('checklist_registos', 'data_registo=gte.' + ini + '&data_registo=lte.' + fim + 'T23:59:59')),
      new Promise(function(r) { if (typeof Horas !== 'undefined') Horas.load(r); else r(); }),
      new Promise(function(r) { if (typeof Ferias !== 'undefined') Ferias.load(r); else r(); })
    ]).then(function(res) {
      _dados.estadias = arr(res[0]);
      _dados.visitas  = arr(res[1]);
      _dados.checks   = arr(res[2]);
      _estado = 'ok';
      _anoCarregado = ano;
      if (cb) cb();
    }).catch(function(e) {
      _estado = 'erro';
      _erro = (e && e.message) ? e.message : String(e);
      if (cb) cb();
    });
  }

  // ── CÁLCULOS ──────────────────────────────────────────────
  // Nº de ocorrências de uma reserva dentro do período
  // (as recorrentes contam uma vez por cada dia em que acontecem)
  function ocorrencias(r, per) {
    if (r.estado === 'cancelada') return 0;
    if (!r.recorrente) return noPer(r.data_inicio, per) ? 1 : 0;
    var dias = String(r.dias_semana || '').split(',').filter(function(x) { return x !== ''; })
      .map(function(x) { return parseInt(x, 10); });
    var pi = String(r.data_inicio_periodo || r.data_inicio || '').slice(0, 10);
    var pf = String(r.data_fim_periodo || r.data_fim || '').slice(0, 10);
    var ini = pi > per.ini ? pi : per.ini;
    var fim = pf < per.fim ? pf : per.fim;
    if (!ini || !fim || ini > fim) return 0;
    var d = new Date(ini + 'T12:00:00'), lim = new Date(fim + 'T12:00:00'), n = 0, g = 0;
    while (d <= lim && g < 400) {
      if (dias.indexOf(d.getDay()) >= 0) n++;
      d.setDate(d.getDate() + 1); g++;
    }
    return n;
  }

  function pessoasEst(e) { return int(e.n_adultos) + int(e.n_criancas); }
  function noitesEst(e) {
    if (!e.data_checkin) return 0;
    var i = new Date(e.data_checkin);
    var f = e.data_checkout_real ? new Date(e.data_checkout_real)
          : (e.estado === 'ativa' ? new Date() : (e.data_checkout_prev ? new Date(e.data_checkout_prev) : null));
    if (!f || isNaN(i) || isNaN(f)) return 0;
    var n = Math.round((f - i) / 86400000);
    return n > 0 ? n : (e.estado === 'ativa' ? 0 : 1);
  }

  // Noites de uma estadia que caem dentro do período.
  // A noite de dia X conta no mês de X (entrada a 29/09 e saída a 03/10:
  // 2 noites em setembro e 2 em outubro).
  function noitesNoPer(e, per) {
    var n = noitesEst(e);
    if (!n || !e.data_checkin) return 0;
    var ini = String(e.data_checkin).slice(0, 10);
    var ult = new Date(ini + 'T12:00:00');
    ult.setDate(ult.getDate() + n - 1);                 // última noite
    var fim = ymd(ult);
    var a = ini > per.ini ? ini : per.ini;
    var b = fim < per.fim ? fim : per.fim;
    if (a > b) return 0;
    return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000) + 1;
  }

  function diasUteisSobrepostos(ini, fim, per) {
    var a = ini > per.ini ? ini : per.ini;
    var b = fim < per.fim ? fim : per.fim;
    if (!a || !b || a > b) return 0;
    var d = new Date(a + 'T12:00:00'), l = new Date(b + 'T12:00:00'), n = 0, g = 0;
    while (d <= l && g < 400) {
      var w = d.getDay();
      if (w !== 0 && w !== 6) n++;
      d.setDate(d.getDate() + 1); g++;
    }
    return n;
  }

  function func(id) {
    return (APP.utilizadores || []).filter(function(u) { return u.id === id; })[0] || null;
  }

  function calc(per, uni, eqId) {
    var eqs = eqsAmbito(uni, eqId), ids = {}, porEq = {};
    eqs.forEach(function(e) {
      ids[e.id] = true;
      porEq[e.id] = { eq: e, res: 0, resPes: 0, vis: 0, visPes: 0, est: 0, hosp: 0, dorm: 0, chk: 0, memC: 0, memF: 0 };
    });

    var R = {
      per: per, nEqs: eqs.length,
      res: 0, resPes: 0, preRes: 0, vis: 0, visPes: 0, visCri: 0,
      est: 0, hosp: 0, dorm: 0, noites: 0, chk: 0,
      memC: 0, memF: 0, memAb: 0, memosNovos: [], memosConcl: [],
      entidades: {}, paises: {}, tiposVis: {},
      hx: 0, hg: 0, hFuncs: {}, ferDias: 0, ferFuncs: {}
    };

    // Reservas
    var vistas = {};
    (APP.reservas || []).forEach(function(r) {
      if (!ids[r.equipamento_id] || vistas[r.id]) return;
      vistas[r.id] = true;
      var n = ocorrencias(r, per);
      if (!n) return;
      if (r.estado === 'pre_reserva') { R.preRes += n; return; }   // ainda não confirmada → não conta
      var p = n * int(r.num_pessoas);
      var x = porEq[r.equipamento_id];
      x.res += n; x.resPes += p;
      R.res += n; R.resPes += p;
      var ent = String(r.entidade || '').trim();
      if (ent) {
        var k = ent.toLowerCase();
        var E = R.entidades[k] || (R.entidades[k] = { nome: ent, n: 0, p: 0 });
        E.n += n; E.p += p;
      }
    });

    // Estadias: estadias e hóspedes contam no mês de entrada;
    // as dormidas contam no mês em que cada noite acontece.
    _dados.estadias.forEach(function(e) {
      if (!ids[e.equipamento_id]) return;
      if (e.estado === 'cancelada' || e.estado === 'reservada') return;
      var p = pessoasEst(e);
      var entrou = noPer(e.data_checkin, per);
      var d = p * noitesNoPer(e, per);
      if (!entrou && !d) return;
      var x = porEq[e.equipamento_id];
      var pais = e.nacionalidade || 'Não indicado';
      var P = R.paises[pais] || (R.paises[pais] = { nome: pais, est: 0, hosp: 0, dorm: 0 });
      x.dorm += d; R.dorm += d; P.dorm += d;
      if (entrou) {
        x.est++; x.hosp += p;
        R.est++; R.hosp += p; R.noites += noitesEst(e);
        P.est++; P.hosp += p;
      }
    });

    // Visitas
    _dados.visitas.forEach(function(v) {
      if (!ids[v.equipamento_id] || !noPer(v.data, per)) return;
      var p = int(v.n_adultos) + int(v.n_criancas);
      var x = porEq[v.equipamento_id];
      x.vis++; x.visPes += p;
      R.vis++; R.visPes += p; R.visCri += int(v.n_criancas);
      var t = v.tipo_visitante || 'outro';
      var T = R.tiposVis[t] || (R.tiposVis[t] = { tipo: t, n: 0, p: 0 });
      T.n++; T.p += p;
    });

    // Checklists
    _dados.checks.forEach(function(c) {
      if (!ids[c.equipamento_id] || !noPer(c.data_registo, per)) return;
      porEq[c.equipamento_id].chk++; R.chk++;
    });

    // Memorandos
    (APP.memos || []).forEach(function(m) {
      var doAmbito = m.equipamento_id ? !!ids[m.equipamento_id] : (!uni && !eqId && APP.isDds());
      if (!doAmbito) return;
      var criado = String(m.data || m.created_at || '').slice(0, 10);
      if (noPer(criado, per)) {
        R.memC++; R.memosNovos.push(m);
        if (m.equipamento_id) porEq[m.equipamento_id].memC++;
      }
      if (m.estado === 'concluido' && noPer(m.data_conclusao, per)) {
        R.memF++; R.memosConcl.push(m);
        if (m.equipamento_id) porEq[m.equipamento_id].memF++;
      }
      var abertoNoFim = criado && criado <= per.fim &&
        (m.estado !== 'concluido' || (m.data_conclusao && String(m.data_conclusao).slice(0, 10) > per.fim));
      if (abertoNoFim) R.memAb++;
    });

    // Recursos humanos (só para quem gere pessoal)
    if (verRH() && !eqId) {
      if (typeof Horas !== 'undefined' && Horas.registos) {
        Horas.registos().forEach(function(r) {
          if (r.estado !== 'aprovado' || !noPer(r.data, per)) return;
          var f = func(r.funcionario_id);
          if (uni && (!f || f.unidade !== uni)) return;
          var h = parseFloat(r.horas) || 0;
          if (r.tipo === 'gozada') R.hg += h; else R.hx += h;
          R.hFuncs[r.funcionario_id] = true;
        });
      }
      if (typeof Ferias !== 'undefined' && Ferias.todas) {
        Ferias.todas().forEach(function(fe) {
          if (fe.estado !== 'aprovada') return;
          var f = func(fe.funcionario_id);
          if (uni && (!f || f.unidade !== uni)) return;
          var d = diasUteisSobrepostos(String(fe.data_inicio).slice(0, 10), String(fe.data_fim).slice(0, 10), per);
          if (!d) return;
          R.ferDias += d; R.ferFuncs[fe.funcionario_id] = true;
        });
      }
    }

    R.aflu = R.resPes + R.visPes + R.hosp;
    R.lista = Object.keys(porEq).map(function(k) {
      var x = porEq[k];
      x.aflu = x.resPes + x.visPes + x.hosp;
      x.ativo = x.res + x.vis + x.est + x.dorm + x.chk + x.memC + x.memF > 0;
      return x;
    }).sort(function(a, b) { return (b.aflu - a.aflu) || (b.res - a.res) || a.eq.nome.localeCompare(b.eq.nome); });

    R.entidadesL = Object.keys(R.entidades).map(function(k) { return R.entidades[k]; })
      .sort(function(a, b) { return b.n - a.n || b.p - a.p; });
    R.paisesL = Object.keys(R.paises).map(function(k) { return R.paises[k]; })
      .sort(function(a, b) { return b.dorm - a.dorm; });
    R.tiposVisL = Object.keys(R.tiposVis).map(function(k) { return R.tiposVis[k]; })
      .sort(function(a, b) { return b.p - a.p; });
    R.nHFuncs = Object.keys(R.hFuncs).length;
    R.nFerFuncs = Object.keys(R.ferFuncs).length;
    return R;
  }

  // ── COMPARAÇÃO COM O MÊS ANTERIOR ─────────────────────────
  function delta(cur, prev) {
    if (prev === null || prev === undefined) return '';
    if (!prev && !cur) return '<span class="mn-delta mn-eq">= mês anterior</span>';
    if (!prev) return '<span class="mn-delta mn-up">novo</span>';
    var pct = Math.round((cur - prev) / prev * 100);
    if (pct === 0) return '<span class="mn-delta mn-eq">= mês anterior</span>';
    return '<span class="mn-delta ' + (pct > 0 ? 'mn-up' : 'mn-down') + '">' + (pct > 0 ? '▲ ' : '▼ ') + Math.abs(pct) + '% vs. mês anterior</span>';
  }

  function txtDelta(cur, prev, nomeMesAnt) {
    // com bases muito pequenas a percentagem engana (1 → 16 = +1500%)
    if (prev === null || prev === undefined || prev < 10) return '';
    var pct = Math.round((cur - prev) / prev * 100);
    if (pct === 0) return ', valor idêntico ao de ' + nomeMesAnt;
    return ', o que representa ' + (pct > 0 ? 'um aumento' : 'uma diminuição') + ' de ' + Math.abs(pct) + '% face a ' + nomeMesAnt;
  }

  // ── TEXTO PARA O RELATÓRIO ────────────────────────────────
  var TIPOS_VIS = { escola: 'escolas', instituicao: 'instituições', grupo: 'grupos organizados', particular: 'particulares e famílias', outro: 'outros visitantes' };

  function listaPt(a) {
    if (a.length <= 1) return a.join('');
    return a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];
  }

  function gerarTexto(R, P, eqNome) {
    var per = R.per;
    var quando = per.mes ? 'Em ' + per.curto + ' de ' + per.ano : 'No ano de ' + per.ano;
    var antes = P ? MESES[per.mes - 2].toLowerCase() : '';
    var ambito = uniEfetiva() ? 'da ' + uniEfetiva() : 'da Divisão de Desenvolvimento Social';
    var par = [];

    if (eqNome && (R.aflu || R.res)) {
      var s1 = quando + ', o equipamento ' + eqNome + ' registou uma afluência de ' + pl(R.aflu, 'pessoa', 'pessoas') +
               (P ? txtDelta(R.aflu, P.aflu, antes) : '') + '.';
      if (R.res) s1 += (R.res === 1 ? ' Foi realizada ' : ' Foram realizadas ') + pl(R.res, 'utilização', 'utilizações') +
               ' mediante reserva, envolvendo ' + pl(R.resPes, 'participante', 'participantes') + '.';
      var en = R.entidadesL.slice(0, 3).map(function(e) { return e.nome; });
      if (en.length === 1) s1 += ' A entidade utilizadora foi ' + en[0] + '.';
      else if (en.length) s1 += ' As entidades com maior utilização foram ' + listaPt(en) + '.';
      par.push(s1);
    } else if (eqNome) {
      par.push(quando + ', não foi registada utilização do equipamento ' + eqNome + '.');
    } else if (R.aflu || R.res) {
      var s = quando + ', os equipamentos sob gestão ' + ambito + ' registaram uma afluência global de ' +
              nf(R.aflu) + ' pessoas' + (P ? txtDelta(R.aflu, P.aflu, antes) : '') + '.';
      if (R.res) {
        var top = R.lista.filter(function(x) { return x.res > 0; }).slice(0, 3)
          .map(function(x) { return x.eq.nome + ' (' + x.res + ')'; });
        s += (R.res === 1 ? ' Foi realizada ' : ' Foram realizadas ') + pl(R.res, 'utilização', 'utilizações') + ' de espaços mediante reserva, envolvendo ' +
             pl(R.resPes, 'participante', 'participantes') + (top.length ? ', com maior expressão em ' + listaPt(top) : '') + '.';
        var ents = R.entidadesL.slice(0, 3).map(function(e) { return e.nome; });
        if (ents.length === 1) s += ' A entidade utilizadora foi ' + ents[0] + '.';
        else if (ents.length) s += ' Entre as entidades utilizadoras destacam-se ' + listaPt(ents) + '.';
      }
      par.push(s);
    } else {
      par.push(quando + ', não foi registada atividade nos equipamentos sob gestão ' + ambito + '.');
    }
    if (eqNome && !R.aflu && !R.res && !R.est && !R.vis && !R.memC && !R.memF && !R.chk) return par.join('');

    if (!R.est && R.dorm) {
      par.push('No âmbito do alojamento, registaram-se ' + pl(R.dorm, 'dormida', 'dormidas') + ' de hóspedes com entrada no período anterior.');
    }
    if (R.est) {
      var paises = R.paisesL.slice(0, 3).map(function(p) { return p.nome; });
      var media = R.est ? (R.noites / R.est) : 0;
      par.push('No âmbito do alojamento, ' + (R.est === 1 ? 'registou-se ' : 'registaram-se ') + pl(R.est, 'estadia', 'estadias') +
               ', ' + (R.est === 1 ? 'correspondente' : 'correspondentes') + ' a ' + pl(R.hosp, 'hóspede', 'hóspedes') + ' e ' + pl(R.dorm, 'dormida', 'dormidas') + (P ? txtDelta(R.dorm, P.dorm, antes) : '') +
               ', com uma estadia média de ' + pl(media, 'noite', 'noites') +
               (paises.length === 1 ? '. Todos os hóspedes provieram de ' + paises[0] : (paises.length ? '. As principais proveniências foram ' + listaPt(paises) : '')) + '.');
    }

    if (R.vis) {
      var tv = R.tiposVisL.slice(0, 2).map(function(t) { return (TIPOS_VIS[t.tipo] || t.tipo) + ' (' + t.p + ' pessoas)'; });
      par.push((R.vis === 1 ? 'Foi ainda acolhida ' : 'Foram ainda acolhidas ') + pl(R.vis, 'visita', 'visitas') + ' sem reserva prévia, num total de ' +
               pl(R.visPes, 'visitante', 'visitantes') + (R.visCri ? ', dos quais ' + pl(R.visCri, 'criança', 'crianças') : '') +
               (tv.length ? ', com destaque para ' + listaPt(tv) : '') + '.');
    }

    if (R.memC || R.memF || R.memAb || R.chk) {
      var m = 'Ao nível da manutenção, ';
      var partes = [];
      if (R.memC) partes.push((R.memC === 1 ? 'foi emitido ' : 'foram emitidos ') + pl(R.memC, 'memorando', 'memorandos') + ' de intervenção');
      if (R.memF) partes.push((R.memC ? '' : (R.memF === 1 ? 'foi ' : 'foram ')) + (R.memF === 1 ? 'concluído ' : 'concluídos ') + pl(R.memF, 'processo', 'processos'));
      m += partes.length ? listaPt(partes) : 'não foram emitidos novos memorandos';
      m += R.memAb ? ', encontrando-se ' + pl(R.memAb, 'processo', 'processos') + ' em curso no final do período' : '';
      m += '.';
      if (R.chk) m += (R.chk === 1 ? ' Realizou-se ' : ' Realizaram-se ') + pl(R.chk, 'verificação', 'verificações') + ' de rotina (checklists).';
      par.push(m);
    }

    if (verRH() && (R.hx || R.hg || R.ferDias)) {
      var h = 'Em matéria de recursos humanos, ';
      var rh = [];
      if (R.hx) rh.push('foram autorizadas ' + Horas.fmtH(R.hx) + ' de trabalho suplementar (' + pl(R.nHFuncs, 'trabalhador', 'trabalhadores') + ')');
      if (R.hg) rh.push('gozadas ' + Horas.fmtH(R.hg) + ' de compensação do banco de horas');
      if (R.ferDias) rh.push('registados ' + pl(R.ferDias, 'dia útil', 'dias úteis') + ' de férias (' + pl(R.nFerFuncs, 'trabalhador', 'trabalhadores') + ')');
      par.push(h + listaPt(rh) + '.');
    }

    return par.join('\n\n');
  }

  // ── GRÁFICO (barras SVG, imprime bem) ─────────────────────
  // série anual — os meses que ainda não aconteceram ficam a zero
  // (as reservas semanais projetam-se para o futuro e enganariam o gráfico)
  function serieAnual(ano, uni, eqId) {
    var hoje = new Date(), lim = 12;
    if (ano === hoje.getFullYear()) lim = hoje.getMonth() + 1;
    else if (ano > hoje.getFullYear()) lim = 0;
    var s = [];
    for (var m = 1; m <= 12; m++) s.push(m <= lim ? calc(periodo(ano, m), uni, eqId).aflu : 0);
    return s;
  }

  function grafico(serie, destaque) {
    var W = 640, H = 190, pt = 22, pb = 26, pl = 6;
    var alt = H - pt - pb, max = 1;
    serie.forEach(function(v) { if (v > max) max = v; });
    var slot = (W - pl * 2) / 12, bw = Math.min(slot * 0.62, 36);
    var s = '<svg class="mn-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Afluência mensal">';
    [0, .5, 1].forEach(function(f) {
      var y = pt + alt * (1 - f);
      s += '<line x1="' + pl + '" x2="' + (W - pl) + '" y1="' + y + '" y2="' + y + '" stroke="#94A3B8" stroke-opacity=".22"/>';
    });
    serie.forEach(function(v, i) {
      var h = alt * (v / max), x = pl + slot * i + (slot - bw) / 2, y = pt + alt - h;
      var on = (i + 1) === destaque;
      s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, 0).toFixed(1) +
           '" rx="4" fill="' + (on ? '#2457C5' : '#9DB4E6') + '"><title>' + MESES[i] + ': ' + v + '</title></rect>';
      if (v > 0) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">' + nf(v) + '</text>';
      s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="#64748B"' + (on ? ' font-weight="700"' : '') + '>' + MESES_C[i] + '</text>';
    });
    return s + '</svg>';
  }

  // ── RENDER ────────────────────────────────────────────────
  function render() {
    if (!APP.acessoMenu('relatorios')) return accessDenied();

    var h = '<div class="dash-greeting">';
    h += '<div><div class="dash-hello">Relatórios mensais</div>';
    h += '<div class="dash-sub">Escolha o mês. Cada equipamento tem o seu relatório numa página A4, pronto a imprimir ou guardar em PDF.</div></div>';
    if (_vista === 'dds') {
      h += '<div class="mn-actions">';
      h += '<button class="btn btn-secondary btn-sm" onclick="Mensal.exportarCSV()">↓ Exportar CSV</button>';
      h += '<button class="btn btn-primary" onclick="Mensal.imprimir()">🖨 Imprimir resumo da DDS</button>';
      h += '</div>';
    }
    h += '</div>';
    h += '<div class="pg-tabs">';
    h += '<button class="pg-tab' + (_vista === 'eq' ? ' on' : '') + '" onclick="Mensal.setVista(\'eq\')">📄 Por equipamento (A4)</button>';
    h += '<button class="pg-tab' + (_vista === 'dds' ? ' on' : '') + '" onclick="Mensal.setVista(\'dds\')">📊 Resumo de toda a DDS</button>';
    h += '<button class="pg-tab" onclick="App.nav(\'outros\')">🗂 Outros relatórios</button>';
    h += '</div>';

    if (_estado === 'erro') return h + emptyState('Não foi possível carregar os dados', _erro);
    if (_estado !== 'ok') return h + loadingState();

    var ano = _ano(), mes = mesAtual();
    var uni = uniEfetiva();
    var per = periodo(ano, mes);
    var R = calc(per, uni);
    var P = (mes > 1) ? calc(periodo(ano, mes - 1), uni) : null;

    // ── Barra de filtros ──
    h += '<div class="mn-filtros">';
    h += '<div class="mn-meses" role="tablist" aria-label="Mês">';
    for (var m = 1; m <= 12; m++) {
      h += '<button class="rep-mes' + (mes === m ? ' active' : '') + '" onclick="Mensal.setMes(' + m + ')">' + MESES_C[m - 1] + '</button>';
    }
    h += '<button class="rep-mes' + (mes === 0 ? ' active' : '') + '" onclick="Mensal.setMes(0)">Ano ' + ano + '</button>';
    h += '</div>';
    if (!APP._unidadeChefe()) {
      h += '<div class="mn-seg" role="group" aria-label="Unidade">';
      [['', 'Toda a DDS'], ['UASE', 'UASE'], ['UDAJ', 'UDAJ']].forEach(function(o) {
        h += '<button class="' + (uni === o[0] ? 'on' : '') + '" onclick="Mensal.setUni(\'' + o[0] + '\')">' + o[1] + '</button>';
      });
      h += '</div>';
    } else {
      h += '<span class="mn-uni-fixa">Unidade ' + H(uni) + '</span>';
    }
    h += '</div>';

    h += '<div class="mn-per">' + H(per.label) + (uni ? ' · ' + H(uni) : ' · Toda a DDS') +
         ' · ' + R.nEqs + ' equipamentos</div>';

    if (_vista === 'eq') return h + _vistaEquipamentos(R, per);

    // ── KPIs ──
    h += '<div class="mn-kpis">';
    h += _kpi('Afluência total', nf(R.aflu), 'reservas + visitas + hóspedes', P && delta(R.aflu, P.aflu), 'k1');
    h += _kpi('Utilizações', nf(R.res), nf(R.resPes) + ' participantes', P && delta(R.res, P.res), 'k2');
    h += _kpi('Visitantes', nf(R.visPes), pl(R.vis, 'visita registada', 'visitas registadas'), P && delta(R.visPes, P.visPes), 'k3');
    h += _kpi('Dormidas', nf(R.dorm), pl(R.est, 'estadia', 'estadias') + ' · ' + pl(R.hosp, 'hóspede', 'hóspedes'), P && delta(R.dorm, P.dorm), 'k4');
    h += _kpi('Reparações concluídas', nf(R.memF), pl(R.memC, 'nova', 'novas') + ' · ' + R.memAb + ' em curso', '', 'k5');
    h += '</div>';

    if (R.preRes) {
      h += '<div class="mn-aviso">ℹ️ ' + R.preRes + (R.preRes === 1 ? ' utilização marcada como <strong>pré-reserva</strong> não foi contada' : ' utilizações marcadas como <strong>pré-reserva</strong> não foram contadas') + '. Só entram no relatório depois de confirmadas em Reservas.</div>';
    }

    // ── Texto ──
    var texto = gerarTexto(R, P);
    h += '<section class="mn-bloco">';
    h += '<div class="mn-bloco-h"><div><div class="mn-bloco-t">Texto para o relatório</div>';
    h += '<div class="mn-bloco-s">Gerado a partir dos números abaixo. Pode editar antes de copiar.</div></div>';
    h += '<div class="mn-actions"><button class="btn btn-ghost btn-sm" onclick="Mensal.reporTexto()">Repor</button>';
    h += '<button class="btn btn-primary btn-sm" onclick="Mensal.copiarTexto()">📋 Copiar texto</button></div></div>';
    var linhas = Math.max(8, Math.ceil(texto.length / 105) + texto.split('\n').length);
    h += '<textarea id="mn-texto" class="fin mn-texto" rows="' + linhas + '">' + H(texto) + '</textarea>';
    h += '</section>';

    // ── Por equipamento ──
    var ativos = R.lista.filter(function(x) { return x.ativo; });
    var semAtiv = R.lista.length - ativos.length;
    h += '<section class="mn-bloco">';
    h += '<div class="mn-bloco-h"><div><div class="mn-bloco-t">Atividade por equipamento</div>';
    h += '<div class="mn-bloco-s">' + ativos.length + ' com atividade' + (semAtiv ? ' · ' + semAtiv + ' sem registos no período' : '') + '</div></div></div>';
    if (!ativos.length) {
      h += emptyState('Sem atividade registada', 'Não há reservas, visitas, estadias ou reparações neste período.');
    } else {
      h += '<div class="dtw"><table class="dt mn-tab"><thead><tr>';
      h += '<th>Equipamento</th><th class="n">Utilizações</th><th class="n">Participantes</th><th class="n">Visitantes</th><th class="n">Hóspedes</th><th class="n">Dormidas</th><th class="n">Checklists</th><th class="n">Reparações</th><th class="n">Afluência</th>';
      h += '</tr></thead><tbody>';
      ativos.forEach(function(x) {
        h += '<tr><td><span class="td-p">' + H(x.eq.nome) + '</span>' + (x.eq.unidade ? ' <span class="mn-tag">' + H(x.eq.unidade) + '</span>' : '') + '</td>';

  function copiarTexto() {
    var t = document.getElementById('mn-texto');
    if (!t) return;
    var txt = t.value;
    function fallback() {
      t.focus(); t.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      toast(ok ? 'Texto copiado.' : 'Texto selecionado — copie com o teclado.', ok ? 'success' : 'error');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function() { toast('Texto copiado. Cole no relatório.', 'success'); }, fallback);
    } else fallback();

  function exportarCSV() {
    if (_estado !== 'ok') { toast('Os dados ainda estão a carregar.', 'error'); return; }
    var ano = _ano(), mes = mesAtual(), uni = uniEfetiva();
    var per = periodo(ano, mes), R = calc(per, uni);
    var L = ['Equipamento;Unidade;Utilizações;Participantes;Visitas;Visitantes;Estadias;Hóspedes;Dormidas;Checklists;Memorandos novos;Memorandos concluídos;Afluência'];

    });

    var blob = new Blob(['﻿' + L.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'relatorio_mensal_' + (mes ? ano + '-' + p2(mes) : ano) + (uni ? '_' + uni : '') + '.csv';
    a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
    toast('CSV exportado.', 'success');
  }

  // ══════════════════════════════════════════════════════════
  // FOLHA A4 POR EQUIPAMENTO
