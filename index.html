// ── SUPABASE ───────────────────────────────────────────────
function sbHeaders() {
  return {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
}

// Safari-compatible fetch wrapper
function safeFetch(url, opts) {
  // Safari requer mode:'cors' explícito
  opts = opts || {};
  opts.mode = 'cors';
  opts.credentials = 'omit';
  return fetch(url, opts);
}

function sbGet(table, query) {
  return safeFetch(SB_URL + '/rest/v1/' + table + '?' + (query || ''), {
    method: 'GET',
    headers: sbHeaders()
  }).then(function(r) { return r.json(); });
}

function sbPost(table, body) {
  return safeFetch(SB_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: sbHeaders(),
    body: JSON.stringify(body)
  }).then(function(r) {
    if (r.status === 201 || r.ok) return r.json();
    return r.json().then(function(e) { throw e; });
  });
}

function sbPatch(table, filter, body) {
  return safeFetch(SB_URL + '/rest/v1/' + table + '?' + filter, {
    method: 'PATCH',
    headers: sbHeaders(),
    body: JSON.stringify(body)
  }).then(function(r) {
    if (r.ok || r.status === 204) return true;
    return r.json().then(function(e) { throw e; });
  });
}

function sbDelete(table, filter) {
  return safeFetch(SB_URL + '/rest/v1/' + table + '?' + filter, {
    method: 'DELETE',
    headers: sbHeaders()
  }).then(function(r) {
    if (r.ok || r.status === 204) return true;
    return r.json().then(function(e) { throw e; }).catch(function(e) { throw e; });
  });
}

// ── HELPERS GLOBAIS ────────────────────────────────────────

// Escape HTML
function H(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Dias desde uma data
function diasDesde(d) {
  if (!d) return 0;
  return Math.floor((new Date() - new Date(d)) / 86400000);
}

// Classe CSS para contador de dias
function diasCls(n) {
  return n <= 10 ? 'd-ok' : n <= 21 ? 'd-warn' : 'd-crit';
}

// Formatar data PT
function fData(d) {
  if (!d) return '—';
  var dt = new Date(d);
  return [
    dt.getDate().toString().padStart(2,'0'),
    (dt.getMonth()+1).toString().padStart(2,'0'),
    dt.getFullYear()
  ].join('/');
}

// Próxima 4ª feira
function proximaQuarta() {
  var hoje = new Date();
  var diff = (3 - hoje.getDay() + 7) % 7 || 7;
  return { dt: new Date(hoje.getTime() + diff * 86400000), dias: diff };
}

// Saudação por hora
function saudacao() {
  var h = new Date().getHours();
  return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
}

// Data de hoje formatada por extenso
function hojeExtenso() {
  return new Date().toLocaleDateString('pt-PT', { day: 'numeric', month: 'long', year: 'numeric' });
}

// Iniciais de um nome
function iniciais(nome) {
  return String(nome || '').split(' ').map(function(w) { return w[0]; }).join('').substring(0,2).toUpperCase();
}

// Badge de memorando
function badgeMemo(m) {
  if (m.estado === 'reforco_pedido') return '<span class="bdg bdg-reforco"><span class="bdg-dot"></span>Reforço</span>';
  if (m.data_envio_servicos) return '<span class="bdg bdg-enviado"><span class="bdg-dot"></span>Enviado</span>';
  if (m.aprovado_dds) return '<span class="bdg bdg-andamento"><span class="bdg-dot"></span>A enviar</span>';
  return '<span class="bdg bdg-pendente"><span class="bdg-dot"></span>Pendente</span>';
}

// Badge de equipamento
function badgeEqEstado(estado) {
  if (estado === 'ativo')       return '<span class="bdg bdg-ativo"><span class="bdg-dot"></span>Ativo</span>';
  if (estado === 'inativo')     return '<span class="bdg bdg-inativo">Inativo</span>';
  return '<span class="bdg bdg-andamento"><span class="bdg-dot"></span>Manutenção</span>';
}

// Lookup helpers
function getEq(id) {
  return APP.equipamentos.filter(function(e) { return e.id === id; })[0] || null;
}
// Um funcionário está afecto a este equipamento?
// Conta o equipamento principal E os equipamentos adicionais (equipamentos_extra).
// Um funcionário pode desempenhar funções noutros equipamentos além do seu.
function funcNoEq(u, eqId) {
  if (!u || !eqId) return false;
  if (u.equipamento_id === eqId) return true;
  var extra = u.equipamentos_extra;
  if (Array.isArray(extra)) return extra.indexOf(eqId) >= 0;
  return false;
}

// Todos os funcionários afectos a um equipamento (principal + adicionais)
function funcsDoEq(eqId) {
  return (APP.utilizadores || []).filter(function(u) { return funcNoEq(u, eqId); });
}

// Todos os equipamentos de um funcionário (principal + adicionais)
function eqsDoFunc(u) {
  var ids = [];
  if (!u) return ids;
  if (u.equipamento_id) ids.push(u.equipamento_id);
  if (Array.isArray(u.equipamentos_extra)) {
    u.equipamentos_extra.forEach(function(id) { if (ids.indexOf(id) < 0) ids.push(id); });
  }
  return ids;
}

function getTipo(id) {
  return APP.tiposEq.filter(function(t) { return t.id === id; })[0] || null;
}

// ── NAVEGAÇÃO POR MÓDULO ───────────────────────────────────
// Um módulo (Reservas/Escalas/Checklists) mostra sempre UM equipamento.
// Estas três funções garantem que nunca se aterra num equipamento onde
// o módulo está desligado.

// Que equipamento mostrar. Honra o pedido se for válido; senão resolve.
function eqDoModulo(k, eqIdPedido) {
  if (eqIdPedido) {
    var ok = APP.eqsComModulo(k).filter(function(e) { return e.id === eqIdPedido; }).length > 0;
    if (ok) return eqIdPedido;
  }
  return APP.eqParaModulo(k);
}

// Selector no cabeçalho do módulo — só lista equipamentos onde ele está ligado.
function eqSwitcher(k, eqId) {
  var eqs = APP.eqsComModulo(k);
  if (eqs.length <= 1) return ''; // com um só equipamento, o selector é ruído
  var s = '<select class="eq-switch" onchange="trocarEqModulo(this.value)">';
  eqs.forEach(function(e) {
    s += '<option value="' + e.id + '"' + (e.id === eqId ? ' selected' : '') + '>' + H(e.nome) + '</option>';
  });
  s += '</select>';
  return s;
}

// Trocar de equipamento dentro de um módulo: atualiza a seleção global,
// por isso a sidebar e o dashboard ficam coerentes com o que se está a ver.
function trocarEqModulo(eqId) {
  APP.spotEqId = eqId;
  try { App.buildSidebar(); } catch (e) {}
  // Alguns módulos precisam de ir buscar dados do novo equipamento antes de
  // desenhar (senão a grelha aparece vazia). Recarregar consoante a vista.
  var v = APP.view;
  if (v === 'escalas'   && typeof Escalas   !== 'undefined' && Escalas.load) {
    Escalas.load(function() { App.renderContent(); }); return;
  }
  if (v === 'reservas'  && typeof Reservas  !== 'undefined' && Reservas.load) {
    Reservas.load(function() { App.renderContent(); }); return;
  }
  if (v === 'checklists' && typeof Checklist !== 'undefined' && Checklist.load) {
    Checklist.load(function() { App.renderContent(); }); return;
  }
  App.renderContent();
}

// Estado vazio quando NENHUM equipamento acessível tem o módulo ligado.
function semEqParaModulo(nomeModulo) {
  return '<div class="mod-ph"><div class="mod-ph-t">Sem equipamentos com ' + nomeModulo + '</div>' +
         '<div class="mod-ph-s">Este módulo não está ativo em nenhum equipamento a que tenha acesso. ' +
         'Pode ligá-lo na ficha do equipamento, em Módulos.</div></div>';
}

// Um módulo (reservas, aulas, escalas, checklist...) está ativo num equipamento?
// Prioridade: definição do próprio equipamento (eq.modulos) → definição do tipo.
//   eq.modulos[k] === true  → forçar ligado
//   eq.modulos[k] === false → forçar desligado
//   ausente                 → herda do tipo (mod_<k>)
function modAtivo(eq, k) {
  if (!eq) return false;
  var ov = eq.modulos && typeof eq.modulos === 'object' ? eq.modulos[k] : undefined;
  if (ov === true) return true;
  if (ov === false) return false;
  var tipo = getTipo(eq.tipo_id);
  return !!(tipo && tipo['mod_' + k]);
}

// Reservas recorrentes (permanentes) estão permitidas neste equipamento?
// Guardado em eq.modulos.reservas_recorrentes — não precisa de coluna nova.
// Ausente => permitido (mantém o comportamento anterior).
function permiteRecorrente(eq) {
  if (!eq) return false;
  var ov = eq.modulos && typeof eq.modulos === 'object' ? eq.modulos.reservas_recorrentes : undefined;
  return ov !== false; // só desligado quando explicitamente false
}

// Chips de módulos ativos de um tipo
function modChips(tipo) {
  if (!tipo) return '<span class="td-m">—</span>';
  var chips = '';
  MOD_DEFS.forEach(function(m) {
    if (tipo['mod_' + m.k]) {
      chips += '<span class="chip-mod">' + m.l + '</span>';
    }
  });
  return chips || '<span class="td-m">Sem módulos</span>';
}

// ── TOAST ──────────────────────────────────────────────────
function toast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  var icon = type === 'error'
    ? '<svg class="ti" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    : '<svg class="ti" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  el.innerHTML = icon + H(msg);
  var c = document.getElementById('toast-wrap');

}

// ── CARREGAR DADOS ─────────────────────────────────────────
function mudarAnoTrabalho(ano, cb) {
  APP.anoTrabalho = parseInt(ano, 10) || new Date().getFullYear();
  loadAll(function() {
    if (typeof App !== 'undefined' && App.renderContent) App.renderContent();
    if (cb) cb();
  });
}

function loadAll(cb) {
  var _loadDone = false;

  // Ano de trabalho (por defeito o ano corrente). Filtra as tabelas que crescem.
  var ano = APP.anoTrabalho || new Date().getFullYear();
  var iniAno = ano + '-01-01';
  var fimAno = ano + '-12-31';
  // memorandos usa created_at; reservas/escalas usam data_inicio
  var filtroData = 'data_inicio=gte.' + iniAno + '&data_inicio=lte.' + fimAno;
  var filtroCriado = 'created_at=gte.' + iniAno + '&created_at=lte.' + fimAno + 'T23:59:59';

  Promise.all([
    sbGet('memorandos_dds', filtroCriado + '&order=created_at.desc').then(function(d) {
      APP.memos = Array.isArray(d) ? d : [];
    }).catch(function() { APP.memos = []; }),

    sbGet('equipamentos', 'order=nome.asc').then(function(d) {
      APP.equipamentos = Array.isArray(d) ? d : [];
      APP.equipamentos.sort(compareEq);
      // escolher o equipamento em destaque — nunca um a que o utilizador não tem acesso
      var visiveis = APP.equipamentos.filter(function(e) { return APP.podeVerEquipamento(e.id); });
      var atualOk = APP.spotEqId && visiveis.some(function(e) { return e.id === APP.spotEqId; });
      if (!atualOk) {
        // 1º o seu equipamento principal, se o puder ver
        if (APP.user && APP.user.equipamento_id && visiveis.some(function(e) { return e.id === APP.user.equipamento_id; })) {
          APP.spotEqId = APP.user.equipamento_id;
        // 2º um equipamento de que seja responsável
        } else if (APP.user && visiveis.length) {
          var meu = visiveis.filter(function(e) { return e.responsavel_id === APP.user.id; })[0];
          APP.spotEqId = meu ? meu.id : visiveis[0].id;
        } else {
          APP.spotEqId = null;
        }
      }
    }).catch(function() { APP.equipamentos = []; }),

    sbGet('tipos_equipamento', 'order=nome.asc').then(function(d) {
      APP.tiposEq = Array.isArray(d) ? d : [];
    }).catch(function() { APP.tiposEq = []; }),

    sbGet('utilizadores', 'order=nome.asc').then(function(d) {
      APP.utilizadores = Array.isArray(d) ? d : [];
    }).catch(function() { APP.utilizadores = []; }),

    // reservas do ano — mas incluir recorrentes (que podem começar antes)
    sbGet('reservas', 'or=(and(data_inicio.gte.' + iniAno + ',data_inicio.lte.' + fimAno + '),recorrente.eq.true)&order=data_inicio.asc').then(function(d) {
      APP.reservas = Array.isArray(d) ? d : [];
    }).catch(function() {
      // fallback: se o filtro OR falhar, traz só as do ano
      return sbGet('reservas', filtroData + '&order=data_inicio.asc').then(function(d) {
        APP.reservas = Array.isArray(d) ? d : [];
      }).catch(function() { APP.reservas = []; });
    }),

    sbGet('escalas', filtroData + '&order=data_inicio.asc').then(function(d) {
      APP.escalas = Array.isArray(d) ? d : [];
    }).catch(function() { APP.escalas = []; }),

    sbGet('equipamento_espacos', 'order=ordem.asc').then(function(d) {
      APP.espacos = Array.isArray(d) ? d : [];
    }).catch(function() { APP.espacos = []; }),

    sbGet('checklist_templates', 'order=created_at.asc').then(function(d) {
      APP.checklist_templates = Array.isArray(d) ? d : [];
    }).catch(function() { APP.checklist_templates = []; }),

    sbGet('checklist_registos', 'order=data_registo.desc&limit=100').then(function(d) {
      APP.checklist_registos = Array.isArray(d) ? d : [];
    }).catch(function() { APP.checklist_registos = []; }),

    sbGet('avisos', 'destinatario_id=eq.' + (APP.user ? APP.user.id : '00000000-0000-0000-0000-000000000000') + '&order=created_at.desc&limit=50').then(function(d) {
      APP.avisos = Array.isArray(d) ? d : [];
    }).catch(function() { APP.avisos = []; })
  ]).then(function() {
    APP.funcionarios = [];
    if (typeof App !== 'undefined') {
      if (App.buildSidebar) App.buildSidebar();
      if (App.updateBadges) App.updateBadges();
    }
    if (!_loadDone) { _loadDone = true; if (cb) cb(null); }
  }).catch(function(err) {
    console.error('loadAll erro:', err);
    if (!_loadDone) { _loadDone = true; if (cb) cb(err); }
  });

  // rede de segurança — nunca ficar preso em "a carregar"
  setTimeout(function() {
    if (!_loadDone) {
      _loadDone = true;
      console.warn('loadAll timeout — a abrir na mesma');
      APP.memos = APP.memos || [];
      APP.equipamentos = APP.equipamentos || [];
      APP.tiposEq = APP.tiposEq || [];
      APP.utilizadores = APP.utilizadores || [];
      APP.reservas = APP.reservas || [];
      APP.escalas = APP.escalas || [];
      APP.espacos = APP.espacos || [];
      APP.funcionarios = [];
      if (typeof App !== 'undefined' && App.buildSidebar) App.buildSidebar();
      if (cb) cb(null);
    }
  }, 6000);
}

// ── GERADOR DE NÚMERO DE MEMORANDO ────────────────────────
function gerarNumMemo() {
  var agora = new Date();
  var ano = agora.getFullYear();
  var mes = (agora.getMonth() + 1).toString().padStart(2, '0');
  var pattern = 'MEM/' + ano + '/' + mes + '/*';
  return sbGet('memorandos_dds', 'numero=like.' + pattern + '&select=numero&order=numero.desc&limit=1')
    .then(function(rows) {
      var seq = 1;
      if (rows && rows.length) {
        var parts = rows[0].numero.split('/');
        seq = parseInt(parts[parts.length - 1], 10) + 1;
      }
      return 'MEM/' + ano + '/' + mes + '/' + seq.toString().padStart(3, '0');
    });
}

// ── ORDEM DOS EQUIPAMENTOS ────────────────────────────────
// Usa o campo "ordem" (definido em "Ordenar equipamentos"); sem ordem, vai por nome.
function compareEq(a, b) {
  var oa = (a && a.ordem != null) ? a.ordem : 99999, ob = (b && b.ordem != null) ? b.ordem : 99999;
  if (oa !== ob) return oa - ob;
  return String(a.nome).localeCompare(String(b.nome), 'pt');
}

// ── BRIGADAS (localStorage) ────────────────────────────────
var BRIGADAS_KEY = 'gestdds_brigadas';

function getBrigadas() {
  if (typeof Brigadas !== 'undefined') return Brigadas.lista();
  var saved = localStorage.getItem(BRIGADAS_KEY);
  return saved ? JSON.parse(saved) : ['Brigada A', 'Brigada B', 'Manutenção', 'Limpeza'];
}

function saveBrigadas(list) {
  localStorage.setItem(BRIGADAS_KEY, JSON.stringify(list));
}

// ── EMPTY STATE ────────────────────────────────────────────
function emptyState(title, sub) {
  return '<div class="empty-wrap">' +
    '<div class="empty-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>' +
    '<div class="empty-title">' + H(title) + '</div>' +
    '<p class="empty-sub">' + H(sub) + '</p>' +
    '</div>';
}

// ── ACCESS DENIED ──────────────────────────────────────────
function accessDenied() {
  return emptyState('Acesso restrito', 'Não tem permissões para aceder a esta secção.');
}

// ── LOADING ────────────────────────────────────────────────
function loadingState() {
  return '<div class="loading-wrap"><div class="spinner"></div> A carregar...</div>';
}

</script>
<script>
/* ═════ avisos.js ═════ */
// ============================================================
// GestDDS — avisos.js  v5.1
// Painel de notificações / avisos
// ============================================================

var Avisos = (function() {

  var _avisos = [];
  var _polling = null;
  var _modo = 'notificacao'; // 'notificacao' (sino) | 'mensagem' (envelope)

  // ── CARREGAR ──────────────────────────────────────────────
  function carregar() {
    if (!APP.user || !APP.user.id) return Promise.resolve();

    var uuidRx = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    if (!uuidRx.test(APP.user.id)) return Promise.resolve();

    return sbGet('avisos', 'destinatario_id=eq.' + APP.user.id + '&order=created_at.desc&limit=100')
      .then(function(data) {
        _avisos = Array.isArray(data) ? data : [];
        _updateBadge();
      })
      .catch(function() {
        _avisos = [];
      });
  }

  function _ehMensagem(a) { return a.tipo === 'mensagem'; }
  function _ehNotificacao(a) { return a.tipo !== 'mensagem'; }

  // Mensagens que EU enviei (uma cópia por destinatário). Agrupadas por lote.
  var _enviadas = [];
  function _carregarEnviadas() {
    if (!APP.user || !APP.user.id) return Promise.resolve();
    return sbGet('avisos', 'remetente_id=eq.' + APP.user.id + '&tipo=eq.mensagem&order=created_at.desc&limit=200')
      .then(function(data) { _enviadas = Array.isArray(data) ? data : []; })
      .catch(function() { _enviadas = []; });
  }

  // Agrupar as cópias por lote (ou, para envios antigos sem lote, por
  // remetente+título+mensagem+minuto) → uma linha por mensagem enviada.
  function _enviadasAgrupadas() {
    var grupos = {};
    _enviadas.forEach(function(a) {
      var chave = a.lote_id || (a.titulo + '|' + a.mensagem + '|' + String(a.created_at).slice(0, 16));
      if (!grupos[chave]) {
        grupos[chave] = { chave: chave, lote_id: a.lote_id || null, titulo: a.titulo, mensagem: a.mensagem,
                          created_at: a.created_at, ids: [], destinatarios: 0, lidos: 0 };
      }
      grupos[chave].ids.push(a.id);
      grupos[chave].destinatarios++;
      if (a.lido) grupos[chave].lidos++;
    });
    return Object.keys(grupos).map(function(k) { return grupos[k]; })
      .sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
  }

  function _updateBadge() {
    // sino = notificações não lidas
    var notNaoLidas = _avisos.filter(function(a) { return !a.lido && _ehNotificacao(a); }).length;
    var sino = document.getElementById('sino-badge');
    if (sino) {
      sino.textContent = notNaoLidas;
      sino.style.display = notNaoLidas > 0 ? 'flex' : 'none';
    }
    // envelope = mensagens não lidas
    var msgNaoLidas = _avisos.filter(function(a) { return !a.lido && _ehMensagem(a); }).length;
    var env = document.getElementById('msg-badge');
    if (env) {
      env.textContent = msgNaoLidas;
      env.style.display = msgNaoLidas > 0 ? 'flex' : 'none';
    }
  }

  // ── ABRIR PAINÉIS ─────────────────────────────────────────
  function abrir() { _abrirModo('notificacao'); }        // sino
  function abrirMensagens() { _abrirModo('mensagem'); }  // envelope

  function _abrirModo(modo) {
    _modo = modo;
    _abaMsg = 'recebidas'; // sempre começa nas recebidas
    var overlay = document.getElementById('avisos-overlay');
    var panel   = document.getElementById('avisos-panel');
    if (overlay) overlay.classList.add('open');
    if (panel)   panel.classList.add('open');

    // título do painel
    var titulo = document.getElementById('avisos-title');
    if (titulo) titulo.textContent = modo === 'mensagem' ? 'Mensagens' : 'Notificações';

    // botão nova mensagem só no modo mensagem e para admin/DDS
    var btn = document.getElementById('btn-nova-msg');
    if (btn) btn.style.display = (modo === 'mensagem' && (APP.isAdmin() || APP.isDds())) ? 'inline-flex' : 'none';

    var proms = [carregar()];
    // quem pode enviar, também carrega as suas mensagens enviadas
    if (modo === 'mensagem' && (APP.isAdmin() || APP.isDds())) proms.push(_carregarEnviadas());
    Promise.all(proms).then(function() { _renderBody(); });
  }

  var _abaMsg = 'recebidas';
  function verAba(aba) { _abaMsg = aba; _renderBody(); }

  function fechar() {
    var overlay = document.getElementById('avisos-overlay');
    var panel   = document.getElementById('avisos-panel');
    if (overlay) overlay.classList.remove('open');
    if (panel)   panel.classList.remove('open');
  }

  // ── RENDER BODY ───────────────────────────────────────────
  function _renderBody() {
    var body = document.getElementById('avisos-body');
    if (!body) return;

    var podeEnviar = APP.isAdmin() || APP.isDds();

    // No modo mensagem, quem pode enviar tem duas abas: Recebidas / Enviadas
    var abasHtml = '';
    if (_modo === 'mensagem' && podeEnviar) {
      abasHtml += '<div class="msg-abas">';
      abasHtml += '<button class="msg-aba' + (_abaMsg === 'recebidas' ? ' active' : '') + '" onclick="Avisos.verAba(\'recebidas\')">Recebidas</button>';
      abasHtml += '<button class="msg-aba' + (_abaMsg === 'enviadas' ? ' active' : '') + '" onclick="Avisos.verAba(\'enviadas\')">Enviadas</button>';
      abasHtml += '</div>';
    }

    // Aba ENVIADAS
    if (_modo === 'mensagem' && podeEnviar && _abaMsg === 'enviadas') {
      var enviadas = _enviadasAgrupadas();
      if (!enviadas.length) {
        body.innerHTML = abasHtml + '<div class="avisos-empty"><div class="avisos-empty-ic">📤</div><div class="avisos-empty-t">Sem mensagens enviadas</div><div class="avisos-empty-s">As mensagens que enviar aparecem aqui.</div></div>';
        return;
      }
      var h = abasHtml;
      enviadas.forEach(function(g) { h += _enviadaItem(g); });
      body.innerHTML = h;
      return;
    }

    // Aba RECEBIDAS (comportamento original)
    var lista = _avisos.filter(_modo === 'mensagem' ? _ehMensagem : _ehNotificacao);

    if (!lista.length) {
      var ic = _modo === 'mensagem' ? '✉️' : '🔔';
      var t  = _modo === 'mensagem' ? 'Sem mensagens' : 'Sem notificações';
      var s  = _modo === 'mensagem' ? 'Não tem mensagens.' : 'Não tem avisos pendentes.';
      body.innerHTML = abasHtml + '<div class="avisos-empty"><div class="avisos-empty-ic">' + ic + '</div><div class="avisos-empty-t">' + t + '</div><div class="avisos-empty-s">' + s + '</div></div>';
      return;
    }

    var naoLidos = lista.filter(function(a) { return !a.lido; });
    var lidos    = lista.filter(function(a) { return a.lido; });

    var html = abasHtml;
    if (naoLidos.length) {
      html += '<div class="avisos-section-label">Não lidos — ' + naoLidos.length + '</div>';
      naoLidos.forEach(function(a) { html += _avisoItem(a, true); });
    }
    if (lidos.length) {
      html += '<div class="avisos-section-label" style="margin-top:4px;">Histórico</div>';
      lidos.forEach(function(a) { html += _avisoItem(a, false); });
    }
    body.innerHTML = html;
  }

  // Uma mensagem enviada (agrupada), com estado de leitura e botão apagar
  function _enviadaItem(g) {
    var tempo = _tempoRelativo(g.created_at);
    var html = '<div class="aviso-item">';
    html += '<div class="aviso-ic"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></div>';
    html += '<div class="aviso-body">';
    html += '<div class="aviso-titulo">' + H(g.titulo || 'Mensagem') + '</div>';
    html += '<div class="aviso-msg">' + H(g.mensagem || '') + '</div>';
    html += '<div class="aviso-tempo">' + tempo + ' · ' + g.lidos + '/' + g.destinatarios + ' lida(s)</div>';
    html += '<button class="btn btn-danger btn-sm" style="margin-top:8px;font-size:11.5px;padding:5px 12px;" onclick="event.stopPropagation();Avisos.apagarEnviada(\'' + g.chave + '\')">🗑 Apagar mensagem</button>';
    html += '</div></div>';
    return html;
  }

  function _avisoItem(a, naoLido) {
    var tempo = _tempoRelativo(a.created_at);
    var remetente = a.remetente_nome ? '<span style="font-weight:600;color:var(--accent);">' + H(a.remetente_nome) + '</span> · ' : '';
    var html = '<div class="aviso-item' + (naoLido ? ' nao-lido' : '') + '">';
    html += '<div class="aviso-ic"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></div>';
    html += '<div class="aviso-body">';
    html += '<div class="aviso-titulo">' + H(a.titulo || 'Aviso') + '</div>';
    html += '<div class="aviso-msg">' + H(a.mensagem || '') + '</div>';
    html += '<div class="aviso-tempo">' + remetente + tempo + '</div>';
    if (naoLido) {
      html += '<button class="btn btn-primary btn-sm" style="margin-top:8px;font-size:11.5px;padding:5px 12px;" onclick="event.stopPropagation();Avisos.marcarLido(\'' + a.id + '\')">✓ Tomei conhecimento</button>';
    } else {
      html += '<div style="margin-top:6px;font-size:11px;color:var(--green);font-weight:600;">✓ Lido</div>';
    }
    html += '</div>';
    if (naoLido) html += '<div style="width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:4px;"></div>';
    html += '</div>';
    return html;
  }

  // ── ACÇÕES ────────────────────────────────────────────────
  function apagarEnviada(chave) {
    var g = _enviadasAgrupadas().filter(function(x) { return x.chave === chave; })[0];
    if (!g) return;
    if (!confirm('Apagar esta mensagem para todos os ' + g.destinatarios + ' destinatário(s)? Esta ação não pode ser anulada.')) return;

    // apagar todas as cópias: por lote (fiável) ou pela lista de ids
    var filtro = g.lote_id ? ('lote_id=eq.' + g.lote_id) : ('id=in.(' + g.ids.join(',') + ')');
    sbDelete('avisos', filtro).then(function() {
      _enviadas = _enviadas.filter(function(a) { return g.ids.indexOf(a.id) < 0; });
      _renderBody();
      toast('Mensagem apagada.', 'success');
    }).catch(function(e) {
      var msg = (e && (e.code || e.message)) ? [e.code, e.message].filter(Boolean).join(' · ') : 'Erro ao apagar a mensagem.';
      toast(msg, 'error');
    });
  }

  function marcarLido(id) {
    sbPatch('avisos', 'id=eq.' + id, { lido: true }).then(function() {
      // atualizar localmente
      _avisos.forEach(function(a) { if (a.id === id) a.lido = true; });
      _updateBadge();
      _renderBody();
    }).catch(function() {});
  }

  function marcarTodosLidos() {
    var naoLidos = _avisos.filter(function(a) { return !a.lido; });
    if (!naoLidos.length) return;

    var ids = naoLidos.map(function(a) { return a.id; }).join(',');
    sbPatch('avisos', 'id=in.(' + ids + ')', { lido: true }).then(function() {
      _avisos.forEach(function(a) { a.lido = true; });
      _updateBadge();
      _renderBody();
      toast('Todos os avisos marcados como lidos.', 'success');
    }).catch(function() {
      toast('Erro ao atualizar avisos.', 'error');
    });
  }

  // ── TEMPO RELATIVO ────────────────────────────────────────
  function _tempoRelativo(dateStr) {
    if (!dateStr) return '—';
    var diff = Math.floor((new Date() - new Date(dateStr)) / 1000);
    if (diff < 60)   return 'Agora mesmo';
    if (diff < 3600) return Math.floor(diff / 60) + ' min atrás';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h atrás';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd atrás';
    return fData(dateStr);
  }

  // ── POLLING ───────────────────────────────────────────────
  // verifica novos avisos a cada 60 segundos
  function _startPolling() {
    if (_polling) clearInterval(_polling);
    _polling = setInterval(function() {
      carregar();
    }, 60000);
  }

  // ── COMPOR E ENVIAR MENSAGENS (admin/DDS) ─────────────────
  function openCompor() {
    if (!APP.isAdmin() && !APP.isDds()) {
      toast('Sem permissão para enviar mensagens.', 'error');
      return;
    }
    // popular destinatários
    var sel = document.getElementById('msg-destino');
    if (sel) {
      sel.innerHTML = '';
      sel.innerHTML += '<option value="__todos">📢 Todos os utilizadores</option>';
      // por equipamento
      APP.equipamentos.forEach(function(eq) {
        sel.innerHTML += '<option value="eq:' + eq.id + '">🏢 ' + H(eq.nome) + ' (equipa)</option>';
      });
      // individuais
      sel.innerHTML += '<option value="" disabled>──────────</option>';
      APP.utilizadores.forEach(function(u) {
        if (u.id === APP.user.id) return;
        sel.innerHTML += '<option value="user:' + u.id + '">👤 ' + H(u.nome) + '</option>';
      });
    }
    var t = document.getElementById('msg-titulo'); if (t) t.value = '';
    var m = document.getElementById('msg-texto'); if (m) m.value = '';
    openModal('m-nova-msg');
  }

  function enviar() {
    var destino = (document.getElementById('msg-destino') || {}).value || '';
    var titulo  = (document.getElementById('msg-titulo') || {}).value || '';
    var texto   = (document.getElementById('msg-texto') || {}).value || '';

    if (!titulo.trim()) { toast('Escreva um título.', 'error'); return; }
    if (!texto.trim())  { toast('Escreva a mensagem.', 'error'); return; }
    if (!destino)       { toast('Escolha o destinatário.', 'error'); return; }

    // determinar lista de destinatários
    var destinatarios = [];
    if (destino === '__todos') {
      destinatarios = APP.utilizadores.filter(function(u){ return u.id !== APP.user.id; }).map(function(u){ return u.id; });
    } else if (destino.indexOf('eq:') === 0) {
      var eqId = destino.slice(3);
      destinatarios = APP.utilizadores.filter(function(u){ return u.equipamento_id === eqId && u.id !== APP.user.id; }).map(function(u){ return u.id; });
    } else if (destino.indexOf('user:') === 0) {
      destinatarios = [destino.slice(5)];
    }

    // nunca enviar a si próprio
    destinatarios = destinatarios.filter(function(uid) { return uid !== APP.user.id; });

    if (!destinatarios.length) { toast('Sem destinatários para este envio.', 'error'); return; }

    // identificador comum a todas as cópias deste envio, para poder apagá-las
    // todas de uma vez se tiver sido enviada por engano.
    var lote = 'lote_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

    // criar um aviso por destinatário
    var envios = destinatarios.map(function(uid) {
      return sbPost('avisos', {
        destinatario_id: uid,
        titulo: titulo.trim(),
        mensagem: texto.trim(),
        lido: false,
        tipo: 'mensagem',
        remetente_id: APP.user.id,
        remetente_nome: APP.user.nome,
        lote_id: lote
      });
    });

    Promise.all(envios).then(function() {
      toast('Mensagem enviada a ' + destinatarios.length + ' destinatário(s).', 'success');
      closeModal('m-nova-msg');
      _carregarEnviadas();
    }).catch(function(e) {
      // mostrar o erro real do Supabase
      var msg = (e && (e.code || e.message)) ? [e.code, e.message].filter(Boolean).join(' · ') : 'Erro ao enviar mensagem.';
      toast(msg, 'error');
    });
  }

  // HTML do modal de composição (injectado no boot)
  function _modalHTML() {
    var html = '<div class="modal-bd" id="m-nova-msg">';
    html += '<div class="modal" style="max-width:480px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-blue"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div><div><div class="modal-title">Nova mensagem</div><div class="modal-sub">Enviar aviso aos utilizadores</div></div><button class="modal-close" onclick="closeModal(\'m-nova-msg\')">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="fi"><label class="fl">Para</label><select id="msg-destino" class="fin"></select></div>';
    html += '<div class="fi"><label class="fl">Título</label><input type="text" id="msg-titulo" class="fin" placeholder="Assunto da mensagem"></div>';
    html += '<div class="fi"><label class="fl">Mensagem</label><textarea id="msg-texto" class="fin" rows="4" placeholder="Escreva a sua mensagem..."></textarea></div>';
    html += '</div>';
    html += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-nova-msg\')">Cancelar</button><button class="btn btn-primary" onclick="Avisos.enviar()">Enviar mensagem</button></div>';
    html += '</div></div>';
    return html;
  }

  // ── INIT ──────────────────────────────────────────────────
  function init() {
    // injectar modal de composição
    var host = document.getElementById('modals-host') || document.body;
    if (host && !document.getElementById('m-nova-msg')) {
      var div = document.createElement('div');
      div.innerHTML = _modalHTML();
      host.appendChild(div.firstChild);
    }
    carregar().then(function() {
      _startPolling();
    });
  }

  return {
    init: init,
    abrir: abrir,
    abrirMensagens: abrirMensagens,
    fechar: fechar,
    carregar: carregar,
    marcarLido: marcarLido,
    marcarTodosLidos: marcarTodosLidos,
    verAba: verAba,
    apagarEnviada: apagarEnviada,
    openCompor: openCompor,
    enviar: enviar
  };

})();

</script>
<script>
/* ═════ reservas.js ═════ */
// ============================================================
// GestDDS — reservas.js  v5.2
// Módulo de Reservas — calendário semanal, pré-reserva,
// reservas recorrentes semanais
// ============================================================

var Reservas = (function() {

  var _weekOffset = 0;

  var DIAS_SEMANA = [
    { v: 1, l: 'Seg' }, { v: 2, l: 'Ter' }, { v: 3, l: 'Qua' },
    { v: 4, l: 'Qui' }, { v: 5, l: 'Sex' }, { v: 6, l: 'Sáb' }, { v: 0, l: 'Dom' }
  ];

  var CORES = [
    { v: '#3B82F6', l: 'Azul' },   { v: '#8B5CF6', l: 'Roxo' },
    { v: '#10B981', l: 'Verde' },  { v: '#F59E0B', l: 'Âmbar' },
    { v: '#EF4444', l: 'Vermelho'},{ v: '#06B6D4', l: 'Ciano' },
    { v: '#EC4899', l: 'Rosa' },   { v: '#6366F1', l: 'Índigo'}
  ];

  var HORAS = [];
  for (var h = 7; h <= 23; h++) HORAS.push(h.toString().padStart(2,'0') + ':00');

  // ── ESTADO DAS RESERVAS ───────────────────────────────────
  var ESTADOS = {
    pre_reserva: { l: 'Pré-reserva', cor: '#F59E0B', bg: '#FFFBEB' },
    confirmada:  { l: 'Confirmada',  cor: '#3B82F6', bg: '#EFF6FF' },
    cancelada:   { l: 'Cancelada',   cor: '#EF4444', bg: '#FEF2F2' }
  };

  // ── RENDER PRINCIPAL ──────────────────────────────────────
  function render(eqId) {
    // resolve para um equipamento onde o módulo esteja REALMENTE ligado
    var alvo = eqDoModulo('reservas', eqId || APP.spotEqId);
    if (!alvo) return semEqParaModulo('Reservas');
    if (APP.spotEqId !== alvo) APP.spotEqId = alvo; // manter a sidebar coerente
    var eq = getEq(alvo);
    if (!eq) return semEqParaModulo('Reservas');

    var podeGerir = APP.podeGerirReservas(eq.id);
    var html = '<div class="eq-toolbar"><div class="eq-toolbar-t">Calendário de reservas</div>';
    if (podeGerir) {
      html += '<div style="display:flex;gap:8px;">';
      html += '<button class="btn btn-secondary btn-sm" onclick="Reservas.openNova(\'' + eq.id + '\',\'pre_reserva\')">+ Pré-reserva</button>';
      html += '<button class="btn btn-primary btn-sm" onclick="Reservas.openNova(\'' + eq.id + '\',\'confirmada\')">+ Reserva confirmada</button>';
      html += '</div>';
    } else {
      html += '<span style="font-size:12px;color:var(--text-3);padding:6px 10px;background:var(--bg);border-radius:6px;">👁 Apenas consulta</span>';
    }
    html += '</div>';

    // Legenda de estado
    html += '<div style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;">';
    for (var est in ESTADOS) {
      var e = ESTADOS[est];
      html += '<div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);">';
      html += '<div style="width:10px;height:10px;border-radius:50%;background:' + e.cor + ';"></div>' + e.l;
      html += '</div>';
    }
    html += '</div>';

    html += _renderCalendario(eq.id);
    return html;
  }

  // ── CALENDÁRIO ────────────────────────────────────────────
  function _getWeekDates() {
    var hoje = new Date();
    var diaSemana = hoje.getDay();
    var seg = new Date(hoje);
    seg.setDate(hoje.getDate() - (diaSemana === 0 ? 6 : diaSemana - 1) + (_weekOffset * 7));
    var dias = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(seg);
      d.setDate(seg.getDate() + i);
      dias.push(d);
    }
    return dias;
  }

  function _fDia(d) {
    var n = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    return n[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1);
  }

  function _isHoje(d) {
    var h = new Date();
    return d.getDate()===h.getDate() && d.getMonth()===h.getMonth() && d.getFullYear()===h.getFullYear();
  }

  // Expandir reservas recorrentes para a semana atual
  // "09:30" → 9.5   (os minutos contam)
  // Fundo claro (translúcido) a partir de uma cor #RRGGBB, para o bloco
  // da reserva ter a cor escolhida sem esconder o texto.
  function _corClara(hex) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hex || ''));
    if (!m) return 'rgba(59,130,246,0.14)';
    var r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',0.15)';
  }

  function _hDec(hhmm) {
    if (!hhmm) return null;
    var p = String(hhmm).split(':');
    return (parseInt(p[0], 10) || 0) + (parseInt(p[1], 10) || 0) / 60;
  }

  // Componentes LOCAIS de uma data, para os inputs date/time.
  // toISOString() dá UTC e pode saltar de dia consoante o fuso.
  function _pad(n) { return (n < 10 ? '0' : '') + n; }
  function _dataLocal(d) {
    return d.getFullYear() + '-' + _pad(d.getMonth() + 1) + '-' + _pad(d.getDate());
  }
  function _horaLocal(d) {
    return _pad(d.getHours()) + ':' + _pad(d.getMinutes());
  }

  function _expandirRecorrentes(reservas, dias) {
    var eventos = [];

    reservas.forEach(function(r) {
      if (!r.recorrente) {
        var ri = new Date(r.data_inicio);
        var rf = r.data_fim ? new Date(r.data_fim) : null;

        var hIni = ri.getHours() + ri.getMinutes() / 60;
        var hFim = rf ? (rf.getHours() + rf.getMinutes() / 60) : (hIni + 1);
        // se acaba noutro dia, mostra até ao fim do dia
        if (rf && rf.toDateString() !== ri.toDateString()) hFim = 24;

        dias.forEach(function(d) {
          var dNorm  = new Date(d);  dNorm.setHours(0,0,0,0);
          var riNorm = new Date(ri); riNorm.setHours(0,0,0,0);
          var rfNorm = new Date(rf || ri); rfNorm.setHours(23,59,59,0);
          if (dNorm >= riNorm && dNorm <= rfNorm) {
            eventos.push({ reserva: r, data: d, hIni: hIni, hFim: hFim });
          }
        });
        return;
      }

      // recorrente — expandir por dia da semana dentro do período
      var diasSem = (r.dias_semana || '').split(',').map(function(x) { return parseInt(x, 10); });
      var periInicio = r.data_inicio_periodo ? new Date(r.data_inicio_periodo) : new Date(r.data_inicio);
      var periFim    = r.data_fim_periodo    ? new Date(r.data_fim_periodo)    : new Date(r.data_fim);

      var hIniR = _hDec(r.hora_inicio);
      var hFimR = _hDec(r.hora_fim);
      if (hIniR == null) hIniR = 9;
      if (hFimR == null || hFimR <= hIniR) hFimR = hIniR + 1;

      dias.forEach(function(d) {
        var dNorm = new Date(d); dNorm.setHours(0,0,0,0);
        var pNorm = new Date(periInicio); pNorm.setHours(0,0,0,0);
        var fNorm = new Date(periFim);    fNorm.setHours(23,59,59,0);

        if (dNorm >= pNorm && dNorm <= fNorm && diasSem.indexOf(d.getDay()) >= 0) {
          eventos.push({ reserva: r, data: d, hIni: hIniR, hFim: hFimR });
        }
      });
    });
    _atribuirColunas(eventos);
    return eventos;
  }

  // Reservas que se sobrepõem no tempo, no mesmo dia, ficam LADO A LADO.
  // A cada evento damos { _col, _cols } para calcular largura e posição.
  function _atribuirColunas(eventos) {
    // agrupar por dia
    var porDia = {};
    eventos.forEach(function(ev) {
      var k = ev.data.toDateString();
      (porDia[k] = porDia[k] || []).push(ev);
    });

    Object.keys(porDia).forEach(function(k) {
      var lista = porDia[k].sort(function(a, b) { return a.hIni - b.hIni || a.hFim - b.hFim; });

      // dividir em grupos que se tocam (cadeias de sobreposição)
      var grupo = [], fimGrupo = -1;
      function fecharGrupo() {
        if (!grupo.length) return;
        // colocação gulosa por colunas
        var cols = [];
        grupo.forEach(function(ev) {
          var c = 0;
          while (cols[c] != null && cols[c] > ev.hIni + 1e-6) c++;
          ev._col = c;
          cols[c] = ev.hFim;
        });
        var total = cols.length;
        grupo.forEach(function(ev) { ev._cols = total; });
        grupo = []; fimGrupo = -1;
      }

      lista.forEach(function(ev) {
        if (grupo.length && ev.hIni >= fimGrupo - 1e-6) fecharGrupo();
        grupo.push(ev);
        if (ev.hFim > fimGrupo) fimGrupo = ev.hFim;
      });
      fecharGrupo();
    });
  }

  function _renderCalendario(eqId) {
    var dias = _getWeekDates();
    var labelSemana = fData(dias[0].toISOString()) + ' — ' + fData(dias[6].toISOString());

    // só as reservas DESTE equipamento
    var doEq = (APP.reservas || []).filter(function(r) { return r.equipamento_id === eqId; });
    var eventos = _expandirRecorrentes(doEq, dias);

    var html = '<div class="escala-controls">';
    html += '<div class="escala-nav">';
    html += '<div class="esc-nav-btn" onclick="Reservas.semanaAnterior()">‹</div>';
    html += '<div class="escala-week">📅 ' + labelSemana + '</div>';
    html += '<div class="esc-nav-btn" onclick="Reservas.semanaProxima()">›</div>';
    if (_weekOffset !== 0) html += '<button class="btn btn-ghost btn-sm" onclick="Reservas.semanaActual()" style="font-size:12px;">Hoje</button>';
    html += '</div>';
    html += '<button class="btn btn-secondary btn-sm" onclick="Reservas.openListagem(\'' + eqId + '\')">Ver lista</button>';
    html += '</div>';

    // ── Grelha DINÂMICA: só as horas em que há reservas ──
    var minH = 24, maxH = 0;
    eventos.forEach(function(ev) {
      var hi = ev.hIni, hf = ev.hFim;
      if (hi == null) return;
      if (hi < minH) minH = hi;
      if ((hf || hi + 1) > maxH) maxH = hf || hi + 1;
    });
    if (minH > maxH) { minH = 9; maxH = 18; }    // sem reservas
    minH = Math.max(0, Math.floor(minH) - 1);
    maxH = Math.min(24, Math.ceil(maxH) + 1);
    if (maxH - minH < 6) maxH = Math.min(24, minH + 6);

    var LINHA = 30;

    html += '<div class="sched-wrap"><div class="sched-grid" style="--row:' + LINHA + 'px;">';
    html += '<div class="sched-head"></div>';
    dias.forEach(function(d) {
      html += '<div class="sched-head' + (_isHoje(d) ? ' today' : '') + '">' + _fDia(d) + '</div>';
    });

    for (var hn = minH; hn < maxH; hn++) {
      var horaNum = hn;
      html += '<div class="sched-time">' + ('0' + hn).slice(-2) + ':00</div>';

      dias.forEach(function(d) {
        var dStr = _dataLocal(d);
        html += '<div class="sched-cell" onclick="Reservas.clickCelula(this,\'' + eqId + '\')" data-hora="' + horaNum + '" data-data="' + dStr + '">';

        eventos.forEach(function(ev) {
          if (ev.data.toDateString() !== d.toDateString()) return;
          if (Math.floor(ev.hIni) !== horaNum) return;

          var r   = ev.reserva;
          var est = ESTADOS[r.estado] || ESTADOS.confirmada;

          var hIni = ev.hIni;
          var hFim = (ev.hFim && ev.hFim > hIni) ? ev.hFim : hIni + 1;

          var offset = (hIni - Math.floor(hIni)) * LINHA;
          var altura = Math.max(16, (hFim - hIni) * LINHA - 2);

          var lbl = _fmtH(hIni) + '–' + _fmtH(hFim);

          // posição lado a lado quando há sobreposição
          var cols = ev._cols || 1;
          var col  = ev._col || 0;
          var larg = 100 / cols;
          var posL = col * larg;

          // A cor do bloco é a COR ESCOLHIDA na reserva. O estado vira sinal
          // secundário: pré-reserva com contorno tracejado, cancelada esbatida.
          var cor = r.cor || '#3B82F6';
          var estilo = 'background:' + _corClara(cor) + ';color:' + cor +
                       ';border-left:3px solid ' + cor + ';top:' + offset + 'px;height:' + altura + 'px;' +
                       'left:calc(' + posL + '% + 1px);width:calc(' + larg + '% - 2px);cursor:pointer;';
          if (r.estado === 'pre_reserva') estilo += 'border:1.5px dashed ' + cor + ';border-left:3px solid ' + cor + ';';
          if (r.estado === 'cancelada')   estilo += 'opacity:.5;text-decoration:line-through;';

          html += '<div class="sched-event" title="' + H(r.titulo) + (r.espaco ? ' · ' + H(r.espaco) : '') + ' · ' + lbl + '"';
          html += ' style="' + estilo + '"';
          html += ' onclick="event.stopPropagation();Reservas.abrirDetalhe(\'' + r.id + '\')">';
          html += '<span style="font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">';
          if (r.estado === 'pre_reserva') html += '⏳ ';
          if (r.recorrente) html += '🔁 ';
          html += H(r.titulo);
          html += '</span>';
          if (r.espaco && altura > 24) {
            html += '<span style="font-weight:600;opacity:.85;font-size:9px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + H(r.espaco) + '</span>';
          }
          if (altura > 26) {
            html += '<span style="font-weight:400;opacity:.8;font-size:9.5px;">' + lbl + '</span>';
          }
          html += '</div>';
        });

        html += '</div>';
      });
    }

    html += '</div></div>';
    return html;
  }

  // 9.5 → "09:30"
  function _fmtH(dec) {
    var h = Math.floor(dec);
    var m = Math.round((dec - h) * 60);
    if (m === 60) { h++; m = 0; }
    return ('0' + h).slice(-2) + ':' + ('0' + m).slice(-2);
  }

  // ── LISTAGEM ──────────────────────────────────────────────
  function openListagem(eqId) {
    var reservas = (APP.reservas || []).filter(function(r) { return r.equipamento_id === eqId; });
    reservas.sort(function(a,b) { return new Date(a.data_inicio) - new Date(b.data_inicio); });

    var body = document.getElementById('m-res-list-body');
    if (!body) return;

    if (!reservas.length) {
      body.innerHTML = emptyState('Sem reservas', 'Não existem reservas para este equipamento.');
    } else {
      var html = '<div class="dtw"><table class="dt">';
      html += '<thead><tr><th>Título</th><th>Entidade</th><th>Período</th><th>Horário</th><th>Tipo</th><th>Estado</th><th></th></tr></thead><tbody>';
      reservas.forEach(function(r) {
        var est = ESTADOS[r.estado] || ESTADOS.confirmada;
        html += '<tr>';
        html += '<td class="td-p">' + H(r.titulo) + '</td>';
        html += '<td class="td-m">' + H(r.entidade || '—') + '</td>';
        if (r.recorrente) {
          var diasStr = (r.dias_semana || '').split(',').map(function(d) {
            var ds = DIAS_SEMANA.filter(function(x) { return x.v == parseInt(d,10); })[0];
            return ds ? ds.l : d;
          }).join(', ');
          html += '<td class="td-m">' + fData(r.data_inicio_periodo) + ' → ' + fData(r.data_fim_periodo) + '</td>';
          html += '<td class="td-m">' + diasStr + '<br><span style="font-family:JetBrains Mono,monospace;">' + (r.hora_inicio||'').slice(0,5) + '–' + (r.hora_fim||'').slice(0,5) + '</span></td>';
          html += '<td><span class="bdg" style="background:#EDE9FE;color:#5B21B6;">🔁 Recorrente</span></td>';
        } else {
          html += '<td class="td-m">' + fData(r.data_inicio) + '</td>';
          var hi = new Date(r.data_inicio), hf = new Date(r.data_fim);
          html += '<td class="td-mono">' + _horaLocal(hi) + '–' + _horaLocal(hf) + '</td>';
          html += '<td><span class="bdg" style="background:var(--accent-light);color:var(--accent-dark);">Pontual</span></td>';
        }
        html += '<td><span class="bdg" style="background:' + est.bg + ';color:' + est.cor + ';">' + est.l + '</span></td>';
        html += '<td><div class="td-act">';
        if (r.estado === 'pre_reserva') {
          html += '<button class="btn btn-primary btn-sm" onclick="Reservas.confirmar(\'' + r.id + '\')">Confirmar</button> ';
        }
        html += '<button class="btn btn-ghost btn-sm" onclick="Reservas.openEditar(\'' + r.id + '\')">Editar</button>';
        html += '</div></td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      body.innerHTML = html;
    }
    openModal('m-res-listagem');
  }

  // ── MODAL HTML ────────────────────────────────────────────
  function getModaisHTML() {
    var html = '';

    // MODAL NOVA / EDITAR RESERVA
    html += '<div class="modal-bd" id="m-reserva-nova">';
    html += '<div class="modal" style="max-width:540px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-blue"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div><div class="modal-title" id="m-res-ttl">Nova reserva</div><div class="modal-sub" id="m-res-eq">—</div></div><button class="modal-close" onclick="closeModal(\'m-reserva-nova\')">✕</button></div>';
    html += '<div class="modal-body">';

    html += '<div class="form-sec-t">Identificação</div>';
    html += '<div class="fi"><label class="fl">Título / Atividade *</label><input type="text" id="res-titulo" class="fin" placeholder="Descrição da atividade"></div>';
    html += '<div class="form-row"><div class="fi"><label class="fl">Entidade / Clube</label><input type="text" id="res-entidade" class="fin" placeholder="Nome da entidade ou pessoa"></div>';
    html += '<div class="fi"><label class="fl">Espaço</label><select id="res-espaco-sel" class="fin" onchange="Reservas.onEspacoChange()"><option value="">Nenhum</option></select><input type="text" id="res-espaco" class="fin" placeholder="Escreva o espaço" style="display:none;margin-top:5px;"></div></div>';
    html += '<div class="form-row" id="res-contagem-wrap"><div class="fi"><label class="fl" id="res-lbl-cont">Nº de pessoas</label><input type="number" id="res-num-pessoas" class="fin" min="0" placeholder="0"></div>';
    html += '<div class="fi" id="res-cont2-wrap" style="display:none;"><label class="fl" id="res-lbl-cont2">—</label><input type="number" id="res-num-pessoas2" class="fin" min="0" placeholder="0"></div></div>';

    html += '<div class="form-sec-t">Estado</div>';
    html += '<div class="form-row"><div class="fi"><label class="fl">Tipo de reserva *</label>';
    html += '<select id="res-estado" class="fin">';
    html += '<option value="pre_reserva">Pré-reserva (aguarda confirmação)</option>';
    html += '<option value="confirmada">Reserva confirmada</option>';
    html += '<option value="cancelada">Cancelada</option>';
    html += '</select></div>';
    html += '<div class="fi"><label class="fl">Cor no calendário</label>';
    html += '<div class="res-cores" id="res-cor-picker">';
    CORES.forEach(function(cor, i) {
      html += '<button type="button" class="res-cor-bolha' + (i === 0 ? ' sel' : '') + '" data-cor="' + cor.v +
              '" title="' + cor.l + '" style="background:' + cor.v + ';" onclick="Reservas.escolherCor(\'' + cor.v + '\')"></button>';
    });
    html += '</div>';
    html += '<input type="hidden" id="res-cor" value="#3B82F6">';
    html += '</div></div>';

    // Seletor de tipo — só aparece quando o equipamento permite recorrentes.
    // Fica escondido por defeito; _configurarPorTipo() decide se o mostra.
    html += '<div id="res-tipo-wrap" style="display:none;">';
    html += '<div class="form-sec-t">Tipo de agendamento</div>';
    html += '<div style="display:flex;gap:10px;margin-bottom:14px;">';
    html += '<label style="display:flex;align-items:center;gap:7px;cursor:pointer;flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r);transition:border-color .15s;" id="lbl-pontual">';
    html += '<input type="radio" name="res-tipo" id="res-tipo-p" value="pontual" checked onchange="Reservas.onTipoChange()">';
    html += '<div><div style="font-size:13px;font-weight:600;">Pontual</div><div style="font-size:11px;color:var(--text-3);">Uma data específica</div></div></label>';
    html += '<label style="display:flex;align-items:center;gap:7px;cursor:pointer;flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r);transition:border-color .15s;" id="lbl-recorrente">';
    html += '<input type="radio" name="res-tipo" id="res-tipo-r" value="recorrente" onchange="Reservas.onTipoChange()">';
    html += '<div><div style="font-size:13px;font-weight:600;">🔁 Recorrente</div><div style="font-size:11px;color:var(--text-3);">Semanal durante um período</div></div></label>';
    html += '</div>';
    html += '</div>';

    // PONTUAL — sempre num único dia (data + intervalo de horas)
    html += '<div id="res-pontual-wrap">';
    html += '<div class="form-row"><div class="fi"><label class="fl">Data *</label><input type="date" id="res-data-i" class="fin" onchange="Reservas.onDataChange()"></div></div>';
    html += '<div class="form-row"><div class="fi"><label class="fl">Hora início *</label><input type="time" id="res-inicio" class="fin" value="09:00"></div>';
