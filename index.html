<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Impedir cache do HTML (o Safari é agressivo a guardar versões antigas).
     Os .js têm ?v=... — basta mudar a versão para forçar a atualização. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GestorDDS</title>
<meta name="theme-color" content="#0F1C2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   GestDDS — Design System
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F7FA;
  --surface:#FFFFFF;
  --border:#E8ECF2;
  --border-2:#D1D9E6;
  --text:#0F172A;
  --text-2:#475569;
  --text-3:#94A3B8;
  --accent:#2563EB;
  --accent-light:#EFF6FF;
  --accent-dark:#1D4ED8;
  --green:#16A34A;
  --green-bg:#F0FDF4;
  --green-border:#BBF7D0;
  --amber:#D97706;
  --amber-bg:#FFFBEB;
  --amber-border:#FDE68A;
  --red:#DC2626;
  --red-bg:#FEF2F2;
  --red-border:#FECACA;
  --purple:#7C3AED;
  --purple-bg:#F5F3FF;
  --purple-border:#DDD6FE;
  --teal:#0891B2;
  --teal-bg:#ECFEFF;
  --sidebar-w:224px;
  --topbar-h:56px;
  --r:8px;
  --r-lg:12px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --sh-lg:0 12px 32px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.06);
  --tr:140ms ease;
}
[data-theme="dark"]{
  --bg:#0F172A;
  --surface:#1E293B;
  --border:#334155;
  --border-2:#475569;
  --text:#F1F5F9;
  --text-2:#CBD5E1;
  --text-3:#94A3B8;
  --accent:#3B82F6;
  --accent-light:#1E3A5F;
  --accent-dark:#60A5FA;
  --green:#22C55E;
  --green-bg:#14351F;
  --green-border:#166534;
  --amber:#F59E0B;
  --amber-bg:#3A2E10;
  --amber-border:#92400E;
  --red:#EF4444;
  --red-bg:#3A1515;
  --red-border:#991B1B;
  --purple:#A78BFA;
  --purple-bg:#2A1F45;
  --purple-border:#5B21B6;
  --teal:#22D3EE;
  --teal-bg:#0E3A44;
  --sh:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --sh-md:0 4px 12px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.2);
  --sh-lg:0 12px 32px rgba(0,0,0,.5),0 4px 8px rgba(0,0,0,.3);
}
html{overflow-x:hidden;}
/* As barras destes contentores são tratadas no fim da folha de estilos
   (só horizontal, e sem barra visível). */
.dtw::-webkit-scrollbar-thumb:hover, .sched-wrap::-webkit-scrollbar-thumb:hover{background:var(--text-3);}
.modal-body{scrollbar-width:none;-ms-overflow-style:none;}
.modal-body::-webkit-scrollbar{width:0;height:0;display:none;}

/* ── Impressão ── */
#print-root{display:none;}
@page{size:A4;margin:12mm;}
@media print{
  body{background:#fff !important;}
  /* esconde TUDO menos a folha de impressão (topbar, sidebar, modais, avisos, dropdowns…) */
  body > *:not(#print-root){display:none !important;}
  html, body{height:auto !important;min-height:0 !important;width:100% !important;max-width:none !important;margin:0 !important;padding:0 !important;overflow:visible !important;display:block !important;}
  #print-root{width:100% !important;max-width:none !important;}
  #print-root{display:block !important;width:100%;max-width:100%;box-sizing:border-box;padding:0;margin:0;color:#1a1a1a;font-family:'Inter',system-ui,sans-serif;}

  /* ── Cabeçalho institucional ── */
  .pr-head{margin-bottom:18px;padding-bottom:12px;border-bottom:2.5px solid #1D4ED8;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .pr-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .pr-org{font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:#1D4ED8;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .pr-title{font-size:19px;font-weight:800;margin-top:5px;letter-spacing:-.3px;color:#0f172a;}
  .pr-meta{font-size:9px;color:#64748b;margin-top:4px;}
  .pr-chip{display:inline-block;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;background:#EFF6FF !important;color:#1D4ED8;border:1px solid #BFDBFE;border-radius:20px;padding:3px 10px;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  /* ── Tabelas ── */
  .pr-table{width:100%;max-width:100%;border-collapse:collapse;font-size:8.5px;table-layout:fixed;margin-bottom:4px;}
  .pr-table th{background:#0f172a !important;color:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:left;padding:5px 6px;border:none;font-weight:600;font-size:8px;text-transform:uppercase;letter-spacing:.4px;word-wrap:break-word;}
  .pr-table td{padding:4px 6px;border:none;border-bottom:1px solid #e2e8f0;word-wrap:break-word;overflow-wrap:break-word;vertical-align:top;}
  .pr-table tbody tr:nth-child(even) td{background:#f8fafc !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .pr-table tr{page-break-inside:avoid;}
  .pr-tot td{font-weight:800 !important;background:#EFF6FF !important;color:#1D4ED8;border-top:1.5px solid #1D4ED8;border-bottom:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  .pr-meta2{font-size:9px;color:#64748b;margin:0 0 6px;}

  /* ── Secções ── */
  .pr-sec{font-size:10px;font-weight:800;margin:11px 0 5px;color:#0f172a;text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;gap:7px;}
  .pr-sec:before{content:'';width:3px;height:12px;background:#1D4ED8;border-radius:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  /* ── KPIs ── */
  .pr-kpis{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
  .pr-kpi{flex:1 1 15%;min-width:78px;background:#f8fafc !important;border:1px solid #e2e8f0;border-left:3px solid #1D4ED8;border-radius:5px;padding:7px 9px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  /* ── Gráficos no relatório impresso ── */
  /* Os 3 gráficos ficam lado a lado; cada bloco (título + gráfico) é
     indivisível, para o título nunca ficar órfão no fim da página. */
  .pr-charts{display:grid;gap:7px;margin:4px 0 8px;page-break-inside:avoid;break-inside:avoid;}
  .pr-bloco{page-break-inside:avoid;break-inside:avoid;}
  .pr-sec{page-break-after:avoid;break-after:avoid;}
  .pr-chart{page-break-inside:avoid;break-inside:avoid;margin:0;padding:6px;border:1px solid #e2e8f0;border-radius:5px;}
  .pr-chart-t{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#475569;text-align:center;margin-bottom:2px;}
  .pr-chart .rchart{width:100%;max-width:100%;height:auto;max-height:130px;}
  .pr-chart .rdonut{display:flex;align-items:center;gap:14px;}
  .pr-chart .rdonut-svg{width:96px;height:96px;flex:0 0 96px;}
  .pr-chart .rleg{font-size:9px;}
  .pr-chart .rleg-i{gap:6px;}
  .pr-kpi-v{font-size:19px;font-weight:800;color:#0f172a;line-height:1.15;letter-spacing:-.5px;}
  .pr-kpi-l{font-size:7.5px;color:#64748b;text-transform:uppercase;letter-spacing:.6px;margin-top:3px;font-weight:600;}

  /* ── Rodapé ── */
  .pr-foot{margin-top:18px;font-size:8px;color:#94a3b8;text-align:center;border-top:1px solid #e2e8f0;padding-top:8px;}

  .pr-empty{font-size:8.5px;color:#94a3b8;font-style:italic;padding:5px 0;}
  .pr-badge{display:inline-block;font-size:8px;background:#f1f5f9 !important;color:#475569;border:1px solid #e2e8f0;border-radius:10px;padding:2px 7px;margin:0 3px 3px 0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  /* Ficha completa por equipamento */
  .pr-ficha{page-break-after:always;}
  .pr-ficha:last-child{page-break-after:auto;}
  .pr-eqname{font-size:14px;font-weight:800;margin:0 0 2px;color:#0f172a;}
  .pr-eqsub{font-size:8.5px;color:#555;margin-bottom:6px;}
  .pr-grid{display:flex;flex-wrap:wrap;gap:2px 24px;font-size:8.5px;margin-bottom:5px;}
  .pr-grid div{min-width:45%;}
  .pr-grid b{color:#000;}
  .pr-empty{font-size:8px;color:#888;font-style:italic;padding:1px 0;}
  .pr-badge{display:inline-block;font-size:8px;border:1px solid #999;border-radius:8px;padding:1px 5px;margin:0 3px 3px 0;}
}
.rep-grp{margin-bottom:12px;}
/* Página de relatórios — abas e cartões */
.rep-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.rep-tab{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--text-3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;}
.rep-tab:hover{color:var(--text-2);}
.rep-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.rep-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
.rep-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;}
.rep-card-v{font-size:24px;font-weight:800;line-height:1.1;}
.rep-card-t{font-size:12.5px;font-weight:600;color:var(--text-2);margin-top:4px;}
.rep-card-s{font-size:11px;color:var(--text-3);margin-top:2px;}
/* Barra de período dos relatórios */
.rep-periodo{display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:16px;}
.rep-periodo-l{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-right:6px;}
.rep-mes{font-size:12px;font-weight:600;color:var(--text-2);background:transparent;border:1px solid var(--border);border-radius:7px;padding:5px 9px;cursor:pointer;transition:all .12s;}
.rep-mes:hover{border-color:var(--accent);color:var(--accent);}
.rep-mes.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.sb-badge{margin-left:auto;background:var(--amber);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:9px;padding:0 5px;}
.rep-grp-t{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.rep-grp .btn{margin:0 6px 6px 0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;overflow-x:hidden;max-width:100vw;}

/* ── LOGIN ── */
#login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EFF6FF 0%,#F5F7FA 60%,#F0FDF4 100%);}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:40px;width:380px;box-shadow:var(--sh-lg);}
.lb-brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.lb-ic{width:44px;height:44px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;}
.lb-ic svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.lb-name{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.5px;}
.lb-sub{font-size:11px;color:var(--text-3);margin-top:1px;}
.login-ttl{font-size:17px;font-weight:700;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text-2);margin-bottom:24px;}
.login-demo{margin-top:14px;padding:10px 12px;background:var(--bg);border-radius:var(--r);font-size:11.5px;color:var(--text-3);line-height:1.8;}
.login-demo b{color:var(--text-2);}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh;overflow-x:hidden;max-width:100vw;}
.app-shell{display:flex;min-height:100vh;width:100%;max-width:100vw;overflow-x:hidden;}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:200;overflow:hidden;transition:transform .25s ease;}
.sidebar.hidden{transform:translateX(-100%);}
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199;}
#sb-overlay.open{display:block;}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);height:100vh;}
  .sidebar.open{transform:translateX(0);}
  .main-area{margin-left:0 !important;width:100%;max-width:100%;overflow-x:hidden;}
  .content{padding:14px 12px;}
  .stats-grid, .stats-grid-3, .stats-grid-4, .stats-grid-5{grid-template-columns:repeat(2,1fr) !important;gap:10px;}
  .dash-grid{grid-template-columns:1fr !important;}
  .form-row{grid-template-columns:1fr !important;}
  .eq-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .eq-tab-panel{padding:12px 10px;}
  .topbar{padding:0 12px;}
  .tb-menu{max-width:calc(100vw - 24px);}
  .eq-spotlight{overflow-x:hidden;}
  .dtw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .dash-greeting{flex-wrap:wrap;gap:10px;}
  .dash-hello{font-size:20px !important;}
  .modal{max-width:calc(100vw - 24px) !important;}
  .stat-val{font-size:24px;}
  .sched-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
}
@media(min-width:769px){
  .sidebar{transform:translateX(0);}
  .sidebar.hidden{transform:translateX(-100%);}
}
.sb-brand{height:var(--topbar-h);padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sb-ic{width:30px;height:30px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-ic svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.sb-name{font-size:13.5px;font-weight:800;color:var(--text);letter-spacing:-.3px;line-height:1.2;}
.sb-ver{font-size:9.5px;color:var(--text-3);font-family:'JetBrains Mono',monospace;}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto;overflow-x:hidden;min-height:0;}
.sb-group{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;padding:12px 8px 4px;}
.sbi{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--text-2);font-size:12.5px;font-weight:500;transition:all var(--tr);margin-bottom:1px;user-select:none;}
.sbi:hover{background:var(--bg);color:var(--text);}
.sbi.active{background:var(--accent-light);color:var(--accent-dark);font-weight:600;}
.sbi svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.sbi-lbl{flex:1;}
.sbi-arr{width:12px;height:12px;transition:transform .2s;flex-shrink:0;}
.sbi.grp-open .sbi-arr{transform:rotate(180deg);}
.sb-sub{padding-left:16px;display:none;}
.sb-sub.open{display:block;}
.sb-eq-item{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:11.5px;font-weight:500;color:var(--text-2);transition:all var(--tr);margin-bottom:1px;}
.sb-eq-item:hover{background:var(--bg);color:var(--text);}
.sb-eq-item.active{background:var(--accent-light);color:var(--accent-dark);}
.sb-eq-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* Lista de equipamentos compacta */
.sb-eq-row{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:0 4px 1px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text-2);transition:all var(--tr);}
.sb-eq-row:hover{background:var(--bg);color:var(--text);}
.sb-eq-row.active{background:var(--accent-light);color:var(--accent-dark);font-weight:600;}
.sb-eq-nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-eq-cnt{font-size:10.5px;font-weight:700;color:var(--text-3);background:var(--bg);border-radius:20px;padding:1px 6px;flex-shrink:0;}
.sb-eq-grp .sbi-arr{width:12px;height:12px;flex-shrink:0;transition:transform var(--tr);}
.sb-eq-grp.grp-open .sbi-arr{transform:rotate(180deg);}

/* Links de admin, discretos */
.sb-eq-links{display:flex;align-items:center;gap:6px;padding:5px 14px 2px;font-size:11px;color:var(--text-3);}
.sb-eq-links span{cursor:pointer;transition:color var(--tr);}
.sb-eq-links span:hover{color:var(--accent);}
.sb-eq-links .sb-sep{cursor:default;opacity:.5;}

/* Assinatura institucional */
.sb-sig{font-size:10px;color:var(--text-3);text-align:center;padding:2px;opacity:.6;letter-spacing:.2px;line-height:1.4;}
.sb-divider{height:1px;background:var(--border);margin:6px 0;}
.sb-footer{padding:8px;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface);}
.sb-muni{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;margin-top:4px;}
.sb-muni-badge{width:28px;height:28px;background:var(--accent-light);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.sb-muni-name{font-size:10.5px;font-weight:600;color:var(--text-2);line-height:1.3;}
.sb-muni-sub{font-size:9.5px;color:var(--text-3);}

.sw-head{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.8px;padding:5px 8px 3px;}
.sw-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--text-2);transition:background var(--tr);}
.sw-item:hover{background:var(--bg);color:var(--text);}
.tb-menu{position:absolute;top:calc(100%+8px);right:0;min-width:210px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:8px;z-index:9999;display:none;}
.tb-menu.open{display:block;}
.tb-menu-header{font-size:13px;font-weight:700;color:var(--text);padding:4px 8px 0;}
.tb-menu-sub{font-size:11px;color:var(--text-3);padding:0 8px 6px;}
.tb-menu-divider{height:1px;background:var(--border);margin:6px 0;}
.tb-menu-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text-2);transition:background var(--tr);}
.tb-menu-item:hover{background:var(--bg);color:var(--text);}
.sw-av{width:22px;height:22px;border-radius:50%;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sw-role{font-size:10px;color:var(--text-3);margin-left:auto;}
.sw-div{height:1px;background:var(--border);margin:4px 0;}

/* ── TOPBAR ── */
.main-area{margin-left:var(--sidebar-w);flex:1;min-width:0;max-width:100vw;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;transition:margin-left .25s ease;}
.main-area.full{margin-left:0;}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:12px;position:sticky;top:0;z-index:300;max-width:100%;box-sizing:border-box;}
.tb-tog{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;color:var(--text-3);transition:background var(--tr);}
.tb-tog:hover{background:var(--bg);}
.tb-search{flex:1;min-width:0;max-width:300px;display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);color:var(--text-3);font-size:13px;}
.tb-search svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex-shrink:0;}
.tb-search kbd{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 5px;}
.search-results{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-lg);max-height:60vh;overflow-y:auto;z-index:9999;display:none;padding:6px;}
.search-results.open{display:block;}
.sr-group{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--text-3);padding:8px 10px 4px;}
.sr-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;transition:background var(--tr);}
.sr-item:hover{background:var(--bg);}
.sr-item-ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--accent-light);}
.sr-item-txt{flex:1;min-width:0;}
.sr-item-nome{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-item-sub{font-size:11px;color:var(--text-3);}
.sr-empty{padding:16px;text-align:center;color:var(--text-3);font-size:12.5px;}
.tb-spacer{flex:1;}
.tb-actions{display:flex;align-items:center;gap:6px;overflow:visible;}
.tb-btn{width:34px;height:34px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);border:none;background:none;transition:background var(--tr);position:relative;}
.tb-btn:hover{background:var(--bg);}
.tb-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.tb-badge{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);}
.tb-badge.green{background:var(--green);}
.tb-user{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:var(--r);cursor:pointer;transition:background var(--tr);}
.tb-user:hover{background:var(--bg);}
.tb-av{width:30px;height:30px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.content{flex:1;padding:22px;max-width:100%;overflow-x:hidden;box-sizing:border-box;}

/* ── FORMS ── */
.fi{margin-bottom:14px;}
.fl{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:5px;}
.fin{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:14px;color:var(--text);font-family:'Inter',sans-serif;background:var(--surface);outline:none;transition:border var(--tr),box-shadow var(--tr);}
.fin:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
.fin::placeholder{color:var(--text-3);}
select.fin option{background:var(--surface);}
textarea.fin{resize:vertical;min-height:72px;line-height:1.5;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-sec-t{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;padding:12px 0 7px;border-top:1px solid var(--border);margin-top:4px;}
.form-sec-t:first-child{border-top:none;padding-top:0;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all var(--tr);white-space:nowrap;}
.btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--sh);}
.btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:var(--sh-md);}
.btn-secondary{background:var(--surface);color:var(--text-2);border:1px solid var(--border);box-shadow:var(--sh);}
.btn-secondary:hover{background:var(--bg);border-color:var(--border-2);}
.btn-ghost{background:transparent;color:var(--text-2);}
.btn-ghost:hover{background:var(--bg);}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);}
.btn-danger:hover{background:#FEE2E2;}
.btn-success{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
.btn-sm{padding:5px 10px;font-size:12px;}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.stats-grid-5{grid-template-columns:repeat(5,1fr);}
.stats-grid-4{grid-template-columns:repeat(4,1fr);}
.stats-grid-3{grid-template-columns:repeat(3,1fr);}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh);display:flex;align-items:flex-start;gap:14px;cursor:pointer;transition:box-shadow var(--tr),transform var(--tr);min-width:0;}
.stat-card:hover{box-shadow:var(--sh-md);transform:translateY(-1px);}
.stat-ic{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.si-blue{background:#DBEAFE;color:var(--accent);}
.si-green{background:#DCFCE7;color:var(--green);}
.si-amber{background:#FEF3C7;color:var(--amber);}
.si-purple{background:#EDE9FE;color:var(--purple);}
.si-teal{background:#CFFAFE;color:var(--teal);}
.si-red{background:#FEE2E2;color:var(--red);}
.stat-body{flex:1;min-width:0;}
.stat-lbl{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:3px;}
.stat-val{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.5px;line-height:1;margin-bottom:3px;}
.stat-sub{font-size:12px;color:var(--text-2);}
.stat-link{font-size:12px;color:var(--accent);font-weight:600;margin-top:5px;display:block;}

/* ── DASHBOARD ── */
.dash-greeting{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.dash-hello{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.5px;margin-bottom:3px;}
.dash-sub{font-size:13px;color:var(--text-2);}
.dash-date{display:flex;align-items:center;gap:7px;padding:7px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;box-shadow:var(--sh);}
.dash-date svg{width:14px;height:14px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;}
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start;}
.dash-grid > div{min-width:0;}

/* ── SPOTLIGHT ── */
.eq-spotlight{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden;margin-bottom:14px;max-width:100%;min-width:0;}
.eqs-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
.eqs-left{display:flex;align-items:center;gap:10px;}
.eqs-emoji{font-size:20px;}
.eqs-title{font-size:14.5px;font-weight:700;color:var(--text);}
.eq-sel-wrap{position:relative;}
.eq-sel-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-2);transition:all var(--tr);}
.eq-sel-btn:hover{border-color:var(--border-2);}
.eq-sel-dd{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:6px;z-index:9999;min-width:240px;max-width:calc(100vw - 16px);max-height:60vh;overflow-y:auto;display:none;}
.eq-sel-dd.open{display:block;}
.eq-sel-grp{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;padding:6px 8px 3px;}
.eq-sel-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--text-2);transition:background var(--tr);}
.eq-sel-item:hover{background:var(--bg);color:var(--text);}
.eq-sel-item.active{background:var(--accent-light);color:var(--accent-dark);font-weight:600;}
.eq-sel-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;}

/* ── EQ TABS ── */
.eq-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 16px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;}
.eq-tabs::-webkit-scrollbar{display:none;}
.eq-tab{padding:9px 13px;font-size:13px;font-weight:600;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--tr),border-color var(--tr);white-space:nowrap;}
.eq-tab:hover{color:var(--text-2);}
.eq-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.eq-tab-panel{display:none;padding:16px;max-width:100%;overflow-x:hidden;}
.eq-tab-panel.active{display:block;}

/* ── ESCALA ── */
.escala-controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.escala-nav{display:flex;align-items:center;gap:8px;}
.esc-nav-btn{width:27px;height:27px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:16px;font-weight:600;}
.escala-week{font-size:13px;font-weight:600;color:var(--text);}
.btn-filter{display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer;font-size:12px;font-weight:500;color:var(--text-2);}
.sched-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;max-width:100%;scrollbar-width:none;-ms-overflow-style:none;}
.sched-wrap::-webkit-scrollbar{display:none;}
.sched-grid{display:grid;grid-template-columns:42px repeat(7,1fr);font-size:11px;min-width:480px;}
.sched-head{padding:4px 3px;text-align:center;font-weight:700;color:var(--text-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;}
.sched-head.today{color:var(--accent);background:var(--accent-light);border-radius:5px;}
/* Altura da linha FIXA — o JS usa o mesmo valor (SCHED_ROW) para
   calcular a altura dos blocos. Se mudar aqui, mude também lá. */
.sched-grid{--row:34px;}
.sched-time{padding:0 5px 0 0;text-align:right;color:var(--text-3);font-family:'JetBrains Mono',monospace;font-size:10px;border-right:1px solid var(--border);height:var(--row);display:flex;align-items:flex-start;justify-content:flex-end;line-height:1;}
.sched-cell{border-top:1px dotted rgba(0,0,0,.06);height:var(--row);position:relative;box-sizing:border-box;}
/* marca ténue da meia-hora — ajuda a ler turnos que acabam às :30 */
.sched-cell:after{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dotted rgba(0,0,0,.03);pointer-events:none;}
.sched-event{position:absolute;left:1px;width:calc(100% - 2px);border-radius:5px;padding:3px 5px;font-size:10px;font-weight:600;line-height:1.25;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06);box-sizing:border-box;}
.sched-ev-h{font-weight:400;opacity:.8;font-size:9.5px;display:block;}
.sched-legend{display:flex;flex-wrap:wrap;gap:10px;padding-top:9px;border-top:1px solid var(--border);margin-top:6px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2);}
.legend-dot{width:7px;height:7px;border-radius:50%;}
.sched-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);margin-top:8px;}
.link-text{font-size:13px;color:var(--accent);font-weight:600;cursor:pointer;}

/* ── PANELS ── */
.panel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--border);}
.panel-title{font-size:13px;font-weight:700;color:var(--text);}
.panel-sub{font-size:11px;color:var(--text-3);margin-top:1px;font-weight:500;}
.panel-link{font-size:12px;color:var(--accent);font-weight:600;cursor:pointer;}
.reserva-item{display:flex;align-items:center;gap:10px;padding:8px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--tr);}
.reserva-item:last-child{border-bottom:none;}
.reserva-item:hover{background:var(--bg);}
.r-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.r-time{font-size:11.5px;font-weight:600;color:var(--text-2);white-space:nowrap;min-width:90px;font-family:'JetBrains Mono',monospace;}
.r-info{flex:1;min-width:0;}
.r-name{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.r-loc{font-size:11px;color:var(--text-3);}
.small-item{display:flex;align-items:flex-start;gap:9px;padding:8px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--tr);}
.small-item:last-child{border-bottom:none;}
.small-item:hover{background:var(--bg);}
.si-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.si-icon svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
.si-body{flex:1;min-width:0;}
.si-title{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.si-sub{font-size:11px;color:var(--text-3);}
.si-right{text-align:right;flex-shrink:0;}
.si-time{font-size:11px;color:var(--text-3);font-family:'JetBrains Mono',monospace;margin-bottom:3px;}
.memo-item{display:flex;align-items:center;gap:11px;padding:9px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--tr);}
.memo-item:last-child{border-bottom:none;}
.memo-item:hover{background:var(--bg);}
.mi-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--amber-bg);}
.mi-icon svg{width:14px;height:14px;fill:none;stroke:var(--amber);stroke-width:2;stroke-linecap:round;}
.mi-body{flex:1;min-width:0;}
.mi-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mi-sub{font-size:11px;color:var(--text-3);}
.mi-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.mi-days{font-size:11px;color:var(--text-3);font-family:'JetBrains Mono',monospace;}
.mi-arr{color:var(--text-3);}

/* ── BADGES ── */
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;}
.bdg-dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.bdg-pendente{background:var(--amber-bg);color:var(--amber);}
.bdg-reforco{background:var(--red-bg);color:var(--red);}
.bdg-andamento{background:var(--purple-bg);color:var(--purple);}
.bdg-concluido{background:var(--green-bg);color:var(--green);}
.bdg-ativo{background:var(--green-bg);color:var(--green);}
.bdg-inativo{background:var(--bg);color:var(--text-3);border:1px solid var(--border);}
.bdg-enviado{background:var(--accent-light);color:var(--accent-dark);}

/* ── CHIP MÓDULOS ── */
.chip-mod{display:inline-flex;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--accent-light);color:var(--accent-dark);margin-right:3px;margin-bottom:2px;}

/* ── TABLE ── */
.dtw{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh);overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;}
.dt{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
.dt thead th{padding:9px 13px;text-align:left;font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;background:var(--bg);border-bottom:1px solid var(--border);}
.dt tbody td{padding:10px 13px;color:var(--text-2);border-bottom:1px solid var(--border);vertical-align:middle;}
.dt tbody tr:last-child td{border-bottom:none;}
.dt tbody tr{transition:background var(--tr);}
.dt tbody tr:hover{background:var(--bg);}
.td-p{font-weight:600;color:var(--text);}
.td-mono{font-family:'JetBrains Mono',monospace;font-size:11.5px;}
.td-m{font-size:11.5px;color:var(--text-3);}
.td-act{display:flex;align-items:center;gap:4px;justify-content:flex-end;}

/* ── DAYS BADGE ── */
.days-bdg{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;display:inline-block;}
.d-ok{background:var(--green-bg);color:var(--green);}
.d-warn{background:var(--amber-bg);color:var(--amber);}
.d-crit{background:var(--red-bg);color:var(--red);}

/* ── DETAIL BOX ── */
.detail-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:0 14px;}
.detail-row{display:flex;gap:16px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.detail-row:last-child{border-bottom:none;}
.detail-lbl{color:var(--text-3);font-weight:500;min-width:120px;flex-shrink:0;}
.detail-val{color:var(--text);font-weight:500;}

/* ── ACCORDION ── */
.acc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh);}
.acc-hdr{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;user-select:none;transition:background var(--tr);}
.acc-hdr:hover{background:var(--bg);}
.acc-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-3);background:var(--bg);padding:1px 7px;border-radius:20px;border:1px solid var(--border);}

/* ── EMPTY / LOADING ── */
.empty-wrap{padding:44px 32px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);}
.empty-ic{width:38px;height:38px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
.empty-ic svg{width:17px;height:17px;fill:none;stroke:var(--text-3);stroke-width:1.8;stroke-linecap:round;}
.empty-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;}
.empty-sub{font-size:13px;color:var(--text-3);}
.loading-wrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:48px;color:var(--text-3);font-size:13px;}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── INFO BANNER ── */
.info-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);border:1px solid var(--accent-border,#B2CCFF);background:var(--accent-light);color:var(--accent-dark);font-size:12.5px;font-weight:500;margin-bottom:14px;}

/* ── SECTION HEAD ── */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sec-title{font-size:13.5px;font-weight:700;color:var(--text);}
.sec-link{font-size:12px;color:var(--accent);font-weight:600;cursor:pointer;}
.sec-badge{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--bg);border:1px solid var(--border);color:var(--text-3);display:inline-block;margin-left:6px;}
.form-hint{font-size:11.5px;color:var(--text-3);margin-top:3px;}

/* ── MOD PLACEHOLDER ── */
/* ── Mensagens · abas Recebidas/Enviadas ── */
.msg-abas{display:flex;gap:6px;padding:8px 4px 10px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.msg-aba{flex:1;font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text-2);cursor:pointer;}

.qa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:20px;}
.qa{display:flex;align-items:center;gap:11px;padding:13px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;cursor:pointer;text-align:left;font:inherit;color:var(--text);box-shadow:var(--sh);transition:border-color .12s,box-shadow .12s;}
.qa:hover{border-color:var(--accent);box-shadow:var(--sh-md);}
.qa-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--accent-light);}
.qa-t{font-size:13.5px;font-weight:600;line-height:1.25;}
.qa-s{font-size:11.5px;color:var(--text-3);}
.todo{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:20px;box-shadow:var(--sh);overflow:hidden;}
.todo-h{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;}
.todo-i{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.todo-i:last-child{border-bottom:none;}
.todo-i:hover{background:var(--bg);}
.todo-n{min-width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
.todo-n.a{background:#FEF3C7;color:#92400E;}
.todo-n.b{background:#DBEAFE;color:#1D4ED8;}
.todo-n.c{background:#FEE2E2;color:#B91C1C;}
.todo-n.d{background:#EDE9FE;color:#5B21B6;}
.todo-t{flex:1;font-size:13.5px;font-weight:600;}
.todo-s{font-size:12px;color:var(--text-3);font-weight:400;}
.todo-ok{padding:14px 16px;font-size:13px;color:var(--green);font-weight:600;}

/* ── Relatório mensal ── */
.mn-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.mn-filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--sh);}
.mn-meses{display:flex;gap:4px;flex-wrap:wrap;}
.mn-seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;}
.mn-seg button{border:none;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:var(--text-2);padding:6px 12px;border-radius:7px;cursor:pointer;}
.mn-seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--sh);}
.mn-uni-fixa{font-size:12.5px;font-weight:700;color:var(--accent);}
.mn-per{font-size:12.5px;color:var(--text-3);font-weight:600;margin:4px 2px 14px;}
.mn-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px;}
.mn-kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden;}
.mn-kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.mn-kpi.k2:before{background:#0D9488;}.mn-kpi.k3:before{background:#7C3AED;}.mn-kpi.k4:before{background:#D97706;}.mn-kpi.k5:before{background:#16A34A;}
.mn-kpi-t{font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;}
.mn-kpi-v{font-size:28px;font-weight:800;letter-spacing:-1px;color:var(--text);margin:4px 0 2px;line-height:1.1;}
.mn-kpi-s{font-size:12px;color:var(--text-2);}
.mn-delta{display:inline-block;margin-top:7px;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;}
.mn-up{background:#DCFCE7;color:#15803D;}
.mn-down{background:#FEE2E2;color:#B91C1C;}
.mn-eq{background:var(--bg);color:var(--text-3);}
.mn-aviso{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px;}
[data-theme="dark"] .mn-aviso{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber);}
.mn-bloco{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--sh);min-width:0;}
.mn-bloco .dtw{box-shadow:none;}
.mn-bloco-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.mn-bloco-t{font-size:15px;font-weight:700;color:var(--text);}
.mn-bloco-s{font-size:12px;color:var(--text-3);margin-top:2px;}
.mn-texto{font-size:14px;line-height:1.65;min-height:180px;font-family:inherit;}
.mn-tab th.n,.mn-tab td.n{text-align:right;}
.mn-tot td{font-weight:800;color:var(--text);background:var(--accent-light);}
.mn-zero{color:var(--border-2);}
.mn-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--text-3);background:var(--bg);border-radius:20px;padding:1px 7px;margin-left:4px;}
.mn-nota{font-size:11.5px;color:var(--text-3);margin-top:8px;}
.mn-vazio{font-size:13px;color:var(--text-3);padding:18px;text-align:center;border:1px dashed var(--border);border-radius:10px;}
.mn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;}
.mn-barras{display:flex;flex-direction:column;gap:8px;}
.mn-barra{display:grid;grid-template-columns:minmax(0,38%) 1fr auto;gap:10px;align-items:center;font-size:13px;}
.mn-barra-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2);}
.mn-barra-t{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;}
.mn-barra-t div{height:100%;background:var(--accent);border-radius:6px;}
.mn-barra-v{font-size:12.5px;white-space:nowrap;}
.mn-barra-v span{color:var(--text-3);font-size:11.5px;}
.mn-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.mn-mini div{background:var(--bg);border-radius:10px;padding:12px;}
.mn-mini b{display:block;font-size:20px;font-weight:800;color:var(--text);}
.mn-mini span{font-size:11.5px;color:var(--text-3);}
.mn-chart{width:100%;height:auto;display:block;max-width:820px;}

/* ── Telemóvel ── */
@media(max-width:1100px){ .mn-kpis{grid-template-columns:repeat(3,minmax(0,1fr));} }
@media(max-width:768px){
  .content{padding:16px 14px 40px;}
  .topbar{padding:0 12px;}
  .tb-search{display:none;}
  .mn-kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
  .mn-grid{grid-template-columns:1fr;}
  .mn-mini{grid-template-columns:1fr;}
  .mn-filtros{flex-direction:column;align-items:stretch;}
  .qa-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .btn{min-height:40px;}
  .btn-sm{min-height:34px;}
  .sbi,.sb-eq-item,.sb-eq-row{padding:10px 12px;}
  .modal-bd{padding:10px;align-items:flex-end;}
  .modal{max-height:94dvh;}
  .dash-greeting{align-items:flex-start;}
}

/* ── Impressão do relatório mensal ── */
@media print{
  .pr-txt{font-size:10px;line-height:1.55;margin:0 0 7px;color:#1e293b;text-align:justify;}
  .pr-chart .mn-chart{max-height:150px;}
}

/* ── Entrada ── */
#login-wrap{background:radial-gradient(1200px 600px at 10% -10%,#23407A 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#1B4F8A 0%,transparent 55%),var(--ink);}
.login-box{border:none;border-radius:20px;padding:40px 36px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-width:calc(100vw - 32px);}
.lb-ic{background:linear-gradient(135deg,#3D6FE0,#2457C5);}
.login-ttl{font-size:20px;letter-spacing:-.4px;}

/* ════════════════════════════════════════════════════════════
   v6.1 — navegação por equipamento
   ════════════════════════════════════════════════════════════ */

/* ── Barra lateral: um item por equipamento ── */
.sb-uni{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-muted);opacity:.75;padding:8px 10px 3px 12px;}
.sb-eq{display:flex;align-items:center;gap:9px;padding:7px 10px;margin-bottom:1px;border-radius:8px;cursor:pointer;color:var(--ink-text);font-size:13.2px;line-height:1.25;transition:background .12s,color .12s;}
.sb-eq:hover{background:rgba(255,255,255,.06);color:#fff;}
.sb-eq.on{background:rgba(76,125,235,.18);color:#fff;font-weight:600;}
.sb-eq-ic{width:22px;flex:none;text-align:center;font-size:15px;}
.sb-eq-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-eq-tabs{margin:2px 0 8px 21px;padding-left:10px;border-left:1px solid rgba(255,255,255,.12);}
.sb-eq-tab{padding:5px 10px;font-size:12.5px;color:var(--ink-muted);border-radius:6px;cursor:pointer;}
.sb-eq-tab:hover{color:#fff;background:rgba(255,255,255,.05);}
.sb-eq-tab.on{color:#fff;font-weight:600;background:rgba(255,255,255,.08);}

/* ── Página do equipamento ── */
.eqp-head{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 22px 14px;}
.eqp-id{display:flex;align-items:center;gap:14px;min-width:0;}
.eqp-emoji{width:48px;height:48px;flex:none;border-radius:12px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:25px;}
.eqp-nome{font-size:21px;font-weight:800;letter-spacing:-.4px;color:var(--text);line-height:1.2;}
.eqp-meta{font-size:12.5px;color:var(--text-3);margin-top:3px;}
.eqp-tabs{display:flex;gap:2px;overflow-x:auto;background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r-lg) var(--r-lg);padding:0 12px;margin-bottom:18px;scrollbar-width:thin;}
.eqp-tab{flex:none;display:flex;align-items:center;gap:6px;background:none;border:none;border-bottom:2.5px solid transparent;padding:11px 12px 10px;font:inherit;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;white-space:nowrap;}
.eqp-tab span{font-size:14px;opacity:.85;}
.eqp-tab:hover{color:var(--text);}
.eqp-tab.on{color:var(--accent);border-bottom-color:var(--accent);}
.eqp-corpo>.card:first-child,.eqp-corpo>div>.card:first-child{margin-top:0;}
.eqp-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
.eqp-kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;}
.eqp-kpi-v{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--text);line-height:1.1;}
.eqp-kpi-l{font-size:12px;color:var(--text-3);margin-top:3px;}
.eqp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start;}
.eqp-grid .mn-bloco{margin:0;}
.eqp-li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);font-size:13px;cursor:default;}
.eqp-li[onclick]{cursor:pointer;}
.eqp-li[onclick]:hover{background:var(--accent-light);}
.eqp-li:last-child{border-bottom:none;}
.eqp-li-h{flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-2);font-size:12.5px;}
.eqp-li-t{flex:1;min-width:0;color:var(--text);}
.eqp-li-t small{display:block;color:var(--text-3);font-size:11.5px;margin-top:1px;}
.eqp-av{width:28px;height:28px;flex:none;border-radius:50%;background:var(--accent-light);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.qa-compacto{margin-bottom:16px;}
.chip-mod{display:inline-block;font-size:11.5px;font-weight:600;background:var(--accent-light);color:var(--accent);border-radius:20px;padding:3px 9px;margin:0 4px 4px 0;}

/* Barra de ferramentas dentro de um separador (substitui os cabeçalhos antigos) */
.eq-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.eq-toolbar-t{font-size:15px;font-weight:700;color:var(--text);}
.eq-toolbar>div:last-child{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

/* Separadores de página (Relatórios) */
.pg-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin:0 0 16px;}
.pg-tab{background:none;border:none;border-bottom:2.5px solid transparent;padding:9px 14px;font:inherit;font-size:13.5px;font-weight:600;color:var(--text-2);cursor:pointer;margin-bottom:-1px;}
.pg-tab:hover{color:var(--text);}
.pg-tab.on{color:var(--accent);border-bottom-color:var(--accent);}

/* ── Início ── */
.ini-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.ini-ola{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--text);}
.ini-sub{font-size:13px;color:var(--text-3);margin-top:3px;}
.ini-head-r{display:flex;align-items:center;gap:8px;}
.ini-ano{width:auto;padding:7px 10px;font-size:12.5px;font-weight:600;}
.ini-aviso-ano{font-size:11.5px;font-weight:700;color:var(--amber);}
.ini-sec-t{font-size:15px;font-weight:800;color:var(--text);margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.ini-sec-t span{font-size:12.5px;font-weight:500;color:var(--text-3);}
.ini-eqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.ini-eq{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s,border-color .15s,transform .15s;}
.ini-eq:hover,.ini-eq:focus-visible{border-color:var(--accent);box-shadow:var(--sh-md);transform:translateY(-1px);outline:none;}
.ini-eq-top{display:flex;align-items:center;gap:12px;}
.ini-eq-ic{width:42px;height:42px;flex:none;border-radius:11px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:22px;}
.ini-eq-nome{font-size:15px;font-weight:700;color:var(--text);line-height:1.25;}
.ini-eq-sub{font-size:12px;color:var(--text-3);margin-top:2px;}
.ini-eq-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.ini-eq-n{background:var(--bg);border:1px solid transparent;border-radius:9px;padding:8px 6px;text-align:center;font:inherit;cursor:pointer;color:var(--text);}
.ini-eq-n:hover{border-color:var(--border-2);}
.ini-eq-n b{display:block;font-size:19px;font-weight:800;line-height:1.1;}
.ini-eq-n span{display:block;font-size:10.5px;color:var(--text-3);margin-top:2px;line-height:1.2;}
.ini-eq-n.al b{color:var(--amber);}
.ini-eq-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;}
.ini-eq-tab{background:none;border:1px solid var(--border);border-radius:20px;padding:4px 10px;font:inherit;font-size:11.5px;font-weight:600;color:var(--text-2);cursor:pointer;}
.ini-eq-tab:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}

/* ── Relatórios: lista de equipamentos ── */
.rq-barra{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;font-size:13.5px;color:var(--text-2);}
.rq-barra b{color:var(--text);}
.rq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.rq-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;}
.rq-card.vazio{opacity:.62;}
.rq-top{display:flex;align-items:center;gap:10px;}
.rq-ic{width:38px;height:38px;flex:none;border-radius:10px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:20px;}
.rq-top>div:nth-child(2){flex:1;}
.rq-nome{font-size:14px;font-weight:700;color:var(--text);line-height:1.25;}
.rq-sub{font-size:11.5px;color:var(--text-3);}
.rq-aflu{text-align:right;flex:none;}
.rq-aflu b{display:block;font-size:20px;font-weight:800;color:var(--accent);line-height:1;}
.rq-aflu span{font-size:10.5px;color:var(--text-3);}
.rq-nums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-2);}
.rq-nums b{color:var(--text);}
.rq-acts{display:flex;gap:6px;margin-top:auto;}

/* ── Folha A4 (pré-visualização no ecrã) ── */
.rel-wrap{overflow-x:auto;padding:6px 0 20px;}
.rel-page{width:210mm;min-height:297mm;box-sizing:border-box;margin:0 auto;padding:13mm 14mm 11mm;background:#fff;color:#1a2233;box-shadow:0 4px 24px rgba(15,28,46,.14),0 0 0 1px rgba(15,28,46,.06);font-family:'Inter',system-ui,sans-serif;font-size:10.5px;line-height:1.45;display:flex;flex-direction:column;}
.rel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:10px;border-bottom:2.5px solid #2457C5;margin-bottom:12px;}
.rel-org{font-size:8px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#2457C5;}
.rel-tit{font-size:10px;font-weight:600;color:#64748b;margin-top:5px;text-transform:uppercase;letter-spacing:.5px;}
.rel-eq{font-size:20px;font-weight:800;letter-spacing:-.4px;color:#0f172a;margin-top:2px;line-height:1.2;}
.rel-meta{font-size:9.5px;color:#64748b;margin-top:3px;}
.rel-chip{flex:none;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#2457C5;background:#EDF2FC;border:1px solid #C9D7F5;border-radius:20px;padding:5px 12px;white-space:nowrap;}
.rel-kpis{display:grid;gap:7px;margin-bottom:10px;}
.rel-kpi{border:1px solid #E3E8EF;border-radius:8px;padding:8px 9px;background:#F7F9FC;}
.rel-kpi-v{font-size:19px;font-weight:800;color:#0f172a;line-height:1.1;letter-spacing:-.3px;}
.rel-kpi-v small{font-size:12px;color:#64748b;font-weight:700;}
.rel-kpi-l{font-size:8.5px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-top:2px;font-weight:600;}
.rel-d{font-size:8.5px;color:#64748b;margin-top:3px;font-weight:600;}
.rel-d.up{color:#15803D;}
.rel-d.down{color:#B91C1C;}
.rel-sec{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#2457C5;margin:10px 0 5px;padding-bottom:3px;border-bottom:1px solid #E3E8EF;}
.rel-txt{margin:0 0 6px;text-align:justify;color:#1e293b;}
.rel-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.rel-cols>div{min-width:0;}
.rel-t{width:100%;border-collapse:collapse;font-size:9.5px;table-layout:auto;}
.rel-t th{text-align:left;font-size:8px;text-transform:uppercase;letter-spacing:.3px;color:#64748b;font-weight:700;padding:3px 5px;border-bottom:1.5px solid #CBD3DF;}
.rel-t td{padding:3px 5px;border-bottom:1px solid #EEF1F5;vertical-align:top;word-break:break-word;}
.rel-t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.rel-t tr.tot td{font-weight:800;border-top:1.5px solid #2457C5;border-bottom:none;color:#0f172a;}
.rel-vazio{font-size:9.5px;color:#94a3b8;font-style:italic;padding:4px 0;}
.rel-mais{color:#64748b;font-style:italic;text-align:center;}
.rel-mini{font-size:9.5px;color:#475569;margin-bottom:4px;}
.rel-page .mn-chart{width:100%;height:auto;max-height:130px;}
.rel-foot{margin-top:auto;padding-top:8px;border-top:1px solid #E3E8EF;font-size:8px;color:#94a3b8;}

@media (max-width:860px){
  .rel-wrap{margin:0 -12px;}
  .rel-page{transform-origin:top left;}
}
@media (max-width:768px){
  .eqp-head{padding:14px;flex-wrap:wrap;}
  .eqp-nome{font-size:18px;}
  .eqp-emoji{width:40px;height:40px;font-size:21px;}
  .eqp-tabs{padding:0 6px;}
  .eqp-grid{grid-template-columns:1fr;}
  .ini-eqs,.rq-grid{grid-template-columns:1fr;}
  .ini-ola{font-size:20px;}
}

@page{size:A4;margin:10mm;}
@media print{
  #print-root .rel-page{width:auto;min-height:0;height:272mm;overflow:hidden;margin:0;padding:0;box-shadow:none;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #print-root .rel-page:last-child{page-break-after:auto;break-after:auto;}
  #print-root .rel-chip,#print-root .rel-kpi{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}

/* ── v6.2: menu de equipamentos agrupado por tipo ── */
.sb-eqg{display:flex;align-items:center;gap:9px;padding:7px 10px;margin-bottom:1px;border-radius:8px;cursor:pointer;color:var(--ink-text);font-size:13.2px;user-select:none;}
.sb-eqg:hover{background:rgba(255,255,255,.06);color:#fff;}
.sb-eqg small{font-size:11px;color:var(--ink-muted);font-weight:600;margin-left:3px;}
.sb-eqg.tem-on{color:#fff;font-weight:600;}
.sb-eqg-arr{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;opacity:.6;transform:rotate(-90deg);transition:transform .15s;}
.sb-eqg.open .sb-eqg-arr{transform:none;}
.sb-eqg-l{margin:0 0 4px 21px;padding-left:8px;border-left:1px solid rgba(255,255,255,.1);}
.sb-eq.sub{padding:6px 10px;font-size:12.8px;}
.sb-eq.on{box-shadow:inset 3px 0 0 #6EA0FF;}
/* textos longos (ex.: descrição de memorandos) cortados a 2 linhas */
.eqp-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* ── Escolher equipamento ── */
.esc-eq-l{display:flex;flex-direction:column;gap:6px;}
.esc-eq{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 12px;font:inherit;color:var(--text);cursor:pointer;}
.esc-eq:hover{border-color:var(--accent);background:var(--accent-light);}
.esc-eq-ic{width:36px;height:36px;flex:none;border-radius:9px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:19px;}
.esc-eq-t{flex:1;min-width:0;font-size:14px;font-weight:600;}
.esc-eq-t small{display:block;font-size:12px;font-weight:400;color:var(--text-3);margin-top:1px;}
.esc-eq-a{color:var(--text-3);font-size:18px;}

/* ── v6.2: memorandos ── */
.memo-row{cursor:pointer;}
.memo-row:hover td{background:var(--accent-light);}
.memo-desc{min-width:240px;max-width:460px;white-space:normal !important;}
.memo-desc-t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;}
.memo-ver-estado{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;}
.memo-ver-txt{white-space:pre-wrap;font-size:13.5px;line-height:1.6;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;max-height:42vh;overflow:auto;}
.memo-ver-obs{font-size:12.5px;color:var(--text-2);max-height:24vh;}
#m-ver-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.memo-ver-acts{display:flex;gap:6px;flex-wrap:wrap;}
.memo-filtros{display:flex;flex-wrap:wrap;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px 2px;margin-bottom:12px;}
.memo-filtros .fi{min-width:170px;flex:1;max-width:260px;}
.memo-resumo{font-size:13px;color:var(--text-2);margin:0 0 12px;}
.memo-resumo b{color:var(--text);}
.memo-grp{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden;}
.memo-grp-h{padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--text);background:var(--bg);border-bottom:1px solid var(--border);}
.memo-grp-h span{font-size:11.5px;font-weight:700;color:var(--text-3);margin-left:4px;}
.memo-vi{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.memo-vi:last-child{border-bottom:none;}
.memo-vi:hover{background:var(--accent-light);}
.memo-vi.conc{opacity:.6;}
.memo-vi-l{flex:1;min-width:0;}
.memo-vi-top{font-size:12px;color:var(--text-3);display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.memo-vi-d{font-size:13.2px;color:var(--text);margin-top:4px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;}
.memo-vi-a{display:flex;gap:6px;flex:none;}
@media (max-width:768px){.memo-vi{flex-direction:column;}.memo-filtros .fi{max-width:none;}}

/* folha impressa */
.mv{font-family:'Inter',system-ui,sans-serif;color:#111827;font-size:9.5pt;}
.mv-head{display:flex;justify-content:space-between;gap:12px;border-bottom:2.5px solid #2457C5;padding-bottom:8px;margin-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.mv-org{font-size:7pt;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#2457C5;}
.mv-tit{font-size:15pt;font-weight:800;margin-top:3px;}
.mv-sub{font-size:8.5pt;color:#4b5563;margin-top:2px;}
.mv-data{font-size:7.5pt;color:#6b7280;text-align:right;white-space:nowrap;}
.mv-instr{font-size:8pt;color:#4b5563;margin-bottom:8px;}
.mv-t{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:8.5pt;}
.mv-t th,.mv-t td{border:1px solid #9ca3af;padding:4px 5px;vertical-align:top;text-align:left;}
.mv-t thead th{background:#f1f5f9;font-size:7pt;text-transform:uppercase;letter-spacing:.3px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.mv-t tr.mv-gh th{background:#2457C5;color:#fff;font-size:9pt;text-transform:none;letter-spacing:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.mv-t tr{page-break-inside:avoid;break-inside:avoid;}
.mv-t thead{display:table-header-group;}
.mv-d{white-space:pre-line;}
.mv-c{width:13mm;text-align:center !important;vertical-align:middle !important;}
.mv-box{display:inline-block;width:12px;height:12px;border:1.5px solid #111827;border-radius:2px;vertical-align:middle;}
.mv-assin{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px;font-size:9pt;}
.mv-sec{font-size:8pt;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#2457C5;margin:12px 0 4px;}
.mv-txt{white-space:pre-wrap;font-size:10.5pt;line-height:1.55;border:1px solid #d1d5db;border-radius:4px;padding:8px 10px;}
.mv-det{margin-top:12px;}
.mv-det th{width:48mm;background:#f8fafc;font-weight:600;}
.mv-ver{display:flex;gap:30px;font-size:11pt;margin:6px 0 10px;}
.mv-linhas{height:40mm;background:repeating-linear-gradient(#fff 0,#fff 9.5mm,#9ca3af 9.5mm,#9ca3af 10mm);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.mv-t tbody td{height:11mm;}

/* ── filtros de memorandos ── */
.mf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:10px 12px;margin-bottom:8px;}
.mf .fin{width:auto;min-width:0;flex:1 1 175px;max-width:250px;padding:8px 10px;font-size:13px;}
.mf-q{position:relative;flex:2 1 240px;}
.mf-q svg{position:absolute;left:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);fill:none;stroke:var(--text-3);stroke-width:2;}
.mf-q .fin{width:100%;max-width:none;padding-left:32px;}
.mf-chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);white-space:nowrap;cursor:pointer;}
.mf-info{font-size:12.5px;color:var(--text-3);margin:0 2px 10px;display:flex;align-items:center;gap:8px;}
.mf-info b{color:var(--text);}
@media (max-width:768px){.mf .fin{max-width:none;flex:1 1 45%;}}

/* ── brigadas ── */
.brg-add{display:flex;gap:8px;margin-bottom:12px;}
.brg-add .fin{flex:1;}
.brg-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--border);}
.brg-ord{display:flex;flex-direction:column;gap:1px;}
.brg-mv{background:none;border:1px solid var(--border);border-radius:4px;width:24px;height:17px;font-size:8px;line-height:1;color:var(--text-2);cursor:pointer;padding:0;}
.brg-mv:disabled{opacity:.3;cursor:default;}
.brg-mv:not(:disabled):hover{border-color:var(--accent);color:var(--accent);}
.brg-nome{flex:1;min-width:0;font-weight:600;font-size:14px;color:var(--text);}
.brg-nome small{display:block;font-weight:400;font-size:11.5px;color:var(--text-3);}
.fl-link{float:right;font-weight:500;text-transform:none;letter-spacing:0;color:var(--accent);font-size:11.5px;}

/* ── ordenar equipamentos ── */
.ini-ord{margin-left:auto;}
.ord-l{display:flex;flex-direction:column;gap:4px;}
.ord-i{display:flex;align-items:center;gap:10px;padding:7px 8px;border:1px solid var(--border);border-radius:9px;background:var(--card);transition:background .3s;}
.ord-i.foco{background:var(--accent-light);border-color:var(--accent);}
.ord-n{width:22px;text-align:right;font-size:12px;font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums;}
.ord-ic{font-size:18px;width:24px;text-align:center;}
.ord-t{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--text);}
.ord-t small{display:block;font-size:11.5px;font-weight:400;color:var(--text-3);}
.ord-b{width:30px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text-2);cursor:pointer;font-size:11px;}
.ord-b:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.ord-b:disabled{opacity:.3;cursor:default;}
.ord-sql{margin:8px 0 0;padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;font-size:12px;white-space:pre-wrap;user-select:all;}

</style>
</head>

<script>
/* ═════ config.js ═════ */
// ============================================================
// GestDDS — config.js
// Estado global, Supabase, utilitários partilhados
// ============================================================

var APP_VERSION = 'v5.0';
var SB_URL = 'https://mmhmiuxfhwwalwnegrlg.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1taG1pdXhmaHd3YWx3bmVncmxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NjI3MTEsImV4cCI6MjA5ODIzODcxMX0.4_AdbI8K-fWXaIB0VOmV2Ld8Kh-pzVU9PypeoGUJdAU';

// ── ESTADO GLOBAL ──────────────────────────────────────────
var APP = {
  user: null,           // row da tabela utilizadores
  view: 'dashboard',    // vista atual
  subview: null,        // sub-vista (ex: 'sec1', 'lista', 'tipos')

  // dados em cache
  memos: [],
  equipamentos: [],
  tiposEq: [],
  utilizadores: [],
  funcionarios: [],
  reservas: [],
  escalas: [],
  espacos: [],
  checklist_templates: [],
  checklist_items: [],
  checklist_registos: [],
  checklist_respostas: [],

  // spotlight no dashboard
  spotEqId: null,

  // ano de trabalho (filtra reservas/escalas/memorandos)
  anoTrabalho: new Date().getFullYear(),

  // ações pendentes (modais)
  actionId: null,
  actionRecord: null,
  editId: null,

  // helpers de perfil
  isDds: function() { return APP.user && APP.user.isDds; },
  isAdmin: function() { return APP.user && APP.user.perfil === 'admin'; },

  // ── ACESSOS PERSONALIZADOS ────────────────────────────────
  // permissoes_extra (jsonb em utilizadores) guarda só excepções:
  //   { "reservas": true }    → forçar acesso (mesmo sem o perfil ter)
  //   { "relatorios": false } → bloquear acesso (mesmo que o perfil tenha)
  //   chave ausente           → segue as regras normais do perfil

  // valor da excepção para um menu (true/false) ou null se não há excepção
  _extraMenu: function(menu) {
    var ex = APP.user && APP.user.permissoes_extra;
    if (!ex || typeof ex !== 'object') return null;
    if (ex[menu] === true) return true;
    if (ex[menu] === false) return false;
    return null;
  },

  // acesso por defeito do perfil a cada menu
  _menuPorPerfil: function(menu) {
    if (!APP.user) return false;
    var p = APP.user.perfil;
    if (p === 'admin') return true;
    switch (menu) {
      case 'memorandos':   return p !== 'funcionario';
      case 'relatorios':   return !!APP.user.isDds || APP.isResponsavel();
      case 'funcionarios': return !!APP.user.isDds || APP.isResponsavel();
      // checklists: responsabilidade de quem gere o equipamento.
      // Um funcionário só acede se lhe for atribuído acesso (permissoes_extra).
      case 'checklists':   return !!APP.user.isDds || APP.isResponsavel();
      // check-in/check-out: dados pessoais de hóspedes — acesso restrito.
      // O admin autoriza cada funcionário individualmente (permissoes_extra).
      case 'estadias':     return !!APP.user.isDds || APP.isResponsavel();
      case 'visitas':      return !!APP.user.isDds || APP.isResponsavel();
      case 'utilizadores': return false; // só admin
      default:             return true;  // reservas, escalas, ferias, horas, dashboard
    }
  },

  // FUNÇÃO CENTRAL — sidebar e navegação usam esta
  acessoMenu: function(menu) {
    if (!APP.user) return false;
    if (APP.user.perfil === 'admin') return true; // admin nunca fica bloqueado
    if (menu === 'utilizadores') return false;    // gestão de utilizadores é sempre só admin
    var ex = APP._extraMenu(menu);
    if (ex !== null) return ex;
    return APP._menuPorPerfil(menu);
  },

  // ── EQUIPAMENTO × MÓDULO ─────────────────────────────────
  // Reservas, Escalas e Checklists são SEMPRE de um equipamento.
  // Estes três helpers são a única fonte de verdade sobre "que
  // equipamento devo mostrar neste módulo".

  // Equipamentos que o utilizador vê E onde o módulo está ligado
  eqsComModulo: function(k) {
    if (!APP.user) return [];
    return (APP.equipamentos || []).filter(function(e) {
      if (!APP.podeVerEquipamento(e.id)) return false;
      return (typeof modAtivo === 'function') ? modAtivo(e, k) : true;
    });
  },

  // O módulo faz sentido para este utilizador? (esconder menus vazios)
  moduloDoMeuEq: function(k) {
    return APP.eqsComModulo(k).length > 0;
  },

  // Qual o equipamento a mostrar no módulo k.
  // Preferência: o que está selecionado — mas só se lá tiver o módulo.
  // Caso contrário, o primeiro equipamento válido. null = nenhum.
  eqParaModulo: function(k) {
    var validos = APP.eqsComModulo(k);
    if (!validos.length) return null;
    var atual = validos.filter(function(e) { return e.id === APP.spotEqId; })[0];
    return atual ? atual.id : validos[0].id;
  },

  // perfil do utilizador atual
  perfil: function() { return APP.user ? APP.user.perfil : null; },

  // é responsável de equipamento (gere o seu equipamento)
  isResponsavel: function() {
    return APP.user && ['responsavel','professor_responsavel'].indexOf(APP.user.perfil) >= 0;
  },
  // é funcionário simples (acesso limitado)
  isFuncionario: function() {
    return APP.user && APP.user.perfil === 'funcionario';
  },

  // ── NÍVEIS DE ACESSO ──────────────────────────────────────
  // vê e gere TUDO na DDS (Admin e Responsável DDS)
  _veTudo: function() {
    if (!APP.user) return false;
    return APP.user.perfil === 'admin' || APP.user.perfil === 'responsavel_dds';
  },
  // unidade de um Chefe de Unidade ('UDAJ' / 'UASE'), ou null
  _unidadeChefe: function() {
    if (!APP.user) return null;
    if (APP.user.perfil === 'supervisor_udaj') return 'UDAJ';
    if (APP.user.perfil === 'supervisor_uase') return 'UASE';
    return null;
  },
  // é responsável (perfil de responsável de equipamento)
  _ehPerfilResponsavel: function() {
    return APP.user && ['responsavel','professor_responsavel'].indexOf(APP.user.perfil) >= 0;
  },
  // este utilizador é responsável POR este equipamento?
  _ehResponsavelDe: function(eqId) {
    if (!APP.user) return false;
    var eq = getEq(eqId);
    if (eq && eq.responsavel_id && eq.responsavel_id === APP.user.id) return true;
    return funcNoEq(APP.user, eqId);
  },
  // o equipamento pertence à unidade do Chefe atual?
  _eqNaMinhaUnidade: function(eqId) {
    var uni = APP._unidadeChefe();
    if (!uni) return false;
    var eq = getEq(eqId);
    return !!(eq && eq.unidade === uni);
  },

  // pode gerir (criar/editar/apagar) um equipamento específico?
  podeGerirEquipamento: function(eqId) {
    if (!APP.user) return false;
    if (APP._veTudo()) return true;
    if (APP._unidadeChefe()) return APP._eqNaMinhaUnidade(eqId);
    if (APP._ehPerfilResponsavel()) return APP._ehResponsavelDe(eqId);
    return false; // funcionário não gere
  },

  // pode ver um equipamento específico?
  podeVerEquipamento: function(eqId) {
    if (!APP.user) return false;
    if (APP._veTudo()) return true;
    if (APP._unidadeChefe()) return APP._eqNaMinhaUnidade(eqId);
    if (APP._ehPerfilResponsavel()) return APP._ehResponsavelDe(eqId);
    return funcNoEq(APP.user, eqId); // funcionário: os equipamentos onde trabalha
  },

  // pode criar memorandos? (respeita acessos personalizados)
  podeCriarMemorandos: function() {
    if (!APP.user) return false;
    return APP.acessoMenu('memorandos');
  },

  // pode gerir reservas de um equipamento?
  podeGerirReservas: function(eqId) {
    if (!APP.user) return false;
    if (APP._veTudo()) return true;
    if (APP._unidadeChefe()) return APP._eqNaMinhaUnidade(eqId);
    if (APP._ehPerfilResponsavel()) return APP._ehResponsavelDe(eqId);
    return false; // funcionário só vê
  },

  // pode gerir escalas de um equipamento?
  podeGerirEscalas: function(eqId) {
    if (!APP.user) return false;
    if (APP._veTudo()) return true;
    if (APP._unidadeChefe()) return APP._eqNaMinhaUnidade(eqId);
    if (APP._ehPerfilResponsavel()) return APP._ehResponsavelDe(eqId);
    return false;
  },

  // pode ver o check-in/check-out deste equipamento?
  // (funcionário só se o admin lhe atribuir acesso em permissoes_extra)
  podeVerEstadias: function(eqId) {
    if (!APP.user) return false;
    if (!APP.acessoMenu('estadias')) return false;
    if (!APP.podeVerEquipamento(eqId)) return false;
    return true;
  },

  // pode registar check-in / check-out?
  podeGerirEstadias: function(eqId) {
    if (!APP.podeVerEstadias(eqId)) return false;
    if (APP._veTudo()) return true;
    if (APP._unidadeChefe()) return APP._eqNaMinhaUnidade(eqId);
    if (APP._ehPerfilResponsavel()) return APP._ehResponsavelDe(eqId);
    // funcionário com acesso atribuído: só nos equipamentos onde trabalha
    return funcNoEq(APP.user, eqId);
  },

  // registo de visitas — mesma lógica das estadias
  podeVerVisitas: function(eqId) {
    if (!APP.user) return false;
    if (!APP.acessoMenu('visitas')) return false;
    return APP.podeVerEquipamento(eqId);
  },
  podeGerirVisitas: function(eqId) {
    if (!APP.podeVerVisitas(eqId)) return false;
    if (APP._veTudo()) return true;
    if (APP._unidadeChefe()) return APP._eqNaMinhaUnidade(eqId);
    if (APP._ehPerfilResponsavel()) return APP._ehResponsavelDe(eqId);
    return funcNoEq(APP.user, eqId);
  },

  // pode preencher checklists? (funcionário só se lhe for atribuído acesso)
  podePreencherChecklist: function(eqId) {
    if (!APP.user) return false;
    if (!APP.acessoMenu('checklists')) return false;
    if (APP._veTudo()) return true;
    if (APP._unidadeChefe()) return APP._eqNaMinhaUnidade(eqId);
    if (APP._ehPerfilResponsavel()) return APP._ehResponsavelDe(eqId);
    // funcionário com acesso atribuído: só nos equipamentos onde trabalha

  // pode gerir templates de checklist?
  podeGerirTemplates: function(eqId) {
    if (!APP.user) return false;
    if (APP._veTudo()) return true;
    if (APP._unidadeChefe()) return APP._eqNaMinhaUnidade(eqId);
    if (APP._ehPerfilResponsavel()) return APP._ehResponsavelDe(eqId);
    return false;
  },

  // pode gerir utilizadores? (só admin)
  podeGerirUtilizadores: function() {
    return APP.user && APP.user.perfil === 'admin';
  },

  nomeUtilizador: function() {
    if (!APP.user) return 'Utilizador';
    return APP.user.nome || APP.user.username || 'Utilizador';

  // label legível do perfil
  perfilLabel: function() {
