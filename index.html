  function openSerie(eqId) {
    if (!APP.podeGerirEscalas(eqId)) { toast('Não tem permissão.', 'error'); return; }
    APP.serieEqId = eqId;
    var eq = getEq(eqId);

    var sub = document.getElementById('m-serie-eq');
    if (sub) sub.textContent = eq ? eq.nome : '—';

    _popularFuncSelect(eqId, 'serie-func');

    var hoje = new Date().toISOString().split('T')[0];
    var fim = new Date(); fim.setMonth(fim.getMonth() + 1);
    var de = document.getElementById('serie-de');
    var ate = document.getElementById('serie-ate');
    if (de) de.value = hoje;
    if (ate) ate.value = fim.toISOString().split('T')[0];

    _contarSerie();
    openModal('m-escala-serie');
  }

  function _contarSerie() {
    var box = document.getElementById('serie-aviso');
    if (!box) return;
    var f  = (document.getElementById('serie-func') || {}).value;
    var de = (document.getElementById('serie-de') || {}).value;
    var at = (document.getElementById('serie-ate') || {}).value;
    if (!f || !de || !at) { box.textContent = 'Escolha o funcionário e o intervalo.'; return; }

    var n = (APP.escalas || []).filter(function(t) {
      return t.equipamento_id === APP.serieEqId && t.funcionario_id === f &&
             t.data_inicio >= de && t.data_inicio <= at &&
             t.tipo_turno !== 'folga' && t.tipo_turno !== 'ferias';
    }).length;

    box.innerHTML = n
      ? 'Vai apagar <strong>' + n + ' turno(s)</strong>. Esta ação não pode ser desfeita.'
      : 'Não há turnos neste intervalo.';
  }

  function execSerie() {
    var f  = (document.getElementById('serie-func') || {}).value;
    var de = (document.getElementById('serie-de') || {}).value;
    var at = (document.getElementById('serie-ate') || {}).value;
    if (!f)  { toast('Escolha o funcionário.', 'error'); return; }
    if (!de || !at) { toast('Indique o intervalo.', 'error'); return; }
    if (at < de) { toast('A data final não pode ser anterior à inicial.', 'error'); return; }
    apagarSerie(APP.serieEqId, f, de, at);
  }

  function _popularFuncSelect(eqId, selId) {
    var sel = document.getElementById(selId);
    if (!sel) return;
    sel.innerHTML = '<option value="">Selecione o funcionário...</option>';
    var funcs = APP.utilizadores.filter(function(u) {
      return funcNoEq(u, eqId) && !u.isDds;
    });
    funcs.forEach(function(f) {
      var o = document.createElement('option');
      o.value = f.id; o.textContent = f.nome;
      sel.appendChild(o);
    });
  }

  function openNovo(eqId) {
    if (!APP.podeGerirEscalas(eqId)) {
      toast('Não tem permissão para criar turnos. A escala é gerida pelo responsável do equipamento.', 'error');
      return;
    }
    _bloquearEdicao(false);
    APP.editId = null;
    APP.actionRecord = { equipamento_id: eqId };
    var eq = getEq(eqId);
    document.getElementById('m-esc-ttl').textContent = 'Novo turno';
    document.getElementById('m-esc-eq').textContent  = eq ? eq.nome : '—';

    _popularFuncSelect(eqId, 'esc-func');
    document.getElementById('esc-tipo').value  = 'normal';
    document.getElementById('esc-obs').value   = '';
    var hoje = new Date().toISOString().split('T')[0];
    document.getElementById('esc-di').value = hoje;
    document.getElementById('esc-df').value = hoje;
    var hSel = document.getElementById('esc-horario');
    if (hSel) hSel.value = 'partido';
    var he = document.getElementById('esc-he'); if (he) he.value = '09:00';
    var hs = document.getElementById('esc-hs'); if (hs) hs.value = '17:00';
    onTipoChange();
    onHorarioChange();
    var infoBox = document.getElementById('m-esc-info');
    if (infoBox) { infoBox.style.display = 'none'; infoBox.innerHTML = ''; }
    _mostrarFormulario(true);
    _bloquearEdicao(false);

    // repetição: limpar e mostrar (só disponível ao criar)
    var repW = document.getElementById('esc-rep-wrap');
    if (repW) repW.style.display = 'block';
    var ateEl = document.getElementById('esc-ate'); if (ateEl) ateEl.value = '';
    document.querySelectorAll('.esc-dia').forEach(function(cb) { cb.checked = false; });

    var footer = document.getElementById('m-esc-footer');
    if (footer) footer.innerHTML = '<button class="btn btn-ghost" onclick="closeModal(\'m-escala-novo\')">Cancelar</button><button class="btn btn-primary" onclick="Escalas.salvar()">Guardar turno</button>';

    openModal('m-escala-novo');
  }

  function openNovoDia(eqId, funcId, data) {
    openNovo(eqId);
    setTimeout(function() {
      var sel = document.getElementById('esc-func');
      if (sel) sel.value = funcId;
      var di = document.getElementById('esc-di');
      var df = document.getElementById('esc-df');
      if (di) di.value = data;
      if (df) df.value = data;
    }, 50);
  }

  function openEditar(id) {
    var e = (APP.escalas || []).filter(function(x) { return x.id === id; })[0];
    if (!e) return;
    APP.editId = id;
    APP.actionRecord = e;
    var eq = getEq(e.equipamento_id);
    document.getElementById('m-esc-ttl').textContent = APP.podeGerirEscalas(e.equipamento_id) ? 'Editar turno' : 'Detalhe do turno';
    document.getElementById('m-esc-eq').textContent  = eq ? eq.nome : '—';
    _preencherInfoOrigem(e);

    _popularFuncSelect(e.equipamento_id, 'esc-func');
    var set = function(eid, val) { var el = document.getElementById(eid); if (el) el.value = val || ''; };
    set('esc-func',  e.funcionario_id);
    set('esc-tipo',  e.tipo_turno || 'normal');
    set('esc-funcao',e.funcao);
    set('esc-di',    e.data_inicio ? new Date(e.data_inicio).toISOString().split('T')[0] : '');
    set('esc-df',    e.data_fim    ? new Date(e.data_fim).toISOString().split('T')[0]    : '');
    set('esc-he',    e.hora_entrada ? e.hora_entrada.slice(0,5) : '');
    set('esc-hs',    e.hora_saida  ? e.hora_saida.slice(0,5)   : '');
    var hSelE = document.getElementById('esc-horario');
    if (hSelE) hSelE.value = 'custom';   // ao editar mostra as horas reais
    onHorarioChange();
    set('esc-obs',   e.observacoes);
    onTipoChange();

    // repetição não se aplica a edição de um turno existente
    var repW = document.getElementById('esc-rep-wrap');
    if (repW) repW.style.display = 'none';

    var footer = document.getElementById('m-esc-footer');
    if (footer) footer.innerHTML = '<button class="btn btn-danger btn-sm" onclick="Escalas.apagar(\'' + id + '\')">Apagar</button><button class="btn btn-ghost" onclick="closeModal(\'m-escala-novo\')">Cancelar</button><button class="btn btn-primary" onclick="Escalas.salvar()">Guardar alterações</button>';

    // Bloqueio (depois do rodapé, para o substituir):
    // — quem não gere escalas só consulta
    // — folgas/férias são geridas nos respetivos módulos, mas quem gere
    //   a escala mantém o botão de apagar (para corrigir turnos órfãos)
    var podeGerir  = APP.podeGerirEscalas(e.equipamento_id);
    var eFolgaOuFerias = (e.tipo_turno === 'folga' || e.tipo_turno === 'ferias');
    var soConsulta = !podeGerir || eFolgaOuFerias;

    // nas folgas e férias esconde-se o formulário: só interessa a informação
    _mostrarFormulario(!eFolgaOuFerias);

    if (soConsulta) _bloquearEdicao(true, id, podeGerir);

    openModal('m-escala-novo');
  }

  function salvar() {
    var eqId = APP.actionRecord ? APP.actionRecord.equipamento_id : APP.spotEqId;
    if (eqId && !APP.podeGerirEscalas(eqId)) {
      toast('Não tem permissão para alterar a escala.', 'error');
      return;
    }
    var funcSel = document.getElementById('esc-func');
    var di      = document.getElementById('esc-di');
    var df      = document.getElementById('esc-df');
    if (!funcSel || !funcSel.value) { toast('Selecione o funcionário.', 'error'); return; }
    if (!di || !di.value)           { toast('Data de início obrigatória.', 'error'); return; }
    if (!df || !df.value)           { toast('Data de fim obrigatória.', 'error'); return; }
    if (di.value > df.value)        { toast('O fim deve ser posterior ao início.', 'error'); return; }

    var uuidRx = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    var criadoPor = APP.user && APP.user.id && uuidRx.test(APP.user.id) ? APP.user.id : null;
    var tipo = document.getElementById('esc-tipo').value;
    var semHoras = ['ferias','folga','feriado'];
    var comHoras = semHoras.indexOf(tipo) < 0;

    // ── blocos horários (partido cria 2 turnos por dia) ──
    var blocos = [{ he: null, hs: null }];
    if (comHoras) {
      var hSel = (document.getElementById('esc-horario') || {}).value || 'partido';
      if (hSel === 'custom') {
        blocos = [{
          he: (document.getElementById('esc-he') || {}).value || null,
          hs: (document.getElementById('esc-hs') || {}).value || null
        }];
      } else {
        blocos = HORARIOS[hSel] || HORARIOS.partido;
      }
    }

    var base = {
      equipamento_id: APP.actionRecord ? APP.actionRecord.equipamento_id : APP.spotEqId,
      funcionario_id: funcSel.value,
      tipo_turno:     tipo,
      funcao:         (document.getElementById('esc-funcao').value || '').trim() || null,
      cor:            _tipoCor(tipo),
      observacoes:    (document.getElementById('esc-obs').value || '').trim(),
      criado_por:     criadoPor
    };

    // ── Repetição: um turno por cada dia escolhido até à data limite ──
    var ate = document.getElementById('esc-ate');
    var diasSel = [];
    document.querySelectorAll('.esc-dia').forEach(function(cb) {
      if (cb.checked) diasSel.push(parseInt(cb.value, 10));
    });

    // datas a criar
    var datas = [];
    if (!APP.editId && ate && ate.value && diasSel.length) {
      if (ate.value < di.value) { toast('A data de "Repetir até" deve ser posterior ao início.', 'error'); return; }
      var cur = new Date(di.value + 'T12:00:00');
      var lim = new Date(ate.value + 'T12:00:00');
      var guard = 0;
      while (cur <= lim && guard < 400) {
        if (diasSel.indexOf(cur.getDay()) >= 0) {
          datas.push(cur.getFullYear() + '-' + ('0' + (cur.getMonth() + 1)).slice(-2) + '-' + ('0' + cur.getDate()).slice(-2));
        }
        cur.setDate(cur.getDate() + 1);
        guard++;
      }
      if (!datas.length) { toast('Nenhum dia corresponde aos dias escolhidos.', 'error'); return; }
    }

    // ── EDIÇÃO: atualiza só o turno em causa ──
    if (APP.editId) {
      var upd = {};
      for (var k in base) upd[k] = base[k];
      upd.data_inicio  = di.value;
      upd.data_fim     = df.value;
      upd.hora_entrada = blocos[0].he;
      upd.hora_saida   = blocos[0].hs;
      sbPatch('escalas', 'id=eq.' + APP.editId, upd).then(function() {
        toast('Turno atualizado.', 'success');
        closeModal('m-escala-novo');
        _loadEscalas(function() { _rerender(); });
      }).catch(function(e) {
        console.error('Erro escala:', e);
        toast('Erro ao guardar turno.', 'error');
      });
      return;
    }

    // ── CRIAÇÃO: datas × blocos horários ──
    var lote = [];
    var listaDatas = datas.length ? datas : [di.value];

    // Se indicou uma Data fim posterior SEM escolher dias da semana,
    // expandimos dia a dia (senão o turno aparecia em todos os dias do
    // intervalo, fins-de-semana incluídos).
    if (!datas.length && df.value && df.value > di.value) {
      listaDatas = [];
      var c2 = new Date(di.value + 'T12:00:00');
      var l2 = new Date(df.value + 'T12:00:00');
      var g2 = 0;
      while (c2 <= l2 && g2 < 400) {
        listaDatas.push(c2.getFullYear() + '-' + ('0' + (c2.getMonth() + 1)).slice(-2) + '-' + ('0' + c2.getDate()).slice(-2));
        c2.setDate(c2.getDate() + 1);
        g2++;
      }
    }

    listaDatas.forEach(function(d) {
      blocos.forEach(function(b) {
        var t = {};
        for (var k2 in base) t[k2] = base[k2];
        t.data_inicio  = d;
        t.data_fim     = d;   // cada turno é de UM dia
        t.hora_entrada = b.he;
        t.hora_saida   = b.hs;
        lote.push(t);
      });
    });

    sbPost('escalas', lote).then(function() {
      toast(lote.length > 1 ? (lote.length + ' turnos criados.') : 'Turno criado.', 'success');
      closeModal('m-escala-novo');
      _loadEscalas(function() { _rerender(); });
    }).catch(function(e) {
      console.error('Erro escala:', e);
      toast('Erro ao guardar turno.', 'error');
    });
  }

  function apagar(id) {
    var t = (APP.escalas || []).filter(function(x) { return x.id === id; })[0];
    if (t && !APP.podeGerirEscalas(t.equipamento_id)) {
      toast('Não tem permissão para apagar turnos.', 'error');
      return;
    }
    if (!confirm('Apagar este turno?')) return;

    sbDelete('escalas', 'id=eq.' + id).then(function() {
      // tirar já da memória, para desaparecer do ecrã
      APP.escalas = (APP.escalas || []).filter(function(x) { return x.id !== id; });
      toast('Turno eliminado.', 'success');
      closeModal('m-escala-novo');
      _loadEscalas(function() { _rerender(); });
    }).catch(function(e) {
      console.error('Erro ao apagar turno:', e);
      var m = [e && e.code, e && e.message].filter(Boolean).join(' · ');
      toast('Erro ao apagar: ' + (m || 'desconhecido'), 'error');
    });
  }

  // Apagar TODOS os turnos de um funcionário num intervalo — útil quando
  // uma repetição correu mal e são dezenas de turnos.
  function apagarSerie(eqId, funcId, de, ate) {
    if (!APP.podeGerirEscalas(eqId)) {
      toast('Não tem permissão.', 'error');
      return;
    }
    var alvo = (APP.escalas || []).filter(function(t) {
      return t.equipamento_id === eqId && t.funcionario_id === funcId &&
             t.data_inicio >= de && t.data_inicio <= ate &&
             t.tipo_turno !== 'folga' && t.tipo_turno !== 'ferias';
    });
    if (!alvo.length) { toast('Não há turnos nesse intervalo.', 'error'); return; }

    var u = (APP.utilizadores || []).filter(function(x){ return x.id === funcId; })[0];
    if (!confirm('Apagar ' + alvo.length + ' turno(s) de ' + (u ? u.nome : 'este funcionário') + '?\n\n(Folgas e férias não são afectadas.)')) return;

    sbDelete('escalas',
      'equipamento_id=eq.' + eqId +
      '&funcionario_id=eq.' + funcId +
      '&data_inicio=gte.' + de +
      '&data_inicio=lte.' + ate +
      '&tipo_turno=neq.folga' +
      '&tipo_turno=neq.ferias'
    ).then(function() {
      var ids = alvo.map(function(t){ return t.id; });
      APP.escalas = (APP.escalas || []).filter(function(t){ return ids.indexOf(t.id) < 0; });
      toast(alvo.length + ' turno(s) eliminados.', 'success');
      closeModal('m-escala-serie');
      _loadEscalas(function() { _rerender(); });
    }).catch(function(e) {
      console.error('Erro ao apagar série:', e);
      var m = [e && e.code, e && e.message].filter(Boolean).join(' · ');
      toast('Erro ao apagar: ' + (m || 'desconhecido'), 'error');
    });
  }

  function exportar(eqId) {
    // Exportar escala da semana como CSV simples
    var dias = _getWeekDates();
    var funcs = funcsDoEq(eqId);
    var linhas = ['Funcionário;Seg;Ter;Qua;Qui;Sex;Sáb;Dom'];
    funcs.forEach(function(func) {
      var row = [func.nome];
      dias.forEach(function(d) {
        var dataStr = _ymdLocal(d);
        var ts = (APP.escalas || []).filter(function(e) {
          if (e.funcionario_id !== func.id || e.equipamento_id !== eqId) return false;
          var ei = String(e.data_inicio).slice(0, 10);
          var ef = String(e.data_fim || e.data_inicio).slice(0, 10);
          return dataStr >= ei && dataStr <= ef;
        });
        if (ts.length) {
          row.push(ts.map(function(turno) {
            return turno.hora_entrada ? turno.hora_entrada.slice(0,5) + '-' + (turno.hora_saida || '').slice(0,5) : _tipoLabel(turno.tipo_turno);
          }).join(' / '));
        } else {
          row.push('—');
        }
      });
      linhas.push(row.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(';'));
    });
    var csv = '\ufeff' + linhas.join('\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = 'escala_' + _ymdLocal(dias[0]) + '.csv';
    a.click(); URL.revokeObjectURL(url);
    toast('Escala exportada.', 'success');
  }

  // ── CARREGAR ESCALAS ──────────────────────────────────────
  function _loadEscalas(cb) {
    if (!APP.spotEqId) { if (cb) cb(); return; }
    var dias = _getWeekDates();
    var inicio = new Date(dias[0]); inicio.setDate(inicio.getDate() - 14);
    var fim    = new Date(dias[6]); fim.setDate(fim.getDate() + 14);
    var di = inicio.toISOString().split('T')[0];
    var dfim = fim.toISOString().split('T')[0];

    sbGet('escalas', 'equipamento_id=eq.' + APP.spotEqId +
      '&data_inicio=gte.' + di +
      '&data_fim=lte.' + dfim +
      '&order=data_inicio.asc')
    .then(function(data) {
      var novos = Array.isArray(data) ? data : [];
      // registar o que já foi carregado (equipamento + janela + semana)
      APP._escCarregado = APP.spotEqId + '|' + di + '|' + dfim;

      // Fundir com o que já está em memória, MAS descartando os turnos
      // deste equipamento dentro desta janela — assim os que foram
      // apagados no servidor desaparecem de facto.
      var base = (APP.escalas || []).filter(function(e) {
        var mesmaJanela = e.equipamento_id === APP.spotEqId &&
                          e.data_inicio >= di && e.data_inicio <= dfim;
        return !mesmaJanela;
      });

      APP.escalas = base.concat(novos);
      if (cb) cb();
    }).catch(function(e) {
      console.error('Erro ao carregar escalas:', e);
      if (cb) cb();
    });
  }

  function init() {
    APP.escalas = APP.escalas || [];
    var cont = document.getElementById('modais-escalas');
    if (cont) cont.innerHTML = getModaisHTML();
  }

  function load(cb) {
    // Resolver o MESMO equipamento que o render vai mostrar ANTES de carregar.
    // Sem isto, o load usava um spotEqId ainda não acertado (o último visto) e
    // trazia as escalas do equipamento errado — a grelha aparecia vazia.
    var alvo = (typeof eqDoModulo === 'function') ? eqDoModulo('escalas', APP.spotEqId) : APP.spotEqId;
    if (alvo && APP.spotEqId !== alvo) APP.spotEqId = alvo;
    _loadEscalas(cb);
  }

  return {
    render: render, init: init, load: load,
    semanaAnterior: semanaAnterior, semanaProxima: semanaProxima, semanaActual: semanaActual,
    openNovo: openNovo, openNovoDia: openNovoDia, openEditar: openEditar,
    salvar: salvar, apagar: apagar, exportar: exportar, onTipoChange: onTipoChange,
    onHorarioChange: onHorarioChange, anularFolga: anularFolga,
    apagarTurnoBloqueado: apagarTurnoBloqueado,
    openSerie: openSerie, execSerie: execSerie, contarSerie: _contarSerie
  };

})();

</script>
<script>
/* ═════ checklist.js ═════ */
// ============================================================
// GestDDS — checklist.js  v5.1
// Módulo de Checklists de Verificação por equipamento
// ============================================================

var Checklist = (function() {

  // ── RENDER PRINCIPAL ──────────────────────────────────────
  function render(eqId) {
    var alvo = eqDoModulo('checklist', eqId || APP.spotEqId);
    if (!alvo) return semEqParaModulo('Checklists');
    if (APP.spotEqId !== alvo) APP.spotEqId = alvo;
    var eq = getEq(alvo);
    if (!eq) return semEqParaModulo('Checklists');

    var tipo = getTipo(eq.tipo_id);

    var html = '<div class="eq-toolbar"><div class="eq-toolbar-t">Verificações de rotina</div>';
    html += '<div style="display:flex;gap:8px;">';
    if (APP.podeGerirTemplates(eq.id)) html += '<button class="btn btn-secondary btn-sm" onclick="Checklist.openGerirTemplates(\'' + eq.id + '\')">⚙ Gerir templates</button>';
    html += '<button class="btn btn-primary" onclick="Checklist.openNovoRegisto(\'' + eq.id + '\')">+ Novo registo</button>';
    html += '</div></div>';

    html += _renderTemplates(eq.id);
    html += _renderHistorico(eq.id);
    return html;
  }

  function _renderTemplates(eqId) {
    var templates = (APP.checklist_templates || []).filter(function(t) { return t.equipamento_id === eqId && t.ativo; });

    var html = '<div class="sec-head"><div class="sec-title">Templates ativos</div></div>';

    if (!templates.length) {
      return html + emptyState('Sem templates', 'Crie um template de checklist para este equipamento.');
    }

    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:20px;">';
    templates.forEach(function(t) {
      var items = (APP.checklist_items || []).filter(function(i) { return i.template_id === t.id; });
      // último registo
      var regs = (APP.checklist_registos || []).filter(function(r) { return r.template_id === t.id; });
      regs.sort(function(a,b) { return new Date(b.data_registo) - new Date(a.data_registo); });
      var ultimo = regs[0];

      var periLabel = { diaria: 'Diária', semanal: 'Semanal', mensal: 'Mensal' };

      html += '<div class="panel-card" style="cursor:default;">';
      html += '<div class="panel-head">';
      html += '<div><div class="panel-title">' + H(t.nome) + '</div>';
      html += '<div style="font-size:11px;color:var(--text-3);margin-top:2px;">' + (periLabel[t.periodicidade] || t.periodicidade) + ' · ' + items.length + ' itens</div></div>';
      html += '<button class="btn btn-primary btn-sm" onclick="Checklist.openNovoRegistoTemplate(\'' + eqId + '\',\'' + t.id + '\')">Preencher</button>';
      html += '</div>';
      if (ultimo) {
        var d = diasDesde(ultimo.data_registo);
        html += '<div style="padding:10px 13px;font-size:12px;color:var(--text-2);">';
        html += '✓ Último registo: <strong>' + fData(ultimo.data_registo) + '</strong>';
        html += ' <span class="days-bdg ' + diasCls(d) + '">' + d + 'd</span></div>';
      } else {
        html += '<div style="padding:10px 13px;font-size:12px;color:var(--text-3);">Sem registos ainda.</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function _renderHistorico(eqId) {
    var regs = (APP.checklist_registos || []).filter(function(r) { return r.equipamento_id === eqId; });
    regs.sort(function(a,b) { return new Date(b.data_registo) - new Date(a.data_registo); });

    var html = '<div class="sec-head" style="margin-top:4px;"><div class="sec-title">Histórico de registos</div></div>';

    if (!regs.length) return html + emptyState('Sem registos', 'Nenhuma verificação realizada ainda.');

    html += '<div class="dtw"><table class="dt">';
    html += '<thead><tr><th>Data</th><th>Template</th><th>Realizado por</th><th>Resultado</th><th>Obs.</th></tr></thead>';
    html += '<tbody>';
    regs.slice(0, 20).forEach(function(r) {
      var tmpl  = (APP.checklist_templates || []).filter(function(t) { return t.id === r.template_id; })[0];
      var func  = APP.utilizadores.filter(function(u) { return u.id === r.realizado_por; })[0];
      var resps = (APP.checklist_respostas || []).filter(function(x) { return x.registo_id === r.id; });
      var nOk   = resps.filter(function(x) { return x.resposta === true; }).length;
      var nNok  = resps.filter(function(x) { return x.resposta === false; }).length;
      var pct   = resps.length ? Math.round(nOk / resps.length * 100) : 0;

      html += '<tr>';
      html += '<td class="td-m">' + fData(r.data_registo) + '</td>';
      html += '<td class="td-p">' + H(tmpl ? tmpl.nome : '—') + '</td>';
      html += '<td class="td-m">' + H(func ? func.nome : '—') + '</td>';
      html += '<td>';
      if (resps.length) {
        var cor = pct === 100 ? 'var(--green)' : pct >= 75 ? 'var(--amber)' : 'var(--red)';
        html += '<span style="font-weight:700;color:' + cor + ';">' + pct + '%</span>';
        html += '<span style="font-size:11px;color:var(--text-3);"> (' + nOk + '✓ ' + nNok + '✗)</span>';
      } else {
        html += '<span class="td-m">—</span>';
      }
      html += '</td>';
      html += '<td class="td-m" style="max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + H(r.observacoes || '—') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ── MODAIS HTML ───────────────────────────────────────────
  function getModaisHTML() {
    var html = '';

    // MODAL REGISTO (preencher checklist)
    html += '<div class="modal-bd" id="m-chk-registo">';
    html += '<div class="modal" style="max-width:560px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-green"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div><div><div class="modal-title" id="m-chk-ttl">Preencher checklist</div><div class="modal-sub" id="m-chk-sub">—</div></div><button class="modal-close" onclick="closeModal(\'m-chk-registo\')">✕</button></div>';
    html += '<div class="modal-body" id="m-chk-body"><div class="loading-wrap"><div class="spinner"></div></div></div>';
    html += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-chk-registo\')">Cancelar</button><button class="btn btn-primary" onclick="Checklist.guardarRegisto()">Guardar registo</button></div>';
    html += '</div></div>';

    // MODAL GERIR TEMPLATES
    html += '<div class="modal-bd" id="m-chk-templates">';
    html += '<div class="modal" style="max-width:560px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-teal"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div><div><div class="modal-title">Gerir templates de checklist</div><div class="modal-sub" id="m-tmpl-eq">—</div></div><button class="modal-close" onclick="closeModal(\'m-chk-templates\')">✕</button></div>';
    html += '<div class="modal-body" id="m-tmpl-body"></div>';
    html += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-chk-templates\')">Fechar</button><button class="btn btn-primary" onclick="Checklist.openNovoTemplate()">+ Novo template</button></div>';
    html += '</div></div>';

    // MODAL NOVO TEMPLATE
    html += '<div class="modal-bd" id="m-chk-novo-tmpl">';
    html += '<div class="modal" style="max-width:520px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-teal"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><div><div class="modal-title" id="m-ntmpl-ttl">Novo template</div><div class="modal-sub">Defina os itens de verificação</div></div><button class="modal-close" onclick="closeModal(\'m-chk-novo-tmpl\')">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="form-row"><div class="fi"><label class="fl">Nome *</label><input type="text" id="tmpl-nome" class="fin" placeholder="ex: Checklist Início de Turno"></div>';
    html += '<div class="fi"><label class="fl">Periodicidade</label><select id="tmpl-peri" class="fin"><option value="diaria">Diária</option><option value="semanal">Semanal</option><option value="mensal">Mensal</option></select></div></div>';
    html += '<div class="fi"><label class="fl">Descrição</label><input type="text" id="tmpl-desc" class="fin" placeholder="Descrição breve"></div>';
    html += '<div class="form-sec-t">Itens de verificação</div>';
    html += '<div id="tmpl-itens" style="margin-bottom:8px;"></div>';
    html += '<button class="btn btn-ghost btn-sm" onclick="Checklist.addItem()">+ Adicionar item</button>';
    html += '</div>';
    html += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-chk-novo-tmpl\')">Cancelar</button><button class="btn btn-primary" onclick="Checklist.salvarTemplate()">Guardar template</button></div>';
    html += '</div></div>';

    return html;
  }

  // ── ACÇÕES ────────────────────────────────────────────────
  var _currentEqId     = null;
  var _currentTemplId  = null;
  var _itemCount       = 0;

  function openNovoRegisto(eqId) {
    // se há templates, mostrar selector
    var templates = (APP.checklist_templates || []).filter(function(t) { return t.equipamento_id === eqId && t.ativo; });
    if (!templates.length) {
      toast('Crie primeiro um template de checklist.', 'error'); return;
    }
    if (templates.length === 1) {
      openNovoRegistoTemplate(eqId, templates[0].id); return;
    }
    // vários templates — perguntar qual preencher
    _currentEqId = eqId;
    _currentTemplId = null;
    var eq = getEq(eqId);
    document.getElementById('m-chk-ttl').textContent = 'Que checklist quer preencher?';
    document.getElementById('m-chk-sub').textContent = eq ? eq.nome : '—';
    var periL = { diaria: 'Diária', semanal: 'Semanal', mensal: 'Mensal' };
    var h = '<div style="display:flex;flex-direction:column;gap:8px;">';
    templates.forEach(function(t) {
      h += '<button class="qa" onclick="Checklist.openNovoRegistoTemplate(\'' + eqId + '\',\'' + t.id + '\')"><span class="qa-ic">✓</span><span><span class="qa-t">' + H(t.nome) + '</span><br><span class="qa-s">' + (periL[t.periodicidade] || '') + '</span></span></button>';
    });
    document.getElementById('m-chk-body').innerHTML = h + '</div>';
    openModal('m-chk-registo');
  }

  function openNovoRegistoTemplate(eqId, templId) {
    _currentEqId    = eqId;
    _currentTemplId = templId;
    var eq    = getEq(eqId);
    var templ = (APP.checklist_templates || []).filter(function(t) { return t.id === templId; })[0];
    var items = (APP.checklist_items || []).filter(function(i) { return i.template_id === templId; });
    items.sort(function(a,b) { return a.ordem - b.ordem; });

    document.getElementById('m-chk-ttl').textContent = templ ? templ.nome : 'Checklist';
    document.getElementById('m-chk-sub').textContent = eq ? eq.nome : '—';

    var body = document.getElementById('m-chk-body');
    if (!items.length) {
      body.innerHTML = emptyState('Sem itens', 'Adicione itens a este template.');
    } else {
      var html = '<div style="margin-bottom:12px;">';
      items.forEach(function(item) {
        html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">';
        html += '<div style="display:flex;gap:8px;flex-shrink:0;">';
        html += '<label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="radio" name="item-' + item.id + '" value="ok" style="accent-color:var(--green);"> <span style="font-size:12px;color:var(--green);font-weight:600;">✓ OK</span></label>';
        html += '<label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="radio" name="item-' + item.id + '" value="nok" style="accent-color:var(--red);"> <span style="font-size:12px;color:var(--red);font-weight:600;">✗ NOK</span></label>';
        html += '</div>';
        html += '<div style="flex:1;font-size:13px;color:var(--text);">' + H(item.pergunta) + '</div>';
        html += '</div>';
      });
      html += '</div>';
      html += '<div class="fi"><label class="fl">Observações gerais</label><textarea id="chk-obs" class="fin" rows="2" placeholder="Notas sobre esta verificação..."></textarea></div>';
      body.innerHTML = html;
    }
    openModal('m-chk-registo');
  }

  function guardarRegisto() {
    if (!_currentEqId || !_currentTemplId) { toast('Escolha primeiro a checklist.', 'error'); return; }
    var items = (APP.checklist_items || []).filter(function(i) { return i.template_id === _currentTemplId; });
    var uuidRx = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    var realPor = APP.user && APP.user.id && uuidRx.test(APP.user.id) ? APP.user.id : null;
    var obs = (document.getElementById('chk-obs') || {}).value || '';

    // criar registo
    sbPost('checklist_registos', {
      template_id:   _currentTemplId,
      equipamento_id: _currentEqId,
      realizado_por: realPor,
      data_registo:  new Date().toISOString(),
      observacoes:   obs
    }).then(function(data) {
      var regId = Array.isArray(data) ? data[0].id : (data.id || null);
      if (!regId || !items.length) {
        toast('Registo guardado.', 'success');
        closeModal('m-chk-registo');
        _reloadChecklist();
        return;
      }
      // guardar respostas
      var respostas = items.map(function(item) {
        var radios = document.querySelectorAll('input[name="item-' + item.id + '"]');
        var val = null;
        radios.forEach(function(r) { if (r.checked) val = r.value === 'ok'; });
        return { registo_id: regId, item_id: item.id, resposta: val };
      }).filter(function(r) { return r.resposta !== null; });

      if (!respostas.length) {
        toast('Registo guardado (sem respostas).', 'success');
        closeModal('m-chk-registo');
        _reloadChecklist();
        return;
      }

      // inserir respostas em batch
      var promises = respostas.map(function(r) { return sbPost('checklist_respostas', r); });
      Promise.all(promises).then(function() {
        toast('Checklist registada com sucesso.', 'success');
        closeModal('m-chk-registo');
        _reloadChecklist();
      }).catch(function(e) {
        console.error('Erro respostas:', e);
        toast('O registo foi criado, mas algumas respostas não foram guardadas.', 'error');
        _reloadChecklist();
      });
    }).catch(function(e) {
      console.error('Erro checklist:', e);
      toast('Erro ao guardar registo.', 'error');
    });
  }

  function openGerirTemplates(eqId) {
    _currentEqId = eqId;
    var eq = getEq(eqId);
    document.getElementById('m-tmpl-eq').textContent = eq ? eq.nome : '—';
    _renderTmplList();
    openModal('m-chk-templates');
  }

  function _renderTmplList() {
    var templates = (APP.checklist_templates || []).filter(function(t) { return t.equipamento_id === _currentEqId; });
    var body = document.getElementById('m-tmpl-body');
    if (!body) return;
    if (!templates.length) {
      body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-3);font-size:13px;">Sem templates. Crie o primeiro.</div>';
      return;
    }
    var html = '';
    templates.forEach(function(t) {
      var items = (APP.checklist_items || []).filter(function(i) { return i.template_id === t.id; });
      html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">';
      html += '<div style="flex:1;"><div style="font-weight:600;color:var(--text);font-size:13px;">' + H(t.nome) + '</div>';
      html += '<div style="font-size:11.5px;color:var(--text-3);">' + items.length + ' itens · ' + (t.periodicidade || '') + (t.ativo ? '' : ' · Inativo') + '</div></div>';
      html += '<button class="btn btn-ghost btn-sm" onclick="Checklist.editarTemplate(\'' + t.id + '\')">Editar</button>';
      html += '</div>';
    });
    body.innerHTML = html;
  }

  function openNovoTemplate() {
    APP.editId = null;
    document.getElementById('m-ntmpl-ttl').textContent = 'Novo template';
    document.getElementById('tmpl-nome').value = '';
    document.getElementById('tmpl-desc').value = '';
    document.getElementById('tmpl-peri').value = 'diaria';
    document.getElementById('tmpl-itens').innerHTML = '';
    _itemCount = 0;
    addItem();
    openModal('m-chk-novo-tmpl');
  }

  function editarTemplate(id) {
    var t = (APP.checklist_templates || []).filter(function(x) { return x.id === id; })[0];
    if (!t) return;
    APP.editId = id;
    document.getElementById('m-ntmpl-ttl').textContent = 'Editar template';
    document.getElementById('tmpl-nome').value = t.nome || '';
    document.getElementById('tmpl-desc').value = t.descricao || '';
    document.getElementById('tmpl-peri').value = t.periodicidade || 'diaria';

    var items = (APP.checklist_items || []).filter(function(i) { return i.template_id === id; });
    items.sort(function(a,b) { return a.ordem - b.ordem; });
    document.getElementById('tmpl-itens').innerHTML = '';
    _itemCount = 0;
    items.forEach(function(item) {
      addItemCom(item.pergunta, item.id);
    });
    if (!items.length) addItem();
    openModal('m-chk-novo-tmpl');
  }

  function addItem() { addItemCom('', null); }

  function addItemCom(valor, itemId) {
    _itemCount++;
    var cont = document.getElementById('tmpl-itens');
    var div = document.createElement('div');
    div.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:7px;';
    div.innerHTML = '<span style="font-size:12px;color:var(--text-3);width:18px;text-align:right;flex-shrink:0;">' + _itemCount + '.</span>' +
      '<input type="text" class="fin" placeholder="Descrição do item..." value="' + H(valor) + '" style="flex:1;" data-item-id="' + (itemId || '') + '">' +
      '<button class="btn btn-ghost btn-sm" style="color:var(--red);flex-shrink:0;" onclick="this.parentNode.remove()">✕</button>';
    cont.appendChild(div);
  }

  function salvarTemplate() {
    var nome = document.getElementById('tmpl-nome').value.trim();
    if (!nome) { toast('Nome obrigatório.', 'error'); return; }

    var body = {
      equipamento_id: _currentEqId,
      nome:           nome,
      descricao:      document.getElementById('tmpl-desc').value.trim(),
      periodicidade:  document.getElementById('tmpl-peri').value,
      ativo:          true
    };

    var p = APP.editId
      ? sbPatch('checklist_templates', 'id=eq.' + APP.editId, body)
      : sbPost('checklist_templates', body);

    p.then(function(data) {
      var tmplId = APP.editId || (Array.isArray(data) ? data[0].id : data.id);

      // guardar itens
      var inputs = document.querySelectorAll('#tmpl-itens input[type="text"]');
      var itens  = [];
      inputs.forEach(function(inp, idx) {
        var val = inp.value.trim();
        if (val) itens.push({ pergunta: val, ordem: idx, existId: inp.dataset.itemId || null });
      });

      // apagar itens antigos se edição
      var deleteP = APP.editId
        ? sbDelete('checklist_items', 'template_id=eq.' + APP.editId)
        : Promise.resolve();

      deleteP.then(function() {
        var inserts = itens.map(function(it) {
          return sbPost('checklist_items', { template_id: tmplId, pergunta: it.pergunta, ordem: it.ordem });
        });
        return Promise.all(inserts);
      }).then(function() {
        toast(APP.editId ? 'Template atualizado.' : 'Template criado.', 'success');
        closeModal('m-chk-novo-tmpl');
        _reloadChecklist();
        _renderTmplList();
      });
    }).catch(function() { toast('Erro ao guardar template.', 'error'); });
  }

  function _reloadChecklist() {
    _loadChecklist(function() { App.renderContent(); });
  }

  function _loadChecklist(cb) {
    if (!APP.spotEqId) { if (cb) cb(); return; }
    Promise.all([
      sbGet('checklist_templates', 'equipamento_id=eq.' + APP.spotEqId + '&order=created_at.asc').then(function(d) { APP.checklist_templates = Array.isArray(d) ? d : []; }),
      sbGet('checklist_items',     'order=ordem.asc').then(function(d) { APP.checklist_items     = Array.isArray(d) ? d : []; }),
      sbGet('checklist_registos',  'equipamento_id=eq.' + APP.spotEqId + '&order=data_registo.desc&limit=50').then(function(d) { APP.checklist_registos  = Array.isArray(d) ? d : []; }),
      sbGet('checklist_respostas', 'order=created_at.desc').then(function(d) { APP.checklist_respostas = Array.isArray(d) ? d : []; })
    ]).then(function() { if (cb) cb(); }).catch(function() { if (cb) cb(); });
  }

  function init() {
    APP.checklist_templates = APP.checklist_templates || [];
    APP.checklist_items     = APP.checklist_items     || [];
    APP.checklist_registos  = APP.checklist_registos  || [];
    APP.checklist_respostas = APP.checklist_respostas || [];
    var cont = document.getElementById('modais-checklist');
    if (cont) cont.innerHTML = getModaisHTML();
  }

  function load(cb) { _loadChecklist(cb); }

  return {
    render: render, init: init, load: load,
    openNovoRegisto: openNovoRegisto,
    openNovoRegistoTemplate: openNovoRegistoTemplate,
    guardarRegisto: guardarRegisto,
    openGerirTemplates: openGerirTemplates,
    openNovoTemplate: openNovoTemplate,
    editarTemplate: editarTemplate,
    addItem: addItem,
    salvarTemplate: salvarTemplate
  };

})();

</script>
<script>
/* ═════ relatorios.js ═════ */
// ============================================================
// GestDDS — relatorios.js  v5.2
// Relatórios e Indicadores — memorandos + ocupação de reservas
// ============================================================

var Relatorios = (function() {

  var _periodo = 'semana'; // dia | semana | mes | ano
  var _eqFiltro = null;    // null = todos
  var _eqRel = null;       // equipamento em foco na aba "Equipamentos"
  var _indRel = null;      // indicador escolhido para o gráfico de evolução

  function render() {
    // funcionário não acede
    if (APP.isFuncionario()) {
      return '<div class="dash-greeting"><div><div class="dash-hello" style="font-size:18px;">Relatórios</div></div></div>' + accessDenied();
    }

    var aba = APP.repTab || 'indicadores';

    var html = '<div class="dash-greeting">';
    html += '<div><div class="dash-hello" style="font-size:18px;">Relatórios e Indicadores</div>';
    html += '<div class="dash-sub">Análises detalhadas, fichas e documentos para imprimir.</div></div>';
    html += '<button class="btn btn-primary" onclick="App.nav(\'relatorios\')">📄 Abrir relatório mensal</button>';
    html += '</div>';

    // ── Abas ──
    html += '<div class="rep-tabs">';
    [['indicadores', 'Indicadores'], ['equipamentos', 'Equipamentos'], ['horas', 'Banco de Horas'], ['impressao', 'Imprimir / PDF']].forEach(function(t) {
      html += '<div class="rep-tab' + (aba === t[0] ? ' active' : '') + '" onclick="Relatorios.setTab(\'' + t[0] + '\')">' + t[1] + '</div>';
    });
    html += '</div>';

    // ── Barra de período (aplica-se a todos os relatórios) ──
    var anoW = APP.anoTrabalho || new Date().getFullYear();
    html += '<div class="rep-periodo">';
    html += '<span class="rep-periodo-l">Período</span>';
    html += '<button class="rep-mes' + (!APP.repMes ? ' active' : '') + '" onclick="Relatorios.setMes(null)">Ano ' + anoW + '</button>';
    for (var mi = 1; mi <= 12; mi++) {
      var nm = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][mi - 1];
      html += '<button class="rep-mes' + (APP.repMes === mi ? ' active' : '') + '" onclick="Relatorios.setMes(' + mi + ')">' + nm + '</button>';
    }
    html += '</div>';

    if (aba === 'indicadores') {
      html += _renderResumoTopo();
      html += _renderFiltros();
      html += _renderOcupacao();
      html += _renderStatsGlobais();
      html += _renderMemoStats();
      html += _renderPorEquipamento();
    } else if (aba === 'equipamentos') {
      html += _renderEquipamentos();
    } else if (aba === 'horas') {
      html += _renderHorasIndicadores();
    } else {
      html += _renderListaFuncionarios();
    }

    return html;
  }

  function setTab(t) {
    APP.repTab = t;
    App.renderContent();
  }

  // ── RESUMO NO TOPO (cartões) ──────────────────────────────
  function _renderResumoTopo() {
    var U = APP.utilizadores, E = APP.equipamentos;
    // memorandos do período selecionado
    var M = APP.memos.filter(function(m) { return _noPeriodo(m.created_at); });

    var nExt = U.filter(function(u){ return u.unidade === 'EXTERNA'; }).length;
    var nDds = U.length - nExt;
    var eAtivos = E.filter(function(e){ return e.estado === 'ativo'; }).length;
    var mAbertos = M.filter(function(m){ return m.estado !== 'concluido'; }).length;
    var taxa = M.length ? Math.round(M.filter(function(m){ return m.estado === 'concluido'; }).length / M.length * 100) : 0;

    var per = _perLabel();

    var h = '<div class="rep-cards">';
    h += _repCard(nDds, 'Funcionários DDS', nExt ? ('+' + nExt + ' de outras divisões') : 'Registados', '#15803D', '#DCFCE7');
    h += _repCard(E.length, 'Equipamentos', eAtivos + ' ativos', '#1D4ED8', '#DBEAFE');
    h += _repCard(mAbertos, 'Memorandos em aberto', 'de ' + M.length + ' em ' + per, '#D97706', '#FEF3C7');
    h += _repCard(taxa + '%', 'Taxa de conclusão', 'memorandos de ' + per, '#7C3AED', '#EDE9FE');
    h += '</div>';
    return h;
  }

  function _repCard(v, t, sub, cor, bg) {
    var h = '<div class="rep-card">';
    h += '<div class="rep-card-v" style="color:' + cor + ';">' + v + '</div>';
    h += '<div class="rep-card-t">' + t + '</div>';
    h += '<div class="rep-card-s">' + sub + '</div>';
    h += '</div>';
    return h;
  }

  // ── INDICADORES DO BANCO DE HORAS ─────────────────────────
  function _renderHorasIndicadores() {
    if (typeof Horas === 'undefined') return '<div class="card">Módulo indisponível.</div>';

    var regs = Horas.registos();
    if (!regs.length) {
      return '<div class="card">' + emptyState('Sem registos', 'Ainda não há horas registadas no banco de horas.') + '</div>';
    }

    // âmbito conforme o perfil
    var uni = null;
    if (APP.user.perfil === 'supervisor_udaj') uni = 'UDAJ';
    if (APP.user.perfil === 'supervisor_uase') uni = 'UASE';

    var funcs = APP.utilizadores.filter(function(u) {
      if (u.unidade === 'EXTERNA') return true; // externos também podem ter horas
      return !uni || u.unidade === uni;
    });

    // totais — no período selecionado
    var tEf = 0, tGo = 0, nPend = 0;
    regs.forEach(function(r) {
      var f = APP.utilizadores.filter(function(u){ return u.id === r.funcionario_id; })[0];
      if (uni && (!f || f.unidade !== uni)) return;

      // pendentes: contam sempre (são trabalho por despachar, não têm período)
      if (r.estado === 'pendente' || r.estado === 'validado_resp') { nPend++; return; }
      if (r.estado !== 'aprovado') return;

      // aprovados: só os do período escolhido
      if (!_noPeriodo(r.data)) return;

      if (r.tipo === 'gozada') tGo += parseFloat(r.horas) || 0;
      else                     tEf += parseFloat(r.horas) || 0;
    });

    var subPer = _perLabel();

    var h = '';
    h += '<div class="rep-cards">';
    h += _repCard(Horas.fmtH(tEf), 'Horas efetuadas', subPer + (uni ? ' · ' + uni : ''), '#15803D', '#DCFCE7');
    h += _repCard(Horas.fmtH(tGo), 'Horas gozadas', subPer + (uni ? ' · ' + uni : ''), '#D97706', '#FEF3C7');
    h += _repCard(Horas.fmtH(tEf - tGo), 'Movimento do período', 'efetuadas − gozadas', (tEf - tGo) > 0 ? '#B91C1C' : '#15803D', '#FEE2E2');
    h += _repCard(nPend, 'Por validar', 'registos pendentes', '#2563EB', '#DBEAFE');
    h += '</div>';

    // saldos por funcionário — movimento no período + saldo acumulado
    var linhas = funcs.map(function(f) {
      var s = Horas.saldoDe(f.id);   // acumulado (sempre total)

      // movimento só do período selecionado
      var pEf = 0, pGo = 0;
      regs.forEach(function(r) {
        if (r.funcionario_id !== f.id) return;
        if (r.estado !== 'aprovado') return;
        if (!_noPeriodo(r.data)) return;
        if (r.tipo === 'gozada') pGo += parseFloat(r.horas) || 0;
        else                     pEf += parseFloat(r.horas) || 0;
      });

      return { f: f, s: s, pEf: pEf, pGo: pGo };
    }).filter(function(x) {
      // mostra quem tem movimento no período OU saldo pendente
      return x.pEf > 0 || x.pGo > 0 || x.s.saldo !== 0;
    }).sort(function(a, b) { return b.s.saldo - a.s.saldo; });

    h += '<div class="card" style="margin-top:14px;">';
    h += '<div class="sec-head"><div><div class="sec-title" style="font-size:14px;">Saldos por funcionário</div>';
    h += '<div style="font-size:11.5px;color:var(--text-3);margin-top:2px;">Movimento em ' + H(subPer) + ' · saldo sempre acumulado</div></div>';
    h += '<button class="btn btn-secondary btn-sm" onclick="Relatorios.imprimir(\'horas\',\'' + (uni || '') + '\')">🖨️ Imprimir</button></div>';

    if (!linhas.length) {
      h += emptyState('Sem saldos', 'Nenhum funcionário tem horas neste período.');
    } else {
      h += '<div class="dtw"><table class="dt">';
      h += '<thead><tr><th>Funcionário</th><th>Unidade</th><th>Efetuadas</th><th>Gozadas</th><th>Saldo acumulado</th><th></th></tr></thead><tbody>';
      linhas.forEach(function(x) {
        var cor = x.s.saldo > 0 ? 'var(--green)' : (x.s.saldo < 0 ? 'var(--red)' : 'var(--text-2)');
        h += '<tr>';
        h += '<td><span class="td-p">' + H(x.f.nome) + '</span></td>';
        h += '<td class="td-m">' + H(x.f.unidade === 'EXTERNA' ? (x.f.divisao_origem || 'Externo') : (x.f.unidade || '—')) + '</td>';
        h += '<td class="td-m">' + (x.pEf ? Horas.fmtH(x.pEf) : '—') + '</td>';
        h += '<td class="td-m">' + (x.pGo ? Horas.fmtH(x.pGo) : '—') + '</td>';
        h += '<td><strong style="color:' + cor + ';">' + Horas.fmtH(x.s.saldo) + '</strong></td>';
        h += '<td style="text-align:right;"><button class="btn btn-ghost btn-sm" onclick="Relatorios.imprimir(\'horas_ind\',\'' + x.f.id + '\')">Extrato</button></td>';
        h += '</tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '</div>';
    return h;
  }

  function _renderFiltros() {
    var periodos = [
      { v:'dia',    l:'Hoje' },
      { v:'semana', l:'Esta semana' },
      { v:'mes',    l:'Este mês' },
      { v:'ano',    l:'Este ano' }
    ];
    var html = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;">';
    html += '<span style="font-size:12px;font-weight:600;color:var(--text-3);">Período:</span>';
    periodos.forEach(function(p) {
      var active = _periodo === p.v;
      html += '<button class="btn btn-sm ' + (active ? 'btn-primary' : 'btn-ghost') + '" onclick="Relatorios.setPeriodo(\'' + p.v + '\')">' + p.l + '</button>';
    });

    // filtro de equipamento (só DDS vê todos)
    if (APP.isDds()) {
      html += '<span style="font-size:12px;font-weight:600;color:var(--text-3);margin-left:8px;">Equipamento:</span>';
      html += '<select class="fin" style="width:auto;max-width:200px;padding:5px 10px;font-size:12.5px;" onchange="Relatorios.setEqFiltro(this.value)">';
      html += '<option value="">Todos</option>';
      APP.equipamentos.forEach(function(e) {
        html += '<option value="' + e.id + '"' + (_eqFiltro === e.id ? ' selected' : '') + '>' + H(e.nome) + '</option>';
      });
      html += '</select>';
    }
    html += '</div>';
    return html;
  }

  // ── OCUPAÇÃO (números de pessoas) ─────────────────────────
  function _periodoRange() {
    var hoje = new Date(); hoje.setHours(0,0,0,0);
    var inicio, fim;
    if (_periodo === 'dia') {
      inicio = new Date(hoje);
      fim = new Date(hoje); fim.setHours(23,59,59,0);
    } else if (_periodo === 'semana') {
      var ds = hoje.getDay();
      inicio = new Date(hoje); inicio.setDate(hoje.getDate() - (ds===0?6:ds-1));
      fim = new Date(inicio); fim.setDate(inicio.getDate()+6); fim.setHours(23,59,59,0);
    } else if (_periodo === 'mes') {
      inicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
      fim = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0, 23,59,59);
    } else { // ano
      inicio = new Date(hoje.getFullYear(), 0, 1);
      fim = new Date(hoje.getFullYear(), 11, 31, 23,59,59);
    }
    return { inicio: inicio, fim: fim };
  }

  // expande reservas (incl. recorrentes) e conta ocorrências + pessoas no período
  function _ocupacaoData() {
    var range = _periodoRange();
    var reservas = (APP.reservas || []).filter(function(r) {
      if (r.estado === 'cancelada') return false;
      if (_eqFiltro && r.equipamento_id !== _eqFiltro) return false;
      // se não-DDS, só o seu equipamento
      if (!APP.isDds() && APP.user && r.equipamento_id !== APP.user.equipamento_id) return false;
      return true;
    });

    var porEspaco = {};  // espaco/eq -> { ocorrencias, pessoas, pessoas2 }
    var totalOcorrencias = 0, totalPessoas = 0;

    function addOcorrencia(r, chave, nome) {
      if (!porEspaco[chave]) porEspaco[chave] = { nome: nome, ocorrencias: 0, pessoas: 0, pessoas2: 0 };
      porEspaco[chave].ocorrencias++;
      porEspaco[chave].pessoas  += (r.num_pessoas  || 0);
      porEspaco[chave].pessoas2 += (r.num_pessoas2 || 0);
      totalOcorrencias++;
      totalPessoas += (r.num_pessoas || 0);
    }

    reservas.forEach(function(r) {
      var eq = getEq(r.equipamento_id);
      var espNome = r.espaco || (eq ? eq.nome : 'Sem espaço');
      var chave = (r.equipamento_id||'') + '|' + espNome;

      if (r.recorrente) {
        var dias = (r.dias_semana||'').split(',').map(function(x){return parseInt(x,10);});
        var pi = new Date(r.data_inicio_periodo), pf = new Date(r.data_fim_periodo);
        // iterar dias no range de análise
        var d = new Date(range.inicio);
        while (d <= range.fim) {
          var dN = new Date(d); dN.setHours(0,0,0,0);
          if (dias.indexOf(d.getDay()) >= 0 &&
              dN >= new Date(pi.getFullYear(),pi.getMonth(),pi.getDate()) &&
              dN <= new Date(pf.getFullYear(),pf.getMonth(),pf.getDate())) {
            addOcorrencia(r, chave, espNome);
          }
          d.setDate(d.getDate()+1);
        }
      } else {
        var di = new Date(r.data_inicio);
        if (di >= range.inicio && di <= range.fim) {
          addOcorrencia(r, chave, espNome);
        }
      }
    });

    return { porEspaco: porEspaco, totalOcorrencias: totalOcorrencias, totalPessoas: totalPessoas, range: range };
  }

  function _renderMemoStats() {
    // evolução mensal: mostra sempre o ano inteiro (é esse o propósito do gráfico),
    // mas destaca o mês selecionado
    var anoW = String(APP.anoTrabalho || new Date().getFullYear());
    var memos = (APP.isDds() ? APP.memos : APP.memos.filter(function(m){ return m.equipamento_id === (APP.user&&APP.user.equipamento_id); }))
                .filter(function(m) { return String(m.created_at || '').slice(0,4) === anoW; });
    var porMes = {};
    memos.forEach(function(m) {
      var d   = new Date(m.created_at);
      var key = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0');
      if (!porMes[key]) porMes[key] = { total:0, concl:0, reforco:0 };
      porMes[key].total++;
      if (m.estado === 'concluido') porMes[key].concl++;
      if (m.num_reforcos > 0) porMes[key].reforco++;
    });
    var keys = Object.keys(porMes).sort().reverse().slice(0, 6);
    if (!keys.length) return '';

    keys.forEach(function(k) {
      var m = porMes[k];
      var pct = m.total ? Math.round(m.concl / m.total * 100) : 0;
      var data = new Date(k + '-01');
      var lbl = data.toLocaleDateString('pt-PT', { month:'long', year:'numeric' });

      html += '<tr><td class="td-p">' + H(lbl) + '</td>';
      html += '<td class="td-mono">' + m.total + '</td>';
      html += '<td><span style="color:var(--green);font-weight:600;">' + m.concl + '</span></td>';
      html += '<td>' + (m.reforco ? '<span style="color:var(--red);font-weight:600;">' + m.reforco + '</span>' : '0') + '</td>';

  function exportarMemos() {
    var memos = (APP.isDds() ? APP.memos : APP.memos.filter(function(m){ return m.equipamento_id === (APP.user&&APP.user.equipamento_id); }))
                .filter(function(m) { return _noPeriodo(m.created_at); });

    memos.forEach(function(m) {

      linhas.push([
        m.numero || '',
        '"' + (m.descricao || '').replace(/"/g,'""') + '"',

        eq ? '"' + eq.nome + '"' : '',
        fData(m.created_at),
        m.estado || '',

      ].join(','));

  function _downloadCSV(content, filename) {
    var blob = new Blob(['\ufeff' + content], { type: 'text/csv;charset=utf-8;' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  // Router de impressão
  function imprimir(tipo, ambito) {
    var body = '';
    if (tipo === 'resumo')            body = _repResumo();
    else if (tipo === 'funcionarios') body = _repFuncionarios(ambito);
    else if (tipo === 'equipamentos') body = _repEquipamentos(ambito);
    else if (tipo === 'ficha')        body = _repFicha(ambito, 'full');
    else if (tipo === 'ficha_op')     body = _repFicha(ambito, 'operacao');
    else if (tipo === 'ficha_man')    body = _repFicha(ambito, 'manutencao');
    else if (tipo === 'memorandos')   body = _repMemorandos(ambito);
    else if (tipo === 'horas')        body = _repHoras(ambito);
    else if (tipo === 'horas_ind')    body = _repHorasIndividual(ambito);
    else return;

    var root = document.getElementById('print-root');
    if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
    root.innerHTML = body;
    window.print();
  }

  var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  function _perLabel() {
    var ano = APP.anoTrabalho || new Date().getFullYear();
    var m = APP.repMes;
    return (m ? MESES[parseInt(m, 10) - 1] + ' de ' + ano : 'Ano de ' + ano);
  }

  // um registo (com campo de data) pertence ao período selecionado?
  function _noPeriodo(iso) {
    if (!iso) return false;
    var ano = String(APP.anoTrabalho || new Date().getFullYear());
    var s = String(iso).slice(0, 10);
    if (s.slice(0, 4) !== ano) return false;
    if (!APP.repMes) return true;
    return s.slice(5, 7) === ('0' + APP.repMes).slice(-2);
  }

    APP.repMes = m || null;
    App.renderContent();

  function _cabecalho(titulo, sub) {
    var hoje = new Date();
    var d = ('0' + hoje.getDate()).slice(-2) + '/' + ('0' + (hoje.getMonth() + 1)).slice(-2) + '/' + hoje.getFullYear();
    var h = '<div class="pr-head">';
    h += '<div class="pr-head-top">';
    h += '<div>';
    h += '<div class="pr-org">Município de Cabeceiras de Basto · Divisão de Desenvolvimento Social</div>';
    h += '<div class="pr-title">' + esc(titulo) + '</div>';
    h += '<div class="pr-meta">' + (sub ? esc(sub) + ' · ' : '') + 'Emitido em ' + d + '</div>';
    h += '</div>';
    h += '<div class="pr-chip">' + esc(_perLabel()) + '</div>';
    h += '</div>';
    h += '</div>';
    return h;
  }
  function _rodape() {
    return '<div class="pr-foot">GestDDS · Divisão de Desenvolvimento Social · Município de Cabeceiras de Basto</div>';
  }

  // RESUMO EXECUTIVO
  function _repResumo() {
    var U = APP.utilizadores, E = APP.equipamentos;
    var M = APP.memos.filter(function(m) { return _noPeriodo(m.created_at); });
    var fUase = U.filter(function(u){ return u.unidade === 'UASE'; }).length;
    var fUdaj = U.filter(function(u){ return u.unidade === 'UDAJ'; }).length;
    var fExt  = U.filter(function(u){ return u.unidade === 'EXTERNA'; }).length;
    var fDds  = U.length - fExt;
    var eUase = E.filter(function(e){ return e.unidade === 'UASE'; }).length;
    var eUdaj = E.filter(function(e){ return e.unidade === 'UDAJ'; }).length;
    var eAtivos = E.filter(function(e){ return e.estado === 'ativo'; }).length;
    var eManut  = E.filter(function(e){ return e.estado === 'manutencao'; }).length;
    var mConcl = M.filter(function(m){ return m.estado === 'concluido'; }).length;
    var mCurso = M.filter(function(m){ return m.estado !== 'concluido' && m.data_envio_servicos; }).length;
    var mPend  = M.length - mConcl - mCurso;
    var taxa   = M.length ? Math.round(mConcl / M.length * 100) : 0;

    var h = _cabecalho('Resumo Executivo', 'Indicadores da Divisão');

    h += '<div class="pr-kpis">';
    h += _kpi(fDds, 'Funcionários DDS');
    h += _kpi(E.length, 'Equipamentos');
    h += _kpi(M.length, 'Memorandos');
    h += _kpi(taxa + '%', 'Taxa de conclusão');
    h += '</div>';

    h += '<div class="pr-sec">Recursos por unidade</div>';
    h += '<table class="pr-table"><thead><tr><th>Unidade</th><th>Funcionários</th><th>Equipamentos</th></tr></thead><tbody>';
    h += '<tr><td>UASE</td><td>' + fUase + '</td><td>' + eUase + '</td></tr>';
    h += '<tr><td>UDAJ</td><td>' + fUdaj + '</td><td>' + eUdaj + '</td></tr>';
    var fSem = fDds - fUase - fUdaj, eSem = E.length - eUase - eUdaj;
    if (fSem || eSem) h += '<tr><td>Sem unidade atribuída</td><td>' + fSem + '</td><td>' + eSem + '</td></tr>';
    h += '<tr class="pr-tot"><td>Total DDS</td><td>' + fDds + '</td><td>' + E.length + '</td></tr>';
    if (fExt) h += '<tr><td>Afectos de outras divisões (não DDS)</td><td>' + fExt + '</td><td>—</td></tr>';
    h += '</tbody></table>';

    h += '<div class="pr-sec">Estado dos equipamentos</div>';
    h += '<table class="pr-table"><thead><tr><th>Ativos</th><th>Em manutenção</th><th>Inativos</th></tr></thead><tbody>';
    h += '<tr><td>' + eAtivos + '</td><td>' + eManut + '</td><td>' + (E.length - eAtivos - eManut) + '</td></tr>';
    h += '</tbody></table>';

    h += '<div class="pr-sec">Memorandos de manutenção</div>';
    h += '<table class="pr-table"><thead><tr><th>Concluídos</th><th>Em curso</th><th>Pendentes</th><th>Taxa de conclusão</th></tr></thead><tbody>';
    h += '<tr><td>' + mConcl + '</td><td>' + mCurso + '</td><td>' + mPend + '</td><td>' + taxa + '%</td></tr>';
    h += '</tbody></table>';

    h += _rodape();
    return h;
  }
  function _kpi(v, l) {
    return '<div class="pr-kpi"><div class="pr-kpi-v">' + esc(v) + '</div><div class="pr-kpi-l">' + esc(l) + '</div></div>';
  }

  // FUNCIONÁRIOS
  function _repFuncionarios(unidade) {
    var lista = APP.utilizadores.slice();
    var soExternos = (unidade === 'EXTERNA');
    if (unidade) lista = lista.filter(function(u){ return u.unidade === unidade; });
    else lista = lista.filter(function(u){ return u.unidade !== 'EXTERNA'; }); // DDS não inclui externos
    lista.sort(function(a, b) {
      var ua = (a.unidade || 'zzz'), ub = (b.unidade || 'zzz');
      if (ua !== ub) return ua.localeCompare(ub);
      return (a.nome || '').localeCompare(b.nome || '');
    });
    var sub = soExternos ? 'Afectos de outras divisões' : (unidade ? ('Unidade ' + unidade) : 'Toda a DDS');
    var h = _cabecalho('Lista de Funcionários', sub);
    h += '<div class="pr-meta2">' + lista.length + ' funcionários</div>';
    h += '<table class="pr-table">';
    h += '<colgroup><col style="width:4%"><col style="width:28%"><col style="width:10%"><col style="width:11%"><col style="width:17%"><col style="width:15%"><col style="width:15%"></colgroup>';
    h += '<thead><tr>';
    [ '#', 'Nome', 'Nº Mec.', soExternos ? 'Divisão' : 'Unidade', 'Função', 'Categoria', 'Vínculo'].forEach(function(c){ h += '<th>' + c + '</th>'; });
    h += '</tr></thead><tbody>';
    lista.forEach(function(u, i) {
      var col4 = soExternos ? (u.divisao_origem || 'Externa') : (u.unidade || '—');
      h += '<tr><td>' + (i + 1) + '</td><td>' + esc(u.nome) + '</td><td>' + esc(u.num_mecanografico || '—') + '</td><td>' + esc(col4) + '</td><td>' + esc(u.funcao || '—') + '</td><td>' + esc(u.categoria || '—') + '</td><td>' + esc(u.vinculo || '—') + '</td></tr>';
    });
    h += '</tbody></table>' + _rodape();
    return h;
  }

  // EQUIPAMENTOS — quadro resumo (enriquecido)
  function _repEquipamentos(unidade) {
    var lista = APP.equipamentos.slice();
    if (unidade) lista = lista.filter(function(e){ return e.unidade === unidade; });
    lista.sort(_ordEq);
    var estadoLbl = { ativo: 'Ativo', manutencao: 'Manutenção', inativo: 'Inativo' };
    var h = _cabecalho('Lista de Equipamentos', unidade ? ('Unidade ' + unidade) : 'Toda a DDS');
    h += '<div class="pr-meta2">' + lista.length + ' equipamentos</div>';
    h += '<table class="pr-table">';
    h += '<colgroup><col style="width:4%"><col style="width:28%"><col style="width:20%"><col style="width:11%"><col style="width:23%"><col style="width:9%"><col style="width:5%"></colgroup>';
    h += '<thead><tr>';
    ['#', 'Equipamento', 'Tipo', 'Unidade', 'Responsável', 'Estado', 'Esp.'].forEach(function(c){ h += '<th>' + c + '</th>'; });
    h += '</tr></thead><tbody>';
    lista.forEach(function(e, i) {
      var tipo = getTipo(e.tipo_id);
      var resp = e.responsavel_id ? (APP.utilizadores.filter(function(u){ return u.id === e.responsavel_id; })[0] || {}).nome : null;
      var nEsp = (APP.espacos || []).filter(function(x){ return x.equipamento_id === e.id; }).length;
      h += '<tr><td>' + (i + 1) + '</td><td>' + esc(e.nome) + '</td><td>' + esc(tipo ? tipo.nome : '—') + '</td><td>' + esc(e.unidade || '—') + '</td><td>' + esc(resp || '—') + '</td><td>' + esc(estadoLbl[e.estado] || e.estado || '—') + '</td><td>' + nEsp + '</td></tr>';
    });
    h += '</tbody></table>' + _rodape();
    return h;
  }

  // FICHA por equipamento — modo: 'full' | 'operacao' | 'manutencao'
  function _repFicha(unidade, modo) {
    modo = modo || 'full';
    var titulos = { full: 'Ficha Completa de Equipamentos', operacao: 'Ficha de Operação — Equipamentos', manutencao: 'Ficha de Manutenção — Equipamentos' };
    var ano = APP.anoTrabalho || new Date().getFullYear();
    var lista = APP.equipamentos.slice();
    if (unidade) lista = lista.filter(function(e){ return e.unidade === unidade; });
    lista.sort(_ordEq);
    var sub = (unidade ? ('Unidade ' + unidade) : 'Toda a DDS') + ' · Ano ' + ano;
    var h = _cabecalho(titulos[modo] || titulos.full, sub);
    if (!lista.length) { h += '<div class="pr-empty">Sem equipamentos.</div>'; return h + _rodape(); }
    lista.forEach(function(e) { h += _fichaEq(e, modo); });
    h += _rodape();
    return h;
  }

  function _fichaEq(e, modo) {
    modo = modo || 'full';
    var mostraOp  = (modo === 'full' || modo === 'operacao');
    var mostraMan = (modo === 'full' || modo === 'manutencao');
    var tipo = getTipo(e.tipo_id);
    var estadoLbl = { ativo: 'Ativo', manutencao: 'Em manutenção', inativo: 'Inativo' };
    var resp = e.responsavel_id ? (APP.utilizadores.filter(function(u){ return u.id === e.responsavel_id; })[0] || {}).nome : null;

    var h = '<div class="pr-ficha">';
    h += '<div class="pr-eqname">' + esc(e.nome) + '</div>';
    h += '<div class="pr-eqsub">' + esc(tipo ? tipo.nome : 'Sem tipo') + (e.codigo ? ' · ' + esc(e.codigo) : '') + '</div>';

    h += '<div class="pr-grid">';
    h += '<div><b>Unidade:</b> ' + esc(e.unidade || '—') + '</div>';
    h += '<div><b>Responsável:</b> ' + esc(resp || '—') + '</div>';
    h += '<div><b>Estado:</b> ' + esc(estadoLbl[e.estado] || e.estado || '—') + '</div>';
    if (e.morada || e.localidade) h += '<div><b>Morada:</b> ' + esc([e.morada, e.localidade].filter(Boolean).join(', ')) + '</div>';
    if (e.telefone) h += '<div><b>Telefone:</b> ' + esc(e.telefone) + '</div>';
    h += '</div>';

    if (mostraOp) {
      var espacos = (APP.espacos || []).filter(function(x){ return x.equipamento_id === e.id; }).sort(function(a, b){ return (a.ordem || 0) - (b.ordem || 0); });
      h += '<div class="pr-sec">Espaços / Valências (' + espacos.length + ')</div>';
      h += espacos.length ? '<div>' + espacos.map(function(x){ return '<span class="pr-badge">' + esc(x.nome) + '</span>'; }).join('') + '</div>' : '<div class="pr-empty">Sem espaços registados.</div>';

      var reservas = (APP.reservas || []).filter(function(r) {
        return r.equipamento_id === e.id && _noPeriodo(r.data_inicio);
      });
      h += '<div class="pr-sec">Reservas em ' + esc(_perLabel()) + ' (' + reservas.length + ')</div>';
      if (reservas.length) {
        h += '<table class="pr-table"><colgroup><col style="width:30%"><col style="width:24%"><col style="width:18%"><col style="width:28%"></colgroup>';
        h += '<thead><tr><th>Título</th><th>Entidade</th><th>Espaço</th><th>Quando</th></tr></thead><tbody>';
        reservas.slice(0, 20).forEach(function(r) {
          var esp = r.espaco_id ? (APP.espacos.filter(function(x){ return x.id === r.espaco_id; })[0] || {}).nome : null;
          h += '<tr><td>' + esc(r.titulo || '—') + '</td><td>' + esc(r.entidade || '—') + '</td><td>' + esc(esp || '—') + '</td><td>' + esc(_quandoReserva(r)) + '</td></tr>';
        });
        h += '</tbody></table>';
        if (reservas.length > 20) h += '<div class="pr-empty">… e mais ' + (reservas.length - 20) + ' reservas.</div>';
      } else h += '<div class="pr-empty">Sem reservas registadas.</div>';

      var turnos = (APP.escalas || []).filter(function(t) {
        return t.equipamento_id === e.id && _noPeriodo(t.data_inicio);
      }).sort(function(a, b){ return new Date(b.data_inicio || 0) - new Date(a.data_inicio || 0); });
      h += '<div class="pr-sec">Escala — turnos (' + turnos.length + ')</div>';
      if (turnos.length) {
        h += '<table class="pr-table"><colgroup><col style="width:30%"><col style="width:18%"><col style="width:30%"><col style="width:22%"></colgroup>';
        h += '<thead><tr><th>Funcionário</th><th>Tipo</th><th>Período</th><th>Horas</th></tr></thead><tbody>';
        turnos.slice(0, 20).forEach(function(t) {
          var f = (APP.utilizadores.filter(function(u){ return u.id === t.funcionario_id; })[0] || {}).nome;
          var per = _fdata(t.data_inicio) + (t.data_fim && t.data_fim !== t.data_inicio ? ' → ' + _fdata(t.data_fim) : '');
          var horas = (t.hora_entrada ? t.hora_entrada.slice(0, 5) : '') + (t.hora_saida ? '–' + t.hora_saida.slice(0, 5) : '');
          h += '<tr><td>' + esc(f || '—') + '</td><td>' + esc(_turnoLbl(t.tipo_turno)) + '</td><td>' + esc(per) + '</td><td>' + esc(horas || '—') + '</td></tr>';
        });
        h += '</tbody></table>';
        if (turnos.length > 20) h += '<div class="pr-empty">… e mais ' + (turnos.length - 20) + ' turnos.</div>';
      } else h += '<div class="pr-empty">Sem turnos registados.</div>';
    }

    if (mostraMan) {
      var memos = (APP.memos || []).filter(function(m) {
        return m.equipamento_id === e.id && _noPeriodo(m.created_at);
      }).sort(function(a, b){ return new Date(b.created_at || 0) - new Date(a.created_at || 0); });
      h += '<div class="pr-sec">Memorandos (' + memos.length + ')</div>';
      if (memos.length) {
        h += '<table class="pr-table"><colgroup><col style="width:12%"><col style="width:50%"><col style="width:20%"><col style="width:18%"></colgroup>';
        h += '<thead><tr><th>Nº</th><th>Descrição</th><th>Estado</th><th>Data</th></tr></thead><tbody>';
        memos.forEach(function(m) {
          h += '<tr><td>' + esc(m.numero || '—') + '</td><td>' + esc(m.descricao || '—') + '</td><td>' + esc(_estadoMemo(m)) + '</td><td>' + _fdata(m.created_at) + '</td></tr>';
        });
        h += '</tbody></table>';
      } else h += '<div class="pr-empty">Sem memorandos.</div>';

      var templates = (APP.checklist_templates || []).filter(function(t){ return t.equipamento_id === e.id; });
      h += '<div class="pr-sec">Checklists (' + templates.length + ')</div>';
      if (templates.length) {
        h += '<table class="pr-table"><colgroup><col style="width:40%"><col style="width:22%"><col style="width:12%"><col style="width:26%"></colgroup>';
        h += '<thead><tr><th>Checklist</th><th>Periodicidade</th><th>Itens</th><th>Últ. verificação</th></tr></thead><tbody>';
        templates.forEach(function(t) {
          var nItens = (APP.checklist_items || []).filter(function(i){ return i.template_id === t.id; }).length;
          var regs = (APP.checklist_registos || []).filter(function(r){ return r.template_id === t.id; }).sort(function(a, b){ return new Date(b.data_realizacao || b.created_at || 0) - new Date(a.data_realizacao || a.created_at || 0); });
          var ult = regs[0] ? _fdata(regs[0].data_realizacao || regs[0].created_at) : '—';
          h += '<tr><td>' + esc(t.nome) + (t.ativo === false ? ' (inativa)' : '') + '</td><td>' + esc(t.periodicidade || '—') + '</td><td>' + nItens + '</td><td>' + esc(ult) + '</td></tr>';
        });
        h += '</tbody></table>';
      } else h += '<div class="pr-empty">Sem checklists.</div>';
    }

    h += '</div>';
    return h;
  }

  function _ordEq(a, b) {
    var ua = (a.unidade || 'zzz'), ub = (b.unidade || 'zzz');
    if (ua !== ub) return ua.localeCompare(ub);
    return (a.nome || '').localeCompare(b.nome || '');
  }
  function _fdata(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
  }
  var _TURNO_LBL = { normal: 'Normal', ferias: 'Férias', folga: 'Folga', feriado: 'Feriado', formacao: 'Formação', doenca: 'Doença' };
  function _turnoLbl(t) { return _TURNO_LBL[t] || t || 'Turno'; }
  var _DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  function _quandoReserva(r) {
    if (r.recorrente) {
      var dias = (r.dias_semana || '').split(',').filter(function(x){ return x !== ''; }).map(function(d){ return _DIAS[parseInt(d, 10)] || ''; }).join(', ');
      var horas = (r.hora_inicio ? r.hora_inicio.slice(0, 5) : '') + (r.hora_fim ? '–' + r.hora_fim.slice(0, 5) : '');
      return 'Semanal: ' + dias + (horas ? ' ' + horas : '');
    }
    var d = _fdata(r.data_inicio);
    var hi = r.data_inicio ? new Date(r.data_inicio) : null;
    var hora = hi && !isNaN(hi) ? (' ' + ('0' + hi.getHours()).slice(-2) + ':' + ('0' + hi.getMinutes()).slice(-2)) : '';
    return d + hora;
  }

  // MEMORANDOS
  function _repMemorandos(ambito) {
    var lista = APP.memos.filter(function(m) { return _noPeriodo(m.created_at); });
    if (ambito === 'ativos') lista = lista.filter(function(m){ return m.estado !== 'concluido'; });
    lista.sort(function(a, b) { return new Date(b.created_at || 0) - new Date(a.created_at || 0); });

    var h = _cabecalho('Memorandos de Manutenção', ambito === 'ativos' ? 'Apenas em aberto' : 'Todos');
    // resumo por estado
    var porEstado = {};
    APP.memos.forEach(function(m){ var e = _estadoMemo(m); porEstado[e] = (porEstado[e] || 0) + 1; });
    h += '<div class="pr-meta2">' + lista.length + ' memorandos listados · Total na divisão: ' + APP.memos.length + '</div>';
    h += '<table class="pr-table" style="margin-bottom:12px;"><thead><tr><th>Pendente</th><th>A enviar</th><th>Em curso</th><th>Reforço</th><th>Concluído</th></tr></thead><tbody><tr>';
    ['Pendente','A enviar','Em curso','Reforço pedido','Concluído'].forEach(function(k){ h += '<td>' + (porEstado[k] || 0) + '</td>'; });
    h += '</tr></tbody></table>';

    h += '<table class="pr-table">';
    h += '<colgroup><col style="width:12%"><col style="width:44%"><col style="width:24%"><col style="width:10%"><col style="width:10%"></colgroup>';
    h += '<thead><tr>';
    ['Nº', 'Descrição', 'Equipamento', 'Estado', 'Data'].forEach(function(c){ h += '<th>' + c + '</th>'; });
    h += '</tr></thead><tbody>';
    lista.forEach(function(m) {
      var eq = m.equipamento_id ? (getEq(m.equipamento_id) || {}).nome : null;
      var dt = m.created_at ? new Date(m.created_at) : null;
      var dstr = dt ? ('0' + dt.getDate()).slice(-2) + '/' + ('0' + (dt.getMonth() + 1)).slice(-2) + '/' + dt.getFullYear() : '—';
      h += '<tr><td>' + esc(m.numero || '—') + '</td><td>' + esc(m.descricao || '—') + '</td><td>' + esc(eq || '—') + '</td><td>' + esc(_estadoMemo(m)) + '</td><td>' + dstr + '</td></tr>';
    });
    h += '</tbody></table>' + _rodape();
    return h;
  }

  // BANCO DE HORAS
  function _repHoras(unidade) {
    if (typeof Horas === 'undefined') return _cabecalho('Banco de Horas', '—') + _rodape();
    var regs = Horas.registos();

    var funcs = APP.utilizadores.filter(function(u) {
      return !unidade || u.unidade === unidade;
    });

    var linhas = funcs.map(function(f) {
      return { f: f, s: Horas.saldoDe(f.id) };
    }).filter(function(x) {
      return x.s.efetuadas > 0 || x.s.gozadas > 0;
    }).sort(function(a, b) {
      var ua = (a.f.unidade || 'zzz'), ub = (b.f.unidade || 'zzz');
      if (ua !== ub) return ua.localeCompare(ub);
      return (a.f.nome || '').localeCompare(b.f.nome || '');
    });

    var tEf = 0, tGo = 0;
    linhas.forEach(function(x) { tEf += x.s.efetuadas; tGo += x.s.gozadas; });

    var h = _cabecalho('Banco de Horas', unidade ? ('Unidade ' + unidade) : 'Toda a DDS');

    h += '<div class="pr-kpis">';
    h += _kpi(Horas.fmtH(tEf), 'Efetuadas');
    h += _kpi(Horas.fmtH(tGo), 'Gozadas');
    h += _kpi(Horas.fmtH(tEf - tGo), 'Saldo');
    h += _kpi(linhas.length, 'Funcionários');
    h += '</div>';

    h += '<div class="pr-sec">Saldos por funcionário (apenas horas aprovadas)</div>';
    if (!linhas.length) {
      h += '<div class="pr-empty">Sem horas aprovadas.</div>';
      return h + _rodape();
    }

    h += '<table class="pr-table">';
    h += '<colgroup><col style="width:5%"><col style="width:33%"><col style="width:14%"><col style="width:16%"><col style="width:16%"><col style="width:16%"></colgroup>';
    h += '<thead><tr><th>#</th><th>Funcionário</th><th>Unidade</th><th>Efetuadas</th><th>Gozadas</th><th>Saldo</th></tr></thead><tbody>';
    linhas.forEach(function(x, i) {
      var uni = x.f.unidade === 'EXTERNA' ? (x.f.divisao_origem || 'Externo') : (x.f.unidade || '—');
      h += '<tr><td>' + (i + 1) + '</td><td>' + esc(x.f.nome) + '</td><td>' + esc(uni) + '</td><td>' + Horas.fmtH(x.s.efetuadas) + '</td><td>' + Horas.fmtH(x.s.gozadas) + '</td><td><strong>' + Horas.fmtH(x.s.saldo) + '</strong></td></tr>';
    });
    h += '<tr class="pr-tot"><td></td><td>Total</td><td></td><td>' + Horas.fmtH(tEf) + '</td><td>' + Horas.fmtH(tGo) + '</td><td>' + Horas.fmtH(tEf - tGo) + '</td></tr>';
    h += '</tbody></table>';

    // detalhe dos movimentos (no período selecionado)
    var movs = regs.filter(function(r) {
      if (r.estado !== 'aprovado') return false;
      if (!_noPeriodo(r.data)) return false;
      if (!unidade) return true;
      var f = APP.utilizadores.filter(function(u){ return u.id === r.funcionario_id; })[0];
      return f && f.unidade === unidade;
    }).sort(function(a, b) { return new Date(b.data || 0) - new Date(a.data || 0); });

    if (movs.length) {
      h += '<div class="pr-sec">Movimentos autorizados — ' + esc(_perLabel()) + ' (' + movs.length + ')</div>';
      h += '<table class="pr-table">';
      h += '<colgroup><col style="width:12%"><col style="width:28%"><col style="width:14%"><col style="width:12%"><col style="width:34%"></colgroup>';
      h += '<thead><tr><th>Data</th><th>Funcionário</th><th>Tipo</th><th>Horas</th><th>Motivo</th></tr></thead><tbody>';
      movs.slice(0, 60).forEach(function(r) {
        var f = APP.utilizadores.filter(function(u){ return u.id === r.funcionario_id; })[0];
        h += '<tr><td>' + _fdata(r.data) + '</td><td>' + esc(f ? f.nome : '?') + '</td><td>' + (r.tipo === 'gozada' ? 'Gozadas' : 'Efetuadas') + '</td><td>' + Horas.fmtH(r.horas) + '</td><td>' + esc(r.motivo || '—') + '</td></tr>';
      });
      h += '</tbody></table>';
      if (movs.length > 60) h += '<div class="pr-empty">… e mais ' + (movs.length - 60) + ' movimentos.</div>';
    }

    return h + _rodape();
  }

  // BANCO DE HORAS — extrato individual
  function _repHorasIndividual(funcId) {
    if (typeof Horas === 'undefined' || !funcId) return _cabecalho('Extrato de Banco de Horas', '—') + _rodape();
    var f = APP.utilizadores.filter(function(u) { return u.id === funcId; })[0];
    if (!f) return _cabecalho('Extrato de Banco de Horas', 'Funcionário não encontrado') + _rodape();

    var s = Horas.saldoDe(funcId);
    var uni = f.unidade === 'EXTERNA' ? (f.divisao_origem || 'Externo à DDS') : (f.unidade || '—');

    var h = _cabecalho('Extrato de Banco de Horas', esc(f.nome) + (f.num_mecanografico ? ' · Nº ' + esc(f.num_mecanografico) : ''));

    h += '<div class="pr-grid">';
    h += '<div><b>Unidade:</b> ' + esc(uni) + '</div>';
    if (f.funcao)    h += '<div><b>Função:</b> ' + esc(f.funcao) + '</div>';
    if (f.categoria) h += '<div><b>Categoria:</b> ' + esc(f.categoria) + '</div>';
    if (f.vinculo)   h += '<div><b>Vínculo:</b> ' + esc(f.vinculo) + '</div>';
    h += '</div>';

    h += '<div class="pr-kpis">';
