    html += '<div class="mh-ic mhi-blue"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>';
    html += '<div><div class="modal-title" id="m-util-ttl">Novo utilizador</div><div class="modal-sub">Preencha os dados da conta</div></div>';
    html += '<button class="modal-close" onclick="closeModal(\'m-util-novo\')">✕</button>';
    html += '</div>';
    html += '<div class="modal-body">';

    html += '<div class="form-sec-t">Identificação</div>';
    html += '<div class="form-row">';
    html += '<div class="fi"><label class="fl">Nome completo *</label><input type="text" id="util-nome" class="fin" placeholder="ex: João Silva"></div>';
    html += '<div class="fi"><label class="fl">Username</label><input type="text" id="util-username" class="fin" placeholder="ex: joao.silva"></div>';
    html += '</div>';
    html += '<div class="form-row">';
    html += '<div class="fi"><label class="fl">Código de acesso *</label><input type="text" id="util-codigo" class="fin" placeholder="ex: JS2026" style="font-family:\'JetBrains Mono\',monospace;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()"><div class="form-hint">Código único que o utilizador usa para entrar</div></div>';
    html += '<div class="fi"><label class="fl">Email</label><input type="email" id="util-email" class="fin" placeholder="email@cm-cabeceiras.pt"></div>';
    html += '</div>';

    html += '<div class="form-sec-t">Perfil e acesso</div>';
    html += '<div class="form-row">';
    html += '<div class="fi"><label class="fl">Perfil *</label>';
    html += '<select id="util-perfil" class="fin" onchange="Utilizadores.onPerfilChange()">';
    html += '<option value="">Selecione...</option>';
    PERFIS.forEach(function(p) {
      html += '<option value="' + p.v + '">' + p.l + '</option>';
    });
    html += '</select></div>';
    html += '<div class="fi"><label class="fl">Acesso DDS?</label>';
    html += '<select id="util-isdds" class="fin">';
    html += '<option value="false">Não — ligado a equipamento</option>';
    html += '<option value="true">Sim — acesso global DDS</option>';
    html += '</select></div>';
    html += '</div>';

    html += '<div class="fi" id="util-eq-wrap">';
    html += '<label class="fl">Equipamento afecto</label>';
    html += '<select id="util-eq" class="fin">';
    html += '<option value="">Nenhum</option>';
    html += '</select>';
    html += '</div>';

    // ── Acessos personalizados ──
    html += '<div class="form-sec-t">Acessos personalizados</div>';
    html += '<p style="font-size:12px;color:var(--text-3);margin:-2px 0 10px;line-height:1.5;">Excepções às regras do perfil — útil para dar ou retirar acessos temporariamente (baixas, férias, substituições). "Perfil" segue o comportamento normal.</p>';
    for (var mi = 0; mi < MENUS_ACESSO.length; mi += 2) {
      html += '<div class="form-row">';
      for (var mj = mi; mj < Math.min(mi + 2, MENUS_ACESSO.length); mj++) {
        var mm = MENUS_ACESSO[mj];
        html += '<div class="fi"><label class="fl">' + mm[1] + '</label>';
        html += '<select id="uacc-' + mm[0] + '" class="fin">';
        html += '<option value="">Perfil (por defeito)</option>';
        html += '<option value="sim">✓ Dar acesso</option>';
        html += '<option value="nao">✗ Retirar acesso</option>';
        html += '</select></div>';
      }
      html += '</div>';
    }

    html += '<div class="form-row">';
    html += '<div class="fi"><label class="fl">Estado</label>';
    html += '<select id="util-ativo" class="fin">';
    html += '<option value="true">Ativo</option>';
    html += '<option value="false">Inativo</option>';
    html += '</select></div>';
    html += '</div>';

    html += '</div>'; // modal-body
    html += '<div class="modal-footer">';
    html += '<button class="btn btn-ghost" onclick="closeModal(\'m-util-novo\')">Cancelar</button>';
    html += '<button class="btn btn-primary" onclick="Utilizadores.salvar()">Guardar utilizador</button>';
    html += '</div>';
    html += '</div></div>';

    // MODAL CONFIRMAR RETIRAR ACESSO
    html += '<div class="modal-bd" id="m-util-apagar">';
    html += '<div class="modal"><div class="modal-header">';
    html += '<div class="mh-ic mhi-red"><svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 11-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></div>';
    html += '<div><div class="modal-title">Retirar acesso à app</div><div class="modal-sub" id="m-util-ap-nome">—</div></div>';
    html += '<button class="modal-close" onclick="closeModal(\'m-util-apagar\')">✕</button>';
    html += '</div>';
    html += '<div class="modal-body"><p style="font-size:13.5px;color:var(--text-2);line-height:1.6;">O funcionário deixa de poder entrar na aplicação, mas <strong>continua registado</strong> — as suas escalas, férias e histórico mantêm-se. Pode voltar a dar-lhe acesso a qualquer momento no menu Funcionários.</p></div>';
    html += '<div class="modal-footer">';
    html += '<button class="btn btn-ghost" onclick="closeModal(\'m-util-apagar\')">Cancelar</button>';
    html += '<button class="btn btn-danger" onclick="Utilizadores.execApagar()">Retirar acesso</button>';
    html += '</div></div></div>';

    return html;
  }

  // ── ACÇÕES ────────────────────────────────────────────────
  function onPerfilChange() {
    var perfil = document.getElementById('util-perfil').value;
    var isDdsSelect = document.getElementById('util-isdds');
    var eqWrap = document.getElementById('util-eq-wrap');

    // perfis DDS ficam automaticamente com isDds=true
    var isDdsPerfil = ['admin','responsavel_dds','supervisor_udaj','supervisor_uase'].indexOf(perfil) >= 0;
    if (isDdsSelect) {
      isDdsSelect.value = isDdsPerfil ? 'true' : 'false';
    }
    if (eqWrap) {
      eqWrap.style.display = isDdsPerfil ? 'none' : 'block';
    }
  }

  function _popularEqSelect(selId) {
    var sel = document.getElementById(selId);
    if (!sel) return;
    sel.innerHTML = '<option value="">Nenhum</option>';
    APP.equipamentos.forEach(function(e) {
      var o = document.createElement('option');
      o.value = e.id;
      o.textContent = e.nome;
      sel.appendChild(o);
    });
  }

  function openNovo() {
    APP.editId = null;
    document.getElementById('m-util-ttl').textContent = 'Novo utilizador';
    var ids = ['util-nome','util-username','util-codigo','util-email'];
    ids.forEach(function(id) { var el = document.getElementById(id); if (el) el.value = ''; });
    var p = document.getElementById('util-perfil'); if (p) p.value = '';
    var d = document.getElementById('util-isdds'); if (d) d.value = 'false';
    var a = document.getElementById('util-ativo'); if (a) a.value = 'true';
    MENUS_ACESSO.forEach(function(m) {
      var el = document.getElementById('uacc-' + m[0]); if (el) el.value = '';
    });
    _popularEqSelect('util-eq');
    var ew = document.getElementById('util-eq-wrap'); if (ew) ew.style.display = 'block';
    openModal('m-util-novo');
  }

  function openEditar(id) {
    var u = APP.utilizadores.filter(function(x) { return x.id === id; })[0];
    if (!u) return;
    APP.editId = id;
    document.getElementById('m-util-ttl').textContent = 'Editar utilizador';

    var set = function(eid, val) {
      var el = document.getElementById(eid);
      if (el) el.value = val !== null && val !== undefined ? val : '';
    };
    set('util-nome',     u.nome);
    set('util-username', u.username);
    set('util-codigo',   u.codigo);
    set('util-email',    u.email);
    set('util-perfil',   u.perfil);
    set('util-isdds',    u.isDds ? 'true' : 'false');
    set('util-ativo',    u.ativo !== false ? 'true' : 'false');

    // acessos personalizados
    var pexE = u.permissoes_extra || {};
    MENUS_ACESSO.forEach(function(m) {
      var el = document.getElementById('uacc-' + m[0]);
      if (!el) return;
      if (pexE[m[0]] === true)       el.value = 'sim';
      else if (pexE[m[0]] === false) el.value = 'nao';
      else                           el.value = '';
    });

    _popularEqSelect('util-eq');
    var eqSel = document.getElementById('util-eq');
    if (eqSel && u.equipamento_id) eqSel.value = u.equipamento_id;

    // mostrar/esconder eq
    var isDdsPerfil = ['admin','responsavel_dds','supervisor_udaj','supervisor_uase'].indexOf(u.perfil) >= 0;
    var ew = document.getElementById('util-eq-wrap');
    if (ew) ew.style.display = isDdsPerfil ? 'none' : 'block';

    openModal('m-util-novo');
  }

  function salvar() {
    var nome   = document.getElementById('util-nome');
    var codigo = document.getElementById('util-codigo');
    if (!nome || !nome.value.trim()) { toast('O nome é obrigatório.', 'error'); return; }
    if (!codigo || !codigo.value.trim()) { toast('O código de acesso é obrigatório.', 'error'); return; }

    var perfil = document.getElementById('util-perfil').value;
    var isDds  = document.getElementById('util-isdds').value === 'true';
    var eqSel  = document.getElementById('util-eq');
    var atvSel = document.getElementById('util-ativo');

    var body = {
      nome:           nome.value.trim(),
      username:       (document.getElementById('util-username').value || '').trim(),
      codigo:         codigo.value.trim().toUpperCase(),
      email:          (document.getElementById('util-email').value || '').trim(),
      perfil:         perfil,
      isDds:          isDds,
      equipamento_id: (eqSel && eqSel.value) ? eqSel.value : null,
      ativo:          atvSel ? atvSel.value === 'true' : true
    };

    // acessos personalizados
    var pex = {};
    MENUS_ACESSO.forEach(function(m) {
      var el = document.getElementById('uacc-' + m[0]);
      if (!el) return;
      if (el.value === 'sim') pex[m[0]] = true;
      else if (el.value === 'nao') pex[m[0]] = false;
    });
    body.permissoes_extra = pex;
    body.tem_acesso = true; // quem está neste menu tem acesso à app

    var p = APP.editId
      ? sbPatch('utilizadores', 'id=eq.' + APP.editId, body)
      : sbPost('utilizadores', body);

    p.then(function() {
      toast(APP.editId ? 'Utilizador atualizado.' : 'Utilizador criado.', 'success');
      closeModal('m-util-novo');
      loadAll(function() {
        App.renderContent();
        App.buildSidebar();
      });
    }).catch(function(e) {
      // código duplicado
      if (e && e.message && e.message.indexOf('unique') >= 0) {
        toast('Esse código já está em uso. Escolha outro.', 'error');
      } else {
        toast('Erro ao guardar.', 'error');
      }
    });
  }

  function confirmarApagar(id, nome) {
    APP.actionId = id;
    var el = document.getElementById('m-util-ap-nome');
    if (el) el.textContent = nome;
    openModal('m-util-apagar');
  }

  function execApagar() {
    if (!APP.actionId) return;
    sbPatch('utilizadores', 'id=eq.' + APP.actionId, { tem_acesso: false }).then(function() {
      toast('Acesso à app retirado. O funcionário continua registado.', 'success');
      closeModal('m-util-apagar');
      loadAll(function() { App.renderContent(); App.buildSidebar(); });
    }).catch(function() { toast('Erro ao retirar acesso.', 'error'); });
  }

  function init() {
    var cont = document.getElementById('modais-utilizadores');
    if (cont) cont.innerHTML = getModaisHTML();
  }

  return {
    render: render,
    init: init,
    openNovo: openNovo,
    openEditar: openEditar,
    salvar: salvar,
    confirmarApagar: confirmarApagar,
    execApagar: execApagar,
    onPerfilChange: onPerfilChange
  };

})();

</script>
<script>
/* ═════ ferias.js ═════ */
// ============================================================
// GestDDS — ferias.js  v1.0
// Sistema de marcação e validação de férias
// Funcionário marca → dirigente da unidade (UDAJ/UASE) valida
// ============================================================

var Ferias = (function() {

  var _ferias = [];
  var _editId = null;
  var _apagarId = null;

  // ── CARREGAR ──────────────────────────────────────────────
  function load(cb) {
    sbGet('ferias', 'order=data_inicio.desc').then(function(d) {
      _ferias = Array.isArray(d) ? d : [];
      if (cb) cb();
    }).catch(function() { _ferias = []; if (cb) cb(); });
  }

  function todas() { return _ferias; }

  // nº de pedidos à espera da validação do utilizador atual
  function pendentesParaMim() {
    if (!_ehDirigente()) return 0;
    return _ferias.filter(function(f) { return f.estado === 'pendente' && _podeValidar(f); }).length;
  }

  // ── PERMISSÕES ────────────────────────────────────────────
  // dirigente valida as férias dos funcionários da SUA unidade
  function _ehDirigente() {
    return APP.user && ['supervisor_udaj','supervisor_uase','admin'].indexOf(APP.user.perfil) >= 0;
  }
  function _unidadeDoDirigente() {
    if (!APP.user) return null;
    if (APP.user.perfil === 'supervisor_udaj') return 'UDAJ';
    if (APP.user.perfil === 'supervisor_uase') return 'UASE';
    return null; // admin vê todas
  }
  function _podeValidar(f) {
    if (!_ehDirigente()) return false;
    if (APP.user.perfil === 'admin') return true;
    var func = _getFunc(f.funcionario_id);
    if (!func) return false;
    return func.unidade === _unidadeDoDirigente();
  }

  function _getFunc(id) {
    return (APP.utilizadores || []).filter(function(u) { return u.id === id; })[0];
  }

  // ── RENDER PRINCIPAL ──────────────────────────────────────
  function render() {
    if (!APP.user) return '';

    var html = '<div class="dash-greeting">';
    html += '<div><div class="dash-hello" style="font-size:18px;">Férias</div>';
    html += '<div class="dash-sub">' + (_ehDirigente() ? 'Validação e gestão de férias.' : 'Marcação e acompanhamento das suas férias.') + '</div></div>';
    html += '<button class="btn btn-primary btn-sm" onclick="Ferias.openMarcar()">+ Marcar férias</button>';
    html += '</div>';

    if (_ehDirigente()) {
      html += _renderDirigente();
    } else {
      html += _renderFuncionario();
    }
    return html;
  }

  // ── VISTA FUNCIONÁRIO (as suas férias) ────────────────────
  function _renderFuncionario() {
    var minhas = _ferias.filter(function(f) { return f.funcionario_id === APP.user.id; });
    minhas.sort(function(a, b) { return new Date(b.data_inicio) - new Date(a.data_inicio); });

    if (!minhas.length) {
      return '<div style="padding:30px;text-align:center;color:var(--text-3);font-size:13px;border:1px dashed var(--border);border-radius:var(--r);">Ainda não marcou férias.<br><br><button class="btn btn-primary btn-sm" onclick="Ferias.openMarcar()">Marcar as primeiras férias</button></div>';
    }

    var html = '<div class="dtw"><table class="dt"><thead><tr><th>Período</th><th>Dias</th><th>Estado</th><th>Observações</th><th></th></tr></thead><tbody>';
    minhas.forEach(function(f) {
      html += '<tr>';
      html += '<td class="td-p">' + fData(f.data_inicio) + ' → ' + fData(f.data_fim) + '</td>';
      html += '<td class="td-mono">' + (f.dias_uteis || _diasEntre(f.data_inicio, f.data_fim)) + '</td>';
      html += '<td>' + _badgeEstado(f.estado) + '</td>';
      html += '<td class="td-m">' + H(f.observacoes || '—');
      if (f.estado === 'rejeitada' && f.motivo_rejeicao) html += '<div style="color:var(--red);font-size:11px;">Motivo: ' + H(f.motivo_rejeicao) + '</div>';
      html += '</td>';
      html += '<td><div class="td-act">';
      // funcionário só pode editar/apagar enquanto PENDENTE
      // depois de aprovada/rejeitada, só o dirigente mexe
      if (f.estado === 'pendente') {
        html += '<button class="btn btn-ghost btn-sm" onclick="Ferias.openEditar(\'' + f.id + '\')">Editar</button>';
        html += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Ferias.apagar(\'' + f.id + '\')">Apagar</button>';
      } else {
        html += '<span style="font-size:11px;color:var(--text-3);">—</span>';
      }
      html += '</div></td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ── VISTA DIRIGENTE (validar) ─────────────────────────────
  function _renderDirigente() {
    var unidade = _unidadeDoDirigente();
    // filtrar férias dos funcionários da sua unidade (admin vê todas)
    var relevantes = _ferias.filter(function(f) {
      if (APP.user.perfil === 'admin') return true;
      var func = _getFunc(f.funcionario_id);
      return func && func.unidade === unidade;
    });

    var pendentes = relevantes.filter(function(f) { return f.estado === 'pendente'; });
    var outras    = relevantes.filter(function(f) { return f.estado !== 'pendente'; });
    outras.sort(function(a, b) { return new Date(b.data_inicio) - new Date(a.data_inicio); });

    var html = '';

    // pendentes de validação
    html += '<div class="sec-head"><div class="sec-title">Pendentes de validação';
    if (pendentes.length) html += ' <span style="background:var(--amber);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;">' + pendentes.length + '</span>';
    html += '</div></div>';

    if (!pendentes.length) {
      html += '<div style="padding:16px;text-align:center;color:var(--text-3);font-size:12.5px;border:1px dashed var(--border);border-radius:var(--r);margin-bottom:20px;">Sem pedidos por validar.</div>';
    } else {
      pendentes.forEach(function(f) {
        var func = _getFunc(f.funcionario_id);
        var sobrepos = _sobreposicoes(f);
        html += '<div style="border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;background:var(--surface);">';
        html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">';
        html += '<div><div style="font-weight:700;font-size:14px;color:var(--text);">' + H(func ? func.nome : 'Funcionário') + '</div>';
        html += '<div style="font-size:12.5px;color:var(--text-2);margin-top:2px;">' + fData(f.data_inicio) + ' → ' + fData(f.data_fim) + ' · <strong>' + (f.dias_uteis || _diasEntre(f.data_inicio, f.data_fim)) + ' dias</strong></div>';
        if (func && func.equipamento_id) {
          var eq = getEq(func.equipamento_id);
          if (eq) html += '<div style="font-size:11.5px;color:var(--text-3);margin-top:2px;">📍 ' + H(eq.nome) + '</div>';
        }
        if (f.observacoes) html += '<div style="font-size:12px;color:var(--text-2);margin-top:4px;font-style:italic;">"' + H(f.observacoes) + '"</div>';
        html += '</div>';
        html += '</div>';

        // aviso de sobreposição
        if (sobrepos.length) {
          html += '<div style="margin-top:10px;padding:10px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:8px;">';
          html += '<div style="font-size:12.5px;font-weight:700;color:var(--amber);margin-bottom:4px;">⚠️ Sobreposição no mesmo equipamento</div>';
          sobrepos.forEach(function(s) {
            var sf = _getFunc(s.funcionario_id);
            html += '<div style="font-size:11.5px;color:var(--text-2);">• ' + H(sf ? sf.nome : '?') + ': ' + fData(s.data_inicio) + ' → ' + fData(s.data_fim) + ' (' + _labelEstado(s.estado) + ')</div>';
          });
          html += '</div>';
        }

        html += '<div style="display:flex;gap:8px;margin-top:12px;">';
        html += '<button class="btn btn-success btn-sm" onclick="Ferias.aprovar(\'' + f.id + '\')">✓ Aprovar</button>';
        html += '<button class="btn btn-danger btn-sm" onclick="Ferias.openRejeitar(\'' + f.id + '\')">✕ Rejeitar</button>';
        html += '</div>';
        html += '</div>';
      });
    }

    // histórico
    if (outras.length) {
      html += '<div class="sec-head" style="margin-top:8px;"><div class="sec-title">Histórico</div></div>';
      html += '<div class="dtw"><table class="dt"><thead><tr><th>Funcionário</th><th>Período</th><th>Dias</th><th>Estado</th><th></th></tr></thead><tbody>';
      outras.forEach(function(f) {
        var func = _getFunc(f.funcionario_id);
        html += '<tr><td class="td-p">' + H(func ? func.nome : '—') + '</td>';
        html += '<td class="td-m">' + fData(f.data_inicio) + ' → ' + fData(f.data_fim) + '</td>';
        html += '<td class="td-mono">' + (f.dias_uteis || _diasEntre(f.data_inicio, f.data_fim)) + '</td>';
        html += '<td>' + _badgeEstado(f.estado) + '</td>';
        html += '<td><div class="td-act"><button class="btn btn-ghost btn-sm" onclick="Ferias.openEditar(\'' + f.id + '\')">Editar</button><button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Ferias.apagar(\'' + f.id + '\')">Apagar</button></div></td></tr>';
      });
      html += '</tbody></table></div>';
    }

    return html;
  }

  // ── SOBREPOSIÇÕES (mesmo equipamento, datas cruzadas) ─────
  function _sobreposicoes(f) {
    var func = _getFunc(f.funcionario_id);
    if (!func || !func.equipamento_id) return [];
    var ini = new Date(f.data_inicio), fim = new Date(f.data_fim);

    return _ferias.filter(function(o) {
      if (o.id === f.id) return false;
      if (o.estado === 'rejeitada') return false;
      var of = _getFunc(o.funcionario_id);
      if (!of || of.equipamento_id !== func.equipamento_id) return false;
      // datas cruzam-se?
      var oi = new Date(o.data_inicio), ofim = new Date(o.data_fim);
      return ini <= ofim && oi <= fim;
    });
  }

  // ── MARCAR FÉRIAS ─────────────────────────────────────────
  function openMarcar() {
    _editId = null;
    document.getElementById('fer-inicio').value = '';
    document.getElementById('fer-fim').value = '';
    document.getElementById('fer-obs').value = '';
    var av = document.getElementById('fer-aviso'); if (av) av.style.display = 'none';
    var info = document.getElementById('fer-dias-info'); if (info) info.textContent = '';
    var ttl = document.getElementById('fer-modal-titulo'); if (ttl) ttl.textContent = 'Marcar férias';

    // se dirigente/admin, mostrar seletor de funcionário
    var wrap = document.getElementById('fer-func-wrap');
    var sel = document.getElementById('fer-func');
    if (_ehDirigente() && wrap && sel) {
      wrap.style.display = 'block';
      // listar funcionários da sua unidade (admin vê todos)
      var unidade = _unidadeDoDirigente();
      var funcs = (APP.utilizadores || []).filter(function(u) {
        if (u.perfil === 'admin') return false;
        if (APP.user.perfil === 'admin') return true;
        return u.unidade === unidade;
      });
      funcs.sort(function(a, b) { return (a.nome || '').localeCompare(b.nome || ''); });
      sel.innerHTML = '<option value="">— Para mim —</option>';
      funcs.forEach(function(u) {
        sel.innerHTML += '<option value="' + u.id + '">' + H(u.nome) + '</option>';
      });
    } else if (wrap) {
      wrap.style.display = 'none';
    }
    openModal('m-ferias');
  }

  function _onDatasChange() {
    var ini = document.getElementById('fer-inicio').value;
    var fim = document.getElementById('fer-fim').value;
    var info = document.getElementById('fer-dias-info');
    if (ini && fim && info) {
      var d = _diasEntre(ini, fim);
      info.textContent = d > 0 ? (d + ' dia(s) útil(eis)') : 'Datas inválidas';
      info.style.color = d > 0 ? 'var(--accent)' : 'var(--red)';
    } else if (info) {
      info.textContent = '';
    }
  }

  function marcar() {
    // se estiver em modo edição, guardar alteração
    if (_editId) { _guardarEdicao(); return; }

    var ini = document.getElementById('fer-inicio').value;
    var fim = document.getElementById('fer-fim').value;
    var obs = (document.getElementById('fer-obs').value || '').trim();

    if (!ini || !fim) { toast('Indique as datas de início e fim.', 'error'); return; }
    if (new Date(fim) < new Date(ini)) { toast('A data de fim não pode ser anterior à de início.', 'error'); return; }

    var dias = _diasEntre(ini, fim);

    // dirigente pode marcar para outro funcionário → fica logo aprovada
    var funcSel = document.getElementById('fer-func');
    var paraOutro = _ehDirigente() && funcSel && funcSel.value;
    var funcId = paraOutro ? funcSel.value : APP.user.id;

    var body = {
      funcionario_id: funcId,
      data_inicio: ini,
      data_fim: fim,
      dias_uteis: dias,
      observacoes: obs || null,
      estado: paraOutro ? 'aprovada' : 'pendente'
    };
    if (paraOutro) {
      body.validado_por = APP.user.id;
      body.data_validacao = new Date().toISOString();
    }

    sbPost('ferias', body).then(function(resp) {
      closeModal('m-ferias');
      if (paraOutro) {
        toast('Férias registadas e aprovadas.', 'success');
        _criarTurnoFerias(body);
        _avisarFuncionario(body, true, null);
      } else {
        toast('Férias marcadas. Aguardam validação do dirigente.', 'success');
        _avisarDirigente(body);
      }
      load(function() { App.renderContent(); });
    }).catch(function(err) {
      console.error('Erro ao marcar férias:', err);
      toast('Erro ao marcar férias: ' + (err && err.message ? err.message : 'verifique se a tabela existe'), 'error');
    });
  }

  function openEditar(id) {
    var f = _ferias.filter(function(x) { return x.id === id; })[0];
    if (!f) return;
    _editId = id;
    document.getElementById('fer-inicio').value = f.data_inicio || '';
    document.getElementById('fer-fim').value = f.data_fim || '';
    document.getElementById('fer-obs').value = f.observacoes || '';
    var wrap = document.getElementById('fer-func-wrap'); if (wrap) wrap.style.display = 'none';
    var ttl = document.getElementById('fer-modal-titulo'); if (ttl) ttl.textContent = 'Editar férias';
    _onDatasChange();
    openModal('m-ferias');
  }

  function _guardarEdicao() {
    var ini = document.getElementById('fer-inicio').value;
    var fim = document.getElementById('fer-fim').value;
    var obs = (document.getElementById('fer-obs').value || '').trim();
    if (!ini || !fim) { toast('Indique as datas.', 'error'); return; }
    if (new Date(fim) < new Date(ini)) { toast('Data de fim inválida.', 'error'); return; }

    sbPatch('ferias', 'id=eq.' + _editId, {
      data_inicio: ini,
      data_fim: fim,
      dias_uteis: _diasEntre(ini, fim),
      observacoes: obs || null
    }).then(function() {
      toast('Férias atualizadas.', 'success');
      closeModal('m-ferias');
      _editId = null;
      load(function() { App.renderContent(); });
    }).catch(function(err) {
      toast('Erro ao atualizar: ' + (err && err.message ? err.message : ''), 'error');
    });
  }

  function apagar(id) {
    _apagarId = id;
    openModal('m-ferias-apagar');
  }

  function confirmarApagar() {
    if (!_apagarId) return;
    sbDelete('ferias', 'id=eq.' + _apagarId).then(function() {
      toast('Férias apagadas.', 'success');
      closeModal('m-ferias-apagar');
      _apagarId = null;
      load(function() { App.renderContent(); });
    }).catch(function(err) {
      console.error('Erro ao apagar férias:', err);
      toast('Erro ao apagar: ' + (err && err.message ? err.message : 'sem permissão'), 'error');
    });
  }

  function _avisarDirigente(f) {
    var func = APP.user;
    if (!func.unidade) return;
    // encontrar o dirigente da unidade
    var perfilDir = func.unidade === 'UDAJ' ? 'supervisor_udaj' : func.unidade === 'UASE' ? 'supervisor_uase' : null;
    if (!perfilDir) return;
    var dirigentes = (APP.utilizadores || []).filter(function(u) { return u.perfil === perfilDir; });
    dirigentes.forEach(function(dir) {
      sbPost('avisos', {
        destinatario_id: dir.id,
        titulo: 'Pedido de férias',
        mensagem: func.nome + ' marcou férias de ' + fData(f.data_inicio) + ' a ' + fData(f.data_fim) + '. Aguarda validação.',
        lido: false,
        tipo: 'notificacao',
        remetente_id: func.id,
        remetente_nome: func.nome
      }).catch(function() {});
    });
  }

  // ── APROVAR / REJEITAR ────────────────────────────────────
  function aprovar(id) {
    var f = _ferias.filter(function(x) { return x.id === id; })[0];
    if (!f) return;
    if (!_podeValidar(f)) { toast('Sem permissão para validar estas férias.', 'error'); return; }

    sbPatch('ferias', 'id=eq.' + id, {
      estado: 'aprovada',
      validado_por: APP.user.id,
      data_validacao: new Date().toISOString()
    }).then(function() {
      toast('Férias aprovadas.', 'success');
      _avisarFuncionario(f, true, null);
      _criarTurnoFerias(f);
      load(function() { App.renderContent(); });
    }).catch(function() { toast('Erro ao aprovar.', 'error'); });
  }

  function openRejeitar(id) {
    document.getElementById('fer-rej-id').value = id;
    document.getElementById('fer-rej-motivo').value = '';
    openModal('m-ferias-rejeitar');
  }

  function rejeitar() {
    var id = document.getElementById('fer-rej-id').value;
    var motivo = (document.getElementById('fer-rej-motivo').value || '').trim();
    var f = _ferias.filter(function(x) { return x.id === id; })[0];
    if (!f) return;

    sbPatch('ferias', 'id=eq.' + id, {
      estado: 'rejeitada',
      validado_por: APP.user.id,
      data_validacao: new Date().toISOString(),
      motivo_rejeicao: motivo || null
    }).then(function() {
      toast('Férias rejeitadas.', 'success');
      closeModal('m-ferias-rejeitar');
      _avisarFuncionario(f, false, motivo);
      load(function() { App.renderContent(); });
    }).catch(function() { toast('Erro ao rejeitar.', 'error'); });
  }

  function _avisarFuncionario(f, aprovada, motivo) {
    var msg = aprovada
      ? 'As suas férias de ' + fData(f.data_inicio) + ' a ' + fData(f.data_fim) + ' foram aprovadas.'
      : 'As suas férias de ' + fData(f.data_inicio) + ' a ' + fData(f.data_fim) + ' foram rejeitadas.' + (motivo ? ' Motivo: ' + motivo : '');
    sbPost('avisos', {
      destinatario_id: f.funcionario_id,
      titulo: aprovada ? 'Férias aprovadas' : 'Férias rejeitadas',
      mensagem: msg,
      lido: false,
      tipo: 'notificacao',
      remetente_id: APP.user.id,
      remetente_nome: APP.user.nome
    }).catch(function() {});
  }

  // criar turno de férias na escala do equipamento (se afecto)
  function _criarTurnoFerias(f) {
    var func = _getFunc(f.funcionario_id);
    if (!func || !func.equipamento_id) return;
    sbPost('escalas', {
      equipamento_id: func.equipamento_id,
      funcionario_id: f.funcionario_id,
      data_inicio: f.data_inicio,
      data_fim: f.data_fim,
      tipo_turno: 'ferias',
      funcao: 'Férias'
    }).catch(function() {});
  }

  // ── HELPERS ───────────────────────────────────────────────
  function _diasEntre(ini, fim) {
    // conta dias úteis (seg-sex)
    var d = new Date(ini), f = new Date(fim), n = 0;
    while (d <= f) {
      var dow = d.getDay();
      if (dow !== 0 && dow !== 6) n++;
      d.setDate(d.getDate() + 1);
    }
    return n;
  }

  function _badgeEstado(e) {
    if (e === 'aprovada') return '<span class="bdg bdg-concluido"><span class="bdg-dot"></span>Aprovada</span>';
    if (e === 'rejeitada') return '<span class="bdg bdg-inativo">Rejeitada</span>';
    return '<span class="bdg bdg-pendente"><span class="bdg-dot"></span>Pendente</span>';
  }
  function _labelEstado(e) {
    return e === 'aprovada' ? 'aprovada' : e === 'rejeitada' ? 'rejeitada' : 'pendente';
  }

  // ── MODAIS HTML ───────────────────────────────────────────
  function getModaisHTML() {
    var html = '';
    // marcar férias
    html += '<div class="modal-bd" id="m-ferias">';
    html += '<div class="modal" style="max-width:440px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-green"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div><div class="modal-title" id="fer-modal-titulo">Marcar férias</div><div class="modal-sub">Pedido sujeito a validação</div></div><button class="modal-close" onclick="closeModal(\'m-ferias\')">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="fi" id="fer-func-wrap" style="display:none;"><label class="fl">Funcionário</label><select id="fer-func" class="fin"></select><div class="form-hint">Escolha o funcionário. Ao marcar, fica logo aprovada.</div></div>';
    html += '<div class="form-row"><div class="fi"><label class="fl">Data de início</label><input type="date" id="fer-inicio" class="fin" onchange="Ferias._onDatasChange()"></div>';
    html += '<div class="fi"><label class="fl">Data de fim</label><input type="date" id="fer-fim" class="fin" onchange="Ferias._onDatasChange()"></div></div>';
    html += '<div id="fer-dias-info" style="font-size:12.5px;font-weight:600;margin-bottom:10px;"></div>';
    html += '<div class="fi"><label class="fl">Observações</label><textarea id="fer-obs" class="fin" rows="2" placeholder="Opcional"></textarea></div>';
    html += '<div id="fer-aviso" style="display:none;"></div>';
    html += '</div>';
    html += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-ferias\')">Cancelar</button><button class="btn btn-primary" onclick="Ferias.marcar()">Submeter pedido</button></div>';
    html += '</div></div>';

    // rejeitar
    html += '<div class="modal-bd" id="m-ferias-rejeitar">';
    html += '<div class="modal" style="max-width:400px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-red"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div><div><div class="modal-title">Rejeitar férias</div></div><button class="modal-close" onclick="closeModal(\'m-ferias-rejeitar\')">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<input type="hidden" id="fer-rej-id">';
    html += '<div class="fi"><label class="fl">Motivo da rejeição</label><textarea id="fer-rej-motivo" class="fin" rows="3" placeholder="Explique porque não pode aprovar..."></textarea></div>';
    html += '</div>';
    html += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-ferias-rejeitar\')">Cancelar</button><button class="btn btn-danger" onclick="Ferias.rejeitar()">Rejeitar férias</button></div>';
    html += '</div></div>';

    // confirmar apagar
    html += '<div class="modal-bd" id="m-ferias-apagar">';
    html += '<div class="modal" style="max-width:380px;">';
    html += '<div class="modal-header"><div class="mh-ic mhi-red"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></div><div><div class="modal-title">Apagar férias</div></div><button class="modal-close" onclick="closeModal(\'m-ferias-apagar\')">✕</button></div>';
    html += '<div class="modal-body"><p style="font-size:13.5px;color:var(--text-2);margin:0;">Tem a certeza que quer apagar estas férias? Esta ação não pode ser desfeita.</p></div>';
    html += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-ferias-apagar\')">Cancelar</button><button class="btn btn-danger" onclick="Ferias.confirmarApagar()">Apagar</button></div>';
    html += '</div></div>';

    return html;
  }

  function init() {
    var host = document.getElementById('modals-host') || document.body;
    if (host && !document.getElementById('m-ferias')) {
      var div = document.createElement('div');
      div.innerHTML = getModaisHTML();
      while (div.firstChild) host.appendChild(div.firstChild);
    }
  }

  return {
    render: render, init: init, load: load, todas: todas, pendentesParaMim: pendentesParaMim,
    openMarcar: openMarcar, marcar: marcar,
    aprovar: aprovar, openRejeitar: openRejeitar, rejeitar: rejeitar,
    openEditar: openEditar, apagar: apagar, confirmarApagar: confirmarApagar,
    _onDatasChange: _onDatasChange
  };

})();

</script>
<script>
/* ═════ horas.js ═════ */
// ============================================================
// GestDDS — horas.js  v1.0
// Banco de Horas — horas extraordinárias efetuadas e gozadas
//
// FLUXO DE VALIDAÇÃO (dois níveis):
//   1. Funcionário regista            → estado 'pendente'
//   2. Responsável do equipamento     → estado 'validado_resp'  (notifica chefe)
//   3. Chefe da unidade do funcionário→ estado 'aprovado'       (conta no saldo)
//   Rejeição em qualquer fase         → estado 'rejeitado'
//
// Só as horas APROVADAS contam para o saldo.
// Saldo = Σ efetuadas aprovadas − Σ gozadas aprovadas
// ============================================================

var Horas = (function() {

  var _registos = [];

  var ESTADOS = {
    pendente:      { l: 'Aguarda responsável',   c: '#D97706', bg: '#FEF3C7' },
    validado_resp: { l: 'Aguarda chefe unidade',  c: '#2563EB', bg: '#DBEAFE' },
    aprovado:      { l: 'Autorizado',            c: '#15803D', bg: '#DCFCE7' },
    rejeitado:     { l: 'Recusado',              c: '#B91C1C', bg: '#FEE2E2' }
  };

  // ── PERMISSÕES ────────────────────────────────────────────
  function _isAdmin()  { return APP.user && APP.user.perfil === 'admin'; }
  function _isDdsTop() { return _isAdmin() || (APP.user && APP.user.perfil === 'responsavel_dds'); }

  // unidade de um Chefe de Unidade
  function _unidadeChefe() {
    if (!APP.user) return null;
    if (APP.user.perfil === 'supervisor_udaj') return 'UDAJ';
    if (APP.user.perfil === 'supervisor_uase') return 'UASE';
    return null;
  }
  function _ehChefe() { return !!_unidadeChefe() || _isDdsTop(); }

  // é responsável por algum equipamento?
  function _ehResponsavel() {
    return APP.user && ['responsavel', 'professor_responsavel'].indexOf(APP.user.perfil) >= 0;
  }

  // equipamentos de que o utilizador atual é responsável
  function _meusEquipamentos() {
    if (!APP.user) return [];
    return (APP.equipamentos || []).filter(function(e) {
      return e.responsavel_id === APP.user.id || APP.user.equipamento_id === e.id;
    }).map(function(e) { return e.id; });
  }

  // ── CADEIA DE AUTORIZAÇÃO ─────────────────────────────────
  // 1º Responsável do(s) equipamento(s) onde o funcionário trabalha
  // 2º Chefe da unidade do funcionário (só depois do responsável)
  // O ADMIN não autoriza — supervisiona, é notificado e pode apagar.

  // responsáveis dos equipamentos onde o funcionário trabalha
  function _responsaveisDe(func) {
    if (!func) return [];
    var eqs = (typeof eqsDoFunc === 'function') ? eqsDoFunc(func) : (func.equipamento_id ? [func.equipamento_id] : []);
    var ids = [];
    eqs.forEach(function(eqId) {
      var eq = getEq(eqId);
      if (eq && eq.responsavel_id && ids.indexOf(eq.responsavel_id) < 0) ids.push(eq.responsavel_id);
    });
    return ids;
  }

  // Pode fazer a 1ª autorização? (responsável de um equipamento onde a pessoa trabalha)
  function _podeValidarResp(r) {
    if (!APP.user) return false;
    if (r.funcionario_id === APP.user.id) return false; // não autoriza os seus
    if (!_ehResponsavel()) return false;
    var func = _getFunc(r.funcionario_id);
    return _responsaveisDe(func).indexOf(APP.user.id) >= 0;
  }

  // Pode fazer a 2ª autorização? (chefe da unidade do funcionário)
  function _podeValidarChefe(r) {
    if (!APP.user) return false;
    if (r.funcionario_id === APP.user.id) return false;
    var uni = _unidadeChefe();
    if (!uni) return false;
    var func = _getFunc(r.funcionario_id);
    return !!(func && func.unidade === uni);
  }

  function _getFunc(id) {
    return (APP.utilizadores || []).filter(function(u) { return u.id === id; })[0] || null;
  }

  // ── DADOS ─────────────────────────────────────────────────
  function load(cb) {
    sbGet('banco_horas', 'order=data.desc').then(function(d) {
      _registos = Array.isArray(d) ? d : [];
      if (cb) cb();
    }).catch(function() {
      _registos = [];
      if (cb) cb();
    });
  }

  // registos que o utilizador atual pode ver
  function _visiveis() {
    if (!APP.user) return [];
    if (_isDdsTop()) return _registos;

    var uni = _unidadeChefe();
    if (uni) {
      return _registos.filter(function(r) {
        var f = _getFunc(r.funcionario_id);
        return f && f.unidade === uni;
      });
    }

    if (_ehResponsavel()) {
      var meus = _meusEquipamentos();
      return _registos.filter(function(r) {
        return meus.indexOf(r.equipamento_id) >= 0 || r.funcionario_id === APP.user.id;
      });
    }

    // funcionário: só os seus
    return _registos.filter(function(r) { return r.funcionario_id === APP.user.id; });
  }

  // ── SALDOS ────────────────────────────────────────────────
  // Só as horas aprovadas contam
  function saldoDe(funcId) {
    var efet = 0, goz = 0;
    _registos.forEach(function(r) {
      if (r.funcionario_id !== funcId || r.estado !== 'aprovado') return;
      if (r.tipo === 'gozada') goz += parseFloat(r.horas) || 0;
      else                     efet += parseFloat(r.horas) || 0;
    });
    return { efetuadas: efet, gozadas: goz, saldo: efet - goz };
  }

  function _fmtH(n) {
    n = parseFloat(n) || 0;
    var neg = n < 0;
    var abs = Math.abs(n);
    var h = Math.floor(abs);
    var m = Math.round((abs - h) * 60);
    if (m === 60) { h += 1; m = 0; }
    return (neg ? '−' : '') + h + 'h' + (m ? (m < 10 ? '0' + m : m) : '00');
  }

  // ── RENDER ────────────────────────────────────────────────
  function render() {
    var html = '<div class="dash-greeting">';
    html += '<div><div class="dash-hello" style="font-size:18px;">Banco de Horas</div>';
    html += '<div class="dash-sub">Registo de serviço prestado e pedidos de gozo de horas.</div></div>';
    html += '<button class="btn btn-primary" onclick="Horas.openNovo()">+ Novo registo</button>';
    html += '</div>';

    // o meu saldo
    html += _renderMeuSaldo();

    // validações pendentes (para quem valida)
    html += _renderPendentes();

    // saldos de todos (chefes e admin)
    html += _renderSaldosEquipa();

    // histórico
    html += _renderHistorico();

    return html;
  }

  // Saldos de toda a equipa — visível a responsáveis, chefes e admin
  function _renderSaldosEquipa() {
    if (!APP.user) return '';
    if (!(_isDdsTop() || _unidadeChefe() || _ehResponsavel())) return '';

    // âmbito base conforme o perfil
    var funcs = (APP.utilizadores || []).slice();
    var ambito = 'Toda a DDS';
    var eqsDisponiveis = (APP.equipamentos || []).slice();

    if (!_isDdsTop()) {
      var uni = _unidadeChefe();
      if (uni) {
        funcs = funcs.filter(function(u) { return u.unidade === uni; });
        ambito = 'Unidade ' + uni;
        eqsDisponiveis = eqsDisponiveis.filter(function(e) { return e.unidade === uni; });
      } else {
        var meus = _meusEquipamentos();
        funcs = funcs.filter(function(u) { return meus.some(function(eid) { return funcNoEq(u, eid); }); });
        ambito = 'Meus equipamentos';
        eqsDisponiveis = eqsDisponiveis.filter(function(e) { return meus.indexOf(e.id) >= 0; });
      }
    }

    // filtro por equipamento (escolhido pelo utilizador nesta página)
    var filtro = APP.horasEqFiltro || '';
    if (filtro) {
      funcs = funcs.filter(function(u) { return funcNoEq(u, filtro); });
      var eqF = getEq(filtro);
      ambito = eqF ? eqF.nome : ambito;
    }

    var linhas = funcs.map(function(f) { return { f: f, s: saldoDe(f.id) }; })
      .filter(function(x) { return x.s.efetuadas > 0 || x.s.gozadas > 0; })
      .sort(function(a, b) { return b.s.saldo - a.s.saldo; });

    var tEf = 0, tGo = 0;
    linhas.forEach(function(x) { tEf += x.s.efetuadas; tGo += x.s.gozadas; });

    var h = '<div class="card" style="margin-bottom:16px;">';
    h += '<div class="sec-head"><div class="sec-title" style="font-size:14px;">Saldos da equipa — ' + H(ambito) + '</div>';
    h += '<button class="btn btn-secondary btn-sm" onclick="Relatorios.imprimir(\'horas\',\'' + (_unidadeChefe() || '') + '\')">🖨️ Imprimir</button></div>';

    // ── Filtro por equipamento ──
    eqsDisponiveis.sort(function(a, b) { return (a.nome || '').localeCompare(b.nome || ''); });
    h += '<div class="fi" style="margin-bottom:12px;">';
    h += '<label class="fl">Filtrar por equipamento</label>';
    h += '<select class="fin" style="max-width:320px;" onchange="Horas.setEqFiltro(this.value)">';
    h += '<option value=""' + (!filtro ? ' selected' : '') + '>Todos os funcionários</option>';
    eqsDisponiveis.forEach(function(e) {
      h += '<option value="' + e.id + '"' + (filtro === e.id ? ' selected' : '') + '>' + H(e.nome) + '</option>';
    });
    h += '</select></div>';

    if (!linhas.length) {
      h += emptyState('Sem saldos', filtro ? 'Nenhum funcionário deste equipamento tem horas registadas.' : 'Nenhum funcionário tem horas autorizadas.');
      return h + '</div>';
    }

    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">';
    h += _miniKpi(_fmtH(tEf), 'Total efetuadas', 'var(--green)');
    h += _miniKpi(_fmtH(tGo), 'Total gozadas', 'var(--amber)');
    h += _miniKpi(_fmtH(tEf - tGo), 'Saldo a compensar', (tEf - tGo) > 0 ? 'var(--red)' : 'var(--green)');
    h += '</div>';

    h += '<div class="dtw"><table class="dt">';
    h += '<thead><tr><th>Funcionário</th><th>Unidade</th><th>Efetuadas</th><th>Gozadas</th><th>Saldo</th><th></th></tr></thead><tbody>';
    linhas.forEach(function(x) {
      var cor = x.s.saldo > 0 ? 'var(--green)' : (x.s.saldo < 0 ? 'var(--red)' : 'var(--text-2)');
      var uniL = x.f.unidade === 'EXTERNA' ? (x.f.divisao_origem || 'Externo') : (x.f.unidade || '—');
      h += '<tr>';
      h += '<td><span class="td-p">' + H(x.f.nome) + '</span>';
      if (filtro && x.f.equipamento_id !== filtro) h += '<div class="td-m" style="font-size:10.5px;color:var(--accent);">Apoio</div>';
      h += '</td>';
      h += '<td class="td-m">' + H(uniL) + '</td>';
      h += '<td class="td-m">' + _fmtH(x.s.efetuadas) + '</td>';
      h += '<td class="td-m">' + _fmtH(x.s.gozadas) + '</td>';
      h += '<td><strong style="color:' + cor + ';">' + _fmtH(x.s.saldo) + '</strong></td>';
      h += '<td style="text-align:right;"><button class="btn btn-ghost btn-sm" onclick="Relatorios.imprimir(\'horas_ind\',\'' + x.f.id + '\')">Extrato</button></td>';
      h += '</tr>';
    });
    h += '<tr style="font-weight:700;background:var(--bg);"><td>Total</td><td></td><td>' + _fmtH(tEf) + '</td><td>' + _fmtH(tGo) + '</td><td>' + _fmtH(tEf - tGo) + '</td><td></td></tr>';
    h += '</tbody></table></div></div>';
    return h;
  }

  function setEqFiltro(v) {
    APP.horasEqFiltro = v || '';
    App.renderContent();
  }

  function _renderMeuSaldo() {
    if (!APP.user) return '';
    var s = saldoDe(APP.user.id);
    var corSaldo = s.saldo > 0 ? 'var(--green)' : (s.saldo < 0 ? 'var(--red)' : 'var(--text-2)');

    var h = '<div class="card" style="margin-bottom:16px;">';
    h += '<div class="sec-head"><div class="sec-title" style="font-size:14px;">O meu banco de horas</div>';
    h += '<button class="btn btn-secondary btn-sm" onclick="Relatorios.imprimir(\'horas_ind\',\'' + APP.user.id + '\')">🖨️ Extrato</button></div>';
    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;">';
    h += _miniKpi(_fmtH(s.efetuadas), 'Efetuadas', 'var(--green)');
    h += _miniKpi(_fmtH(s.gozadas),   'Gozadas',    'var(--amber)');
    h += _miniKpi(_fmtH(s.saldo),     'Saldo atual', corSaldo);
    h += '</div>';

    // pendentes do próprio
    var meusPend = _registos.filter(function(r) {
      return r.funcionario_id === APP.user.id && (r.estado === 'pendente' || r.estado === 'validado_resp');
    });
    if (meusPend.length) {
      h += '<p style="font-size:12.5px;color:var(--text-3);margin:10px 0 0;line-height:1.5;">';
      h += '<strong style="color:var(--amber);">' + meusPend.length + '</strong> registo(s) a aguardar autorização — só contam para o saldo depois de autorizados.';
      h += '</p>';
    }
    h += '</div>';
    return h;
  }

  function _miniKpi(v, l, cor) {
    var h = '<div style="flex:1;min-width:100px;border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;">';
    h += '<div style="font-size:20px;font-weight:800;color:' + cor + ';">' + v + '</div>';
    h += '<div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.3px;margin-top:2px;">' + l + '</div>';
    h += '</div>';
    return h;
  }

  // Registos à espera da MINHA validação
  function _renderPendentes() {
    if (!APP.user) return '';

    var paraMim = _registos.filter(function(r) {
      if (r.estado === 'pendente')      return _podeValidarResp(r);
      if (r.estado === 'validado_resp') return _podeValidarChefe(r);
      return false;
    });

    // pedidos de alteração a aguardar a minha autorização
    var altsParaMim = _registos.filter(function(r) {
      if (!r.alteracao || !r.alteracao.estado) return false;
      if (r.alteracao.estado === 'pendente')      return _podeValidarResp(r);
      if (r.alteracao.estado === 'validado_resp') return _podeValidarChefe(r);
      return false;
    });

    if (!paraMim.length && !altsParaMim.length) return '';

    var total = paraMim.length + altsParaMim.length;
    var h = '<div class="card" style="margin-bottom:16px;border-left:3px solid var(--amber);">';
    h += '<div class="sec-head"><div class="sec-title" style="font-size:14px;">A aguardar a sua autorização ';
    h += '<span style="background:var(--amber);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;">' + total + '</span>';
    h += '</div></div>';

    // ── pedidos de alteração ──
    altsParaMim.forEach(function(r) {
      var f = _getFunc(r.funcionario_id);
      var alt = r.alteracao;
      var fase = alt.estado === 'pendente' ? '1ª confirmação — responsável do equipamento' : '2ª e última — chefe de unidade';

      h += '<div style="border:1px solid #BFDBFE;background:#EFF6FF;border-radius:10px;padding:12px;margin-bottom:8px;">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">';
      h += '<div style="flex:1;min-width:180px;">';
      h += '<div style="font-size:11px;font-weight:700;color:#1E40AF;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;">✎ Pedido de alteração</div>';
      h += '<div style="font-weight:600;font-size:13.5px;">' + H(f ? f.nome : '?') + '</div>';
      h += '<div style="font-size:12px;color:var(--text-2);margin-top:3px;">';
      h += '<span style="text-decoration:line-through;opacity:.6;">' + _fdata(r.data) + ' · ' + _fmtH(r.horas) + '</span>';
      h += ' → <strong>' + _fdata(alt.data) + ' · ' + _fmtH(alt.horas) + '</strong>';
      h += '</div>';
      h += '<div style="font-size:12px;color:var(--text-3);margin-top:3px;">Motivo: ' + H(alt.motivo) + '</div>';
      h += '<div style="font-size:11px;color:var(--text-3);margin-top:4px;">' + fase + '</div>';
      h += '</div>';
      h += '<div style="display:flex;gap:6px;">';
      h += '<button class="btn btn-primary btn-sm" onclick="Horas.aprovarAlteracao(\'' + r.id + '\')">Autorizar</button>';
      h += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Horas.recusarAlteracao(\'' + r.id + '\')">Recusar</button>';
      h += '</div>';
      h += '</div></div>';
    });

    paraMim.forEach(function(r) {
      var f = _getFunc(r.funcionario_id);
      var eq = getEq(r.equipamento_id);
      var fase = r.estado === 'pendente' ? '1ª confirmação — responsável do equipamento' : '2ª e última — chefe de unidade';

      h += '<div style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">';
      h += '<div style="flex:1;min-width:180px;">';
      h += '<div style="font-weight:600;font-size:13.5px;">' + H(f ? f.nome : '?') + '</div>';
      h += '<div style="font-size:12px;color:var(--text-2);margin-top:2px;">';
      h += _badgeTipo(r.tipo) + ' <strong>' + _fmtH(r.horas) + '</strong> · ' + _fdata(r.data);
      var per = _labelPeriodo(r);
      if (per) h += ' · <strong style="color:var(--amber);">' + per + '</strong>';
      if (eq) h += ' · ' + H(eq.nome);
      if (r.iniciativa) h += ' · 📌 ' + H(r.iniciativa);
      h += '</div>';
      if (r.motivo) h += '<div style="font-size:12px;color:var(--text-3);margin-top:3px;">' + H(r.motivo) + '</div>';
      h += '<div style="font-size:11px;color:var(--text-3);margin-top:4px;">' + fase + '</div>';
      h += '</div>';
      h += '<div style="display:flex;gap:6px;">';
      h += '<button class="btn btn-primary btn-sm" onclick="Horas.aprovar(\'' + r.id + '\')">Autorizar</button>';
      h += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Horas.openRejeitar(\'' + r.id + '\')">Recusar</button>';
      h += '</div>';
      h += '</div></div>';
    });

    h += '</div>';
    return h;
  }

  function _renderHistorico() {
    var lista = _visiveis().slice().sort(function(a, b) {
      return new Date(b.data || 0) - new Date(a.data || 0);
    });

    var h = '<div class="card">';
    h += '<div class="sec-head"><div class="sec-title" style="font-size:14px;">Registos</div></div>';

    if (!lista.length) {
      return h + emptyState('Sem registos', 'Ainda não há registos no banco de horas.') + '</div>';
    }

    h += '<div class="dtw"><table class="dt">';
    h += '<thead><tr><th>Data</th><th>Funcionário</th><th>Tipo</th><th>Horas</th><th>Descrição</th><th>Estado</th><th></th></tr></thead><tbody>';

    lista.forEach(function(r) {
      var f = _getFunc(r.funcionario_id);
      var podeApagar = (r.funcionario_id === APP.user.id && r.estado === 'pendente') || _isAdmin();

      h += '<tr>';
      h += '<td class="td-m">' + _fdata(r.data) + '</td>';
      h += '<td><span class="td-p">' + H(f ? f.nome : '?') + '</span></td>';
      h += '<td>' + _badgeTipo(r.tipo);
      var perT = _labelPeriodo(r);
      if (perT) h += '<div class="td-m" style="font-size:11px;margin-top:2px;">' + perT + '</div>';
      h += '</td>';
      h += '<td><strong>' + _fmtH(r.horas) + '</strong></td>';
      h += '<td class="td-m" style="max-width:200px;">' + H(r.motivo || '—');
      if (r.iniciativa) h += '<div style="font-size:11px;color:var(--accent);margin-top:2px;">📌 ' + H(r.iniciativa) + '</div>';
      if (r.estado === 'rejeitado' && r.motivo_rejeicao) {
        h += '<div style="color:var(--red);font-size:11px;margin-top:2px;">Motivo da recusa: ' + H(r.motivo_rejeicao) + '</div>';
      }
      h += '</td>';
      h += '<td>' + _badgeEstado(r.estado);
      if (r.alteracao && r.alteracao.estado) {
        h += '<div style="font-size:10.5px;color:#2563EB;margin-top:3px;font-weight:600;">✎ Alteração ' + (r.alteracao.estado === 'pendente' ? 'aguarda responsável' : 'aguarda chefe') + '</div>';
      }
      h += '</td>';
      h += '<td style="text-align:right;white-space:nowrap;">';
      // pedir alteração de um registo já autorizado (mesmo circuito)
      if (r.estado === 'aprovado' && !r.alteracao && (r.funcionario_id === APP.user.id || _isAdmin())) {
        h += '<button class="btn btn-ghost btn-sm" onclick="Horas.openAlterar(\'' + r.id + '\')">Pedir alteração</button>';
      }
      if (podeApagar) {
        var lblBtn = (_isAdmin() && r.funcionario_id !== APP.user.id) ? 'Apagar' : 'Retirar';
        h += '<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="Horas.confirmarApagar(\'' + r.id + '\')">' + lblBtn + '</button>';
      }
      h += '</td>';
      h += '</tr>';
    });

    h += '</tbody></table></div></div>';
    return h;
  }

  function _badgeTipo(t) {
    if (t === 'gozada') return '<span class="bdg" style="background:#FEF3C7;color:#92400E;">Gozo</span>';
    return '<span class="bdg" style="background:#DCFCE7;color:#15803D;">Serviço</span>';
  }
  function _badgeEstado(e) {
    var d = ESTADOS[e] || { l: e, c: '#475569', bg: '#F1F5F9' };
    return '<span class="bdg" style="background:' + d.bg + ';color:' + d.c + ';">' + d.l + '</span>';
  }
  function _fdata(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
  }

  // ── MODAIS ────────────────────────────────────────────────
  function getModaisHTML() {
    var h = '';

    // NOVO PEDIDO
    h += '<div class="modal-bd" id="m-horas-novo">';
    h += '<div class="modal" style="max-width:520px;">';
    h += '<div class="modal-header"><div class="mh-ic mhi-amber"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>';
    h += '<div><div class="modal-title" id="m-horas-ttl">Banco de horas</div><div class="modal-sub">Banco de horas</div></div>';
    h += '<button class="modal-close" onclick="closeModal(\'m-horas-novo\')">✕</button></div>';
    h += '<div class="modal-body">';

    h += '<div class="form-row">';
    h += '<div class="fi"><label class="fl">Tipo *</label><select id="h-tipo" class="fin" onchange="Horas.onTipoChange()">';
    h += '<option value="efetuada">Serviço prestado — horas a acumular</option>';
    h += '<option value="gozada">Pedido de gozo de horas do banco</option>';
    h += '</select></div></div>';
    h += '<p id="h-tipo-help" style="font-size:12px;color:var(--text-3);margin:-4px 0 10px;line-height:1.5;"></p>';

    // quem valida por outrem escolhe o funcionário
    h += '<div class="fi" id="h-func-wrap" style="display:none;"><label class="fl">Funcionário *</label>';
    h += '<select id="h-func" class="fin"><option value="">Eu próprio</option></select></div>';

    // Período — só para pedidos de gozo de horas
    h += '<div id="h-periodo-wrap" style="display:none;">';
    h += '<div class="fi"><label class="fl">Período a gozar *</label>';
    h += '<select id="h-periodo" class="fin" onchange="Horas.onPeriodoChange()">';
    h += '<option value="dia">Dia completo</option>';
    h += '<option value="manha">Manhã completa</option>';
    h += '<option value="tarde">Tarde completa</option>';
    h += '<option value="horas">Entre horas (indicar)</option>';
    h += '</select></div>';
    h += '<div class="form-row" id="h-horas-wrap" style="display:none;">';
    h += '<div class="fi"><label class="fl">Das</label><input type="time" id="h-hi" class="fin" onchange="Horas.onHoraChange()"></div>';
    h += '<div class="fi"><label class="fl">Às</label><input type="time" id="h-hf" class="fin" onchange="Horas.onHoraChange()"></div>';
    h += '</div>';
    h += '</div>';

    h += '<div class="form-row">';
    h += '<div class="fi"><label class="fl">Data *</label><input type="date" id="h-data" class="fin"></div>';
    h += '<div class="fi"><label class="fl">Nº de horas *</label><input type="number" id="h-horas" class="fin" step="0.25" min="0.25" placeholder="ex: 2.5"></div>';
    h += '</div>';
    h += '<p style="font-size:11.5px;color:var(--text-3);margin:-4px 0 10px;">Use decimais para as meias horas: 1.5 = 1h30 · 2.25 = 2h15</p>';

    // Equipamento e iniciativa — só para horas extraordinárias
    h += '<div id="h-onde-wrap">';
    h += '<div class="fi"><label class="fl">Equipamento</label><select id="h-eq" class="fin"><option value="">Nenhum / não se aplica</option></select></div>';
    h += '<div class="fi"><label class="fl">Iniciativa / atividade</label>';
    h += '<input type="text" id="h-iniciativa" class="fin" list="iniciativa-opcoes" placeholder="ex: Torneio de Verão, Festa da Juventude">';
    h += '<datalist id="iniciativa-opcoes"></datalist>';
    h += '<p style="font-size:11.5px;color:var(--text-3);margin:4px 0 0;line-height:1.4;">Se as horas foram numa iniciativa e não num equipamento, indique aqui.</p>';
    h += '</div>';
    h += '</div>';
    h += '<div class="fi"><label class="fl">Descrição do serviço *</label><textarea id="h-motivo" class="fin" rows="2" placeholder="ex: Apoio ao torneio de sábado"></textarea></div>';

    h += '<div id="h-circuito" style="background:var(--bg);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text-2);line-height:1.6;">';
    h += '<strong>Circuito de confirmação:</strong> o registo é confirmado pelo responsável do equipamento e, só depois, pelo chefe da sua unidade. Serve de controlo — só conta no saldo depois de confirmado.';
    h += '</div>';

    h += '</div>';
    h += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-horas-novo\')">Cancelar</button>';
    h += '<button class="btn btn-primary" onclick="Horas.salvar()">Submeter</button></div>';
    h += '</div></div>';

    // REJEITAR
    h += '<div class="modal-bd" id="m-horas-rejeitar">';
    h += '<div class="modal"><div class="modal-header"><div class="mh-ic mhi-red"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>';
    h += '<div><div class="modal-title">Recusar pedido</div><div class="modal-sub" id="m-horas-rej-sub">—</div></div>';
    h += '<button class="modal-close" onclick="closeModal(\'m-horas-rejeitar\')">✕</button></div>';
    h += '<div class="modal-body"><div class="fi"><label class="fl">Motivo da recusa *</label>';
    h += '<textarea id="h-motivo-rej" class="fin" rows="3" placeholder="Explique porque está a recusar..."></textarea></div></div>';
    h += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal(\'m-horas-rejeitar\')">Cancelar</button>';
    h += '<button class="btn btn-danger" onclick="Horas.rejeitar()">Recusar pedido</button></div>';
    h += '</div></div>';

    // APAGAR
    h += '<div class="modal-bd" id="m-horas-apagar">';
    h += '<div class="modal"><div class="modal-header"><div class="mh-ic mhi-red"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></div>';
    h += '<div><div class="modal-title">Retirar pedido</div><div class="modal-sub">Esta ação é irreversível</div></div>';
    h += '<button class="modal-close" onclick="closeModal(\'m-horas-apagar\')">✕</button></div>';

    h += '<div class="fi"><label class="fl">Motivo da alteração *</label>';
